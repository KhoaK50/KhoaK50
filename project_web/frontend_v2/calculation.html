    </div>

  <div id="app">
    <div id="controls">

      <div class="card section-calc-info glow">
        <details class="calc" id="calcBoxExtra" open>
          <summary>KHÔNG GIAN VECTOR <span class="chev">▾</span></summary>

          <div class="grid2" style="margin-top:6px">
            <div>
              <label>Chọn bài toán:</label>
              <select id="opExtraSelect">
                <option value="linear_independence">Độc lập tuyến tính</option>
                <option value="rank">Hạng của hệ vector</option>
                <option value="basis">Cơ sở và số chiều</option>
                <option value="coordinates">Tọa độ vector theo cơ sở</option>
              </select>
            </div>
          </div>

          <div id="extraForms" style="margin-top:8px">
            <div id="form-linear_independence" class="extra-form"><label class="small"><b>Kiểm tra ĐLTT</b></label><div id="indepChecklist" class="checklist"></div><div class="row" style="margin-top:6px"><button id="btnIndep">Kiểm tra</button></div><pre id="result_indep">—</pre></div>
            <div id="form-rank" class="extra-form"><label class="small"><b>Hạng của hệ vector</b></label><div id="rankChecklist" class="checklist"></div><div class="row" style="margin-top:6px"><button id="btnRank">Tính hạng</button></div><pre id="result_rank">—</pre></div>
            <div id="form-basis" class="extra-form"><label class="small"><b>Cơ sở & Số chiều</b></label><div id="basisChecklist" class="checklist"></div><div class="row" style="margin-top:6px; gap:8px;"><button id="btnBasis">Tính cơ sở</button><button id="btnOpenSolution" class="btn-solution" type="button">Lời giải</button></div><pre id="result_basis">—</pre></div>
            <div id="form-coordinates" class="extra-form"><label class="small"><b>Tọa độ theo cơ sở</b></label><select id="vCoordSelect"></select><div style="margin-top:8px"><label>Chọn cơ sở:</label><div id="basisCoordChecklist" class="checklist"></div></div><div class="row" style="margin-top:6px"><button id="btnCoord">Xuất tọa độ</button></div><pre id="result_coord">—</pre></div>
          </div>
        </details>
      </div>

      <div class="card section-calc-new glow">
        <details class="calc" id="calcBox" open>
          <summary>PHÉP TÍNH <span class="chev">▾</span></summary>

          <div class="grid2" style="margin-top:6px">
            <div>
              <label>Chọn phép tính:</label>
              <select id="opSelect">
                <option value="add">Cộng vector (v1 + v2)</option>
                <option value="scale">Kéo dãn (k·v)</option> <option value="projection">Hình chiếu (proj_v2(v1))</option>
                <option value="normalize">Chuẩn hoá (v1 / ‖v1‖)</option>
                <option value="dot">Tích vô hướng (v1 · v2)</option>
                <option value="cross">Tích có hướng (v1 × v2)</option>
                <option value="vector_norm">Độ dài vector (|v|)</option>
                <option value="angle_between">Góc giữa 2 vector ((v1,v2))</option>
              </select>
            </div>
            <div id="scalarBox" style="display:none">
              <label>Hệ số k</label>
              <input id="scalarInp" type="text" inputmode="decimal" value="2" placeholder="Nhập k..." />
            </div>
          </div>

          <div class="grid2" style="margin-top:8px">
            <div>
              <label>Vector 1 (v1)</label>
              <select id="v1Select"></select>
            </div>
            <div id="v2Box">
              <label>Vector 2 (v2)</label>
              <select id="v2Select"></select>
            </div>
          </div>

          <div class="row" style="margin-top:10px">
            <button id="btnCompute" class="btn primary">Thực hiện</button>
            <button id="btnPreview" title="Chỉ xem kết quả">Xem trước</button>
          </div>

          <div id="calcSteps" class="help">Kết quả phép tính sẽ hiển thị ở đây.</div>
        </details>
      </div>

      <div class="card section-create glow" id="card-create">
        <label><b>KHỞI TẠO VECTOR</b></label>
        <div style="margin-top:5px; font-size:0.9em; color:#888">
           Định dạng hợp lệ: <code>[1,2]</code>, <code>[1,2,3]</code> hoặc <code>[sqrt(2), 1/2]</code>
        </div>
        <input id="vectorInput" placeholder='[1,2] ...' value="[1,2]" />

        <div class="row" style="margin-top:8px">
          <button id="btnDraw" class="btn primary">Thêm vector</button>
          <button id="btnAuto">Tự động chuyển chiều không gian: BẬT</button>
          <button id="btnClearAll">Xóa hết vector</button>
        </div>
      </div>

      <div class="card section-list glow">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <label>Danh sách vector</label>
        </div>
        <ul id="vectorList"></ul>
      </div>

    </div>

    <div id="viewerWrap">
      <div id="modeBadge" class="pill">Mode: 2D</div>
      <div id="viewer">
        <canvas id="canvas2d"></canvas>
        <div id="threeLayer" tabindex="0" aria-label="3D viewer"></div>
      </div>
      <button id="btnResetView" title="Quay về gốc tọa độ">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
          <line x1="12" y1="2" x2="12" y2="7" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="17" x2="12" y2="22" stroke="currentColor" stroke-width="2"/>
          <line x1="2" y1="12" x2="7" y2="12" stroke="currentColor" stroke-width="2"/>
          <line x1="17" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="solutionOverlay" class="sol-overlay" aria-hidden="true">
    <div class="sol-panel" role="dialog">
      <div class="sol-header">
        <div class="sol-title">
          <div class="sol-badge">Lời giải</div>
          <div id="solTitle" class="sol-h1"><span id="solTitleText">Cơ sở &amp; số chiều</span> <span id="solTitleMath">\( \mathbb{R}^n \)</span></div>
        </div>
        <button id="btnCloseSolution" class="sol-close">✕</button>
      </div>
      <div class="sol-toolbar">
        <div class="sol-method">
          <span class="sol-label">Cách giải:</span>
          <button id="solMethodMat" class="sol-tab is-active">Cách 1: Ma trận</button>
          <button id="solMethodEq" class="sol-tab">Cách 2: Hệ phương trình</button>
        </div>
        <div class="sol-actions"><button id="btnCopySolution" class="sol-btn">Copy LaTeX</button></div>

  <script>
    (function () {
      var version = new Date().getTime();
      function loadScript(url) {
        var script = document.createElement("script");
        script.src = url + "?v=" + version;
        script.async = false;
        document.body.appendChild(script);

      loadScript("js/viewers/viewer3D.js");
    })();

  <div id="mathKeypad">
    <div class="keypad-header"><div class="drag-handle"></div> <button id="keypadClose">✕</button></div>
    <div class="keypad-grid">
      <button class="k-btn op" onclick="App.key('[')">[</button><button class="k-btn op" onclick="App.key(']')">]</button><button class="k-btn op" onclick="App.key('(')">(</button><button class="k-btn op" onclick="App.key(')')">)</button><button class="k-btn action" onclick="App.del()">⌫</button>
      <button class="k-btn num" onclick="App.key('7')">7</button><button class="k-btn num" onclick="App.key('8')">8</button><button class="k-btn num" onclick="App.key('9')">9</button><button class="k-btn op" onclick="App.key('sqrt(')">√</button><button class="k-btn op" onclick="App.key('^2')">^2</button>
      <button class="k-btn num" onclick="App.key('4')">4</button><button class="k-btn num" onclick="App.key('5')">5</button><button class="k-btn num" onclick="App.key('6')">6</button><button class="k-btn op" onclick="App.key('*')">×</button><button class="k-btn op" onclick="App.key('^')">^</button>
      <button class="k-btn num" onclick="App.key('1')">1</button><button class="k-btn num" onclick="App.key('2')">2</button><button class="k-btn num" onclick="App.key('3')">3</button><button class="k-btn op" onclick="App.key('-')">−</button><button class="k-btn op" onclick="App.key('/')">÷</button>
      <button class="k-btn num" onclick="App.key('0')">0</button><button class="k-btn num" onclick="App.key('.')">.</button><button class="k-btn op" onclick="App.key(',')">,</button><button class="k-btn op" onclick="App.key('+')">+</button><button class="k-btn primary" onclick="App.enter()">↵</button>
    </div>
  </div>

  <script>
    (function () {
      const keypad = document.getElementById('mathKeypad');
      let activeInput = null;

      window.openKeypad = function (el) {
        activeInput = el;
        keypad.classList.add('open');
        document.body.classList.add('has-keypad');
        if (window.innerWidth < 768) el.setAttribute('readonly', 'true');
        setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' }); }, 300);
      };

      document.getElementById('keypadClose').onclick = function () {
        keypad.classList.remove('open');
        document.body.classList.remove('has-keypad');
        if (activeInput) activeInput.removeAttribute('readonly');
      };

      window.App.key = function (char) {
        if (!activeInput) return;
        const start = activeInput.selectionStart || activeInput.value.length;
        const end = activeInput.selectionEnd || activeInput.value.length;
        const v = activeInput.value;
        activeInput.value = v.substring(0, start) + char + v.substring(end);
        activeInput.selectionStart = activeInput.selectionEnd = start + char.length;
        activeInput.dispatchEvent(new Event('input', { bubbles: true })); 
        activeInput.focus();
      };

      // ĐÃ SỬA: Hàm del xử lý được việc xóa khi đang bôi đen và xóa lùi
      window.App.del = function () {
        if (!activeInput) return;
        
        const start = activeInput.selectionStart;
        const end = activeInput.selectionEnd;
        const val = activeInput.value;

        // Nếu đang chọn (bôi đen) -> Xóa phần chọn
        if (end > start) {
            activeInput.value = val.substring(0, start) + val.substring(end);
            activeInput.selectionStart = activeInput.selectionEnd = start;
        }
        // Nếu chỉ là con trỏ -> Xóa ký tự trước nó
        else if (start > 0) {
            activeInput.value = val.substring(0, start - 1) + val.substring(start);
            activeInput.selectionStart = activeInput.selectionEnd = start - 1;
        }

        activeInput.dispatchEvent(new Event('input', { bubbles: true })); 
        activeInput.focus();
      };

      window.App.enter = function () { 
          if (!activeInput) return; 
          activeInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); 
      };

      document.addEventListener('focusin', function (e) {
        const el = e.target;
        // Áp dụng cho cả text và number
        if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')) { 
            if (!el.classList.contains('no-keypad')) openKeypad(el); 
        }
      });

      document.addEventListener('click', function (e) {
        const el = e.target;
        if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')) { 
            if (!keypad.classList.contains('open')) openKeypad(el); 
        }
      });

      window.addEventListener('load', function () { 
          requestAnimationFrame(function () { document.body.style.opacity = '1'; }); 
      });
    })();
  </script>
</body>
