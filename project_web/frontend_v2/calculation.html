<!DOCTYPE html>

<head>

  <title>Vectoria - Mô hình trực quan </title>

    (function () {
      // Tạo số phiên bản dựa trên thời gian thực (từng giây)
      var version = new Date().getTime();

      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "css/style.css?v=" + version; // Tự động thêm đuôi ?v=123456...
      document.head.appendChild(link);
    })();
  </script>
  <link rel="stylesheet" href="css/solution_panel.css" />
  <link rel="icon" href="./assets/logo.png" type="image/png">

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    /* Ẩn toàn bộ body ban đầu, tạo hiệu ứng hiện dần (fade-in) */
    body {
      opacity: 0;
      transition: opacity 0.25s ease-in;
    }
  </style>
</head>

<body>
  <div id="topbar">
    <div class="topbar-left">
      <div id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <button class="topbar-icon" title="Trang chủ" onclick="location.href='index.html'" aria-label="Trang chủ">
        <svg viewBox="0 0 24 24" class="icon">
          <path d="M3 10.5L12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M5 9.5V21h5v-6h4v6h5V9.5" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>

      <button class="topbar-icon" title="Kiến thức" onclick="location.href='knowledge_info.html'"
        aria-label="Kiến thức">
        <svg viewBox="0 0 24 24" class="icon">
          <path d="M3 5h7a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H3z" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M21 5h-7a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h7z" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </div>

    <div class="brand">Vectoria</div>

    <div class="topbar-right">
      <div id="themeBadge" class="pill">Theme: Light</div>
    </div>
  </div>

  <div id="overlay"></div>

  <div id="app">
    <div id="controls">
      <div class="card section-calc-new glow">
        <details class="calc" id="calcBox" open>
          <summary>Phép tính (tạo vector mới) <span class="chev">▾</span></summary>

          <div class="grid2" style="margin-top:6px">
            <div>
              <label>Chọn phép tính:</label>
              <select id="opSelect">
                <option value="add">Cộng (v1 + v2)</option>
                <option value="sub">Trừ (v1 – v2)</option>
                <option value="scale">Nhân số (k·v)</option>
                <option value="cross">Tích có hướng (v1 × v2)</option>
                <option value="normalize">Chuẩn hoá (v1 / ‖v1‖)</option>
                <option value="projection">Hình chiếu trực giao của v1 lên v2 (proj_v2(v1))</option>
              </select>
            </div>
            <div id="scalarBox" style="display:none">
              <label>Hệ số k</label>
              <input id="scalarInp" type="number" step="any" value="2" />
            </div>
          </div>

          <div class="grid2" style="margin-top:8px">
            <div>
              <label>Vector 1 (v1)</label>
              <select id="v1Select"></select>
            </div>
            <div id="v2Box">
              <label>Vector 2 (v2)</label>
              <select id="v2Select"></select>
            </div>
          </div>

          <div class="row" style="margin-top:10px">
            <button id="btnCompute" class="btn primary">Tính & Thêm vào danh sách</button>
            <button id="btnPreview" title="Chỉ xem kết quả, không thêm">Xem trước</button>
          </div>

          <div id="calcSteps" class="help">Kết quả phép tính & giải thích sẽ hiển thị ở đây.</div>
        </details>
      </div>

      <div class="card section-calc-info glow">
        <details class="calc" id="calcBoxExtra" open>
          <summary>Phép tính (không tạo vector mới) <span class="chev">▾</span></summary>

          <div class="grid2" style="margin-top:6px">
            <div>
              <label>Chọn phép tính:</label>
              <select id="opExtraSelect">
                <option value="dot">Tích vô hướng (v1 · v2)</option>
                <option value="angle_between">Góc giữa 2 vector</option>
                <option value="vector_norm">Độ dài của vector</option>
                <option value="coordinates">Tọa độ vector theo cơ sở</option>
                <option value="basis">Cơ sở và số chiều</option>
                <option value="linear_independence">Kiểm tra độc lập tuyến tính</option>
                <option value="rank">Hạng của hệ vector</option>
              </select>
            </div>
          </div>

          <div id="extraForms" style="margin-top:8px">
            <div id="form-dot" class="extra-form">
              <label class="small"><b>Tích vô hướng (v1 · v2)</b></label>
              <div class="grid2">
                <div><label>Vector 1 (v1)</label><select id="v1DotSelect"></select></div>
                <div><label>Vector 2 (v2)</label><select id="v2DotSelect"></select></div>
              </div>
              <div class="row" style="margin-top:6px"><button id="btnDot">Tính tích vô hướng</button></div>
              <pre id="result_dot">—</pre>
            </div>

            <div id="form-projection" class="extra-form">
              <label class="small"><b>Hình chiếu trực giao</b></label>
              <div><label>Vector cần chiếu</label><select id="vProjSelect"></select></div>
              <div style="margin-top:8px">
                <label>Chọn vector làm cơ sở chiếu:</label>
                <div id="projBasisChecklist" class="checklist"></div>
              </div>
              <div class="row" style="margin-top:6px"><button id="btnProj">Tạo hình chiếu</button></div>
              <pre id="result_proj">—</pre>
            </div>

            <div id="form-angle_between" class="extra-form">
              <label class="small"><b>Góc giữa 2 vector</b></label>
              <div class="grid2">
                <div><label>Vector 1 (v1)</label><select id="v1AngleSelect"></select></div>
                <div><label>Vector 2 (v2)</label><select id="v2AngleSelect"></select></div>
              </div>
              <div class="row" style="margin-top:6px"><button id="btnAngle">Tính góc</button></div>
              <pre id="result_angle">—</pre>
            </div>

            <div id="form-vector_norm" class="extra-form">
              <label class="small"><b>Độ dài của vector</b></label>
              <select id="vNormSelect"></select>
              <div class="row" style="margin-top:6px"><button id="btnNorm">Tính độ dài</button></div>
              <pre id="result_norm">—</pre>
            </div>

            <div id="form-coordinates" class="extra-form">
              <label class="small"><b>Tọa độ của vector theo cơ sở</b></label>
              <select id="vCoordSelect"></select>
              <div style="margin-top:8px">
                <label>Chọn các vector làm cơ sở:</label>
                <div id="basisCoordChecklist" class="checklist"></div>
              </div>
              <div class="row" style="margin-top:6px"><button id="btnCoord">Xuất tọa độ</button></div>
              <pre id="result_coord">—</pre>
            </div>

            <div id="form-basis" class="extra-form">
              <label class="small"><b>Cơ sở & Số chiều</b></label>
              <div id="basisChecklist" class="checklist"></div>

              <div class="row" style="margin-top:6px; gap:8px;">
                <button id="btnBasis">Tính cơ sở</button>

                <button id="btnOpenSolution" class="btn-solution" type="button" title="Giải theo nhiều cách">
                  Lời giải
                </button>
              </div>

              <pre id="result_basis">—</pre>
            </div>

            <div id="form-linear_independence" class="extra-form">
              <label class="small"><b>Kiểm tra độc lập tuyến tính</b></label>
              <div id="indepChecklist" class="checklist"></div>
              <div class="row" style="margin-top:6px"><button id="btnIndep">Kiểm tra</button></div>
              <pre id="result_indep">—</pre>
            </div>

            <div id="form-rank" class="extra-form">
              <label class="small"><b>Hạng của hệ vector</b></label>
              <div id="rankChecklist" class="checklist"></div>
              <div class="row" style="margin-top:6px"><button id="btnRank">Tính hạng</button></div>
              <pre id="result_rank">—</pre>
            </div>
          </div>
        </details>
      </div>

      <div class="card section-create glow" id="card-create">
        <label>Nhập vector: chấp nhận <code>[1,2]</code>, <code>[1/2, sqrt(2)]</code>,
          <code>[3*sqrt(5)/7, -1/2]</code></label>
        <input id="vectorInput" placeholder='[1,2] hoặc [1/2, sqrt(2)]' value="[1,2]" />

        <div class="row" style="margin-top:8px">
          <button id="btnDraw" class="btn primary">Thêm vector</button>
          <button id="btnAuto">Tự động 2D<->3D: BẬT</button>
          <button id="btnClearAll" title="Xóa tất cả vector">Xóa hết vector</button>
        </div>
      </div>

      <div class="card section-list glow">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <label>Danh sách vector</label>
        </div>
        <ul id="vectorList"></ul>
      </div>

    </div>

    <div id="viewerWrap">
      <div id="modeBadge" class="pill">Mode: 2D</div>
      <div id="viewer">
        <canvas id="canvas2d"></canvas>
        <div id="threeLayer" tabindex="0" aria-label="3D viewer (keyboard enabled)"></div>
      </div>
      <button id="btnResetView" title="Quay về gốc tọa độ (Reset góc nhìn)">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
          <line x1="12" y1="2" x2="12" y2="7" stroke="currentColor" stroke-width="2" />
          <line x1="12" y1="17" x2="12" y2="22" stroke="currentColor" stroke-width="2" />
          <line x1="2" y1="12" x2="7" y2="12" stroke="currentColor" stroke-width="2" />
          <line x1="17" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </div>
  </div>

  <div id="solutionOverlay" class="sol-overlay" aria-hidden="true">
    <div class="sol-panel" role="dialog" aria-modal="true" aria-labelledby="solTitle">

          <div class="sol-badge">Lời giải</div>
          <div id="solTitle" class="sol-h1">
            <span id="solTitleText" class="sol-titleText">Cơ sở &amp; số chiều trong</span>
            <span id="solTitleMath" class="sol-math">\( \mathbb{R}^n \)</span>
          </div>
        </div>
        <button id="btnCloseSolution" class="sol-close" type="button" title="Đóng (Esc)">✕</button>

      <div class="sol-toolbar">
        <div class="sol-method">

          <button id="solMethodMat" class="sol-tab is-active" type="button">Cách 1: Ma trận & biến đổi sơ cấp</button>

  </div>

  <div id="mathKeypad">
    <div class="keypad-header">
      <div class="drag-handle"></div> <button id="keypadClose" title="Đóng bàn phím">✕</button>
    </div>
    <div class="keypad-grid">
      <button class="k-btn op" onclick="App.key('[')">[</button>
      <button class="k-btn op" onclick="App.key(']')">]</button>
      <button class="k-btn op" onclick="App.key('(')">(</button>
      <button class="k-btn op" onclick="App.key(')')">)</button>
      <button class="k-btn action" onclick="App.del()">⌫</button>

      <button class="k-btn num" onclick="App.key('7')">7</button>
      <button class="k-btn num" onclick="App.key('8')">8</button>
      <button class="k-btn num" onclick="App.key('9')">9</button>
      <button class="k-btn op" onclick="App.key('sqrt(')">√</button>
      <button class="k-btn op" onclick="App.key('^2')">^2</button>

      <button class="k-btn num" onclick="App.key('4')">4</button>
      <button class="k-btn num" onclick="App.key('5')">5</button>
      <button class="k-btn num" onclick="App.key('6')">6</button>
      <button class="k-btn op" onclick="App.key('*')">×</button>
      <button class="k-btn op" onclick="App.key('^')">^</button>

      <button class="k-btn num" onclick="App.key('1')">1</button>
      <button class="k-btn num" onclick="App.key('2')">2</button>
      <button class="k-btn num" onclick="App.key('3')">3</button>
      <button class="k-btn op" onclick="App.key('-')">−</button>
      <button class="k-btn op" onclick="App.key('/')">÷</button>

      <button class="k-btn num" onclick="App.key('0')">0</button>
      <button class="k-btn num" onclick="App.key('.')">.</button>
      <button class="k-btn op" onclick="App.key(',')">,</button>
      <button class="k-btn op" onclick="App.key('+')">+</button>
      <button class="k-btn primary" onclick="App.enter()">↵</button>
    </div>
  </div>

  <script>
    (function () {
      const keypad = document.getElementById('mathKeypad');
      let activeInput = null;

      // 1. Mở bàn phím
      window.openKeypad = function (el) {
        activeInput = el;
        keypad.classList.add('open');

        // Thêm class này để CSS biết đường độn padding lên
        document.body.classList.add('has-keypad');

        // Mobile: Chặn bàn phím zin của điện thoại
        if (window.innerWidth < 768) {
          el.setAttribute('readonly', 'true');
        }

        // --- QUAN TRỌNG: CUỘN INPUT LÊN TẦM MẮT ---
        // Đợi 300ms cho bàn phím trượt lên xong rồi mới cuộn
        setTimeout(() => {
          el.scrollIntoView({
            behavior: 'smooth',
            block: 'center', // Căn ô input vào GIỮA màn hình (tránh bị che bởi topbar hoặc keypad)
            inline: 'nearest'
          });
        }, 300);
      };

      // 2. Đóng bàn phím
      document.getElementById('keypadClose').onclick = function () {
        keypad.classList.remove('open');
        // Gỡ class để giao diện trở lại bình thường
        document.body.classList.remove('has-keypad');

        if (activeInput) activeInput.removeAttribute('readonly');
      };

      // 3. Xử lý gõ phím
      window.App.key = function (char) {
        if (!activeInput) return;
        const start = activeInput.selectionStart;
        const end = activeInput.selectionEnd;
        const v = activeInput.value;
        activeInput.value = v.substring(0, start) + char + v.substring(end);
        activeInput.selectionStart = activeInput.selectionEnd = start + char.length;
        activeInput.dispatchEvent(new Event('input', { bubbles: true }));
        activeInput.focus();
      };

      window.App.del = function () {
        if (!activeInput) return;
        const start = activeInput.selectionStart;
        const val = activeInput.value;
        if (start > 0) {
          activeInput.value = val.slice(0, start - 1) + val.slice(start);
          activeInput.selectionStart = activeInput.selectionEnd = start - 1;
          activeInput.dispatchEvent(new Event('input', { bubbles: true }));
          activeInput.focus();
        }
      };

      window.App.enter = function () {
        if (!activeInput) return;
        activeInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      };

      // 4. EVENT DELEGATION
      document.addEventListener('focusin', function (e) {
        const el = e.target;
        if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')) {
          if (!el.classList.contains('no-keypad')) {
            openKeypad(el);
          }
        }
      });

      document.addEventListener('click', function (e) {
        const el = e.target;
        if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')) {
          if (!keypad.classList.contains('open')) {
            openKeypad(el);
          }
        }
      });
    })();
  </script>
