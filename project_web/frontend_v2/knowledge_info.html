        }
        return '<div class="latex-proof">' +
                 '<div class="latex-proof-body">' + formattedBody + '</div>' +
               '</div>';
      });
    });

    html = replaceEnvironment(html, 'tcolorbox', function(optBracket, optBrace, body) {
      const opt = optBracket || optBrace || '';
      const bs = parseTcbVisualOptsLocal(opt, 'tcolorbox', false);
      const title = (bs.rawTitle || '').trim();
      const varsAttr = ' style="' + buildBoxCssVarsStyleLocal(bs) + '"';
      const formattedBody = formatInnerParagraphs(body.trim());
      if (title) {
        if (bs.headerMode === 'boxed-pill') {
          return '<div class="latex-tcolorbox has-boxed-pill"' + varsAttr + '>' +
                   '<div class="latex-tcb-pill-header">' + title + '</div>' +
                   '<div class="latex-tcolorbox-content">' + formattedBody + '</div>' +
                 '</div>';
        }
        if (bs.headerMode === 'inline') {
          const lead = '<strong class="v-box-lead-label">' + title + '.</strong> ';
          const pm = formattedBody.match(/^<p[^>]*>/);
          const merged = pm ? (pm[0] + lead + formattedBody.slice(pm[0].length)) : ('<p style="margin-bottom: 12px;">' + lead + '</p>' + formattedBody);
          return '<div class="latex-tcolorbox"' + varsAttr + '><div class="latex-tcolorbox-content">' + merged + '</div></div>';
        }
        return '<div class="latex-tcolorbox"' + varsAttr + '>' +
                 '<div class="latex-tcb-bar-header">' + title + '</div>' +
                 '<div class="latex-tcolorbox-content">' + formattedBody + '</div>' +
               '</div>';
      }
      return '<div class="latex-tcolorbox"' + varsAttr + '><div class="latex-tcolorbox-content">' + formattedBody + '</div></div>';
    });

    html = replaceTwoArgCommandWithBraces(html, 'boxpair', function(content, points) {
      const formattedContent = formatInnerParagraphs(content.trim());
      const cleanPoints = points.trim().replace(/^\s*\{[^}]*\}/, '').trim();
      return '<div class="latex-boxpair" style="display: flex; flex-wrap: wrap; gap: 0; margin: 18px 0; border: 1px solid var(--s4, #d7dfe3); border-radius: 2px; background: var(--s1); overflow: hidden; align-items: stretch;">' +
        '<div class="latex-boxpair-content" style="flex: 1 1 280px; min-width: 0; padding: 14px 18px;">' +
          formattedContent +
        '</div>' +
        '<div class="latex-boxpair-points" style="flex: 0 0 100px; min-width: 90px; background: var(--s2); border-left: 1px solid var(--s3); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--s11); font-size: 0.85rem; text-align: center; padding: 10px;">' +
          cleanPoints +
        '</div>' +
      '</div>';
    });

    html = replaceEnvironment(html, 'multicols', function(optBracket, optBrace, body) {
      const cols = parseInt(optBracket || optBrace, 10) || 2;
      return '<div class="latex-multicols cols-' + cols + '">' + body.trim() + '</div>';
    });

    html = replaceEnvironment(html, 'center', function(opt1, opt2, body) { return '<div style="text-align: center; margin: 16px 0; width: 100%;">' + body.trim() + '</div>'; });
    html = replaceEnvironment(html, 'flushleft', function(opt1, opt2, body) { return '<div style="text-align: left; margin: 16px 0; width: 100%;">' + body.trim() + '</div>'; });
    html = replaceEnvironment(html, 'flushright', function(opt1, opt2, body) { return '<div style="text-align: right; margin: 16px 0; width: 100%;">' + body.trim() + '</div>'; });

    // XỬ LÝ TUẦN TỰ HEADINGS, BỘ ĐẾM (\setcounter/\addtocounter/\stepcounter), \addcontentsline VÀ \tableofcontents CHUẨN OVERLEAF
    const docStructRe = /\\(?:(part|chapter|section|subsection|subsubsection|paragraph|subparagraph)(\*)?(?:\s*\[[^\]]*\])?\s*\{|(setcounter|addtocounter|stepcounter|refstepcounter)\s*\{|(addcontentsline)\s*\{)/g;
    let dsm;
    const structEvents = [];
    while ((dsm = docStructRe.exec(html)) !== null) {
      if (dsm[1]) {
        const braceIdx = html.lastIndexOf('{', dsm.index + dsm[0].length);
        const extracted = extractBalancedBraces(html, braceIdx);
        if (!extracted) continue;
        structEvents.push({
          eventKind: 'heading',
          type: dsm[1],
          isStarred: Boolean(dsm[2]),
          startIndex: dsm.index,
          endIndex: extracted.endIndex,
          title: extracted.content.trim()
        });
        docStructRe.lastIndex = extracted.endIndex + 1;
      } else if (dsm[3]) {
        const op = dsm[3];
        const b1 = html.lastIndexOf('{', dsm.index + dsm[0].length);
        const arg1 = extractBalancedBraces(html, b1);
        if (!arg1) continue;
        let endIdx = arg1.endIndex;
        let numVal = 0;
        if (op === 'setcounter' || op === 'addtocounter') {
          let ws = endIdx + 1;
          while (ws < html.length && /\s/.test(html[ws])) ws++;
          if (html[ws] === '{') {
            const arg2 = extractBalancedBraces(html, ws);
            if (arg2) {
              endIdx = arg2.endIndex;
              const parsedV = parseInt(arg2.content.trim(), 10);
              if (!isNaN(parsedV)) numVal = parsedV;
            }
          }
        }
        structEvents.push({
          eventKind: 'counter',
          counterOp: op,
          counterName: arg1.content.trim(),
          counterVal: numVal,
          startIndex: dsm.index,
          endIndex: endIdx
        });
        docStructRe.lastIndex = endIdx + 1;
      } else if (dsm[4]) {
        const b1 = html.lastIndexOf('{', dsm.index + dsm[0].length);
        const arg1 = extractBalancedBraces(html, b1);
        if (!arg1) continue;
        let ws2 = arg1.endIndex + 1;
        while (ws2 < html.length && /\s/.test(html[ws2])) ws2++;
        if (html[ws2] !== '{') continue;
        const arg2 = extractBalancedBraces(html, ws2);
        if (!arg2) continue;
        let ws3 = arg2.endIndex + 1;
        while (ws3 < html.length && /\s/.test(html[ws3])) ws3++;
        if (html[ws3] !== '{') continue;
        const arg3 = extractBalancedBraces(html, ws3);
        if (!arg3) continue;
        structEvents.push({
          eventKind: 'addcontentsline',
          tocTarget: arg1.content.trim().toLowerCase(),
          tocType: arg2.content.trim().toLowerCase(),
          title: arg3.content.trim(),
          startIndex: dsm.index,
          endIndex: arg3.endIndex
        });
        docStructRe.lastIndex = arg3.endIndex + 1;
      }
    }

    const tocLevelNumMap = { part: 0, chapter: 0, section: 1, subsection: 2, subsubsection: 3, paragraph: 4, subparagraph: 5 };
    let partCnt = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.part || 0);
    let chap = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.chapter || 0);
    let sec = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.section || 0);
    let subsec = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.subsection || 0);
    let subsubsec = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.subsubsection || 0);
    let liveTocDepthLocal = tocDepthLocal;
    let unnumCnt = 0;
    let manualAnchorCnt = 0;
    let lastHeadingIdLocal = '';
    let lastHeadingEndLocal = -1;
    const tocItems = [];
    const seededBoxCountersLocal = {};

    for (let si = 0; si < structEvents.length; si++) {
      const ev = structEvents[si];
      if (ev.eventKind === 'counter') {
        ev.repTag = '';
        if (ev.counterName === 'tocdepth' && ev.counterOp === 'setcounter') {
          liveTocDepthLocal = ev.counterVal;
        } else if (!isStandaloneNormalizedLesson) {
          const applyCnt = function(prev) {
            if (ev.counterOp === 'setcounter') return ev.counterVal;
            if (ev.counterOp === 'addtocounter') return prev + ev.counterVal;
            if (ev.counterOp === 'stepcounter' || ev.counterOp === 'refstepcounter') return prev + 1;
            return prev;
          };
          if (ev.counterName === 'part') partCnt = applyCnt(partCnt);
          else if (ev.counterName === 'chapter') {
            chap = applyCnt(chap);
            if (ev.counterOp === 'stepcounter' || ev.counterOp === 'refstepcounter') { sec = 0; subsec = 0; subsubsec = 0; }
          } else if (ev.counterName === 'section') {
            sec = applyCnt(sec);
            if (ev.counterOp === 'stepcounter' || ev.counterOp === 'refstepcounter') { subsec = 0; subsubsec = 0; }
          } else if (ev.counterName === 'subsection') {
            subsec = applyCnt(subsec);
            if (ev.counterOp === 'stepcounter' || ev.counterOp === 'refstepcounter') { subsubsec = 0; }
          } else if (ev.counterName === 'subsubsection') {
            subsubsec = applyCnt(subsubsec);
          } else if (ev.counterName !== 'equation' && ev.counterName !== 'secnumdepth') {
            seededBoxCountersLocal[ev.counterName] = applyCnt(seededBoxCountersLocal[ev.counterName] || 0);
          }
        }
        continue;
      }

      if (ev.eventKind === 'addcontentsline') {
        ev.repTag = '';
        if (ev.tocTarget === 'toc') {
          const lvlNum = Object.prototype.hasOwnProperty.call(tocLevelNumMap, ev.tocType) ? tocLevelNumMap[ev.tocType] : 1;
          let targetAnchor = '';
          if (lastHeadingIdLocal && lastHeadingEndLocal >= 0 && html.slice(lastHeadingEndLocal, ev.startIndex).trim() === '') {
            targetAnchor = lastHeadingIdLocal;
          } else {
            manualAnchorCnt++;
            targetAnchor = 'toc-anchor-' + manualAnchorCnt;
            ev.repTag = '<span id="' + targetAnchor + '"></span>';
          }
          tocItems.push({
            type: ev.tocType,
            levelNum: lvlNum,
            maxDepthAtEntry: liveTocDepthLocal,
            num: '',
            title: ev.title,
            id: targetAnchor,
            isManualAdd: true
          });
        }
        continue;
      }

      const h = ev;
      const plainHeading = h.title.replace(/<[^>]+>/g, '').replace(/\\[a-zA-Z]+\*?/g, '').replace(/[{}]/g, '').trim();
      const hasPrefix = /^(?:chương|chapter|phần|part|bài|câu\s*hỏi|problem)\b/i.test(plainHeading) || /^[0-9]+(\.[0-9]+)+\s*/.test(plainHeading);

      if (h.type === 'part') {
        if (!h.isStarred) partCnt++;
        h.numStr = '';
        h.id = h.isStarred ? ('part-star-' + (++unnumCnt)) : ('part-' + partCnt);
        if (!h.isStarred) {
          tocItems.push({ type: 'part', levelNum: 0, maxDepthAtEntry: liveTocDepthLocal, num: String(partCnt), title: h.title, id: h.id, isManualAdd: false });
        }
      } else if (h.type === 'paragraph' || h.type === 'subparagraph') {
        unnumCnt++;
        h.numStr = '';
        h.id = 'para-' + unnumCnt;
      } else if (h.isStarred) {
        unnumCnt++;
        h.numStr = '';
        h.tocNum = '';
        h.id = h.type + '-star-' + unnumCnt;
      } else if (h.type === 'chapter') {
        chap++; sec = 0; subsec = 0; subsubsec = 0;
        h.chapVal = chap;
        h.numStr = 'Chương ' + chap;
        h.tocNum = String(chap);
        h.id = 'chapter-' + chap;
        tocItems.push({ type: 'chapter', levelNum: 0, maxDepthAtEntry: liveTocDepthLocal, num: h.tocNum, title: h.title, id: h.id, isManualAdd: false });
      } else if (h.type === 'section') {
        sec++; subsec = 0; subsubsec = 0;
        const secLbl = chap ? (chap + '.' + sec) : String(sec);
        h.numStr = secLbl + ' ';
        h.tocNum = secLbl;
        h.id = 'section-' + (chap ? chap + '-' : '') + sec;
        tocItems.push({ type: 'section', levelNum: 1, maxDepthAtEntry: liveTocDepthLocal, num: h.tocNum, title: h.title, id: h.id, isManualAdd: false });
      } else if (h.type === 'subsection') {
        subsec++; subsubsec = 0;
        const effSec = sec || 1;
        const subLbl = chap ? (chap + '.' + effSec + '.' + subsec) : (effSec + '.' + subsec);
        h.numStr = subLbl + ' ';
        h.tocNum = subLbl;
        h.id = 'subsec-' + (chap ? chap + '-' : '') + effSec + '-' + subsec;
        tocItems.push({ type: 'subsection', levelNum: 2, maxDepthAtEntry: liveTocDepthLocal, num: h.tocNum, title: h.title, id: h.id, isManualAdd: false });
      } else if (h.type === 'subsubsection') {
        subsubsec++;
        const effSec = sec || 1;
        const effSub = subsec || 1;
        const ssubLbl = chap ? (chap + '.' + effSec + '.' + effSub + '.' + subsubsec) : (effSec + '.' + effSub + '.' + subsubsec);
        h.numStr = ssubLbl + ' ';
        h.tocNum = ssubLbl;
        h.id = 'subsubsec-' + (chap ? chap + '-' : '') + effSec + '-' + effSub + '-' + subsubsec;
        tocItems.push({ type: 'subsubsection', levelNum: 3, maxDepthAtEntry: liveTocDepthLocal, num: h.tocNum, title: h.title, id: h.id, isManualAdd: false });
      }

      lastHeadingIdLocal = h.id;
      lastHeadingEndLocal = h.endIndex + 1;

      const displayNum = (h.isStarred || hasPrefix) ? '' : h.numStr;
      if (h.type === 'part') {
        h.repTag = '<h1 class="latex-part-title" id="' + h.id + '" style="font-size: 1.56rem; font-weight: 800; text-align: center; margin: 34px 0 22px 0; color: var(--s12); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid var(--s4); padding-bottom: 12px;">' + h.title + '</h1>';
      } else if (h.type === 'chapter') {
        const cAlign = chapterFormatLocal.align || 'left';
        const cCase = chapterFormatLocal.uppercase ? ' text-transform: uppercase;' : '';
        const cCol = chapterFormatLocal.color || 'var(--s12)';
        if (h.isStarred || hasPrefix || !displayNum) {
          h.repTag = '<h1 class="latex-chapter" id="' + h.id + '" style="text-align: ' + cAlign + '; margin-top: 2.2em; margin-bottom: 1.2em; font-size: 2.24rem; font-weight: 700; line-height: 1.24; color: ' + cCol + ';' + cCase + '">' + h.title + '</h1>';
        } else if (chapterFormatLocal.shape === 'hang' || chapterFormatLocal.shape === 'block') {
          h.repTag = '<h1 class="latex-chapter" id="' + h.id + '" style="text-align: ' + cAlign + '; margin-top: 2.2em; margin-bottom: 1.2em; font-size: 2.24rem; font-weight: 700; line-height: 1.24; color: ' + cCol + ';' + cCase + '"><span class="latex-chapter-num" style="margin-right: 0.55em;">' + (h.chapVal || chap) + '</span>' + h.title + '</h1>';
        } else {
          h.repTag = '<h1 class="latex-chapter" id="' + h.id + '" style="text-align: ' + cAlign + '; margin-top: 2.2em; margin-bottom: 1.3em; color: ' + cCol + ';' + cCase + '">' +
            '<span class="latex-chapter-label" style="display: block; font-size: 1.96rem; font-weight: 700; line-height: 1.24; margin-bottom: 0.42em;">' + displayNum + '</span>' +
            '<span class="latex-chapter-title" style="display: block; font-size: 2.36rem; font-weight: 700; line-height: 1.22;">' + h.title + '</span>' +
          '</h1>';
        }
      } else if (h.type === 'section') {
        h.repTag = '<h2 class="latex-section" id="' + h.id + '" style="margin-top: 1.85em; margin-bottom: 0.78em; font-size: 1.62rem; font-weight: 700; line-height: 1.3; color: var(--s12); width: 100%;">' + displayNum + h.title + '</h2>';
      } else if (h.type === 'subsection') {
        h.repTag = '<h3 class="latex-subsection" id="' + h.id + '" style="margin-top: 1.5em; margin-bottom: 0.65em; font-size: 1.35rem; font-weight: 700; line-height: 1.35; color: var(--s12); width: 100%;">' + displayNum + h.title + '</h3>';
      } else if (h.type === 'paragraph' || h.type === 'subparagraph') {
        h.repTag = '<h5 class="latex-paragraph" id="' + h.id + '" style="margin: 1.05em 0 0.45em; font-size: 1.05rem; font-weight: 700; color: var(--s12);">' + h.title + '</h5>';
      } else if (h.type === 'subsubsection') {
        h.repTag = '<h4 class="latex-subsubsection" id="' + h.id + '" style="margin-top: 1.25em; margin-bottom: 0.52em; font-size: 1.15rem; font-weight: 700; line-height: 1.4; color: var(--s12); width: 100%;">' + displayNum + h.title + '</h4>';
      }
    }

    // Thay thế các sự kiện cấu trúc từ cuối lên đầu để bảo toàn chỉ số vị trí
    for (let i = structEvents.length - 1; i >= 0; i--) {
      const ev = structEvents[i];
      html = html.substring(0, ev.startIndex) + (ev.repTag || '') + html.substring(ev.endIndex + 1);
    }

    // Tạo khối Mục lục chuẩn Overleaf nếu trong văn bản có \tableofcontents (hỗ trợ cả Mục lục lưu từ bản thảo gốc cho đoạn cắt một phần)
    if (html.indexOf('\\tableofcontents') !== -1) {
      const stripTagsForTocMatch = function(str) {
        return String(str || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
      };
      const formatPersistedTocTitleLocal = function(rawT) {
        if (!rawT) return '';
        let s = String(rawT);
        s = replaceTwoArgCommandWithBraces(s, 'texorpdfstring', function(a) { return a; });
        s = s.replace(/\\\(([\s\S]+?)\\\)/g, function(_m, code) { return storeMath(code, false, null); });
        s = s.replace(/\$([^$\r\n]+?)\$/g, function(_m, code) { return storeMath(code, false, null); });
        s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        for (let guard = 0; guard < 6; guard++) {
          const prev = s;
          s = replaceTwoArgCommandWithBraces(s, 'textcolor', function(colSpec, txt) {
            return '<span style="color: ' + mapLatexColor(colSpec, '') + ';">' + txt + '</span>';
          });
          s = replaceCommandWithBraces(s, 'textbf', function(c) { return '<strong style="font-weight: 700;">' + c + '</strong>'; });
          s = replaceCommandWithBraces(s, 'textit', function(c) { return '<em>' + c + '</em>'; });
          s = replaceCommandWithBraces(s, 'emph', function(c) { return '<em>' + c + '</em>'; });
          s = replaceCommandWithBraces(s, 'texttt', function(c) { return '<code>' + c + '</code>'; });
          s = replaceCommandWithBraces(s, 'underline', function(c) { return '<u>' + c + '</u>'; });
          if (s === prev) break;
        }
        s = s.replace(/(<[^>]+>)|\\[a-zA-Z]+\*?|[{}]/g, function(m, tag) { return tag || ''; });
        return s.trim();
      };

      const localVisibleTocItems = tocItems.filter(function(it) {
        return it.levelNum <= (typeof it.maxDepthAtEntry === 'number' ? it.maxDepthAtEntry : tocDepthLocal);
      });
      const persistedTocArr = Array.isArray(persistedDocConfig.tocEntries) ? persistedDocConfig.tocEntries : [];
      const usePersistedTocLocal = persistedTocArr.length > 0 && (!isStandaloneNormalizedLesson || localVisibleTocItems.length === 0);

      let visibleTocItems = localVisibleTocItems;
      if (usePersistedTocLocal) {
        visibleTocItems = persistedTocArr
          .filter(function(pe) { return (typeof pe.levelNum === 'number' ? pe.levelNum : 1) <= tocDepthLocal; })
          .map(function(pe) {
            const pNum = pe.numLabel || '';
            const formattedTitle = formatPersistedTocTitleLocal(pe.title || pe.rawTitle || pe.cleanTitle || '');
            const cleanKey = (pe.cleanTitle || stripTagsForTocMatch(formattedTitle)).trim();
            let matchedId = '';
            for (let li = 0; li < tocItems.length; li++) {
              const lt = tocItems[li];
              if (lt.type === pe.type && (lt.num || '') === pNum && stripTagsForTocMatch(lt.title) === cleanKey) {
                matchedId = lt.id || '';
                break;
              }
            }
            if (!matchedId && cleanKey) {
              for (let si = 0; si < structEvents.length; si++) {
                const sev = structEvents[si];
                if (sev.kind === 'heading' && sev.id && stripTagsForTocMatch(sev.title) === cleanKey) {
                  matchedId = sev.id;
                  break;
                }
              }
            }
            return {
              type: pe.type || 'section',
              levelNum: typeof pe.levelNum === 'number' ? pe.levelNum : 1,
              num: pNum,
              title: formattedTitle,
              id: matchedId,
              isManualAdd: Boolean(pe.isManualAdd)
            };
          });
      }

      const hasChaptersToc = visibleTocItems.some(function(it) { return it.type === 'chapter'; }) || docClassLocal === 'report' || docClassLocal === 'book';

      html = html.replace(/\\tableofcontents(?![a-zA-Z])/g, function(_m, tocOffset) {
        if (visibleTocItems.length === 0) return '';
        const beforeToc = html.slice(Math.max(0, tocOffset - 120), tocOffset);
        const scopedColM = /<(?:div|span)\s+style="[^"]*color:\s*([^;"]+)[^"]*">\s*$/i.exec(beforeToc);
        const scopedTocCol = scopedColM ? scopedColM[1].trim() : '';
        const headingCol = scopedTocCol || 'var(--s12)';
        const entryCol = scopedTocCol || hyperrefTocColorLocal || 'var(--s12)';

        let rowsHtml = '';
        for (let ti = 0; ti < visibleTocItems.length; ti++) {
          const item = visibleTocItems[ti];
          const numSpan = item.num
            ? '<span class="latex-toc-num" style="display: inline-block; min-width: ' + (item.type === 'chapter' ? '1.6em' : item.type === 'section' ? '2.4em' : '3.3em') + '; margin-right: 0.35em;">' + item.num + '</span>'
            : '';
          const innerLink = item.id
            ? '<a href="#' + item.id + '" style="color: inherit; text-decoration: none;">' + numSpan + item.title + '</a>'
            : '<span style="color: inherit;">' + numSpan + item.title + '</span>';
          if (item.type === 'part' || item.type === 'chapter') {
            rowsHtml += '<div class="latex-toc-row is-chapter" style="display: flex; align-items: baseline; font-weight: 700; font-size: 1.05rem; margin-top: 10px; line-height: 1.45; color: ' + entryCol + ';">' +
              innerLink + '</div>';
          } else {
            const indentEm = item.type === 'section' ? (hasChaptersToc ? 1.6 : 0) : item.type === 'subsection' ? (hasChaptersToc ? 4.0 : 1.8) : (hasChaptersToc ? 6.4 : 3.6);
            const weight = (!hasChaptersToc && item.type === 'section') ? 700 : 400;
            const leaderHtml = (!hasChaptersToc && item.type === 'section' && !item.isManualAdd)
              ? ''
              : '<span class="latex-toc-dots" aria-hidden="true" style="flex: 1 1 24px; border-bottom: 1.5px dotted currentColor; opacity: 0.55; margin: 0 8px 4px;"></span>';
            rowsHtml += '<div class="latex-toc-row is-' + item.type + '" style="display: flex; align-items: baseline; padding-left: ' + indentEm + 'em; font-weight: ' + weight + '; font-size: 0.98rem; line-height: 1.55; color: ' + entryCol + ';">' +
              innerLink + leaderHtml + '</div>';
          }
        }
        return '<div class="latex-toc" role="navigation" aria-label="Mục lục" style="margin: 28px 0 44px; padding: 0; background: transparent; border: none;">' +
          '<h2 class="latex-toc-heading" style="color: ' + headingCol + '; font-size: 1.85rem; font-weight: 700; margin: 0 0 22px; text-align: left; line-height: 1.3;">Mục lục</h2>' +
          '<div class="latex-toc-list" style="display: flex; flex-direction: column; gap: 6px;">' + rowsHtml + '</div></div>';
      });
    }

    html = html.replace(/\\begingroup(?![a-zA-Z])/g, '');
    html = html.replace(/\\endgroup(?![a-zA-Z])/g, '');
    html = html.replace(/\\color(?:\s*\[[^\]]*\])?\s*\{[^}]*\}/g, '');

    function resolveCanonicalBoxMetaLocal(envKey) {
      if (envKey === 'dn' || envKey === 'definition' || envKey === 'dinhnghia') {
        return { canonical: 'dn', defaultLabel: 'Định nghĩa', cls: 'latex-box-dn', counterKey: 'dn' };
      }
      if (envKey === 'vd' || envKey === 'example' || envKey === 'vidu') {
        return { canonical: 'vd', defaultLabel: 'Ví dụ', cls: 'latex-box-vd', counterKey: 'vd' };
      }
      if (envKey === 'dl' || envKey === 'theorem' || envKey === 'dinhly' || envKey === 'lemma' || envKey === 'bode' || envKey === 'bd') {
        return { canonical: 'dl', defaultLabel: (envKey.includes('lemma') || envKey.includes('bode') || envKey === 'bd') ? 'Bổ đề' : 'Định lý', cls: 'latex-box-dl', counterKey: 'dl' };
      }
      if (envKey === 'tc' || envKey.startsWith('prop') || envKey === 'tinhchat' || envKey === 'menhde' || envKey === 'md') {
        return { canonical: 'tc', defaultLabel: (envKey.includes('prop') || envKey.includes('menhde') || envKey === 'md') ? 'Mệnh đề' : 'Tính chất', cls: 'latex-box-tc', counterKey: 'tc' };
      }
      if (envKey === 'hq' || envKey === 'corollary' || envKey === 'hequa') {
        return { canonical: 'hq', defaultLabel: 'Hệ quả', cls: 'latex-box-hq', counterKey: 'hq' };
      }
      if (envKey === 'nx' || envKey === 'remark' || envKey === 'nhanxet') {
        return { canonical: 'nx', defaultLabel: 'Nhận xét', cls: 'latex-box-nx', counterKey: 'nx' };
      }
      if (envKey === 'bt' || envKey === 'exercise' || envKey === 'baitap' || envKey === 'btmau') {
        return { canonical: 'bt', defaultLabel: envKey === 'btmau' ? 'Bài tập mẫu' : 'Bài tập', cls: envKey === 'btmau' ? 'latex-box-btmau' : 'latex-box-bt', counterKey: 'bt' };
      }
      const conf = boxConfigs[envKey] || { label: envKey.charAt(0).toUpperCase() + envKey.slice(1), cls: 'latex-box-generic' };
      return { canonical: envKey, defaultLabel: conf.label, cls: conf.cls, counterKey: null };
    }

    function renderAcademicBox(envKey, title, b, chapNum, counters) {
      const meta = resolveCanonicalBoxMetaLocal(envKey);
      const pInfo = persistedBoxStyles[envKey] || persistedBoxStyles[meta.canonical] || null;
      let cleanBodyStr = b;
      if (pInfo && pInfo.isTcbTheorem && /^[ \t]*\{[a-zA-Z0-9_:.-]*\}/.test(cleanBodyStr)) {
        const leadBrace = cleanBodyStr.indexOf('{');
        const refG = extractBalancedBraces(cleanBodyStr, leadBrace);
        if (refG) cleanBodyStr = cleanBodyStr.slice(refG.endIndex + 1);
      }

      const isFramed = Boolean(pInfo && pInfo.isFramed && pInfo.boxStyle);
      const bs = isFramed ? pInfo.boxStyle : null;

      if (pInfo && pInfo.isPureTcolorbox && !pInfo.label) {
        const pureTitle = (title || '').trim();
        const formattedPure = formatInnerParagraphs(cleanBodyStr.trim());
        const varsAttr = bs ? (' style="' + buildBoxCssVarsStyleLocal(bs) + '"') : '';
        if (pureTitle) {
          if (bs && bs.headerMode === 'boxed-pill') {
            return '<div class="latex-tcolorbox has-boxed-pill"' + varsAttr + '><div class="latex-tcb-pill-header">' + pureTitle + '</div><div class="latex-tcolorbox-content">' + formattedPure + '</div></div>';
          }
          return '<div class="latex-tcolorbox"' + varsAttr + '><div class="latex-tcb-bar-header">' + pureTitle + '</div><div class="latex-tcolorbox-content">' + formattedPure + '</div></div>';
        }
        return '<div class="latex-tcolorbox"' + varsAttr + '><div class="latex-tcolorbox-content">' + formattedPure + '</div></div>';
      }

      const displayLabel = (pInfo && pInfo.label) ? pInfo.label : meta.defaultLabel;
      const shouldCount = pInfo
        ? Boolean(pInfo.hasCounter) && Boolean(meta.counterKey || pInfo.hasCounter)
        : Boolean(meta.counterKey);

      let numPrefix = '';
      if (shouldCount) {
        const cKey = (pInfo && pInfo.sharedCounter)
          ? (resolveCanonicalBoxMetaLocal(pInfo.sharedCounter).counterKey || pInfo.sharedCounter)
          : (meta.counterKey || envKey);
        counters[cKey] = (counters[cKey] || 0) + 1;
        if (chapNum) numPrefix = ' ' + chapNum + '.' + counters[cKey];
        else if (isStandaloneSlicedLesson || (pInfo && pInfo.hasCounter)) numPrefix = ' ' + counters[cKey];
      }

      const labelColorOverride = (pInfo && pInfo.labelColor) || '';
      const darkLabelColorOverride = (pInfo && pInfo.darkLabelColor) || '';
      const bodyFontPref = (pInfo && pInfo.bodyFontStyle) || '';
      const bodyStyleCls = bodyFontPref === 'italic' ? ' is-body-italic' : (bodyFontPref === 'normal' ? ' is-body-normal' : '');

      const optTitle = title && title.trim() ? ' (' + title.trim() + ')' : '';
      const fullHeader = displayLabel + numPrefix + optTitle;
      let formattedBody = formatInnerParagraphs(cleanBodyStr.trim());

      if (isFramed && bs) {
        const styleVars = buildBoxCssVarsStyleLocal(bs, labelColorOverride, darkLabelColorOverride);
        const styleAttr = styleVars ? (' style="' + styleVars + '"') : '';
        if (bs.headerMode === 'boxed-pill') {
          return '<div class="latex-box ' + meta.cls + ' is-framed-box has-boxed-pill' + bodyStyleCls + '"' + styleAttr + '>' +
                   '<div class="latex-tcb-pill-header">' + fullHeader + '</div>' +
                   '<div class="latex-box-content">' + formattedBody + '</div>' +
                 '</div>';
        }
        if (bs.headerMode === 'bar') {
          return '<div class="latex-box ' + meta.cls + ' is-framed-box' + bodyStyleCls + '"' + styleAttr + '>' +
                   '<div class="latex-tcb-bar-header">' + fullHeader + '</div>' +
                   '<div class="latex-box-content">' + formattedBody + '</div>' +
                 '</div>';
        }
        const framedLead = '<strong class="v-box-lead-label">' + fullHeader + '.</strong> ';
        const pmF = formattedBody.match(/^<p[^>]*>/);
        if (pmF) formattedBody = pmF[0] + framedLead + formattedBody.slice(pmF[0].length);
        else formattedBody = '<p style="margin-bottom: 12px;">' + framedLead + '</p>' + formattedBody;
        return '<div class="latex-box ' + meta.cls + ' is-framed-box' + bodyStyleCls + '"' + styleAttr + '>' +
                 '<div class="latex-box-content">' + formattedBody + '</div>' +
               '</div>';
      }

      const unframedVars = buildBoxCssVarsStyleLocal(null, labelColorOverride, darkLabelColorOverride);
      const unframedStyleAttr = unframedVars ? (' style="' + unframedVars + '"') : '';
      const labelHtml = '<strong class="v-box-lead-label">' + fullHeader + '.</strong> ';
      const pMatch = formattedBody.match(/^<p[^>]*>/);
      if (pMatch) {
        formattedBody = pMatch[0] + labelHtml + formattedBody.slice(pMatch[0].length);
      } else {
        formattedBody = '<p style="margin-bottom: 12px;">' + labelHtml + '</p>' + formattedBody;
      }

      return '<div class="latex-box ' + meta.cls + bodyStyleCls + '"' + unframedStyleAttr + '>' +
               '<div class="latex-box-content">' + formattedBody + '</div>' +
             '</div>';
    }

    const chRegex = /<h1[^>]*id="chapter-([0-9]+)"[^>]*>/g;
    let cm;
    const chIndices = [];
    while ((cm = chRegex.exec(html)) !== null) {
      chIndices.push({ index: cm.index, chapNum: parseInt(cm[1], 10) });
    }

    if (chIndices.length === 0) {
      let detectedChap = (!isStandaloneNormalizedLesson && chap > 0) ? chap : null;
      if (!detectedChap && !isStandaloneSlicedLesson) {
        const chapMatch = html.match(/<h[12][^>]*>\s*(?:<span[^>]*>\s*)?(?:chương|chuong|chapter)\s*([0-9]+)/i);
        if (chapMatch) detectedChap = parseInt(chapMatch[1], 10);
      }

      const counters = Object.assign({}, seededBoxCountersLocal);
      Object.keys(boxConfigs).forEach(function(envKey) {
        html = replaceEnvironment(html, envKey, function(optBracket, optBrace, body) {
          return renderAcademicBox(envKey, optBracket || optBrace, body, detectedChap, counters);
        });
      });
    } else {
      let finalReplaced = '';
      let preChap = html.substring(0, chIndices[0].index);
      const preCounters = {};
      Object.keys(boxConfigs).forEach(function(envKey) {
        preChap = replaceEnvironment(preChap, envKey, function(optBracket, optBrace, body) {
          return renderAcademicBox(envKey, optBracket || optBrace, body, null, preCounters);
        });
      });
      finalReplaced += preChap;

      for (let ci = 0; ci < chIndices.length; ci++) {
        const cNum = chIndices[ci].chapNum;
        const start = chIndices[ci].index;
        const end = (ci + 1 < chIndices.length) ? chIndices[ci + 1].index : html.length;
        let cBody = html.substring(start, end);
        const cCounters = {};
        Object.keys(boxConfigs).forEach(function(envKey) {
          cBody = replaceEnvironment(cBody, envKey, function(optBracket, optBrace, body) {
            return renderAcademicBox(envKey, optBracket || optBrace, body, cNum, cCounters);
          });
        });
        finalReplaced += cBody;
      }
      html = finalReplaced;
    }

    // Môi trường kích thước chữ \begin{Large}...\end{Large}, \begin{huge}...\end{huge}, v.v.
    [
      { name: 'Huge', size: '2.1rem', weight: '700', line: '1.35' },
      { name: 'huge', size: '1.78rem', weight: '600', line: '1.4' },
      { name: 'LARGE', size: '1.48rem', weight: '600', line: '1.45' },
      { name: 'Large', size: '1.28rem', weight: '600', line: '1.5' },
      { name: 'large', size: '1.14rem', weight: '500', line: '1.55' },
      { name: 'normalsize', size: '1rem', weight: '400', line: '1.7' },
      { name: 'small', size: '0.92rem', weight: '400', line: '1.6' },
      { name: 'footnotesize', size: '0.85rem', weight: '400', line: '1.55' },
      { name: 'scriptsize', size: '0.78rem', weight: '400', line: '1.5' },
      { name: 'tiny', size: '0.72rem', weight: '400', line: '1.45' }
    ].forEach(function(fEnv) {
      html = replaceEnvironment(html, fEnv.name, function(_o1, _o2, body) {
        return '<div class="latex-fontsize-' + fEnv.name + '" style="font-size: ' + fEnv.size + '; line-height: ' + fEnv.line + '; margin: 10px 0;">' + body.trim() + '</div>';
      });
    });

    // Dọn dẹp triệt để bất kỳ thẻ môi trường TeX mồ côi nào còn sót lại
    html = html.replace(/\\begin\s*\{[a-zA-Z0-9_*]+\}(?:\s*\[[^\]]*\])?/g, '');
    html = html.replace(/\\end\s*\{[a-zA-Z0-9_*]+\}/g, '');

    let prevInlineFmt;
    do {
      prevInlineFmt = html;
      html = replaceCommandWithBraces(html, 'textbf', function(c) { return '<strong style="font-weight: 700;">' + c + '</strong>'; });
      html = replaceCommandWithBraces(html, 'textit', function(c) { return '<em>' + c + '</em>'; });
      html = replaceCommandWithBraces(html, 'textsl', function(c) { return '<em>' + c + '</em>'; });
      html = replaceCommandWithBraces(html, 'underline', function(c) { return '<u>' + c + '</u>'; });
      html = replaceCommandWithBraces(html, 'uline', function(c) { return '<u>' + c + '</u>'; });
      html = replaceCommandWithBraces(html, 'ul', function(c) { return '<u>' + c + '</u>'; });
      html = replaceCommandWithBraces(html, 'uwave', function(c) { return '<span style="text-decoration: underline wavy;">' + c + '</span>'; });
      html = replaceCommandWithBraces(html, 'dashuline', function(c) { return '<span style="text-decoration: underline dashed;">' + c + '</span>'; });
      html = replaceCommandWithBraces(html, 'dotuline', function(c) { return '<span style="text-decoration: underline dotted;">' + c + '</span>'; });
      html = replaceCommandWithBraces(html, 'so', function(c) { return '<span style="letter-spacing: 0.14em;">' + c + '</span>'; });
      html = replaceCommandWithBraces(html, 'caps', function(c) { return '<span style="font-variant: small-caps; letter-spacing: 0.05em;">' + c + '</span>'; });
      html = replaceCommandWithBraces(html, 'sout', function(c) { return '<s>' + c + '</s>'; });
      html = replaceCommandWithBraces(html, 'xout', function(c) { return '<s>' + c + '</s>'; });
      html = replaceCommandWithBraces(html, 'st', function(c) { return '<s>' + c + '</s>'; });
      html = replaceCommandWithBraces(html, 'emph', function(c) { return '<em>' + c + '</em>'; });
      html = replaceCommandWithBraces(html, 'texttt', function(c) { return '<code style="font-family: monospace; background: var(--s2); padding: 2px 6px; border-radius: 2px; border: 1px solid var(--s3); font-size: 0.9em;">' + c + '</code>'; });
      html = replaceCommandWithBraces(html, 'textsc', function(c) { return '<span style="font-variant: small-caps;">' + c + '</span>'; });
      html = replaceCommandWithBraces(html, 'textsuperscript', function(c) { return '<sup>' + c + '</sup>'; });
      html = replaceCommandWithBraces(html, 'textsubscript', function(c) { return '<sub>' + c + '</sub>'; });
      html = replaceCommandWithBraces(html, 'hl', function(c) { return '<mark style="background: rgba(250, 204, 21, 0.28); color: inherit; padding: 0 3px; border-radius: 2px;">' + c + '</mark>'; });
      html = replaceCommandWithBraces(html, 'enquote', function(c) { return '&ldquo;' + c + '&rdquo;'; });
      html = replaceCommandWithBraces(html, 'textsf', function(c) {
        return '<span style="font-family: \'Be Vietnam Pro\', system-ui, -apple-system, BlinkMacSystemFont, \'Segoe UI\', sans-serif;">' + c + '</span>';
      });
      ['textrm', 'textnormal', 'textup', 'textmd', 'mbox', 'hbox', 'text'].forEach(function(pCmd) {
        html = replaceCommandWithBraces(html, pCmd, function(c) { return c; });
      });
    } while (prevInlineFmt !== html);

    // Font size commands
    const fontSizes = [
      { name: 'Huge', size: '2.2rem', weight: '800', line: '1.3' },
      { name: 'huge', size: '1.8rem', weight: '700', line: '1.3' },
      { name: 'LARGE', size: '1.5rem', weight: '700', line: '1.4' },
      { name: 'Large', size: '1.3rem', weight: '600', line: '1.4' },
      { name: 'large', size: '1.15rem', weight: '500', line: '1.5' },
      { name: 'normalsize', size: '1em', weight: 'inherit', line: 'inherit' },
      { name: 'small', size: '0.92em', weight: 'inherit', line: '1.65' },
      { name: 'footnotesize', size: '0.85em', weight: 'inherit', line: '1.6' },
      { name: 'scriptsize', size: '0.78em', weight: 'inherit', line: '1.5' },
      { name: 'tiny', size: '0.72em', weight: 'inherit', line: '1.45' }
    ];

    fontSizes.forEach(function(fs) {
      // 1. Dạng lệnh tham số \Huge{...}
      html = replaceCommandWithBraces(html, fs.name, function(c) {
        return '<span style="font-size: ' + fs.size + '; font-weight: ' + fs.weight + '; line-height: ' + fs.line + ';">' + c + '</span>';
      });

      // 2. Dạng nhóm ngoặc nhọn {\Huge ...} với balanced braces
      let idx = 0;
      const groupToken = '{\\' + fs.name;
      while ((idx = html.indexOf(groupToken, idx)) !== -1) {
        const extracted = extractBalancedBraces(html, idx);
        if (!extracted) { idx += groupToken.length; continue; }
        const innerContent = extracted.content.replace(new RegExp('^\\\\' + fs.name + '\\s*'), '');
        const replacement = '<span style="font-size: ' + fs.size + '; font-weight: ' + fs.weight + '; line-height: ' + fs.line + ';">' + innerContent + '</span>';
        html = html.substring(0, idx) + replacement + html.substring(extracted.endIndex + 1);
        idx += replacement.length;
      }

      // 3. Dạng độc lập \Huge nằm trong thẻ hoặc dòng
      const standaloneRegex = new RegExp('\\\\' + fs.name + '\\s+([^<\\n\\r]+)', 'g');
      html = html.replace(standaloneRegex, '<span style="font-size: ' + fs.size + '; font-weight: ' + fs.weight + '; line-height: ' + fs.line + ';">$1</span>');
    });

    html = html.replace(/\\(?:Huge|huge|LARGE|Large|large|normalsize|small|footnotesize|scriptsize|tiny)(?![a-zA-Z])/g, '');

    html = replaceTwoArgCommandWithBraces(html, 'href', function(u, t) {
      const st = hyperrefUrlColorLocal
        ? ('color: ' + hyperrefUrlColorLocal + '; text-decoration: none;')
        : 'color: var(--b9); text-decoration: underline;';
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer" style="' + st + '">' + t + '</a>';
    });
    html = replaceCommandWithBraces(html, 'url', function(u) {
      const st = hyperrefUrlColorLocal
        ? ('color: ' + hyperrefUrlColorLocal + '; text-decoration: none;')
        : 'color: var(--b9); text-decoration: underline;';
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer" style="' + st + '">' + u + '</a>';
    });
    html = replaceCommandWithBraces(html, 'eqref', function(id) {
      const key = String(id || '').trim();
      const entry = labelMapLocal.get(key);
      const numStr = entry ? entry.num : key;
      if (hyperrefLinkColorLocal) {
        const hrefAttr = (entry && entry.anchorId) ? (' href="#' + entry.anchorId + '"') : '';
        return '(<a' + hrefAttr + ' class="latex-eqref" style="color: ' + hyperrefLinkColorLocal + '; text-decoration: none;">' + numStr + '</a>)';
      }
      return '(' + numStr + ')';
    });
    html = replaceCommandWithBraces(html, 'ref', function(id) {
      const key = String(id || '').trim();
      const entry = labelMapLocal.get(key);
      const numStr = entry ? entry.num : key;
      if (hyperrefLinkColorLocal) {
        const hrefAttr = (entry && entry.anchorId) ? (' href="#' + entry.anchorId + '"') : '';
        return '<a' + hrefAttr + ' class="latex-ref" style="color: ' + hyperrefLinkColorLocal + '; text-decoration: none;">' + numStr + '</a>';
      }
      return numStr;
    });
    html = replaceCommandWithBraces(html, 'cite', function(keys) {
      const cleanK = String(keys || '').trim();
      if (hyperrefCiteColorLocal) {
        return '[<span class="latex-cite" style="color: ' + hyperrefCiteColorLocal + ';">' + cleanK + '</span>]';
      }
      return '[' + cleanK + ']';
    });
    html = replaceCommandWithBraces(html, 'label', function() { return ''; });
    html = replaceCommandWithBraces(html, 'footnote', function(fn) { return '<sup class="latex-footnote" title="' + fn + '" style="color: var(--b9); cursor: help;">[*]</sup>'; });

    // Spacing & Symbols
    html = html.replace(/\\(?:qed|qedsymbol|qedd)(?![a-zA-Z])/g, '<span class="latex-tombstone">&#9632;</span>');
    html = html.replace(/\\(?:break|allowbreak|linebreak|newline)(?![a-zA-Z])/g, '<br/>');
    html = html.replace(/\\\\\*?(?:\s*\[[+-]?\d*(?:\.\d+)?\s*(?:pt|mm|cm|in|ex|em|bp|px)\])?/gi, '<br/>');
    html = html.replace(/\\\\\*?/g, '<br/>');
    html = html.replace(/\\(?:newpage|clearpage|cleardoublepage|pagebreak)/g, '<hr class="latex-pagebreak" style="margin: 40px 0; border: none; border-top: 1px dashed var(--s4);"/>');
    html = replaceCommandWithBraces(html, 'vspace', function(h) { return '<div style="height: ' + h + ';"></div>'; });
    html = replaceCommandWithBraces(html, 'hspace', function() { return '&nbsp;&nbsp;'; });
    html = html.replace(/\\bigskip(?![a-zA-Z])/g, '<div style="height: 24px;"></div>');
    html = html.replace(/\\medskip(?![a-zA-Z])/g, '<div style="height: 16px;"></div>');
    html = html.replace(/\\smallskip(?![a-zA-Z])/g, '<div style="height: 8px;"></div>');
    html = html.replace(/\\qquad(?![a-zA-Z])/g, '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;');
    html = html.replace(/\\quad(?![a-zA-Z])/g, '&nbsp;&nbsp;&nbsp;&nbsp;');
    html = html.replace(/\\par(?![a-zA-Z])/g, '\n\n');
    html = html.replace(/\\today(?![a-zA-Z])/g, function() {
      const now = new Date();
      return 'Tháng ' + (now.getMonth() + 1) + ' năm ' + now.getFullYear();
    });
    html = html.replace(/\\vspace\*?\s*\{([^}]*)\}/g, '<div style="height: $1;"></div>');
    html = html.replace(/\\hspace\*?\s*\{[^}]*\}/g, '&nbsp;&nbsp;');
    html = html.replace(/\\vfill(?![a-zA-Z])/g, '<div style="height: 16px;"></div>');
    html = html.replace(/\\dotfill(?![a-zA-Z])/g, '<span style="display: inline-block; min-width: 48px; border-bottom: 1px dotted var(--s6);"></span>');
    html = html.replace(/\\hrulefill(?![a-zA-Z])/g, '<span style="display: inline-block; min-width: 48px; border-bottom: 1px solid var(--s6);"></span>');
    html = html.replace(/\\hfill(?![a-zA-Z])/g, '&nbsp;&nbsp;&nbsp;&nbsp;');
    html = html.replace(/\\(?:enspace|thinspace)(?![a-zA-Z])/g, '&nbsp;');
    html = html.replace(/\\(?:negthinspace|noindent|indent|centering|raggedright|raggedleft|flushbottom|raggedbottom|sloppy|fussy|protect|relax|null|leavevmode|strut|mathstrut|normalfont|mdseries|upshape|rmfamily|sffamily|ttfamily|bfseries|itshape|slshape|scshape)(?![a-zA-Z])/g, '');
    html = html.replace(/\\slash(?![a-zA-Z])/g, '/');
    html = html.replace(/\\textbackslash(?:\{\})?(?![a-zA-Z])/g, '&#92;');
    html = html.replace(/\\textasciitilde(?:\{\})?(?![a-zA-Z])/g, '~');
    html = html.replace(/\\textasciicircum(?:\{\})?(?![a-zA-Z])/g, '^');
    html = html.replace(/\\textbar(?:\{\})?(?![a-zA-Z])/g, '|');
    html = html.replace(/\\textless(?:\{\})?(?![a-zA-Z])/g, '&lt;');
    html = html.replace(/\\textgreater(?:\{\})?(?![a-zA-Z])/g, '&gt;');
    html = html.replace(/\\textbullet(?![a-zA-Z])/g, '&bull;');
    html = html.replace(/\\(?:dots|ldots)(?![a-zA-Z])/g, '&hellip;');
    html = html.replace(/\\LaTeX(?![a-zA-Z])/g, 'LaTeX');
    html = html.replace(/\\TeX(?![a-zA-Z])/g, 'TeX');

    // Gỡ bỏ các ngoặc nhọn nhóm ẩn danh {...} của TeX còn sót lại trong văn xuôi (các ký hiệu \{ \} thật đã được chuyển thành &#123; &#125;)
    html = html.replace(/(<[^>]+>)|[{}]/g, function(m, tag) { return tag || ''; });

    // 12. Phân đoạn văn bản ngoài các khối HTML
    html = html.split(/\n\s*\n/).map(function(p) {
      const trimmed = p.trim();
      if (!trimmed) return '';
      if (isPreformattedHtmlBlock(trimmed)) {
        return trimmed;
      }
      return '<p style="margin-bottom: 16px;">' + trimmed.replace(/\n/g, ' ') + '</p>';
    }).join('\n');

    // 13. KaTeX render các Token toán học đã được bảo vệ
    mathTokens.forEach(function(entry, token) {
      let rendered = '';
      try {
        if (typeof katex !== 'undefined' && katex.renderToString) {
          // Phòng vệ đa lớp: giải phóng bất kỳ token toán học nào bị lồng vô tình trong code
          let cleanCode = entry.code;
          let prevCode;
          do {
            prevCode = cleanCode;
            mathTokens.forEach(function(subEntry, subToken) {
              if (cleanCode.includes(subToken)) {
                cleanCode = cleanCode.replaceAll(subToken, subEntry.code);
              }
            });
          } while (cleanCode !== prevCode);

          rendered = katex.renderToString(cleanCode, {
            throwOnError: false,
            strict: 'ignore',
            displayMode: entry.isDisplay,
            macros: {
              "\\vv": "\\vec",
              "\\bm": "\\mathbf",
              "\\boldsymbol": "\\mathbf",
              "\\RR": "\\mathbb{R}",
              "\\NN": "\\mathbb{N}",
              "\\ZZ": "\\mathbb{Z}",
              "\\QQ": "\\mathbb{Q}",
              "\\CC": "\\mathbb{C}",
              "\\eps": "\\varepsilon",
              "\\vphi": "\\varphi",
              "\\rchi": "\\chi",

              "\\norm": "\\left\\|#1\\right\\|",
              "\\degree": "^\\circ",
              "\\celsius": "^\\circ\\mathrm{C}"
            }
          });
        } else {
          rendered = entry.isDisplay ? '$$' + entry.code + '$$' : '$' + entry.code + '$';
        }
        if (entry.isDisplay) {
          const eqM = entry.eqMeta;
          const idAttr = (eqM && eqM.anchorId) ? (' id="' + eqM.anchorId + '"') : '';

              '<span class="latex-eq-number" style="flex-shrink: 0; font-style: normal; font-weight: 400; color: var(--s12); white-space: nowrap;">(' + eqM.assignedNumbers[0] + ')</span>' +
            '</div>';
          } else if (eqM && eqM.assignedNumbers && eqM.assignedNumbers.length > 1) {
            const numCol = eqM.assignedNumbers.map(function(nStr) {
              return '<span class="latex-eq-number" style="font-style: normal; font-weight: 400; color: var(--s12); white-space: nowrap;">(' + nStr + ')</span>';

  function formatMathContent(str) {
    if (!str || typeof str !== 'string') return '';
    if (typeof katex !== 'undefined') {

          })
          .replace(/\\\[([\s\S]+?)\\\]/g, function(_, m) {
            try { return katex.renderToString(unesc(m), { displayMode: true, throwOnError: false, macros: { "\\vv": "\\vec" } }); } catch(err) { return _; }
          })
          .replace(/\$([^\$]+?)\$/g, function(_, m) {
            try { return katex.renderToString(unesc(m), { displayMode: false, throwOnError: false, macros: { "\\vv": "\\vec" } }); } catch(err) { return _; }
          })
          .replace(/\\\(([\s\S]*?)\\\)/g, function(_, m) {
            try { return katex.renderToString(unesc(m), { displayMode: false, throwOnError: false, macros: { "\\vv": "\\vec" } }); } catch(err) { return _; }
          });
      } catch(e) {
        return str;
      }
    }
    return str;
  }

            {left: '\\[', right: '\\]', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false}

          macros: {
            "\\vv": "\\vec",
            "\\bm": "\\mathbf",
            "\\boldsymbol": "\\mathbf"

          throwOnError: false

  function formatTime(isoString) {
    if (!isoString) return '';
    // Nếu chuỗi thời gian không có định dạng múi giờ (Z hoặc +00:00), mặc định ép về UTC
    if (!isoString.endsWith('Z') && !isoString.match(/[+\-]\d{2}:\d{2}$/)) {
      isoString += 'Z';
    }
    var d = new Date(isoString);
    var now = new Date();
    var diffMs = now - d;
    var diffSec = Math.floor(diffMs / 1000);
    var diffMin = Math.floor(diffSec / 60);
    var diffHour = Math.floor(diffMin / 60);
    var diffDay = Math.floor(diffHour / 24);
    var diffMonth = Math.floor(diffDay / 30);
    var diffYear = Math.floor(diffDay / 365);

    if (diffSec < 60) return 'Vừa xong';
    if (diffMin < 60) return diffMin + tr('knowledge.minutes_ago', ' phút trước');
    if (diffHour < 24) return diffHour + tr('knowledge.hours_ago', ' giờ trước');
    if (diffDay < 30) return diffDay + tr('knowledge.days_ago', ' ngày trước');
    if (diffMonth < 12) return diffMonth + ' tháng trước';
    return diffYear + ' năm trước';
  }
  
  function getAvatarColor(name) {
    var colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
    var hash = 0;
    for (var i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
    return colors[Math.abs(hash) % colors.length];
  }

  function renderContent(raw) {
    var s = raw.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // Support legacy tags just in case
    s = s.replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g, '<b>$1</b>');
    s = s.replace(/&lt;i&gt;(.*?)&lt;\/i&gt;/g, '<i>$1</i>');
    s = s.replace(/&lt;code&gt;(.*?)&lt;\/code&gt;/g, '<code style="background:var(--s2); padding:2px 5px; border-radius:3px; font-family:monospace; font-size:0.85em;">$1</code>');
    
    // Support WYSIWYG generated tags
    s = s.replace(/&lt;strong&gt;(.*?)&lt;\/strong&gt;/gi, '<b>$1</b>');
    s = s.replace(/&lt;em&gt;(.*?)&lt;\/em&gt;/gi, '<i>$1</i>');
    s = s.replace(/&lt;br\/?&gt;/gi, '<br>');
    s = s.replace(/&lt;div&gt;(.*?)&lt;\/div&gt;/gi, '<div>$1</div>');
    
    // Support markdown
    s = s.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    s = s.replace(/\*(.*?)\*/g, '<i>$1</i>');
    s = s.replace(/`(.*?)`/g, '<code style="background:var(--s2); padding:2px 5px; border-radius:3px; font-family:monospace; font-size:0.85em;">$1</code>');
    return s;
  }

            html += '<div style="' + pinContainerStyle + '">' +
              pinIcon +
              '<div style="display:flex; gap:12px;">' +
                pAvatarHtml +
                '<div style="flex-grow:1;">' +
                  '<div style="display:flex; gap:8px; align-items:baseline; margin-bottom:5px;">' +
                    '<span style="font-weight:600; color:var(--s12); font-size:0.95rem;">' + pc.author_name + '</span>' +
                  '</div>' +
                  '<div class="comment-text-content" style="font-size:0.9rem; color:var(--s11); line-height:1.5; margin:0 0 8px; display: block; max-height: 130px; overflow: hidden; word-break: break-word;">' + renderContent(pc.content) + '</div>' +

                    '<span>' + formatTime(pc.created_at) + '</span>' +
                    '<span id="upvote-btn-' + pc.id + '" style="cursor:pointer; transition:color 0.15s; ' + (pc.is_upvoted_by_me ? 'color:var(--b9); font-weight:bold;' : '') + '" onclick="window._toggleUpvote(\'' + pc.id + '\')">' +

                    '<span style="cursor:pointer; transition:color 0.15s;" onmouseover="this.style.color=\'var(--b9)\'" onmouseout="this.style.color=\'\'" onclick="window._startReply(\'' + pc.id + '\',\'' + pc.author_name.replace(/'/g,"") + '\')">' +

                  '</div>';
            
            if (pc.replies && pc.replies.length > 0) {
              html += '<div style="margin-top:12px; font-size:0.85rem; font-weight:600; color:var(--b9); cursor:pointer; display:inline-flex; align-items:center; gap:6px; user-select:none;" onclick="window._toggleReplies(\'' + pc.id + '\')"><i class="ph ph-caret-down" id="reply-icon-' + pc.id + '"></i> ' + tr('knowledge.view_replies', 'Xem {count} phản hồi').replace('{count}', pc.replies.length) + '</div>';
              html += '<div id="replies-container-' + pc.id + '" style="display:none; padding-top:4px;">';
              pc.replies.sort(function(a,b){ return (b.upvote_count||0) - (a.upvote_count||0); });
              pc.replies.forEach(function(cc){
                var ci = cc.author_name ? cc.author_name.charAt(0).toUpperCase() : 'U';
                var cColor = getAvatarColor(cc.author_name || 'User');
                var cAvatarHtml = cc.avatar_url 
                  ? '<div style="width:30px; height:30px; border-radius:50%; background-image:url('+cc.avatar_url+'); background-size:cover; background-position:center; flex-shrink:0;"></div>' 
                  : '<div style="width:30px; height:30px; border-radius:50%; background:' + cColor + '; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.75rem; flex-shrink:0;">' + ci + '</div>';
                
                html += '<div style="display:flex; gap:12px; margin-top:12px; border-left: 2px solid var(--s3); padding-left: 12px;">' +
                  cAvatarHtml +
                  '<div>' +
                    '<div style="display:flex; gap:8px; align-items:baseline; margin-bottom:5px;">' +
                      '<span style="font-weight:600; color:var(--s12); font-size:0.9rem;">' + cc.author_name + '</span>' +
                    '</div>' +
                    '<div class="comment-text-content" style="font-size:0.9rem; color:var(--s11); line-height:1.5; margin:0 0 8px; display: block; max-height: 130px; overflow: hidden; word-break: break-word;">' + renderContent(cc.content) + '</div>' +
                    '<div style="display:flex; gap:12px; font-size:0.8rem; color:var(--s9); align-items:center;">' +
                      '<span>' + formatTime(cc.created_at) + '</span>' +
                      '<span id="upvote-btn-' + cc.id + '" style="cursor:pointer; transition:color 0.15s; ' + (cc.is_upvoted_by_me ? 'color:var(--b9); font-weight:bold;' : '') + '" onclick="window._toggleUpvote(\'' + cc.id + '\')">' +
                        '<i class="ph ph-arrow-up" style="margin-right:4px;"></i><span id="upvote-count-' + cc.id + '">' + (cc.upvote_count || 0) + '</span></span>' +
                    '</div>' +
                  '</div>' +
                '</div>';
              });
              html += '</div>';
            }
            html += '</div></div></div>';
          });
          
          document.getElementById('comments-container').innerHTML = html || '<p style="color:var(--s9); font-size:0.9rem;">' + tr('knowledge.no_comments', 'Chưa có bình luận nào') + '</p>';
          
          setTimeout(function() {
            var contents = document.querySelectorAll('.comment-text-content');
            contents.forEach(function(el) {
              if (el.scrollHeight > el.clientHeight + 5) {
                var btn = document.createElement('div');
                btn.innerHTML = tr('knowledge.see_more', 'Xem thêm');
                btn.style.cssText = 'color: var(--b9); cursor: pointer; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; display: inline-block;';
                el.parentNode.insertBefore(btn, el.nextSibling);
                
                var isExpanded = false;
                btn.onclick = function() {
                  if (!isExpanded) {
                    el.style.maxHeight = 'none';
                    btn.innerHTML = tr('knowledge.collapse', 'Thu gọn');
                  } else {
                    el.style.maxHeight = '130px';
                    btn.innerHTML = tr('knowledge.see_more', 'Xem thêm');
                    // Scroll back a bit if needed, but usually fine
                  }
                  isExpanded = !isExpanded;
                };
              }
            });
          }, 50);
        }
      })
      .catch(function(err){ console.error(err); });
  }
  
  window._toggleReplies = function(id) {
    var c = document.getElementById('replies-container-' + id);
    var i = document.getElementById('reply-icon-' + id);
    if (c) {
      if (c.style.display === 'none') {
        c.style.display = 'block';
        if (i) i.className = 'ph ph-caret-up';
      } else {
        c.style.display = 'none';
        if (i) i.className = 'ph ph-caret-down';
      }
    }
  };

  // Reply: scroll to main textarea & set parent
  window._startReply = function(parentId, authorName) {
    var repContainer = document.getElementById('replies-container-' + parentId);
    if (repContainer && repContainer.style.display === 'none') {
      window._toggleReplies(parentId);
    }
    
    _replyParentId = parentId;
    window._savedReplyParentId = parentId;
    window._savedReplyAuthorName = authorName;
    replyIndicator.style.display = 'flex';
    replyIndicator.innerHTML = '<span><i class="ph ph-arrow-u-up-left"></i> ' + tr('knowledge.replying_to', 'Đang phản hồi <b>{name}</b>').replace('{name}', authorName) + '</span>' +
      '<span style="cursor:pointer; font-size:18px;" onclick="window._cancelReply()">&times;</span>';
    textarea.setAttribute('data-placeholder', tr('knowledge.reply_to', 'Phản hồi ') + authorName + '...');
    textarea.focus();
    editor.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  window._cancelReply = function() {
    _replyParentId = null;
    window._savedReplyParentId = null;
    window._savedReplyAuthorName = null;
    replyIndicator.style.display = 'none';
    textarea.setAttribute('data-placeholder', tr('knowledge.write_comment', 'Viết bình luận hoặc đặt câu hỏi...'));
  };
  
  window._toggleUpvote = function(commentId) {
    var btn = document.getElementById('upvote-btn-' + commentId);
    var countSpan = document.getElementById('upvote-count-' + commentId);
    if (!btn || !countSpan) return;

    var isUpvoted = btn.style.color === 'var(--b9)';
    var currentCount = parseInt(countSpan.textContent) || 0;

    // Optimistic UI Update (Phản hồi tức thì)
    if (isUpvoted) {
      btn.style.color = '';
      btn.style.fontWeight = 'normal';
      countSpan.textContent = currentCount - 1;
    } else {
      btn.style.color = 'var(--b9)';
      btn.style.fontWeight = 'bold';
      countSpan.textContent = currentCount + 1;
    }

    var upvotePromise = window.App?.fetchApi
      ? window.App.fetchApi('/api/comment/upvote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (window.AuthGuard && window.AuthGuard.getToken ? window.AuthGuard.getToken() : localStorage.getItem('user_token')) },
          body: JSON.stringify({ comment_id: parseInt(commentId) })
        })
      : fetch(App.API_BASE + '/api/comment/upvote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (window.AuthGuard && window.AuthGuard.getToken ? window.AuthGuard.getToken() : localStorage.getItem('user_token')) },
          body: JSON.stringify({ comment_id: parseInt(commentId) })
        });

    upvotePromise
    .then(r => r.json())
    .then(data => {
      if(data.success) {
        loadComments(); // reload to update UI easily
      } else {
        window.App.showToast(data.message || 'Lỗi khi thả upvote', 'warning');
      }
    })
    .catch(e => console.error(e));
  };
  
  loadComments();



  // Scroll progress
  var scrollContainer = document.getElementById('dd-scroll-container');
  if (scrollContainer) {
    scrollContainer.onscroll = function() {
      var st = scrollContainer.scrollTop;
      var sh = scrollContainer.scrollHeight - scrollContainer.clientHeight;
      var progElement = document.getElementById('prog');
      if (sh > 0 && progElement) { progElement.style.width = ((st / sh) * 100) + '%'; }
    };
  }
}

// ---------- QUIZ SETUP ----------
function renderQuizSetup(c) {
  c.innerHTML = '';

  var h = document.createElement('h1');
  h.className = 'view-title';
  h.textContent = 'Tạo bộ đề';
  c.appendChild(h);

  var desc = document.createElement('p');
  desc.className = 'view-desc';
  desc.textContent = 'Chọn chủ đề, độ khó và chế độ làm ' + tr('knowledge.lesson_prefix', 'Bài') + ' phù hợp.';
  c.appendChild(desc);

  var hr = document.createElement('div');
  hr.style.cssText = 'border-bottom:1px solid var(--s3); margin:20px 0 28px;';
  c.appendChild(hr);

  var form = document.createElement('div');
  form.style.cssText = 'max-width:640px;';
  c.appendChild(form);

  // --- Phạm vi kiến thức ---
  var topicLabel = document.createElement('div');
  topicLabel.className = 'side-label';
  topicLabel.textContent = 'PHẠM VI KIẾN THỨC';
  topicLabel.style.cssText = 'padding:0; margin-bottom:12px; font-size:0.7rem; letter-spacing:0.05em;';
  form.appendChild(topicLabel);

  var treeContainer = document.createElement('div');
  treeContainer.style.cssText = 'border:1px solid var(--s3); border-radius:var(--radius); padding:12px; margin-bottom:28px; max-height: 400px; overflow-y: auto; background: var(--s2); display: flex; flex-direction: column; gap: 8px;';
  form.appendChild(treeContainer);

  var selectedTopics = {};
  var selectedLessons = {};
  
  function fetchMaxQuestions(callback) {
      var topics = Object.keys(selectedTopics);
      var lessons = Object.keys(selectedLessons);
      var token = (window.AuthGuard && window.AuthGuard.getToken ? window.AuthGuard.getToken() : localStorage.getItem('user_token'));
      
      if (!token) return;

      fetch(App.API_BASE + '/api/quiz/available-count', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({
          selected_topics: topics,
          selected_lessons: lessons,
          difficulty_config: typeof selectedDiff !== 'undefined' ? selectedDiff.value : 'MIXED'
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success && callback) {
          callback(data.count);
        }
      }).catch(function(e){});
  }

  if (typeof MOCK_LIBRARY_DATA !== 'undefined' && MOCK_LIBRARY_DATA.topics) {
    MOCK_LIBRARY_DATA.topics.forEach(function(topic) {
      var details = document.createElement('details');
      // details.open = false; // default closed to keep it neat
      details.style.cssText = 'background: var(--s1); border: 1px solid var(--s3); border-radius: 6px; padding: 4px 8px;';
      
      var summary = document.createElement('summary');
      summary.style.cssText = 'font-weight: 600; font-size: 0.9rem; color: var(--s11); cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 4px 0; user-select: none; list-style: none;';
      
      var topicCheckbox = document.createElement('input');
      topicCheckbox.type = 'checkbox';
      topicCheckbox.id = 'chk_' + topic.id;
      topicCheckbox.style.cssText = 'margin: 0; width: 16px; height: 16px; cursor: pointer; flex-shrink: 0;';
      
      var topicText = document.createElement('span');
      topicText.textContent = tr('library_terms.' + topic.id, topic.title).replace(/^\d+\.\s*/, '');
      topicText.style.cssText = 'flex-grow: 1;';

      // Small dropdown arrow indicator
      var arrow = document.createElement('i');
      arrow.className = 'ph ph-caret-down';
      arrow.style.cssText = 'font-size: 0.7rem; color: var(--s8); transition: transform 0.2s;';
      
      summary.appendChild(topicCheckbox);
      summary.appendChild(topicText);
      summary.appendChild(arrow);
      
      details.addEventListener('toggle', function() {
        arrow.style.transform = details.open ? 'rotate(180deg)' : 'rotate(0deg)';
      });

      details.appendChild(summary);

      var sectionsContainer = document.createElement('div');
      sectionsContainer.className = 'quiz-sections-indent';
      sectionsContainer.style.cssText = 'padding: 8px 0 8px 24px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--s3); margin-top: 4px;';

      var lessonCheckboxes = [];

      if (topic.sections) {
        topic.sections.forEach(function(section) {
          var secDetails = document.createElement('details');
          secDetails.open = false; // Closed by default
          secDetails.style.cssText = 'margin-top: 6px; border-bottom: 1px solid var(--s3); padding-bottom: 6px;';
          
          var secSummary = document.createElement('summary');
          secSummary.style.cssText = 'display:flex; align-items:center; gap:8px; cursor: pointer; list-style: none; user-select: none; padding: 4px 0;';
          
          var secArrow = document.createElement('i');
          secArrow.className = 'ph ph-caret-right';
          secArrow.style.cssText = 'font-size: 0.6rem; color: var(--s8); transition: transform 0.2s; width: 12px; text-align: center;';
          
          var secCheckbox = document.createElement('input');
          secCheckbox.type = 'checkbox';
          secCheckbox.style.cssText = 'margin: 0; width: 14px; height: 14px; cursor: pointer; flex-shrink: 0;';
          secCheckbox.addEventListener('click', function(e) { e.stopPropagation(); });

          var secLabel = document.createElement('span');
          secLabel.textContent = tr('library_terms.' + section.id, section.title);
          secLabel.style.cssText = 'font-weight: 500; font-size: 0.85rem; color: var(--s9);';
          
          secSummary.appendChild(secArrow);
          secSummary.appendChild(secCheckbox);
          secSummary.appendChild(secLabel);
          secDetails.appendChild(secSummary);
          
          secDetails.addEventListener('toggle', function() {
            secArrow.style.transform = secDetails.open ? 'rotate(90deg)' : 'rotate(0deg)';
          });

          var lessonsList = document.createElement('div');
          lessonsList.className = 'quiz-lessons-indent';
          lessonsList.style.cssText = 'display: flex; flex-direction: column; gap: 6px; padding-left: 36px; padding-top: 4px; padding-bottom: 8px;';
          
          var lessonCheckboxesInSection = [];

          if (section.lessons) {
            section.lessons.forEach(function(lesson) {
              var lessLabel = document.createElement('label');
              lessLabel.style.cssText = 'display: flex; align-items: flex-start; gap: 10px; font-size: 0.85rem; color: var(--s11); cursor: pointer; user-select: none; padding: 4px 0;';
              
              var lessCheckbox = document.createElement('input');
              lessCheckbox.type = 'checkbox';
              lessCheckbox.value = lesson.id;
              lessCheckbox.dataset.topicId = topic.id;
              lessCheckbox.style.cssText = 'margin: 2px 0 0 0; width: 14px; height: 14px; cursor: pointer; flex-shrink: 0;';
              lessonCheckboxes.push(lessCheckbox);
              lessonCheckboxesInSection.push(lessCheckbox);

              var lessText = document.createElement('span');
              lessText.textContent = tr('library_terms.' + lesson.id, lesson.title);
              lessText.style.cssText = 'line-height: 1.4;';

              lessCheckbox.addEventListener('change', function() {
                 if (this.checked) {
                   selectedLessons[lesson.id] = true;
                   selectedTopics[topic.id] = true;
                 } else {
                   delete selectedLessons[lesson.id];
                 }
                 
                 var allSecChecked = lessonCheckboxesInSection.every(cb => cb.checked);
                 var anySecChecked = lessonCheckboxesInSection.some(cb => cb.checked);
                 secCheckbox.checked = allSecChecked;
                 secCheckbox.indeterminate = anySecChecked && !allSecChecked;

                 var anyTopicChecked = lessonCheckboxes.some(cb => cb.checked);
                 var allTopicChecked = lessonCheckboxes.every(cb => cb.checked);
                 topicCheckbox.checked = anyTopicChecked;
                 topicCheckbox.indeterminate = anyTopicChecked && !allTopicChecked;
                 
                 if (!anyTopicChecked) {
                   delete selectedTopics[topic.id];
                 }
              });

              lessLabel.appendChild(lessCheckbox);
              lessLabel.appendChild(lessText);
              lessonsList.appendChild(lessLabel);
            });
          }

          secCheckbox.addEventListener('change', function() {
            var isChecked = this.checked;
            this.indeterminate = false;
            lessonCheckboxesInSection.forEach(function(cb) {
              if (cb.checked !== isChecked) {
                cb.checked = isChecked;
                cb.dispatchEvent(new Event('change'));
              }
            });
          });
          
          secDetails.appendChild(lessonsList);
          sectionsContainer.appendChild(secDetails);
        });
      }

      topicCheckbox.addEventListener('change', function() {
        var isChecked = this.checked;
        this.indeterminate = false;
        lessonCheckboxes.forEach(function(cb) {
          if (cb.checked !== isChecked) {
            cb.checked = isChecked;
            cb.dispatchEvent(new Event('change'));
          }
        });
      });

      // Prevent summary click when clicking checkbox
      topicCheckbox.addEventListener('click', function(e) { e.stopPropagation(); });

      details.appendChild(sectionsContainer);
      treeContainer.appendChild(details);
    });
  }

  var scopeBtnContainer = document.createElement('div');
  scopeBtnContainer.style.cssText = 'display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; margin-top: -16px;';
  form.appendChild(scopeBtnContainer);

  var confirmScopeBtn = document.createElement('button');
  confirmScopeBtn.textContent = 'Xác nhận phạm vi';
  confirmScopeBtn.style.cssText = 'padding:10px 24px; border-radius:var(--radius); border:none; background:var(--b9); color:#fff; font-size:0.85rem; font-family:inherit; font-weight:600; cursor:pointer; transition:all 0.15s ease;';

  var editScopeBtn = document.createElement('button');
  editScopeBtn.textContent = 'Chỉnh sửa phạm vi';
  editScopeBtn.style.cssText = 'padding:10px 24px; border-radius:var(--radius); border:1px solid var(--s4); background:transparent; color:var(--s11); font-size:0.85rem; font-family:inherit; font-weight:600; cursor:pointer; display:none;';

  scopeBtnContainer.appendChild(confirmScopeBtn);
  scopeBtnContainer.appendChild(editScopeBtn);

  var step2Container = document.createElement('div');
  form.appendChild(step2Container);

  confirmScopeBtn.onclick = function() {
    var topics = Object.keys(selectedTopics);
    if (topics.length === 0) {
      window.App.showToast('Vui lòng chọn ít nhất một chủ đề.', 'warning');
      return;
    }
    
    treeContainer.style.pointerEvents = 'none';
    treeContainer.style.opacity = '0.7';
    confirmScopeBtn.textContent = 'Đang kiểm tra...';
    confirmScopeBtn.disabled = true;
    confirmScopeBtn.style.opacity = '0.6';

    fetchMaxQuestions(function(maxQ) {
      window.countSuffix.textContent = 'câu hỏi (Tối đa ' + maxQ + ' câu thỏa mãn)';
      window.countInput.max = maxQ;
      if (parseInt(window.countInput.value) > maxQ && maxQ > 0) {
        window.countInput.value = maxQ;
      }

      confirmScopeBtn.style.display = 'none';
      editScopeBtn.style.display = 'inline-block';
      confirmScopeBtn.textContent = 'Xác nhận phạm vi';
      confirmScopeBtn.disabled = false;
      confirmScopeBtn.style.opacity = '1';
    });
  };

  editScopeBtn.onclick = function() {
    treeContainer.style.pointerEvents = 'auto';
    treeContainer.style.opacity = '1';
    editScopeBtn.style.display = 'none';
    confirmScopeBtn.style.display = 'inline-block';
  };

  // --- Độ khó ---
  var diffLabel = document.createElement('div');
  diffLabel.className = 'side-label';
  diffLabel.textContent = 'ĐỘ KHÓ';
  diffLabel.style.cssText = 'padding:0; margin-bottom:12px; font-size:0.7rem; letter-spacing:0.05em;';
  step2Container.appendChild(diffLabel);

  var diffGrid = document.createElement('div');
  diffGrid.style.cssText = 'display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px;';
  step2Container.appendChild(diffGrid);

  var difficulties = [
    { value: 'MIXED', label: 'Tổng hợp' },
    { value: 'EASY', label: 'Dễ' },
    { value: 'MEDIUM', label: 'Trung bình' },
    { value: 'HARD', label: 'Khó' }
  ];
  var selectedDiff = { value: 'MIXED' };
  window.selectedDiff = selectedDiff;
  var diffBtns = [];

  for (var d = 0; d < difficulties.length; d++) {
    (function(diff, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = diff.label;
      btn.style.cssText = 'padding:8px 16px; border-radius:var(--radius); border:1px solid var(--s3); background:var(--s2); color:var(--s9); font-size:0.82rem; font-family:inherit; cursor:pointer; transition:all 0.15s ease; font-weight:500;';
      if (index === 0) {
        btn.style.background = 'var(--b9)';
        btn.style.borderColor = 'var(--b9)';
        btn.style.color = '#fff';
      }
      btn.onclick = function() {
        selectedDiff.value = diff.value;
        for (var x = 0; x < diffBtns.length; x++) {
          diffBtns[x].style.background = 'var(--s2)';
          diffBtns[x].style.borderColor = 'var(--s3)';
          diffBtns[x].style.color = 'var(--s9)';
        }
        this.style.background = 'var(--b9)';
        this.style.borderColor = 'var(--b9)';
        this.style.color = '#fff';
        fetchMaxQuestions(function(maxQ) {
          window.countSuffix.textContent = 'câu hỏi (Tối đa ' + maxQ + ' câu thỏa mãn)';
          window.countInput.max = maxQ;
          if (parseInt(window.countInput.value) > maxQ && maxQ > 0) {
            window.countInput.value = maxQ;
          }
        });
      };
      diffBtns.push(btn);
      diffGrid.appendChild(btn);
    })(difficulties[d], d);
  }

  // --- Số câu ---
  var countLabel = document.createElement('div');
  countLabel.className = 'side-label';
  countLabel.textContent = 'SỐ CÂU HỎI';
  countLabel.style.cssText = 'padding:0; margin-bottom:12px; font-size:0.7rem; letter-spacing:0.05em;';
  step2Container.appendChild(countLabel);

  var countGrid = document.createElement('div');
  countGrid.style.cssText = 'display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:28px;';
  step2Container.appendChild(countGrid);

  // Expose to global/closure so updateMaxQuestions can use them
  window.countInput = document.createElement('input');
  var countInput = window.countInput;
  countInput.type = 'number';
  countInput.min = 1;
  countInput.max = 100;
  countInput.value = 10;
  countInput.style.cssText = 'padding:8px 12px; border-radius:var(--radius); border:1px solid var(--s3); background:var(--s2); color:var(--s11); font-size:0.9rem; font-family:inherit; width: 80px; text-align: center; font-weight: 600; outline: none;';
  
  window.countSuffix = document.createElement('span');
  var countSuffix = window.countSuffix;
  countSuffix.textContent = 'câu hỏi';
  countSuffix.style.cssText = 'font-size: 0.85rem; color: var(--s9); font-weight: 500;';

  countGrid.appendChild(countInput);
  countGrid.appendChild(countSuffix);

  // --- Thời gian ---
  var timeLabel = document.createElement('div');
  timeLabel.className = 'side-label';
  timeLabel.textContent = 'THỜI GIAN';
  timeLabel.style.cssText = 'padding:0; margin-bottom:12px; font-size:0.7rem; letter-spacing:0.05em;';
  step2Container.appendChild(timeLabel);

  var timeGrid = document.createElement('div');
  timeGrid.style.cssText = 'display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:28px;';
  step2Container.appendChild(timeGrid);

  var timeInput = document.createElement('input');
  timeInput.type = 'number';
  timeInput.min = 0;
  timeInput.max = 180;
  timeInput.value = 0;
  timeInput.style.cssText = 'padding:8px 12px; border-radius:var(--radius); border:1px solid var(--s3); background:var(--s2); color:var(--s11); font-size:0.9rem; font-family:inherit; width: 80px; text-align: center; font-weight: 600; outline: none;';
  
  var timeSuffix = document.createElement('span');
  timeSuffix.textContent = 'phút (0 = Không giới hạn)';
  timeSuffix.style.cssText = 'font-size: 0.85rem; color: var(--s9); font-weight: 500;';

  timeGrid.appendChild(timeInput);
  timeGrid.appendChild(timeSuffix);

  // --- Chế độ ---
  var modeLabel = document.createElement('div');
