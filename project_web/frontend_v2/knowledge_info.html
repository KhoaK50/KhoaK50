            while (cursor < html.length && /\s/.test(html[cursor])) cursor++;
            if (cursor >= html.length) { aborted = true; break; }
            if (html[cursor] === '{') {
              const grp = extractBalancedBraces(html, cursor);
              if (!grp) { aborted = true; break; }
              args.push(grp.content);
              cursor = grp.endIndex + 1;
            } else if (html[cursor] === '\\') {
              const st = /^\\([a-zA-Z]+|.)/.exec(html.slice(cursor));
              if (!st) { aborted = true; break; }
              args.push(st[0]);
              cursor += st[0].length;
            } else {
              args.push(html[cursor]);
              cursor += 1;
            }
          }
          if (aborted) {
            res += cm[0];
            i += cm[0].length;
            continue;
          }
          const expanded = macro.body.replace(/#([1-9])/g, function(full, d) {
            const idx = parseInt(d, 10) - 1;
            return (idx >= 0 && idx < args.length) ? args[idx] : full;
          });
          res += expanded;
          i = cursor;
          changed = true;
        }
        html = res;
        if (!changed) break;
      }
    })();

    // Chuẩn hóa và làm sạch các dấu phân cách toán học bị lỗi trước khi tokenize (dùng function để tránh $$ bị JS string replace nuốt thành $)
    html = html.replace(/\${4,}/g, function() { return '$$\n$$'; });
    html = html.replace(/\$\$([^\n$]+?)\$\$\$/g, function(m, p1) { return '$$' + p1 + '$$\n$$'; });
    html = html.replace(/\${3,}/g, function() { return '$$\n$$'; });
    html = html.replace(/\\\\(?=\$\$)/g, '\n\n');
    html = html.replace(/\\\\(?=\$)/g, '\n');
    html = html.replace(/\\\$/g, '___LATEX_ESCAPED_DOLLAR___');
    html = html.replace(/\\vert\{\}/g, '|');
    html = html.replace(/&#8407;/g, '');

    // 3. BẢO VỆ TOÁN HỌC: Trích xuất và thay thế toán học bằng Token bảo vệ
    // Ngăn chặn xung đột giữa cú pháp toán học (<, >, &, \\, _, *) với HTML/DOM
    const mathTokens = new Map();
    let mathCounter = 0;

    function splitTopLevelMathRowsLocal(mathBody) {
      const rows = [];
      if (!mathBody) return rows;
      let envDepth = 0;
      let braceDepth = 0;
      let rowStart = 0;
      let i = 0;
      while (i < mathBody.length) {
        if (mathBody[i] === '\\') {
          if (mathBody[i + 1] === '\\' && envDepth === 0 && braceDepth === 0) {
            rows.push(mathBody.slice(rowStart, i));
            i += 2;
            while (i < mathBody.length && (mathBody[i] === ' ' || mathBody[i] === '\t' || mathBody[i] === '*')) i++;
            if (mathBody[i] === '[') {
              const obr = extractBalancedBrackets(mathBody, i);
              if (obr) i = obr.endIndex + 1;
            }
            rowStart = i;
            continue;
          }
          const envM = /^\\(begin|end)\s*\{[^}]+\}/.exec(mathBody.slice(i));
          if (envM) {
            if (envM[1] === 'begin') envDepth++;
            else if (envDepth > 0) envDepth--;
            i += envM[0].length;
            continue;
          }
          i += 2;
          continue;
        }
        if (mathBody[i] === '{') braceDepth++;
        else if (mathBody[i] === '}' && braceDepth > 0) braceDepth--;
        i++;
      }
      rows.push(mathBody.slice(rowStart));
      return rows;
    }

    function storeMath(code, isDisplay, eqMeta) {
      let cleanCode = code.replace(/___LATEX_ESCAPED_DOLLAR___/g, '\\$');
      cleanCode = cleanCode.replace(/\\label\s*\{[^}]*\}/g, '');
      cleanCode = cleanCode.replace(/\\label\b[0-9.]+/g, '');
      cleanCode = cleanCode.replace(/\\(?:notag|nonumber)\b/g, '');
      cleanCode = cleanCode.replace(/\\vv\s*\{/g, '\\vec{');
      cleanCode = cleanCode.replace(/\\vv\b/g, '\\vec');
      cleanCode = replaceCommandWithBraces(cleanCode, 'ensuremath', function(inner) { return inner; });
      cleanCode = cleanCode.replace(/\\\\[\s\r\n]*\\(?:break|allowbreak|linebreak|newline)\b/g, '\\\\');
      cleanCode = cleanCode.replace(/\\(?:break|allowbreak|linebreak|newline|pagebreak|nopagebreak)\b/g, ' ');
      cleanCode = cleanCode.replace(/\\(textcolor|color)\s*(?:\[\s*([^\]]*)\s*\])?\s*\{([^}]+)\}/g, function(_m, cmd, colMod, colSpec) {
        return '\\' + cmd + '{' + mapLatexColorHexOnly(colSpec, colMod || '') + '}';
      });
      const token = '___KATEX_MATH_' + (isDisplay ? 'DISP' : 'INLN') + '_' + (mathCounter++) + '___';
      mathTokens.set(token, { code: cleanCode, isDisplay: isDisplay, eqMeta: eqMeta || null });
      return token;
    }

    // Display math: $$...$$
    html = html.replace(/\$\$([\s\S]+?)\$\$/g, function(m, code) { return storeMath(code, true, null); });
    // Display math: \[...\] (dùng negative lookbehind để không nuốt nhầm dấu ngắt dòng \\[0.7cm])
    html = html.replace(/(?<!\\)\\\[([\s\S]+?)(?<!\\)\\\]/g, function(m, code) { return storeMath(code, true, null); });

    // Các môi trường toán học khối: equation, align, gather, multline, eqnarray, flalign, alignat, split
    const mathEnvs = ['equation\\*?', 'align\\*?', 'gather\\*?', 'multline\\*?', 'aligned', 'eqnarray\\*?', 'flalign\\*?', 'alignat\\*?', 'split'];
    mathEnvs.forEach(function(envPattern) {
      const envRegex = new RegExp('\\\\begin\\{(' + envPattern + ')\\}([\\s\\S]*?)\\\\end\\{\\1\\}', 'g');
      html = html.replace(envRegex, function(m, envName, code) {
        let innerMath = code;
        if (envName.startsWith('alignat')) {
          innerMath = innerMath.replace(/^\s*\{[^}]*\}/, '');
        }
        const isStarMath = envName.endsWith('*');
        const baseMathEnv = envName.replace(/\*$/, '');
        const isMultiRowEnv = ['align', 'flalign', 'alignat', 'gather', 'eqnarray'].indexOf(baseMathEnv) !== -1;
        const isNumberableEnv = !isStarMath && (baseMathEnv === 'equation' || baseMathEnv === 'multline' || isMultiRowEnv);

        let eqMeta = null;
        if (isNumberableEnv) {
          const rawRows = isMultiRowEnv ? splitTopLevelMathRowsLocal(innerMath) : [innerMath];
          const rowDescs = [];
          let firstLabel = '';
          rawRows.forEach(function(rText) {
            if (!rText || !rText.trim()) return;
            const hasNoNum = /\\(?:notag|nonumber)\b/.test(rText);
            const tagM = /\\tag\*?\s*\{([^}]*)\}/.exec(rText);
            const rowLabels = [];
            const lRe = /\\label\s*\{([^}]+)\}/g;
            let lm;
            while ((lm = lRe.exec(rText)) !== null) {
              const lk = lm[1].trim();
              if (lk) {
                rowLabels.push(lk);
                if (!firstLabel) firstLabel = lk;
              }
            }
            rowDescs.push({
              hasNoNum: hasNoNum,
              explicitTag: tagM ? tagM[1].trim() : '',
              labels: rowLabels
            });
          });
          if (isMultiRowEnv) {
            innerMath = innerMath.replace(/\\tag\*?\s*\{[^}]*\}/g, '');
          }
          eqMeta = {
            baseEnv: baseMathEnv,
            isMultiRow: isMultiRowEnv,
            rows: rowDescs,
            assignedNumbers: [],
            anchorId: firstLabel ? ('eq-lbl-' + firstLabel.replace(/[^a-zA-Z0-9_.-]+/g, '-')) : ''
          };
        }

        if (envName.startsWith('align') || envName.startsWith('flalign') || envName.startsWith('alignat') || envName.startsWith('eqnarray') || envName.startsWith('split')) {
          return storeMath('\\begin{aligned}' + innerMath + '\\end{aligned}', true, eqMeta);
        }
        if (envName.startsWith('gather') || envName.startsWith('multline')) {
          return storeMath('\\begin{gathered}' + innerMath + '\\end{gathered}', true, eqMeta);
        }
        return storeMath(innerMath, true, eqMeta);
      });
    });

    // Inline math: \(...\) (dùng negative lookbehind bảo vệ)
    html = html.replace(/(?<!\\)\\\(([\s\S]*?)(?<!\\)\\\)/g, function(m, code) { return storeMath(code, false, null); });
    // Inline math: $...$ (hỗ trợ nhiều dòng trong cùng một đoạn văn, không cắt ngang đoạn rỗng)
    html = html.replace(/\$((?:[^\$\n]|\n(?!\s*\n))+?)\$/g, function(m, code) { return storeMath(code, false, null); });

    // Môi trường ma trận độc lập (chỉ bắt các ma trận đứng độc lập NGOÀI dấu $...$ nếu có)
    const matrixEnvs = ['pmatrix', 'bmatrix', 'Bmatrix', 'vmatrix', 'Vmatrix', 'matrix', 'smallmatrix', 'cases', 'dcases', 'rcases'];
    matrixEnvs.forEach(function(env) {
      const matRegex = new RegExp('\\\\begin\\{(' + env + ')\\}([\\s\\S]*?)\\\\end\\{\\1\\}', 'g');
      html = html.replace(matRegex, function(m) { return storeMath(m, true, null); });
    });

    // Hỗ trợ \ensuremath{...} xuất hiện trực tiếp trong văn xuôi ngoài $...$
    html = replaceCommandWithBraces(html, 'ensuremath', function(mCode) {
      return storeMath(mCode, false, null);
    });

    // 4. Dọn dẹp macro nội bộ TeX, khai báo gói lệnh và khai báo môi trường có ngoặc nhọn lồng nhau
    function stripBalancedDeclarationsLocal(src) {
      const declRegex = /\\(?:newcommand|renewcommand|providecommand|DeclareRobustCommand|DeclareMathOperator|DeclarePairedDelimiter|newenvironment|renewenvironment|NewEnviron|RenewEnviron|NewDocumentCommand|RenewDocumentCommand|ProvideDocumentCommand|DeclareDocumentCommand|NewDocumentEnvironment|RenewDocumentEnvironment|newtcolorbox|renewtcolorbox|NewTColorBox|RenewTColorBox|DeclareTColorBox|newtcbtheorem|renewtcbtheorem|newtcbox|tcolorboxenvironment|tcbset|mdfdefinestyle|mdfsetup|newmdtheoremenv|newmdenv|surroundwithmdframed|BeforeBeginEnvironment|AtBeginEnvironment|AfterEndEnvironment|AtEndEnvironment|declaretheoremstyle|declaretheorem|newtheorem|newtheoremstyle|theoremstyle|definecolor|colorlet|setlength|addtolength|settowidth|fancypagestyle|fancyhead|fancyfoot|fancyhf|hypersetup|geometry)\*?(?![a-zA-Z])/g;
      let out = '';
      let last = 0;
      let dm;
      while ((dm = declRegex.exec(src)) !== null) {
        out += src.slice(last, dm.index);
        let cur = dm.index + dm[0].length;
        while (cur < src.length && (src[cur] === ' ' || src[cur] === '\t')) cur++;
        if (src[cur] === '\\') {
          const bareCmd = /^\\[a-zA-Z@]+/.exec(src.slice(cur));
          if (bareCmd) cur += bareCmd[0].length;
        }
        let consumedGroup = false;
        while (cur < src.length) {
          let ws = cur;
          while (ws < src.length && (src[ws] === ' ' || src[ws] === '\t')) ws++;
          if (ws < src.length && (src[ws] === '\r' || src[ws] === '\n')) {
            let nl = ws;
            if (src[nl] === '\r') nl++;
            if (src[nl] === '\n') nl++;
            while (nl < src.length && (src[nl] === ' ' || src[nl] === '\t')) nl++;
            if (src[nl] === '[' || src[nl] === '{') ws = nl;
          }
          if (src[ws] === '[') {
            const br = extractBalancedBrackets(src, ws);
            if (!br) break;
            cur = br.endIndex + 1;
            consumedGroup = true;
          } else if (src[ws] === '{') {
            const bg = extractBalancedBraces(src, ws);
            if (!bg) break;
            cur = bg.endIndex + 1;
            consumedGroup = true;
          } else {
            break;
          }
        }
        last = consumedGroup ? cur : (dm.index + dm[0].length);
        declRegex.lastIndex = last;
      }
      out += src.slice(last);
      return out;
    }
    html = stripBalancedDeclarationsLocal(html);

    // 4b. Quét tuần tự toàn bộ văn bản để gán số thứ tự phương trình (2.1) và bảng ánh xạ \label -> \eqref / \ref
    const labelMapLocal = new Map();
    (function buildSequentialLabelsAndEquationNumbersLocal() {
      const CANON_BUCKET = {
        dn: 'dn', definition: 'dn', dinhnghia: 'dn',
        vd: 'vd', example: 'vd', vidu: 'vd',
        dl: 'dl', theorem: 'dl', dinhly: 'dl', lemma: 'dl', bode: 'dl', bd: 'dl',
        tc: 'tc', property: 'tc', properties: 'tc', tinhchat: 'tc', proposition: 'tc', menhde: 'tc', md: 'tc',
        hq: 'hq', corollary: 'hq', hequa: 'hq',
        nx: 'nx', remark: 'nx', nhanxet: 'nx',
        bt: 'bt', exercise: 'bt', baitap: 'bt', btmau: 'bt'
      };
      let sChap = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.chapter || 0);
      let sSec = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.section || 0);
      let sSub = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.subsection || 0);
      let sSubSub = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.subsubsection || 0);
      let sEq = isStandaloneNormalizedLesson ? 0 : (initialCountersLocal.equation || 0);
      let sFig = 0;
      let sTbl = 0;
      let sBoxCnt = {};
      let eqAutoAnchorIdx = 0;
      let currentTarget = null;

      const fmtEq = function(n) {
        if (equationWithinLocal === 'chapter' && sChap > 0) return sChap + '.' + n;
        if (equationWithinLocal === 'section' && sSec > 0) return (sChap > 0 ? (sChap + '.' + sSec) : String(sSec)) + '.' + n;
        return String(n);
      };

      const seqRe = /\\(setcounter|addtocounter|stepcounter|refstepcounter)\s*\{([a-zA-Z0-9_*]+)\}(?:\s*\{([+-]?\d+)\})?|\\(chapter|section|subsection|subsubsection)(\*)?(?![a-zA-Z@])|(___KATEX_MATH_DISP_\d+___)|\\begin\s*\{([a-zA-Z0-9_*]+)\}|\\label\s*\{([^}]+)\}/g;
      let qm;
      while ((qm = seqRe.exec(html)) !== null) {
        if (qm[1]) {
          if (isStandaloneNormalizedLesson) continue;
          const op = qm[1];
          const cn = qm[2].trim();
          const val = qm[3] !== undefined ? parseInt(qm[3], 10) : 0;
          const applyOp = function(prev) {
            if (op === 'setcounter' && !isNaN(val)) return val;
            if (op === 'addtocounter' && !isNaN(val)) return prev + val;
            if (op === 'stepcounter' || op === 'refstepcounter') return prev + 1;
            return prev;
          };
          if (cn === 'chapter') {
            sChap = applyOp(sChap);
            if (op === 'stepcounter' || op === 'refstepcounter') {
              sSec = 0; sSub = 0; sSubSub = 0; sBoxCnt = {};
              if (equationWithinLocal === 'chapter') sEq = 0;
            }
          } else if (cn === 'section') {
            sSec = applyOp(sSec);
            if (op === 'stepcounter' || op === 'refstepcounter') {
              sSub = 0; sSubSub = 0;
              if (equationWithinLocal === 'section') sEq = 0;
            }
          } else if (cn === 'subsection') sSub = applyOp(sSub);
          else if (cn === 'subsubsection') sSubSub = applyOp(sSubSub);
          else if (cn === 'equation') sEq = applyOp(sEq);
          else if (cn !== 'tocdepth' && cn !== 'secnumdepth') {
            const bKey = CANON_BUCKET[cn] || cn;
            sBoxCnt[bKey] = applyOp(sBoxCnt[bKey] || 0);
          }
          continue;
        }
        if (qm[4]) {
          const ht = qm[4];
          const isSt = Boolean(qm[5]);
          if (!isSt) {
            if (ht === 'chapter') {
              sChap++; sSec = 0; sSub = 0; sSubSub = 0; sBoxCnt = {};
              if (equationWithinLocal === 'chapter') sEq = 0;
              currentTarget = { num: String(sChap), anchorId: 'chapter-' + sChap };
            } else if (ht === 'section') {
              sSec++; sSub = 0; sSubSub = 0;
              if (equationWithinLocal === 'section') sEq = 0;
              currentTarget = {
                num: sChap > 0 ? (sChap + '.' + sSec) : String(sSec),
                anchorId: 'section-' + (sChap ? sChap + '-' : '') + sSec
              };
            } else if (ht === 'subsection') {
              sSub++; sSubSub = 0;
              const eSec = sSec || 1;
              currentTarget = {
                num: sChap > 0 ? (sChap + '.' + eSec + '.' + sSub) : (eSec + '.' + sSub),
                anchorId: 'subsec-' + (sChap ? sChap + '-' : '') + eSec + '-' + sSub
              };
            } else if (ht === 'subsubsection') {
              sSubSub++;
              const eSec = sSec || 1;
              const eSub = sSub || 1;
              currentTarget = {
                num: sChap > 0 ? (sChap + '.' + eSec + '.' + eSub + '.' + sSubSub) : (eSec + '.' + eSub + '.' + sSubSub),
                anchorId: 'subsubsec-' + (sChap ? sChap + '-' : '') + eSec + '-' + eSub + '-' + sSubSub
              };
            }
          }
          continue;
        }
        if (qm[6]) {
          const entry = mathTokens.get(qm[6]);
          if (entry && entry.eqMeta) {
            if (!entry.eqMeta.anchorId) {
              entry.eqMeta.anchorId = 'eq-auto-' + (++eqAutoAnchorIdx);
            }
            entry.eqMeta.rows.forEach(function(rDesc) {
              let rowNum = '';
              if (rDesc.explicitTag) {
                rowNum = rDesc.explicitTag;
                if (entry.eqMeta.isMultiRow) {
                  entry.eqMeta.assignedNumbers.push(rowNum);
                }
              } else if (!rDesc.hasNoNum) {
                sEq++;
                rowNum = fmtEq(sEq);
                entry.eqMeta.assignedNumbers.push(rowNum);
              }
              rDesc.labels.forEach(function(lk) {
                if (lk && !labelMapLocal.has(lk)) {
                  labelMapLocal.set(lk, { num: rowNum || fmtEq(Math.max(1, sEq)), anchorId: entry.eqMeta.anchorId });
                }
              });
            });
          }
          continue;
        }
        if (qm[7]) {
          const rawEnv = qm[7].trim();
          if (rawEnv.endsWith('*')) continue;
          if (rawEnv === 'figure') {
            sFig++;
            currentTarget = { num: (equationWithinLocal === 'chapter' && sChap > 0) ? (sChap + '.' + sFig) : String(sFig), anchorId: '' };
            continue;
          }
          if (rawEnv === 'table') {
            sTbl++;
            currentTarget = { num: (equationWithinLocal === 'chapter' && sChap > 0) ? (sChap + '.' + sTbl) : String(sTbl), anchorId: '' };
            continue;
          }
          const canon = CANON_BUCKET[rawEnv] || null;
          const pInfo = persistedBoxStyles[rawEnv] || (canon ? persistedBoxStyles[canon] : null) || null;
          if (pInfo && pInfo.isPureTcolorbox && !pInfo.label) continue;
          const shouldCnt = pInfo ? (pInfo.hasCounter !== false) : Boolean(canon);
          if (shouldCnt) {
            const cKey = (pInfo && pInfo.sharedCounter)
              ? (CANON_BUCKET[pInfo.sharedCounter] || pInfo.sharedCounter)
              : (canon || rawEnv);
            sBoxCnt[cKey] = (sBoxCnt[cKey] || 0) + 1;
            const cVal = sBoxCnt[cKey];
            currentTarget = {
              num: sChap > 0 ? (sChap + '.' + cVal) : String(cVal),
              anchorId: ''
            };
          }
          continue;
        }
        if (qm[8]) {
          const lk = qm[8].trim();
          if (lk && !labelMapLocal.has(lk) && currentTarget) {
            labelMapLocal.set(lk, currentTarget);
          }
        }
      }
    })();

    html = html.replace(/\\let\s*\\[a-zA-Z@]+\s*(?:=\s*)?\\?undefined/g, '');
    html = html.replace(/\\?undefined\b/g, '');
    html = html.replace(/\\makeatletter\b/g, '');
    html = html.replace(/\\makeatother\b/g, '');
    html = html.replace(/\\@ifundefined\{[^}]*\}\{[^}]*\}\{[^}]*\}/g, '');
    html = html.replace(/\\RequirePackage(?:\[[^\]]*\])?\{[^}]*\}/g, '');
    html = html.replace(/\\usepackage(?:\[[^\]]*\])?\{[^}]*\}/g, '');
    html = html.replace(/\\documentclass(?:\[[^\]]*\])?\{[^}]*\}/g, '');
    html = html.replace(/\\pagestyle\{[^}]*\}/g, '');
    html = html.replace(/\\thispagestyle\{[^}]*\}/g, '');
    html = html.replace(/\\pagenumbering\{[^}]*\}/g, '');
    html = html.replace(/\\frontmatter\b/g, '');
    html = html.replace(/\\mainmatter\b/g, '');
    html = html.replace(/\\backmatter\b/g, '');
    html = html.replace(/\\graphicspath\{[\s\S]*?\}\s*/g, '');
    html = html.replace(/\\linespread\{[^}]*\}/g, '');
    html = html.replace(/\\newcounter\{[^}]*\}(?:\[[^\]]*\])?/g, '');
    html = html.replace(/\\numberwithin\{[^}]*\}\{[^}]*\}/g, '');
    html = html.replace(/\\tcbuselibrary\{[^}]*\}/g, '');
    html = html.replace(/\\usetikzlibrary\{[^}]*\}/g, '');
    html = html.replace(/\\hyphenation\{[^}]*\}/g, '');
    html = html.replace(/\\selectfont\b/g, '');
    html = html.replace(/\\normalfont\b/g, '');
    html = html.replace(/\\vfill\b/g, '');
    html = html.replace(/\\hfill\b/g, '');
    html = html.replace(/\\noindent\b/g, '');
    html = html.replace(/\\centering\b/g, '');
    html = html.replace(/\\raggedright\b/g, '');
    html = html.replace(/\\raggedleft\b/g, '');
    html = html.replace(/\\par\b/g, '\n\n');
    html = html.replace(/\\protect\b/g, '');

    // Xử lý \bai{...} thành huy hiệu tiêu đề bài tập
    html = replaceCommandWithBraces(html, 'bai', function(inner) {
      return storeHtmlBlock('<strong class="latex-bai-title" style="color: var(--s12); font-weight: 700; margin-right: 6px;">' + inner + '</strong>');
    });

    // Xử lý \loigiai{...} (gói ex_test Việt Nam) có ngoặc nhọn cân bằng trước khi xử lý \lgiai
    html = replaceCommandWithBraces(html, 'loigiai', function(solBody) {
      return '\n\\lgiai\n' + solBody.trim() + '\n';
    });

    // Xử lý \lgiai thành tiêu đề khối Lời giải chuẩn mực học thuật
    html = html.replace(/\\lgiai\b/g, function() {
      return storeHtmlBlock(
        '<div class="latex-solution-header" style="font-weight: 700; margin: 20px 0 10px; color: var(--s12); display: flex; align-items: center; gap: 8px;">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30a46c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
        '<span>Lời giải</span>' +
        '</div>'
      );
    });

    // Chuyển \today thành định dạng thời gian học thuật tiếng Việt
    html = html.replace(/\\today\b/g, function() {
      const now = new Date();
      return 'Tháng ' + (now.getMonth() + 1) + ' năm ' + now.getFullYear();
    });

    // ESCAPE HTML THÔ TRƯỚC KHI SINH RA BẤT KỲ THẺ HTML NÀO
    html = html.replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Xử lý các ký tự thoát hiểm LaTeX trong chế độ văn bản (ngoài các công thức toán đã được lưu trong mathTokens)
    html = html.replace(/___LATEX_ESCAPED_DOLLAR___/g, '&#36;');
    html = html.replace(/\\%/g, '%');
    html = html.replace(/\\#/g, '#');
    html = html.replace(/\\_/g, '_');
    html = html.replace(/\\&/g, '&amp;');
    html = html.replace(/\\\{/g, '&#123;');
    html = html.replace(/\\\}/g, '&#125;');
    html = html.replace(/\\textbraceleft(?:\{\})?(?![a-zA-Z])/g, '&#123;');
    html = html.replace(/\\textbraceright(?:\{\})?(?![a-zA-Z])/g, '&#125;');
    html = html.replace(/(?:\\~|~)/g, '&nbsp;');
    html = html.replace(/\\textless(?:\{\})?(?![a-zA-Z])/g, '&lt;');
    html = html.replace(/\\textgreater(?:\{\})?(?![a-zA-Z])/g, '&gt;');
    html = html.replace(/\\textasciitilde(?:\{\})?(?![a-zA-Z])/g, '~');
    html = html.replace(/\\textasciicircum(?:\{\})?(?![a-zA-Z])/g, '^');
    html = html.replace(/\\textbackslash(?:\{\})?(?![a-zA-Z])/g, '&#92;');

    // Chuyển chuỗi gạch ngang trang trí \textbf{--------} thành đường phân cách thanh mảnh
    html = html.replace(/\\textbf\{\s*-{4,}\s*\}/g, '<hr class="latex-divider" style="width: 140px; margin: 14px auto; border: none; border-top: 1.5px solid var(--s6);" />');
    html = html.replace(/(?:^|\n)\s*-{8,}\s*(?:\n|$)/g, '\n<hr class="latex-divider" style="width: 140px; margin: 14px auto; border: none; border-top: 1.5px solid var(--s6);" />\n');

    // Chuyển nhóm ngoặc nhọn chứa chuỗi switch TeX: {\Large\bfseries\color{deepred} ...}, {\bf ...}, {\it ...}
    const GROUP_SIZE_MAP = {
      Huge: '2.2rem', huge: '1.8rem', LARGE: '1.5rem', Large: '1.3rem', large: '1.15rem',
      normalsize: '1em', small: '0.92em', footnotesize: '0.85em', scriptsize: '0.78em', tiny: '0.72em'
    };
    const STANDALONE_SWITCH_NAMES = new Set([
      'Huge', 'huge', 'LARGE', 'Large', 'large', 'normalsize', 'small', 'footnotesize', 'scriptsize', 'tiny',
      'bfseries', 'bf', 'mdseries', 'normalfont', 'itshape', 'it', 'slshape', 'sl', 'em', 'upshape',
      'scshape', 'sc', 'ttfamily', 'tt', 'rmfamily', 'rm', 'sffamily', 'sf', 'centering', 'raggedright', 'raggedleft'
    ]);
    function isBraceOwnedByCommand(str, openBraceIdx) {
      let p = openBraceIdx - 1;
      while (p >= 0 && /[ \t\r\n]/.test(str[p])) p--;
      if (p < 0) return false;
      for (let hop = 0; hop < 3; hop++) {
        if (str[p] === ']' || str[p] === '}') {
          const closeCh = str[p];
          const openCh = closeCh === ']' ? '[' : '{';
          let depth = 0;
          let k = p;
          while (k >= 0) {
            if (str[k] === closeCh) depth++;
            else if (str[k] === openCh) {
              depth--;
              if (depth === 0) break;
            }
            k--;
          }
          if (k <= 0) return false;
          p = k - 1;
          while (p >= 0 && /[ \t\r\n]/.test(str[p])) p--;
          continue;
        }
        break;
      }
      const tail = str.slice(Math.max(0, p - 40), p + 1);
      const cm = /\\([a-zA-Z@]+)\*?$/.exec(tail);
      if (!cm) return false;
      const cmdName = cm[1];
      if (cmdName === 'begin' || cmdName === 'end') return false;
      if (STANDALONE_SWITCH_NAMES.has(cmdName)) return false;
      return true;
    }
    function convertBeginEndGroupToBracesLocal(inputStr) {
      if (!inputStr || inputStr.indexOf('\\begingroup') === -1) return inputStr;
      const tokRe = /\\(begingroup|endgroup)(?![a-zA-Z@])/g;
      const tokens = [];
      let tm;
      while ((tm = tokRe.exec(inputStr)) !== null) {
        tokens.push({ kind: tm[1], start: tm.index, end: tm.index + tm[0].length });
      }
      if (tokens.length === 0) return inputStr;
      const reps = [];
      const stack = [];
      for (let ti = 0; ti < tokens.length; ti++) {
        const tk = tokens[ti];
        if (tk.kind === 'begingroup') {
          stack.push(tk);
        } else if (stack.length > 0) {
          const op = stack.pop();
          reps.push({ start: op.start, end: op.end, rep: '{' });
          reps.push({ start: tk.start, end: tk.end, rep: '}' });
        } else {
          reps.push({ start: tk.start, end: tk.end, rep: ' ' });
        }
      }
      while (stack.length > 0) {
        const unclosed = stack.pop();
        reps.push({ start: unclosed.start, end: unclosed.end, rep: ' ' });
      }
      reps.sort(function(a, b) { return b.start - a.start; });
      let res = inputStr;
      for (let ri = 0; ri < reps.length; ri++) {
        res = res.slice(0, reps[ri].start) + reps[ri].rep + res.slice(reps[ri].end);
      }
      return res;
    }
    function resolveScopedSwitchGroups(inputStr) {
      let s = convertBeginEndGroupToBracesLocal(inputStr);
      for (let pass = 0; pass < 6; pass++) {
        let changed = false;
        for (let i = 0; i < s.length - 2; i++) {
          if (s[i] !== '{') continue;
          let probe = i + 1;
          while (probe < s.length && /\s/.test(s[probe])) probe++;
          if (s[probe] !== '\\') {
            // Nhóm ẩn danh {văn bản \color{...} đuôi màu}: khóa phạm vi \color bên trong cặp ngoặc nhọn
            if (!isBraceOwnedByCommand(s, i)) {
              const midGrp = extractBalancedBraces(s, i);
              if (midGrp && /\\color(?:\s*\[[^\]]*\])?\s*\{/.test(midGrp.content)) {
                const cmMid = /\\color(?:\s*\[\s*([^\]]*)\s*\])?\s*\{([^}]+)\}/.exec(midGrp.content);
                if (cmMid) {
                  const beforeCol = midGrp.content.slice(0, cmMid.index);
                  const afterCol = midGrp.content.slice(cmMid.index + cmMid[0].length);
                  const colCss = mapLatexColor(cmMid[2].trim(), cmMid[1] || '');
                  const isBlkMid = /\n\s*\n|<(?:div|table|figure|ul|ol|h[1-6]|blockquote|pre)\b|___KATEX_MATH_DISP_|\\(?:tableofcontents|part|chapter|section|subsection|subsubsection|begin)\b/.test(afterCol);
                  const midTag = isBlkMid ? 'div' : 'span';
                  const repMid = beforeCol + '<' + midTag + ' style="color: ' + colCss + ';">' + afterCol + '</' + midTag + '>';
                  s = s.slice(0, i) + repMid + s.slice(midGrp.endIndex + 1);
                  i += repMid.length - 1;
                  changed = true;
                }
              }
            }
            continue;
          }
          const grp = extractBalancedBraces(s, i);
          if (!grp) continue;
          let cur = 0;
          const inner = grp.content;
          const styles = [];
          let matchedSwitch = false;
          while (cur < inner.length) {
            while (cur < inner.length && /\s/.test(inner[cur])) cur++;
            const sw = /^\\(Huge|huge|LARGE|Large|large|normalsize|small|footnotesize|scriptsize|tiny|bfseries|bf|mdseries|normalfont|itshape|it|slshape|sl|em|upshape|scshape|sc|ttfamily|tt|rmfamily|rm|sffamily|sf|centering|raggedright|raggedleft|color)(?![a-zA-Z])/.exec(inner.slice(cur));
            if (!sw) break;
            const name = sw[1];
            let nextCur = cur + sw[0].length;
            if (name === 'color') {
              let colModel = '';
              while (nextCur < inner.length && /\s/.test(inner[nextCur])) nextCur++;
              if (inner[nextCur] === '[') {
                const obr = extractBalancedBrackets(inner, nextCur);
                if (obr) {
                  colModel = obr.content.trim();
                  nextCur = obr.endIndex + 1;
                }
                while (nextCur < inner.length && /\s/.test(inner[nextCur])) nextCur++;
              }
              if (inner[nextCur] !== '{') break;
              const cg = extractBalancedBraces(inner, nextCur);
              if (!cg) break;
              styles.push('color: ' + mapLatexColor(cg.content, colModel));
              nextCur = cg.endIndex + 1;
            } else if (GROUP_SIZE_MAP[name]) {
              styles.push('font-size: ' + GROUP_SIZE_MAP[name]);
              if (name === 'Huge' || name === 'huge' || name === 'LARGE' || name === 'Large') {
                styles.push('font-weight: 700');
              }
            } else if (name === 'bfseries' || name === 'bf') {
              styles.push('font-weight: 700');
            } else if (name === 'itshape' || name === 'it' || name === 'slshape' || name === 'sl' || name === 'em') {
              styles.push('font-style: italic');
            } else if (name === 'scshape' || name === 'sc') {
              styles.push('font-variant: small-caps');
            } else if (name === 'ttfamily' || name === 'tt') {
              styles.push('font-family: monospace');
            } else if (name === 'sffamily' || name === 'sf') {
              styles.push("font-family: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif");
            } else if (name === 'centering') {
              styles.push('text-align: center');
            }
            matchedSwitch = true;
            cur = nextCur;
          }
          if (matchedSwitch) {
            while (cur < inner.length && (inner[cur] === ' ' || inner[cur] === '\t')) cur++;
            let bodyPart = inner.slice(cur);
            const trimmedBp = bodyPart.trim();
            if (trimmedBp.startsWith('{') && trimmedBp.endsWith('}')) {
              const innerBg = extractBalancedBraces(trimmedBp, 0);
              if (innerBg && innerBg.endIndex === trimmedBp.length - 1) {
                bodyPart = innerBg.content;
              }
            }
            const isBlockBody = /\n\s*\n|<(?:div|table|figure|ul|ol|h[1-6]|blockquote|pre)\b|___KATEX_MATH_DISP_|\\(?:tableofcontents|part|chapter|section|subsection|subsubsection|begin)\b/.test(bodyPart);
            const tag = isBlockBody ? 'div' : 'span';
            const styleAttr = styles.length > 0 ? ' style="' + styles.join('; ') + ';"' : '';
            const ownedByCmd = isBraceOwnedByCommand(s, i);
            const repCore = '<' + tag + styleAttr + '>' + bodyPart + '</' + tag + '>';
            const rep = ownedByCmd ? ('{' + repCore + '}') : repCore;
            s = s.slice(0, i) + rep + s.slice(grp.endIndex + 1);
            i += rep.length - 1;
            changed = true;
          }
        }
        if (!changed) break;
      }
      return s;
    }
    html = resolveScopedSwitchGroups(html);

    // Font size environments (\begin{huge}...\end{huge}, \begin{Large}...\end{Large}, v.v.) và allintypewriter
    const fontEnvs = [
      { env: 'Huge', size: '2.2rem', weight: '800', line: '1.3' },
      { env: 'huge', size: '1.8rem', weight: '700', line: '1.3' },
      { env: 'LARGE', size: '1.5rem', weight: '700', line: '1.4' },
      { env: 'Large', size: '1.3rem', weight: '600', line: '1.4' },
      { env: 'large', size: '1.15rem', weight: '500', line: '1.5' },
      { env: 'normalsize', size: '1em', weight: '400', line: '1.75' },
      { env: 'small', size: '0.92em', weight: '400', line: '1.65' },
      { env: 'footnotesize', size: '0.85em', weight: '400', line: '1.6' },
      { env: 'scriptsize', size: '0.78em', weight: '400', line: '1.5' },
      { env: 'tiny', size: '0.72em', weight: '400', line: '1.45' }
    ];
    fontEnvs.forEach(function(fe) {
      const feRegex = new RegExp('\\\\begin\\{' + fe.env + '\\*?\\}([\\s\\S]*?)\\\\end\\{' + fe.env + '\\*?\\}', 'g');
      html = html.replace(feRegex, function(m, body) {
        return '<div style="font-size: ' + fe.size + '; font-weight: ' + fe.weight + '; line-height: ' + fe.line + '; margin: 8px 0;">' + body.trim() + '</div>';
      });
    });
    html = html.replace(/\\(?:begin|end)\{(?:Huge|huge|LARGE|Large|large|normalsize|small|footnotesize|scriptsize|tiny)\*?\}/g, '');
    html = html.replace(/\\begin\{allintypewriter\}([\s\S]*?)\\end\{allintypewriter\}/g, function(_m, body) {
      return '<div class="latex-allintypewriter" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.94em; margin: 12px 0;">' + body.trim() + '</div>';
    });

    // 5. Title / Author / Date / Maketitle
    const makeTitleHtml = docTitle ? (
      '<div class="latex-titlepage" style="margin-bottom: 36px;">' +
        '<h1 style="font-size: 2.2rem; font-weight: 800; color: var(--s12); text-transform: uppercase; margin-bottom: 12px;">' + docTitle + '</h1>' +
        (docAuthor ? '<h2 style="font-size: 1.3rem; font-weight: 600; color: var(--s11); margin-bottom: 8px;">' + docAuthor + '</h2>' : '') +
        (docDate ? '<h3 style="font-size: 1rem; font-weight: 500; color: var(--s9);">' + docDate + '</h3>' : '') +
      '</div>'
    ) : '';
    if (html.includes('\\maketitle')) {
      html = html.replace(/\\maketitle\b/g, makeTitleHtml);
    } else if (docTitle && !html.includes('\\begin{titlepage}') && !html.includes('latex-titlepage')) {
      html = makeTitleHtml + html;
    }

    // 6. Hàm thay thế môi trường lồng nhau từ trong ra ngoài (escape tên có dấu * và tách ngoặc cân bằng)
    const SELF_HEADER_ENVS = new Set([
      'tabular', 'tabular*', 'tabularx', 'tabulary', 'longtable', 'supertabular', 'xltabular',
      'minipage', 'subfigure', 'subtable', 'wrapfigure', 'wraptable'
    ]);
    const NO_BRACE_ARG_ENVS = new Set([
      'center', 'flushleft', 'flushright', 'quote', 'quotation', 'verse', 'abstract',
      'titlepage', 'figure', 'figure*', 'table', 'table*', 'itemize', 'itemize*',
      'compactitem', 'description', 'description*', 'enumerate', 'enumerate*',
      'compactenum', 'inparaenum', 'tasks', 'proof', 'cminh', 'tcolorbox',
      'framed', 'mdframed', 'shaded', 'snugshade', 'leftbar', 'boxed', 'empheq'
    ]);
    function replaceEnvironment(text, envName, renderFn) {
      const escapedEnv = envName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const isSelfHeader = SELF_HEADER_ENVS.has(envName);
      const allowBraceArg = !isSelfHeader && !NO_BRACE_ARG_ENVS.has(envName);
      let iterations = 0;
      while (iterations < 10) {
        if (!text.includes('\\begin{' + envName + '}')) break;
        const innerRegex = new RegExp(
          '\\\\begin\\{' + escapedEnv + '\\}((?:(?!\\\\begin\\{' + escapedEnv + '\\})[\\s\\S])*?)\\\\end\\{' + escapedEnv + '\\}',
          'g'
        );
        let changed = false;
        text = text.replace(innerRegex, function(_match, rawInner) {
          changed = true;
          if (isSelfHeader) {
            return renderFn('', '', rawInner);
          }
          let rest = rawInner;
          let optBracket = '';
          let optBrace = '';
          const leadWs1 = /^\s*/.exec(rest)[0].length;
          if (rest[leadWs1] === '[') {
            const br = extractBalancedBrackets(rest, leadWs1);
            if (br) {
              optBracket = br.content;
              rest = rest.slice(br.endIndex + 1);
            }
          }
          if (allowBraceArg) {
            const leadWs2 = /^[ \t]*/.exec(rest)[0].length;
            if (rest[leadWs2] === '{') {
              const bg = extractBalancedBraces(rest, leadWs2);
              if (bg) {
                optBrace = bg.content;
                rest = rest.slice(bg.endIndex + 1);
              }
            }
          }
          return renderFn(optBracket, optBrace, rest);
        });
        if (!changed) break;
        iterations++;
      }
      return text;
    }

    // 7. Xử lý danh sách (itemize, enumerate) hỗ trợ lồng nhau và tiền tố văn bản
    function renderListItems(content) {
      const itemRegex = /\\item(?:\s*\[([^\]]*)\])?\s*/g;
      let items = [];
      let match;
      let lastIndex = -1;
      let lastLabel = null;
      let prefixText = '';

      const firstMatch = itemRegex.exec(content);
      if (firstMatch) {
        prefixText = content.substring(0, firstMatch.index).trim();
        lastIndex = firstMatch.index + firstMatch[0].length;
        lastLabel = firstMatch[1] || null;

        while ((match = itemRegex.exec(content)) !== null) {
          items.push({
            label: lastLabel,
            text: content.substring(lastIndex, match.index).trim()
          });
          lastIndex = match.index + match[0].length;
          lastLabel = match[1] || null;
        }
        items.push({
          label: lastLabel,
          text: content.substring(lastIndex).trim()
        });
      }

      if (items.length === 0) {
        return '<li style="margin-bottom: 8px;">' + content.trim() + '</li>';
      }

      const listHtml = items.map(function(it) {
        if (it.label) {
          return '<li style="margin-bottom: 8px; list-style-type: none;"><strong>' + it.label + '</strong> ' + it.text + '</li>';
        }
        return '<li style="margin-bottom: 8px;">' + it.text + '</li>';
      }).join('');

      return (prefixText ? '<p style="margin-bottom: 8px;">' + prefixText + '</p>' : '') + listHtml;
    }

    ['itemize', 'itemize*', 'compactitem', 'description', 'description*'].forEach(function(uEnv) {
      html = replaceEnvironment(html, uEnv, function(opt1, opt2, body) {
        return '<ul class="latex-list latex-itemize" style="margin-bottom: 20px; padding-left: 24px;">' + renderListItems(body) + '</ul>';
      });
    });

    ['enumerate', 'enumerate*', 'compactenum', 'inparaenum'].forEach(function(oEnv) {
      html = replaceEnvironment(html, oEnv, function(opt1, opt2, body) {
        let styleType = '';
        if (opt1) {
          if (/\\alph\b|\(?a[.)]/.test(opt1)) styleType = ' list-style-type: lower-alpha;';
          else if (/\\Alph\b|\(?A[.)]/.test(opt1)) styleType = ' list-style-type: upper-alpha;';
          else if (/\\roman\b|\(?i[.)]/.test(opt1)) styleType = ' list-style-type: lower-roman;';
          else if (/\\Roman\b|\(?I[.)]/.test(opt1)) styleType = ' list-style-type: upper-roman;';
        }
        return '<ol class="latex-list latex-enumerate" style="margin-bottom: 20px; padding-left: 24px;' + styleType + '">' + renderListItems(body) + '</ol>';
      });
    });

    html = replaceEnvironment(html, 'tasks', function(opt1, opt2, body) {
      let cleanTasks = body.trim();
      let cols = 1;
      const colM = /^\((\d+)\)/.exec(cleanTasks);
      if (colM) {
        cols = Math.min(4, Math.max(1, parseInt(colM[1], 10)));
        cleanTasks = cleanTasks.slice(colM[0].length).trim();
      }
      const parts = cleanTasks.split(/\\task(?:\s*\[([^\]]*)\])?\s*/);
      let gridItems = '';
      let taskIdx = 0;
      for (let p = 1; p < parts.length; p += 2) {
        const customLbl = parts[p];
        const itemBody = (parts[p + 1] || '').trim();
        const lbl = customLbl ? customLbl.trim() : String.fromCharCode(97 + (taskIdx % 26)) + ')';
        taskIdx++;
        gridItems += '<div style="display: flex; gap: 8px; align-items: baseline;"><strong>' + lbl + '</strong><div style="flex: 1; min-width: 0;">' + itemBody + '</div></div>';
      }
      return '<div class="latex-tasks-grid cols-' + cols + '" style="display: grid; grid-template-columns: repeat(' + cols + ', minmax(0, 1fr)); gap: 10px 20px; margin: 14px 0;">' + (gridItems || cleanTasks) + '</div>';
    });

    // 8. Minipage, Subfigure, Titlepage, Figure, Wrapfigure, Tabular/Booktabs/Longtable, Table
    ['minipage', 'subfigure', 'subtable'].forEach(function(mEnv) {
      html = replaceEnvironment(html, mEnv, function(optBracket, optBrace, body) {
        let widthSpec = optBrace || '';
        let cleanMin = body.trim();
        while (cleanMin.startsWith('[')) {
          const obr = extractBalancedBrackets(cleanMin, 0);
          if (!obr) break;
          cleanMin = cleanMin.substring(obr.endIndex + 1).trim();
        }
        if (!widthSpec && cleanMin.startsWith('{')) {
          const wg = extractBalancedBraces(cleanMin, 0);
          if (wg) {
            widthSpec = wg.content;
            cleanMin = cleanMin.substring(wg.endIndex + 1).trim();
          }
        }
        let pct = 48;
        const relM = /([0-9]*\.?[0-9]+)\s*\\(?:textwidth|linewidth|columnwidth|hsize)/i.exec(widthSpec);
        if (relM) pct = Math.min(100, Math.max(18, Math.round(parseFloat(relM[1]) * 100)));
        else if (/^\\(?:textwidth|linewidth|columnwidth)$/i.test(widthSpec.trim())) pct = 100;
        const capList = [];
        cleanMin = replaceCommandWithBraces(cleanMin, 'caption', function(cap) {
          capList.push('<div class="latex-caption">' + cap.trim() + '</div>');
          return '';
        });
        const wCss = pct >= 95 ? 'width: 100%; display: block;' : 'width: min(100%, ' + pct + '%); min-width: 240px; display: inline-block; vertical-align: top;';
        return '<div class="latex-minipage" style="box-sizing: border-box; padding: 4px 8px; ' + wCss + '">' + cleanMin.trim() + capList.join('') + '</div>';
      });
    });

    html = replaceEnvironment(html, 'titlepage', function(opt1, opt2, body) {
      return '<div class="latex-titlepage">' + body.trim() + '</div>';
    });

    ['figure', 'figure*', 'wrapfigure', 'wraptable'].forEach(function(fEnv) {
      html = replaceEnvironment(html, fEnv, function(opt1, opt2, body) {
        let clean = body.trim();
        if (fEnv.startsWith('wrap')) {
          while (clean.startsWith('[') || clean.startsWith('{')) {
            if (clean.startsWith('[')) {
              const obr = extractBalancedBrackets(clean, 0);
              if (!obr || obr.endIndex > 20) break;
              clean = clean.substring(obr.endIndex + 1).trim();
            } else {
              const wg = extractBalancedBraces(clean, 0);
              if (!wg || wg.endIndex > 32) break;
              clean = clean.substring(wg.endIndex + 1).trim();
            }
          }
        }
        let captionText = '';
        clean = replaceCommandWithBraces(clean, 'caption', function(cap) {
          captionText = cap.trim();
          return '';
        });
        clean = clean.replace(/\\label\{[^}]*\}/g, '');
        clean = clean.replace(/\\centering\b/g, '');
        const figCap = captionText ? '<figcaption class="latex-caption">' + captionText + '</figcaption>' : '';
        return '<figure class="latex-figure">' + clean.trim() + figCap + '</figure>';
      });
    });

    const renderTableFn = function(envType, body) {
      let cleanBody = body.trim();
      const takesWidthArg = (envType === 'tabular*' || envType === 'tabularx' || envType === 'tabulary' || envType === 'xltabular');
      if (takesWidthArg && cleanBody.startsWith('{')) {
        const wExt = extractBalancedBraces(cleanBody, 0);
        if (wExt) cleanBody = cleanBody.substring(wExt.endIndex + 1).trim();
      }
      if (cleanBody.startsWith('[')) {
        const br = extractBalancedBrackets(cleanBody, 0);
        if (br && br.endIndex < 16) cleanBody = cleanBody.substring(br.endIndex + 1).trim();
      }
      if (cleanBody.startsWith('{')) {
        const colExt = extractBalancedBraces(cleanBody, 0);
        if (colExt) cleanBody = cleanBody.substring(colExt.endIndex + 1).trim();
      }

      // Dọn dẹp header/footer lặp lại của longtable và trích xuất \caption{...}\\ nếu có
      cleanBody = cleanBody.replace(/\\endfirsthead[\s\S]*?\\endhead/g, '')
                           .replace(/\\endhead\b/g, '')
                           .replace(/\\endfoot[\s\S]*?\\endlastfoot/g, '')
                           .replace(/\\(?:endfoot|endlastfoot)\b/g, '');
      let ltCaptionHtml = '';
      const ltCapMatch = /\\caption\*?\s*(?:\[[^\]]*\])?\s*\{/.exec(cleanBody);
      if (ltCapMatch) {
        const bCap = cleanBody.indexOf('{', ltCapMatch.index);
        const capGrp = extractBalancedBraces(cleanBody, bCap);
        if (capGrp) {
          ltCaptionHtml = '<div class="latex-caption" style="margin-bottom: 8px;">' + capGrp.content.trim() + '</div>';
          let cutEnd = capGrp.endIndex + 1;
          const trail = /^\s*(?:\\label\s*\{[^}]*\}\s*)?(?:\\\\(?:\s*\[[^\]]*\])?)?/.exec(cleanBody.slice(cutEnd));
          if (trail) cutEnd += trail[0].length;
