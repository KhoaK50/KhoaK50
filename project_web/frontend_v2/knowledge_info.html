          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#111113';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#fcfcfd';
        }
      } catch (e) {}
    })();
  </script>

<style>
/* """""""""""""""""""""""""""""""""""""""""""""""""""""""""""
   1. DESIGN TOKENS (RADIX UI SLATE + BLUE)
   """"""""""""""""""""""""""""""""""""""""""""""""""""""""""" */
:root {
  /* TẦNG 1: STRICT RADIX SLATE (LIGHT) */
  --s1: #fcfcfd; /* step 1 */
  --s2: #f9f9fb; /* step 2 */
  --s3: #e6e8eb; /* step 6 - subtle borders */
  --s4: #d7dfe3; /* step 7 - strong borders */
  --s6: #8b939a; /* step 9 - solid */
  --s7: #8b939a; /* arrows */
  --s9: #687076; /* step 11 - subtle text */
  --s11: #687076; /* step 11 - text */
  --s12: #11181c; /* step 12 - high contrast text */
  --b9: #0090ff; /* Radix Blue 9 */
  --amber: #ffb224; /* Radix Amber 9 */
  --orange: #f76b15;
  --green: #30a46c;
  --red: #e5484d;
  --radius: 6px; 
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  /* TYPOGRAPHY SYSTEM:
     - Topbar dùng font UI hiện đại (Be Vietnam Pro) đồng bộ các trang khác
     - Search input, Search modal và toàn bộ nội dung học thuật/view dùng STIX Two Text
  */
  --font-modern-ui: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-academic: 'STIX Two Text', 'Latin Modern Roman', 'Times New Roman', Times, serif;
  --font-ui: var(--font-modern-ui);
  --font-sans: var(--font-modern-ui);
  --font: var(--font-academic);
}
:root.dark:not([data-theme="light"]),
:root.dark-theme:not([data-theme="light"]),
:root[data-theme="dark"],
body.dark:not([data-theme="light"]),
body.dark-theme:not([data-theme="light"]) {
  /* TẦNG 1: STRICT RADIX SLATE (DARK) */
  --s1: #111113; /* step 1 */
  --s2: #18191b; /* step 2 */
  --s3: #3b3e44; /* step 6 - subtle borders */
  --s4: #43484e; /* step 7 - strong borders */
  --s6: #51585f; /* step 8 */
  --s7: #697177; /* arrows */
  --s9: #b0b4ba; /* step 11 */
  --s11: #b0b4ba; /* step 11 */
  --s12: #edeef0; /* step 12 */
}
:root[data-theme="light"],
:root[data-theme="light"] body {
  --s1: #fcfcfd;
  --s2: #f9f9fb;
  --s3: #e6e8eb;
  --s4: #d7dfe3;
  --s6: #8b939a;
  --s7: #8b939a;
  --s9: #687076;
  --s11: #687076;
  --s12: #11181c;
}
/* ==========================================================================
   TYPOGRAPHY RULES CHO KNOWLEDGE_INFO.HTML
   1. Mặc định toàn bộ trang (body, sidebar, main-content, graph, workspace, lesson, quiz): FONT HỌC THUẬT
   2. Riêng Topbar (trừ search): FONT GIAO DIỆN HIỆN ĐẠI đồng bộ như các trang khác
   3. Thanh Search trên Topbar và Search Modal: FONT HỌC THUẬT
   ========================================================================== */

/* 1. MẶC ĐỊNH TOÀN BỘ NỘI DUNG VÀ GIAO DIỆN TRANG DÙNG FONT HỌC THUẬT */
body, 
button:not(.ph):not([class*="ph-"]), 
input, select, textarea,
h1, h2, h3, h4, h5, h6,
p, span:not(.ph):not([class*="ph-"]):not(.katex *), 
a:not(.ph):not([class*="ph-"]), 
div:not(.ph):not([class*="ph-"]):not(.katex *),
li, label, table, th, td,
.lib-side, .lib-side *:not(.ph):not([class*="ph-"]),
.lib-item, .lib-cat-header,
.view-title, .bc, .bc *,
#main-content, #main-content *:not(.ph):not([class*="ph-"]):not(.katex *):not(mjx-container *),
#dd-content, #dd-content *:not(.ph):not([class*="ph-"]):not(.katex *):not(mjx-container *),
#dd-graph-view, #dd-graph-view *:not(.ph):not([class*="ph-"]),
#learning-path-workspace-container, #learning-path-workspace-container *:not(.ph):not([class*="ph-"]),
svg text {
  font-family: var(--font-academic) !important;
}

/* 2. RIÊNG TOPBAR DÙNG FONT GIAO DIỆN HIỆN ĐẠI (ĐỒNG BỘ CÙNG TẤT CẢ CÁC TRANG KHÁC) */
header.vec-topbar,
header.vec-topbar *:not(.ph):not([class*="ph-"]):not(.vec-topbar-center):not(.vec-topbar-center *),
.vec-topbar-left, .vec-topbar-left *:not(.ph):not([class*="ph-"]),
.vec-nav-links, .vec-nav-links *:not(.ph):not([class*="ph-"]),
.vec-nav-link, .vec-nav-link *,
.vec-dropdown-menu, .vec-dropdown-menu *:not(.ph):not([class*="ph-"]),
.vec-dropdown-item,
.vec-topbar-right, .vec-topbar-right *:not(.ph):not([class*="ph-"]),
.vec-profile-name, .user-dropdown-menu, .user-dropdown-menu *:not(.ph):not([class*="ph-"]),
#menuTopAvatar, #menuTopAvatar *:not(.ph):not([class*="ph-"]),
#notificationMenu, #notificationMenu *:not(.ph):not([class*="ph-"]),
#unreadBadge {
  font-family: var(--font-modern-ui) !important;
}

/* 3. TRỪ THANH SEARCH TRÊN TOPBAR VÀ SEARCH MODAL: DÙNG FONT HỌC THUẬT */
.vec-topbar-center,
.vec-topbar-center input,
.vec-topbar-center input::placeholder,
.search-modal-container,
.search-modal-container *:not(.ph):not([class*="ph-"]),
.search-modal-container input,
.search-modal-container input::placeholder,
.search-result-item,
.search-result-item * {
  font-family: var(--font-academic) !important;
}

/* 4. BẢO TOÀN CHO CODE BLOCKS VÀ ICON FONT */
code, pre, .font-mono, kbd, samp {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
}
i.ph, [class*="ph-"] {
  font-family: "Phosphor" !important;
}

body{font-family:var(--font-academic)!important;margin:0;overflow:hidden;background:var(--s1);color:var(--s12);display:flex;flex-direction:column;height:100vh}
*,*::before,*::after{box-sizing:border-box}

/* """""""""""""""""""""""""""""""""""""""""""""""""""""""""""
   2. LIBRARY SPA LAYOUT
   """"""""""""""""""""""""""""""""""""""""""""""""""""""""""" */
.lib-layout{display:flex;flex:1;min-height:0}

/*    SIDEBAR (Notion style)    */
.lib-side{width:280px;background:var(--s1);border-right:1px solid var(--s3);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;z-index:100}
body.dark-theme .lib-side{background:var(--s2)}

.lib-side-search{padding:16px;border-bottom:1px solid var(--s3);position:relative}
.lib-side-search input{width:100%;padding:9px 14px 9px 34px;border:1px solid var(--s3);border-radius:var(--radius);background:var(--s2);color:var(--s12);font:500 .85rem/1 var(--font);transition:.15s}
.lib-side-search input:focus{outline:none;border-color:var(--b9);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.lib-side-search i{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--s6);font-size:.82rem}

.side-group{padding:18px 0 6px}
.side-label{font:700 .68rem/1 var(--font);color:var(--s9);padding:0 18px;margin-bottom:10px;letter-spacing:.8px;text-transform:uppercase}
.side-item{display:block;padding:7px 18px;margin:1px 8px;border-radius:var(--radius);color:var(--s11);text-decoration:none;font:500 .87rem/1.35 var(--font);cursor:pointer;transition:.1s;border-left:3px solid transparent}
.side-item:hover{background:var(--s3);color:var(--s12)}
.side-item.active{background:rgba(59,130,246,.07);color:var(--b9);border-left-color:var(--b9);font-weight:600}

.topic-group{margin-bottom:1px}
.topic-head{display:flex;justify-content:space-between;align-items:center;padding:7px 18px;cursor:pointer;color:var(--s12);font:600 .87rem/1.35 var(--font);transition:.1s}
.topic-head:hover{background:var(--s3)}
.topic-head i{font-size:.65em;color:var(--s6);transition:transform .25s}
.topic-group.open .topic-head i{transform:rotate(180deg)}
.topic-list{max-height:0;overflow:hidden;transition:max-height .3s ease}
.topic-group.open .topic-list{max-height:800px}
.topic-list a{display:block;padding:6px 14px 6px 28px;margin:1px 8px;border-radius:var(--radius);color:var(--s11);text-decoration:none;font:500 .84rem/1.4 var(--font);border-left:3px solid transparent}
.topic-list a:hover{background:var(--s3);color:var(--s12)}
.topic-list a.active{color:var(--b9);border-left-color:var(--b9);background:rgba(59,130,246,.07);font-weight:600}

/*    MAIN CONTENT    */
.lib-main{flex:1;display:flex;flex-direction:column;overflow-y:auto;background:var(--s1)}

/* Breadcrumbs - Chuan Modern UI dong bo he thong */
.bc {
  display: flex;
  align-items: center;
  gap: 6px 8px;
  font: 500 0.82rem/1.5 var(--font-modern-ui);
  color: var(--s9);
  margin-bottom: 22px;
  flex-wrap: wrap;
  letter-spacing: -0.01em;
}
.bc a {
  color: var(--s11);
  text-decoration: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color 0.15s ease;
  border-radius: 4px;
}
.bc a:hover {
  color: var(--b9);
  text-decoration: none;
}
.bc i.bc-sep {
  font-size: 0.72rem;
  color: var(--s7);
  display: inline-flex;
  align-items: center;
  user-select: none;
}
.bc .bc-cur {
  color: var(--s12);
  font-weight: 600;
}

/* Views */
.view{display:none;animation:fadeUp .25s ease;flex-direction:column;flex:1}
.view.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.view-title{font:800 1.65rem/1.2 var(--font);color:var(--s12);margin:0 0 6px;letter-spacing:-.4px}
.view-desc{color:var(--s11);font:400 .92rem/1.5 var(--font);margin:0 0 20px}

/* """""""""""""""""""""""""""""""""""""""""""""""""""""""""""
   3. CUSTOM COMBOBOX
   """"""""""""""""""""""""""""""""""""""""""""""""""""""""""" */
.cb{position:relative;min-width:150px}
.cb-trigger{width:100%;padding:8px 32px 8px 12px;border:1px solid var(--s4);border-radius:var(--radius);background:var(--s1);color:var(--s12);font:500 .84rem/1.3 var(--font);cursor:pointer;text-align:left;position:relative;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-trigger:hover{border-color:var(--s6)}
.cb-trigger:focus{outline:none;border-color:var(--b9);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.cb-trigger::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);border:5px solid transparent;border-top-color:var(--s6);pointer-events:none}
.cb.open .cb-trigger::after{border-top-color:transparent;border-bottom-color:var(--s6);transform:translateY(-80%)}
.cb-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--s1);border:1px solid var(--s3);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:200;display:none;max-height:260px;overflow:hidden;flex-direction:column}
.cb.open .cb-drop{display:flex}
.cb-search{border:none;border-bottom:1px solid var(--s3);padding:10px 12px;font:400 .84rem/1 var(--font);background:transparent;color:var(--s12);outline:none}
.cb-search::placeholder { color: var(--s8) !important; opacity: 0.8 !important; }
.cb-opts{overflow-y:auto;flex:1}
.cb-opt{padding:8px 12px;cursor:pointer;font:500 .84rem/1.3 var(--font);color:var(--s11);transition:.1s}
.cb-opt:hover{background:var(--s3);color:var(--s12)}
.cb-opt.selected{background:rgba(59,130,246,.08);color:var(--b9);font-weight:600}

/* """""""""""""""""""""""""""""""""""""""""""""""""""""""""""
   4. DIAGRAM AREA
   """"""""""""""""""""""""""""""""""""""""""""""""""""""""""" */
.diagram-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px;flex-wrap:wrap}

.pathfind-bar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pf-group{display:flex;flex-direction:column;gap:4px}
.pf-label{font:700 .68rem/1 var(--font);color:var(--s9);text-transform:uppercase;letter-spacing:.6px}

.btn{padding:8px 16px;border-radius:var(--radius);font:600 .85rem/1 var(--font);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;border:none;height:34px}
.btn-primary{background:var(--b9);color:#fff}.btn-primary:hover{background:var(--b10);transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.25)}
.btn-ghost{background:transparent;border:1px solid var(--s4);color:var(--s11)}.btn-ghost:hover{border-color:var(--s9);color:var(--s12)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red)}.btn-danger:hover{background:var(--red);color:#fff}

.diagram-tabs{display:flex;gap:2px;background:var(--s2);padding:3px;border-radius:8px;width:fit-content;margin-bottom:12px}
.dtab{padding:7px 16px;border-radius:var(--radius);border:none;background:transparent;font:500 .84rem/1 var(--font);color:var(--s11);cursor:pointer;transition:.15s}
.dtab:hover{color:var(--s12)}.dtab.active{background:var(--s1);color:var(--s12);box-shadow:var(--shadow);font-weight:600}

.diagram-legend-bar { display:flex; gap:16px; font:600 .8rem/1 var(--font); color:var(--s11); margin-bottom: 12px; }
.diagram-legend-bar span { display:flex; align-items:center; gap:6px; }
.diagram-legend-bar span::before { content:''; width:12px; height:12px; border-radius:50%; display:block; }
.diagram-legend-bar .u1::before { background:#3b82f6; }
.diagram-legend-bar .u2::before { background:#f97316; }
.diagram-legend-bar .u3::before { background:#22c55e; }

.btn-close-sheet { display: none; }
.diagram-split{display:flex;flex-direction:row;gap:16px;height:600px}
.diagram-canvas{flex:1;background:var(--s1);border:1px solid var(--s4);border-radius:var(--radius);position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.03);-webkit-user-select:none;user-select:none;height:100%}
.diagram-canvas svg{cursor:grab;display:block;width:100%;height:100%}
.diagram-canvas svg:active{cursor:grabbing}

.floating-legend { position: absolute; top: 0; right: 0; width: 320px; height: 100%; background: var(--s1); border-left: 1px solid var(--s4); border-radius: 0 12px 12px 0; box-shadow: -4px 0 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; z-index: 100; transition: width 0.3s; }


.f-legend-head { padding: 20px 20px; display: flex; justify-content: space-between; align-items: center; color: var(--s12); font-weight: 700; font-size: 1.1rem; cursor: pointer; border-bottom: 1px solid var(--s4); background: var(--s2); border-radius: 0 12px 0 0; }

.f-legend-body { overflow-y: auto; padding: 8px; }
.f-legend-body .lg-item { padding: 10px 14px; border-bottom: 1px solid var(--s3); margin-bottom: 2px; border-radius: 8px; transition: background 0.2s; }
.f-legend-body .lg-text { color: var(--s11); }
.f-legend-body .lg-item:hover { background: var(--s2); }
.legend-panel-old{width:320px;background:var(--s2);border-radius:var(--radius);border:1px solid 
var(--s3);display:flex;flex-direction:column;height:100%;flex-shrink:0}
.legend-head{padding:20px 20px 16px 20px;border-bottom:1px solid var(--s3);font:700 1rem/1 var(--font);color:var(--s12);flex:none;margin:0}
.legend-body{display:flex;flex-direction:column;gap:10px;padding:16px 20px;overflow-y:auto;flex:1;margin:0}
.lg-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius);cursor:pointer;transition:.1s}
.lg-item:hover{background:var(--s3)}
.lg-item.hl{background:rgba(59,130,246,.08)}
.lg-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .72rem/1 var(--font);flex-shrink:0;border:2px solid var(--s4);color:var(--s12);background:var(--s1)}
.lg-item.hl .lg-num{border-color:var(--b9);background:var(--b9);color:#fff}
.lg-text{font:500 .84rem/1.3 var(--font);color:var(--s11)}
.lg-item.hl .lg-text{color:var(--b9);font-weight:600}
.lg-item.on-path .lg-num{border-color:var(--amber);background:var(--amber);color:#fff}
.lg-item.on-path .lg-text{color:var(--amber);font-weight:600}

/* Metro map specifics */
.metro-station{cursor:pointer;transition:opacity .2s}
.metro-station:hover circle{stroke-width:4}
.metro-station text{pointer-events:none}
.metro-route{transition:opacity .2s}
.metro-label{font:600 10px/1 var(--font);fill:var(--s9);pointer-events:none}
.metro-legend{font:700 11px/1 var(--font)}
.metro-interchange circle{stroke-width:3!important}

/* Flowchart specifics */
.fc-node{cursor:pointer;transition:opacity .2s}
.fc-node:hover rect{stroke-width:2;filter:brightness(1.02)}
.fc-edge{transition:opacity .2s}

/* Adjacency Matrix specifics */
.adj-wrap{width:100%;overflow:auto;padding:16px}
.adj-legend{display:flex;gap:20px;margin-bottom:14px;font:700 .78rem/1 var(--font)}
.adj-legend span{display:flex;align-items:center;gap:5px}
.adj-legend span::before{content:'';display:block;width:12px;height:12px;border-radius:2px}
.adj-legend .u1::before{background:#3b82f6}.adj-legend .u2::before{background:#f97316}.adj-legend .u3::before{background:#22c55e}
table.adj-matrix{border-collapse:collapse;font:600 .72rem/1 var(--font)}
table.adj-matrix th{padding:4px 6px;color:var(--s9);font-weight:600;position:sticky;background:var(--s2)}
table.adj-matrix th.col-h{top:0;writing-mode:vertical-lr;text-orientation:mixed;transform:rotate(180deg);min-width:28px;height:60px;text-align:left}
table.adj-matrix th.row-h{left:0;text-align:right;min-width:28px}
table.adj-matrix td{width:28px;height:28px;text-align:center;border:1px solid var(--s3);cursor:pointer;transition:.1s;font-size:0}
table.adj-matrix td.has-edge{font-size:.7rem}
table.adj-matrix td:hover{background:var(--s3)}
table.adj-matrix td.e-blue{background:rgba(59,130,246,.18);color:#3b82f6}
table.adj-matrix td.e-orange{background:rgba(249,115,22,.18);color:#f97316}
table.adj-matrix td.e-green{background:rgba(34,197,94,.18);color:#22c55e}
table.adj-matrix td.e-cross{background:rgba(139,92,246,.18);color:#8b5cf6}
table.adj-matrix td.e-path{background:var(--amber)!important;color:#fff!important}
table.adj-matrix td.diag{background:var(--s3);cursor:default}

/* Pathfinding glow */
.path-glow{filter:drop-shadow(0 0 6px var(--amber))}

/* """""""""""""""""""""""""""""""""""""""""""""""""""""""""""
   5. OTHER VIEWS (Lesson, Exercise, Reference)
   """"""""""""""""""""""""""""""""""""""""""""""""""""""""""" */
.lesson-hdr{border-bottom:1px solid var(--s3);padding-bottom:20px;margin-bottom:24px}
.lesson-hdr h1{font:800 2rem/1.2 var(--font);color:var(--s12);margin:0 0 8px;letter-spacing:-.4px}
.lesson-meta{font:500 .9rem/1 var(--font);color:var(--s11)}

.ex-form{background:var(--s2);border:1px solid var(--s3);padding:28px;border-radius:8px;max-width:560px}
.fg{margin-bottom:18px}
.fg label{display:block;font:600 .87rem/1 var(--font);color:var(--s12);margin-bottom:7px}

(function() {

  document.head.appendChild(s);

  window.toggleMobileLibSide = function(forceState) {
    var side = document.getElementById('lib-side');
    var bd = document.getElementById('lib-side-backdrop');
    if (!side) return;
    var nextOpen = typeof forceState === 'boolean' ? forceState : !side.classList.contains('open');
    side.classList.toggle('open', nextOpen);
    if (bd) bd.classList.toggle('show', nextOpen);
  };

  window.App = window.App || {};
  var _localApi = 'http://127.0.0.1:5000';
  var _prodApi = 'https://visualization-rr5v.onrender.com';
  window.App.LOCAL_API = _localApi;
  window.App.PROD_API = _prodApi;
  window.App.API_BASE = (location.hostname === '127.0.0.1' || location.hostname === 'localhost') ? _localApi : _prodApi;

  // Smart fetch: Tu dong fallback sang Render khi backend local khong chay, va tu dong don dep phien khi gap loi 401
  window.App.fetchApi = function(endpoint, options) {
    options = options || {};
    var primary = (window.App && window.App.API_BASE) || _localApi;
    var fallback = (window.App && window.App.PROD_API) || _prodApi;
    
    var apiPath = endpoint;
    if (apiPath.startsWith(primary)) {
      apiPath = apiPath.substring(primary.length);
    } else if (apiPath.startsWith(_localApi)) {
      apiPath = apiPath.substring(_localApi.length);
    } else if (apiPath.startsWith(_prodApi)) {
      apiPath = apiPath.substring(_prodApi.length);
    }
    var url = apiPath.startsWith('http') ? apiPath : (primary + apiPath);

    return fetch(url, options)
      .then(function(res) {
        if (res.status === 401) {
          if (window.AuthGuard && window.AuthGuard.clearSession) window.AuthGuard.clearSession();
          if (window.TopbarAvatar && window.TopbarAvatar.updateUI) window.TopbarAvatar.updateUI();
        }
        return res;
      })
      .catch(function(err) {
        if (!apiPath.startsWith('http') && primary !== fallback) {
          return fetch(fallback + apiPath, options).then(function(res) {
            if (res.status === 401) {
              if (window.AuthGuard && window.AuthGuard.clearSession) window.AuthGuard.clearSession();
              if (window.TopbarAvatar && window.TopbarAvatar.updateUI) window.TopbarAvatar.updateUI();
            }
            return res;
          });
        }
        throw err;
      });
  };
})();

function tr(key, def) {
  var keys = key.split('.');
  var val = (typeof i18nConfig !== 'undefined' && i18nConfig.translations) ? i18nConfig.translations[i18nConfig.currentLocale] : null;
  for (var i=0; i<keys.length; i++) {
    if (!val) break;
    val = val[keys[i]];
  }
  if (!val) return def || key;
  return val;
}

function formatBreadcrumbTitle(rawStr) {
  if (!rawStr) return '';
  var trimmed = rawStr.trim();
  // Neu chuoi la chu in hoa toan bo (vi du: "KIEN THUC CHUAN BI")
  var lettersOnly = trimmed.replace(/[^a-zA-ZÀ-ỹ]/g, '');
  if (lettersOnly.length > 3 && lettersOnly === lettersOnly.toUpperCase()) {
    // Chuyen sang dang Viet hoa chu cai dau moi tu
    return trimmed.toLowerCase().replace(/(?:^|\s|\/|-)\S/g, function(char) {
      return char.toUpperCase();
    });
  }
  return trimmed;
}

var AppState = { path: [{ type:'root', id:'root', title:tr('knowledge.library', 'Thư viện') }] };

function renderBreadcrumb() {
  var bcs = [document.getElementById('dd-breadcrumb'), document.getElementById('graph-bc')].filter(Boolean);
  if (bcs.length === 0) return;
  
  // Deduplicate consecutive nodes with identical type and id
  var cleanPath = [];
  for (var k = 0; k < AppState.path.length; k++) {
    var pNode = AppState.path[k];
    if (cleanPath.length === 0 || cleanPath[cleanPath.length - 1].type !== pNode.type || cleanPath[cleanPath.length - 1].id !== pNode.id) {
      cleanPath.push(pNode);
    }
  }
  AppState.path = cleanPath;

  bcs.forEach(function(bc) {
    bc.innerHTML = '';
    
    // 1. Tang Thu vien (Root) - Luon la diem bat dau cua breadcrumb
    var isRootOnly = (cleanPath.length <= 1);
    if (isRootOnly) {
      var rootSpan = document.createElement('span');
      rootSpan.className = 'bc-cur';
      rootSpan.setAttribute('data-i18n', 'knowledge.library');
      rootSpan.textContent = tr('knowledge.library', 'Thư viện');
      bc.appendChild(rootSpan);
      return;
    }

    var rootLink = document.createElement('a');
    rootLink.className = 'bc-link';
    rootLink.style.cursor = 'pointer';
    rootLink.onclick = function() { navigateBackTo(0); };
    var rootLinkText = document.createElement('span');
    rootLinkText.setAttribute('data-i18n', 'knowledge.library');
    rootLinkText.textContent = tr('knowledge.library', 'Thư viện');
    rootLink.appendChild(rootLinkText);
    bc.appendChild(rootLink);

    var sepRoot = document.createElement('i');
    sepRoot.className = 'ph ph-caret-right bc-sep';
    bc.appendChild(sepRoot);

    // 2. Cac tang tiep theo - tien vao muc nao thi moi hien thi len muc do
    for (var i = 1; i < cleanPath.length; i++) {
      var node = cleanPath[i];
      var isLast = (i === cleanPath.length - 1);
      
      var rawTitle = '';
      if (node.type === 'quiz' || node.type === 'quiz-room') {
        rawTitle = node.title || 'Bài tập';
      } else if (node.type === 'learning-path') {
        rawTitle = tr('knowledge.learning_path', 'Lộ trình học tập');
      } else if (node.type === 'graph') {
        rawTitle = tr('knowledge.title', 'Không gian Tri thức');
      } else {
        rawTitle = tr('library_terms.' + node.id, node.title || '');
      }

      var displayTitle = formatBreadcrumbTitle(rawTitle);

      if (isLast) {
        var curSpan = document.createElement('span');
        curSpan.className = 'bc-cur';
        curSpan.textContent = displayTitle;
        bc.appendChild(curSpan);
      } else {
        var a = document.createElement('a');
        a.className = 'bc-link';
        a.style.cursor = 'pointer';
        (function(idx) {
          a.onclick = function() { navigateBackTo(idx); };
        })(i);
        var span = document.createElement('span');
        span.textContent = displayTitle;
        a.appendChild(span);
        bc.appendChild(a);

        var chevron = document.createElement('i');
        chevron.className = 'ph ph-caret-right bc-sep';
        bc.appendChild(chevron);
      }
    }
  });
}

function updateUrl(node) {
  if (node.type === 'root') {
     window.history.replaceState(null, '', window.location.pathname);
  } else if (node.type === 'lesson') {
     window.history.replaceState(null, '', '?id=' + node.id);
  } else if (node.type === 'learning-path') {
     var reqId = (node.data && node.data.path_id) || '';
     window.history.replaceState(null, '', '?type=learning-path&id=learning-path' + (reqId ? '&path_id=' + encodeURIComponent(reqId) : ''));
  } else if (node.type === 'graph') {
     var openPf = node.data && node.data.open_pathfinder;
     window.history.replaceState(null, '', '?type=graph&id=graph' + (openPf ? '&open_pathfinder=1' : ''));
  } else {
     window.history.replaceState(null, '', '?type=' + node.type + '&id=' + node.id);
  }
}

function navigateBackTo(idx) {
  if (window._quizActive) {
    if (window.exitQuizWithZero) {
      window.exitQuizWithZero(() => {
        AppState.path = AppState.path.slice(0, idx + 1);
        renderCurrentView();
        updateUrl(AppState.path[AppState.path.length - 1]);
      });
      return;
    }
  }
  AppState.path = AppState.path.slice(0, idx + 1);
  renderCurrentView();
  updateUrl(AppState.path[AppState.path.length - 1]);
}

function navigateTo(type, id, title, data) {
  if (type === 'root') {
    AppState.path = [{ type:'root', id:'root', title:tr('knowledge.library', 'Thư viện') }];
  } else if (type === 'learning-path' || type === 'graph') {
    // Top-level sections always branch directly from root
    AppState.path = [
      { type:'root', id:'root', title:tr('knowledge.library', 'Thư viện') },
      { type:type, id:id, title:title, data:data }
    ];
  } else if (type === 'quiz') {
    var fromLp = Boolean(data && data.from === 'learning-path');
    var lpId = (data && data.path_id) || window._autoPracticePathId || window._autoFinalExamPathId;

    if (fromLp && lpId) {
      AppState.path = [
        { type:'root', id:'root', title:tr('knowledge.library', 'Thư viện') },
        { type:'learning-path', id:'learning-path', title:tr('knowledge.learning_path', 'Lộ trình học tập'), data: { path_id: lpId } },
        { type:'quiz', id:'quiz', title:title, data:data }
      ];
    } else {
      // Kho bài tập tự tạo độc lập: Xóa bỏ triệt để các biến session / in-memory cũ của Lộ trình học tập
      window._autoPracticeLessonId = null;
      window._activePracticeLessonId = null;
      window._autoPracticePathId = null;
      window._autoPracticeNodeIdx = null;
      window._autoFinalExam = null;
      window._autoFinalExamPathId = null;
      sessionStorage.removeItem('auto_practice_lesson_id');
      sessionStorage.removeItem('auto_practice_path_id');
      sessionStorage.removeItem('auto_practice_node_idx');

      AppState.path = [
        { type:'root', id:'root', title:tr('knowledge.library', 'Thư viện') },
        { type:'quiz', id:'quiz', title:title || ('Kho ' + tr('knowledge.lesson_prefix', 'Bài') + ' tập'), data:data }
      ];
    }
  } else if (type === 'quiz-room') {
    var lastNode = AppState.path[AppState.path.length - 1];
    var roomTitle = (lastNode && (lastNode.title === 'Bài tập' || lastNode.title === 'Bài đánh giá tổng kết')) ? lastNode.title : title;
    if (lastNode && lastNode.type === 'quiz') {
      AppState.path.pop();
    }
    AppState.path.push({ type:type, id:id, title:roomTitle, data:data });
  } else {
    var lastNode = AppState.path[AppState.path.length - 1];
    if (lastNode && lastNode.type === type && lastNode.id === id) {
      lastNode.title = title;
      lastNode.data = data;
    } else {
      var existingIdx = -1;
      for (var p = 0; p < AppState.path.length; p++) {
        if (AppState.path[p].type === type && AppState.path[p].id === id) {
          existingIdx = p;
          break;
        }
      }
      if (existingIdx >= 0) {
        AppState.path = AppState.path.slice(0, existingIdx + 1);
        AppState.path[existingIdx].title = title;
        AppState.path[existingIdx].data = data;
      } else {
        if (lastNode && (lastNode.type === 'learning-path' || lastNode.type === 'graph' || lastNode.type === 'quiz')) {
          AppState.path = [{ type:'root', id:'root', title:tr('knowledge.library', 'Thư viện') }];
        }
        AppState.path.push({ type:type, id:id, title:title, data:data });
      }
    }
  }
  try { updateUrl(AppState.path[AppState.path.length - 1]); } catch(e) {}
  renderCurrentView();
}

window.openGraphWithPathFinder = function() {
  if (typeof navigateTo === 'function') {
    navigateTo('graph', 'graph', tr('knowledge.title', 'Không gian Tri thức'), { open_pathfinder: true });
    setTimeout(function() {
      var el = document.getElementById('pf-container');
      if (el) {
        el.classList.add('open');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      var mob = document.getElementById('mob-overlay');
      if (mob && window.innerWidth <= 768) {
        mob.classList.add('show');
      }
    }, 150);
  } else {
    window.location.href = 'knowledge_info.html?type=graph&id=graph&open_pathfinder=1';
  }
};

function renderCurrentView() {
  renderBreadcrumb();
  var root = document.getElementById('drill-down-root');
  var graphView = document.getElementById('dd-graph-view');
  var cnt = document.getElementById('dd-content');
  if (!cnt) return;

  // Reset
  root.style.display = '';
  graphView.style.display = 'none';
  cnt.style.animation = 'none';
  cnt.offsetHeight;
  cnt.style.animation = 'fadeUp 0.25s ease';

  var cur = AppState.path[AppState.path.length - 1];
  
  // Synchronize sidebar active state
  var sideItems = document.querySelectorAll('#side-topics-list .side-item');
  if (sideItems && sideItems.length >= 3) {
    sideItems.forEach(function(el) { el.classList.remove('active'); });
    if (cur.type === 'root') sideItems[0].classList.add('active');
    else if (cur.type === 'graph') sideItems[1].classList.add('active');
    else if (cur.type === 'learning-path') sideItems[2].classList.add('active');
    else if (cur.type === 'quiz' && sideItems[3]) sideItems[3].classList.add('active');
  }

  if (cur.type === 'root') renderRoot(cnt);
  else if (cur.type === 'graph') { 
    root.style.display = 'none'; 
    graphView.style.display = 'flex'; 
    initGraph(); 
    if (cur.data && cur.data.open_pathfinder) {
      setTimeout(function() {
        var el = document.getElementById('pf-container');
        if (el) {
          el.classList.add('open');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        var mob = document.getElementById('mob-overlay');
        if (mob && window.innerWidth <= 768) {
          mob.classList.add('show');
        }
      }, 150);
    }
  }
  else if (cur.type === 'learning-path') renderLearningPathWorkspace(cnt);
  else if (cur.type === 'topic') renderTopic(cnt, cur.data);
  else if (cur.type === 'section') renderSection(cnt, cur.data);
  else if (cur.type === 'lesson') renderLesson(cnt, cur.data);
  else if (cur.type === 'quiz') renderQuizSetup(cnt);
  else if (cur.type === 'quiz-room') renderQuizRoom(cnt, cur.data);
}

function renderLearningPathWorkspace(c) {

  var header = document.createElement('div');

  sub.style.cssText = 'font-size: 0.85rem; color: var(--s9); font-family: var(--font-academic);';
  sub.textContent = 'Các bài học và bài kiểm tra theo tiến trình.';
  titleWrap.appendChild(sub);
  header.appendChild(titleWrap);

  window.updateHeaderCreatePathButton = function(show) {
    var btn = document.getElementById('btn-header-create-path');
    if (btn) btn.style.display = show ? 'inline-flex' : 'none';
  };

  var rightAction = document.createElement('div');
  rightAction.id = 'lp-header-actions';
  rightAction.style.cssText = 'display:flex; gap:8px; align-items:center; flex-wrap:wrap;';
  rightAction.innerHTML = '<button type="button" id="btn-header-create-path" onclick="window.openGraphWithPathFinder();" style="display:none; align-items:center; gap:6px; font-size:13px; font-weight:600; color:#ffffff; padding:6px 14px; border:1px solid var(--b9); border-radius:0px; background:var(--b9); cursor:pointer;"><i class="ph ph-plus"></i> Tạo lộ trình</button>';
  header.appendChild(rightAction);

  c.appendChild(header);

  var workspaceContainer = document.createElement('div');
  workspaceContainer.id = 'learning-path-workspace-container';
  workspaceContainer.style.minHeight = '320px';
  c.appendChild(workspaceContainer);

  var token = (window.AuthGuard && window.AuthGuard.getToken ? window.AuthGuard.getToken() : localStorage.getItem('user_token'));
  var userId = null;
  if (token) {
    if (window.AuthGuard && window.AuthGuard._decodeJWT) {
      var p = window.AuthGuard._decodeJWT(token);
      if (p && p.user_id) userId = p.user_id;
    }
  }
  if (!userId) userId = localStorage.getItem('user_id') || sessionStorage.getItem('user_id');

  var cur = AppState.path[AppState.path.length - 1];
  var targetPathId = (cur && cur.data && cur.data.path_id);

  workspaceContainer.innerHTML = '<div style="padding: 32px 0; color: var(--s9); font-size: 14px; display:flex; align-items:center; gap:10px;"><i class="ph ph-spinner ph-spin" style="font-size:20px;"></i> Đang tải...</div>';

  var API = window.App?.API_BASE || 'http://127.0.0.1:5000';
  var headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;

  var fetchPathsPromise = window.App?.fetchApi
    ? window.App.fetchApi('/api/path/list' + (userId ? '?user_id=' + encodeURIComponent(userId) : ''), { headers: headers })
    : fetch(API + '/api/path/list' + (userId ? '?user_id=' + encodeURIComponent(userId) : ''), { headers: headers });

  fetchPathsPromise
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var paths = (data && data.paths) || [];
      window._cachedPaths = window._cachedPaths || {};
      paths.forEach(function(p) { window._cachedPaths[p.path_id] = p; });

      if (paths.length === 0) {
        if (typeof window.updateHeaderCreatePathButton === 'function') {
          window.updateHeaderCreatePathButton(false);
        }
        renderActionableEmptyState(workspaceContainer, []);
        return;
      }

      if (targetPathId) {
        var activePath = paths.find(function(p) { return p.path_id === targetPathId; });
        if (activePath) {
          localStorage.setItem('committed_path_id', activePath.path_id);
          window._currentPathObj = activePath;
          if (typeof openPathDetail === 'function') {
            openPathDetail(activePath, 'learning-path-workspace-container');
            return;
          }
        }
      }

      // Default: show path catalog
      workspaceContainer.innerHTML = '<div id="vertical-timeline-container" style="position:relative; z-index:2;"></div>';
      if (typeof renderPathList === 'function') {
        renderPathList(paths);
      } else {
        renderActionableEmptyState(workspaceContainer, paths);
      }
    })
    .catch(function(err) {
      console.error('Error fetching paths:', err);
      if (targetPathId && window._cachedPaths && window._cachedPaths[targetPathId]) {
        openPathDetail(window._cachedPaths[targetPathId], 'learning-path-workspace-container');
      } else {
        renderActionableEmptyState(workspaceContainer, []);
      }
    });
}

        <div style="border: 1px solid var(--s3); background: var(--s1); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-radius: 0px;">

window.openLessonFromTimeline = function(nId) {
  var queryId = nId.startsWith('lesson_') ? nId.replace('lesson_', 'l') : nId;
  if (typeof MOCK_LIBRARY_DATA !== 'undefined' && MOCK_LIBRARY_DATA.topics) {
    for (var t of MOCK_LIBRARY_DATA.topics) {
      for (var s of t.sections) {
        for (var l of s.lessons) {
          if (l.id === queryId) {
            AppState.path.push({ type: 'lesson', id: l.id, title: l.title, data: l });
            try { updateUrl(AppState.path[AppState.path.length - 1]); } catch(e) {}
            renderCurrentView();
            return;
          }
        }
      }
    }
  }
  navigateTo('lesson', queryId, 'Bài học ' + queryId, { id: queryId, num: queryId.replace('l', ''), title: 'Bài học ' + queryId });
};

  sessionStorage.setItem('auto_practice_node_idx', nodeIdx);

};

window.startFinalExamFromTimeline = function(pathId) {
  window._autoFinalExam = true;

  // Hàm parse LaTeX thô thành HTML + KaTeX
  function parseLatexToHTML(texString) {
    if (!texString || typeof texString !== 'string' || !texString.trim()) return '';
    
    // Fallback: nếu dữ liệu cũ là JSON của BlockNote
    const trimmedTex = texString.trim();
    if (trimmedTex.startsWith('[') || trimmedTex.startsWith('{"type"')) {
      try {
        const parsedJson = JSON.parse(trimmedTex);
        if (Array.isArray(parsedJson) && parsedJson.length > 0 && parsedJson[0].type) {
          return '<div style="padding: 20px; background: var(--s2); border: 1px solid var(--s3); border-radius: 2px; color: var(--amber);">Vui lòng ' + tr('knowledge.updated', 'Cập nhật') + ' lại ' + tr('knowledge.lessons_count', 'Số bài học') + ' này bằng mã LaTeX.</div>';
        }
      } catch (e) {
        // Không phải JSON hợp lệ -> Tiếp tục xử lý như LaTeX
      }
    }

    let html = texString;

    // Bộ lưu trữ và bảo vệ các khối HTML / SVG nhúng sẵn (không bị escape thẻ < >)
    const htmlBlockTokens = new Map();
    let htmlBlockCounter = 0;
    function storeHtmlBlock(code) {
      const token = '___PRE_HTML_BLOCK_' + (htmlBlockCounter++) + '___';
      htmlBlockTokens.set(token, code);
      return token;
    }

    // Bảo vệ các khối HTML / SVG đã có sẵn trong cơ sở dữ liệu
    html = html.replace(/<div class="vectoria-diagram-container"[\s\S]*?<\/svg>\s*<\/div>/g, function(m) { return storeHtmlBlock(m); });
    html = html.replace(/<div class="latex-solution-header"[\s\S]*?<\/div>/g, function(m) { return storeHtmlBlock(m); });
    html = html.replace(/<strong class="latex-bai-title"[\s\S]*?<\/strong>/g, function(m) { return storeHtmlBlock(m); });
    html = html.replace(/<svg[\s\S]*?<\/svg>/g, function(m) { return storeHtmlBlock(m); });

    // Xử lý các khối \begin{tikzpicture} ... \end{tikzpicture} trực tiếp bằng engine TikZ SVG
    html = html.replace(/\\begin\{tikzpicture\}[\s\S]*?\\end\{tikzpicture\}/g, function(tikzCode) {
      if (window.VectoriaTikz && typeof window.VectoriaTikz.renderTikzToSVG === 'function') {
        return storeHtmlBlock(window.VectoriaTikz.renderTikzToSVG(tikzCode));
      }
      return storeHtmlBlock(
        '<div class="vectoria-diagram-container" style="margin: 20px auto; padding: 20px; border: 1px dashed var(--s4, #d7dfe3); border-radius: 4px; text-align: center; color: var(--s11, #687076); background: var(--s2, #f9f9fb);">' +
          '<div style="font-size: 0.95rem; font-weight: 600; color: var(--s12, #11181c);">Sơ đồ hình học vector</div>' +
        '</div>'
      );
    });

    // Helper: Trích xuất nội dung trong cặp ngoặc nhọn cân bằng {...}
    function extractBalancedBraces(str, openBraceIndex) {
      if (str[openBraceIndex] !== '{') return null;
      let depth = 0;
      for (let i = openBraceIndex; i < str.length; i++) {
        if (str[i] === '\\') {
          let backslashCount = 0;
          while (i < str.length && str[i] === '\\') {
            backslashCount++;
            i++;
          }
          if (backslashCount % 2 !== 0) {
            continue; // Số lẻ backslash thì ký tự tiếp theo bị escape
          }
          if (i >= str.length) break;
        }
        if (str[i] === '{') depth++;
        else if (str[i] === '}') {
          depth--;
          if (depth === 0) return { content: str.substring(openBraceIndex + 1, i), endIndex: i };
        }
      }
      return null;
    }

    // Helper: Trích xuất nội dung trong cặp ngoặc vuông cân bằng [...] (bỏ qua ngoặc vuông nằm trong {...})
    function extractBalancedBrackets(str, openBracketIndex) {
      if (str[openBracketIndex] !== '[') return null;
      let bracketDepth = 0;
      let braceDepth = 0;
      for (let i = openBracketIndex; i < str.length; i++) {
        if (str[i] === '\\') {
          let backslashCount = 0;
          while (i < str.length && str[i] === '\\') {
            backslashCount++;
            i++;
          }
          if (backslashCount % 2 !== 0) {
            continue;
          }
          if (i >= str.length) break;
        }
        if (str[i] === '{') braceDepth++;
        else if (str[i] === '}') braceDepth = Math.max(0, braceDepth - 1);
        else if (braceDepth === 0) {
          if (str[i] === '[') bracketDepth++;
          else if (str[i] === ']') {
            bracketDepth--;
            if (bracketDepth === 0) return { content: str.substring(openBracketIndex + 1, i), endIndex: i };
          }
        }
      }
      return null;
    }

    // Helper: Thay thế lệnh 1 tham số có ngoặc cân bằng (như \section{...}, \textbf{...}, \caption{...})
    // Hỗ trợ cả tùy chọn [opt] đứng trước {arg} như \section[opt]{title}
    function replaceCommandWithBraces(text, commandName, replaceFn) {
      let result = '';
      let lastIndex = 0;
      const regex = new RegExp('\\\\' + commandName + '\\*?(?:\\s*\\[[^\\]]*\\])?\\s*\\{', 'g');
      let match;
      while ((match = regex.exec(text)) !== null) {
        const braceIndex = text.indexOf('{', match.index);
        const extracted = extractBalancedBraces(text, braceIndex);
        if (!extracted) continue;
        result += text.substring(lastIndex, match.index);
        const rep = replaceFn(extracted.content);
        result += (rep !== undefined ? rep : '');
        lastIndex = extracted.endIndex + 1;
        regex.lastIndex = lastIndex;
      }
      result += text.substring(lastIndex);
      return result;
    }

    // Helper: Thay thế lệnh 2 tham số có ngoặc cân bằng (\textcolor[m]{color}{text}, \href{url}{text})
    function replaceTwoArgCommandWithBraces(text, commandName, replaceFn) {
      let result = '';
      let lastIndex = 0;
      const regex = new RegExp('\\\\' + commandName + '\\*?(?:\\s*\\[[^\\]]*\\])?\\s*\\{', 'g');
      let match;
      while ((match = regex.exec(text)) !== null) {
        const braceIndex1 = text.indexOf('{', match.index);
        let optBracket = '';
        const brIdx = text.indexOf('[', match.index);
        if (brIdx !== -1 && brIdx < braceIndex1) {
          const obr = extractBalancedBrackets(text, brIdx);
          if (obr && obr.endIndex < braceIndex1) optBracket = obr.content.trim();
        }
        const arg1 = extractBalancedBraces(text, braceIndex1);
        if (!arg1) continue;
        const afterArg1 = text.substring(arg1.endIndex + 1);
        const match2 = /^(?:\s*\[[^\]]*\])*\s*\{/.exec(afterArg1);
        if (!match2) continue;
        const braceIndex2 = arg1.endIndex + 1 + match2.index + match2[0].lastIndexOf('{');
        const arg2 = extractBalancedBraces(text, braceIndex2);
        if (!arg2) continue;

        result += text.substring(lastIndex, match.index);
        const rep = replaceFn(arg1.content, arg2.content, optBracket);
        result += (rep !== undefined ? rep : '');
        lastIndex = arg2.endIndex + 1;
        regex.lastIndex = lastIndex;
      }
      result += text.substring(lastIndex);
      return result;
    }

    // Helper: Thay thế lệnh 3 tham số có ngoặc cân bằng (\resizebox{w}{h}{body}, \fcolorbox[m]{bd}{bg}{body})
    function replaceThreeArgCommandWithBraces(text, commandName, replaceFn) {
      let result = '';
      let lastIndex = 0;
      const regex = new RegExp('\\\\' + commandName + '\\*?(?:\\s*\\[[^\\]]*\\])?\\s*\\{', 'g');
      let match;
      while ((match = regex.exec(text)) !== null) {
        const b1 = text.indexOf('{', match.index);
        let optBracket = '';
        const brIdx = text.indexOf('[', match.index);
        if (brIdx !== -1 && brIdx < b1) {
          const obr = extractBalancedBrackets(text, brIdx);
          if (obr && obr.endIndex < b1) optBracket = obr.content.trim();
        }
        const a1 = extractBalancedBraces(text, b1);
        if (!a1) continue;
        const after1 = text.substring(a1.endIndex + 1);
        const m2 = /^\s*\{/.exec(after1);
        if (!m2) continue;
        const b2 = a1.endIndex + 1 + m2.index + m2[0].indexOf('{');

        const envN = sm[2].replace(/\*$/, '').trim();

          while (cur < html.length && /\s/.test(html[cur])) cur++;

            if (!obr) break;
            cur = obr.endIndex + 1;
          } else break;
        }
        while (cur < html.length && /\s/.test(html[cur])) cur++;

        ntcRe.lastIndex = sGrp.endIndex + 1;
        const prelim = parseTcbVisualOptsLocal(sGrp.content, 'tcolorbox', false);

        const lblCol = extractColorFromTexSnippetLocal(prelim.rawTitle);

          labelColor: lblCol,
          darkLabelColor: lblCol ? computeDarkTextColorLocal(lblCol) : '',

          isFramed: bs.isVisibleFrame,
          boxStyle: bs

      }

      const wrapExistingBoxWithFrame = function(envN, bs) {
        const prev = rawBoxes[envN] || { label: '', hasCounter: true };
        rawBoxes[envN] = {
          label: prev.label,
          hasCounter: prev.hasCounter,
          sharedCounter: prev.sharedCounter || '',
          within: prev.within || '',

          darkLabelColor: prev.darkLabelColor || '',

      while ((sm = tceRe.exec(html)) !== null) {
        const envN = sm[1].replace(/\*$/, '').trim();
        const bIdx = html.lastIndexOf('{', sm.index + sm[0].length);

        tceRe.lastIndex = sGrp.endIndex + 1;

        const lGrp = extractBalancedBraces(html, bIdx);
        if (!lGrp) continue;
        mdThmRe.lastIndex = lGrp.endIndex + 1;
        const bs = parseTcbVisualOptsLocal(mOpts, 'mdframed', false);
        const lblCol = extractColorFromTexSnippetLocal(lGrp.content);
        rawBoxes[envN] = {
          label: cleanThmLbl(lGrp.content) || envN,
          hasCounter: true,
          sharedCounter: sharedCnt,
          labelColor: lblCol,

      const surMdRe = /\\surroundwithmdframed\s*(?:\[([\s\S]*?)\])?\s*\{([a-zA-Z0-9_*]+)\}/g;

      const hookEnvRe = /\\(?:BeforeBeginEnvironment|AtBeginEnvironment)\s*\{([a-zA-Z0-9_*]+)\}\s*\{/g;

        const hGrp = extractBalancedBraces(html, bIdx);
        if (!hGrp) continue;

        const innerM = /\\begin\s*\{(tcolorbox|mdframed|framed|shaded|leftbar)\}/.exec(hGrp.content);
        if (innerM) {

          let iOpts = '';
          if (hGrp.content[afterInner] === '[') {
            const br = extractBalancedBrackets(hGrp.content, afterInner);
            if (br) iOpts = br.content;
          }
          wrapExistingBoxWithFrame(envN, parseTcbVisualOptsLocal(iOpts, innerM[1], false));

      Object.keys(rawBoxes).forEach(function(k) {

    // Giải nén \texorpdfstring{tex}{pdf} -> tex và gỡ vỏ subequations trước khi tokenize toán học

    // Bảo vệ \$ (escaped dollar) để không bị nhầm là mở đầu công thức toán

        if (str[i] === '\\' && i + 1 < str.length && str[i + 1] === '$') {

            j--;

    // Trích xuất tiêu đề / tác giả / ngày tháng từ toàn bộ văn bản (kể cả preamble trước \begin{document})

    html = replaceCommandWithBraces(html, 'author', function(c) { docAuthor = c.trim(); return ''; });

    // 2. Trích xuất cấu hình lớp tài liệu, bộ đếm ban đầu, hyperref và định dạng chương từ Preamble trước khi cắt \begin{document}

    let docClassLocal = persistedDocConfig.docClass || 'article';
    const dcMatchLocal = /\\documentclass(?:\s*\[[^\]]*\])?\s*\{([^}]+)\}/.exec(rawPreambleBeforeBody || html);
    if (dcMatchLocal) {

    const initialCountersLocal = { part: 0, chapter: 0, section: 0, subsection: 0, subsubsection: 0, equation: 0 };
    if (rawPreambleBeforeBody) {

      let pcm;
      while ((pcm = preCntRe.exec(rawPreambleBeforeBody)) !== null) {

        const cVal = pcm[3] !== undefined ? parseInt(pcm[3], 10) : 0;
        if (cName === 'tocdepth' && cOp === 'setcounter' && !isNaN(cVal)) {

        } else if (!isStandaloneNormalizedLesson && Object.prototype.hasOwnProperty.call(initialCountersLocal, cName)) {

          else if (cOp === 'addtocounter' && !isNaN(cVal)) initialCountersLocal[cName] += cVal;

    }

    let hyperrefTocColorLocal = '';
    let hyperrefLinkColorLocal = persistedDocConfig.hyperrefLinkColor || '';
    let hyperrefUrlColorLocal = persistedDocConfig.hyperrefUrlColor || '';
    let hyperrefCiteColorLocal = persistedDocConfig.hyperrefCiteColor || '';
    (function() {
      const hsSrc = rawPreambleBeforeBody || html;
      let colorLinks = Boolean(hyperrefLinkColorLocal || hyperrefUrlColorLocal || hyperrefCiteColorLocal);
      let hideLinks = false;
      let linkCol = hyperrefLinkColorLocal;
      let tocCol = '';
      let urlCol = hyperrefUrlColorLocal;
      let citeCol = hyperrefCiteColorLocal;

      const parseHyperOptsStr = function(optBody) {
        splitTopLevelCommaOptsLocal(optBody).forEach(function(item) {
          const eqP = item.indexOf('=');
          const k = (eqP === -1 ? item : item.slice(0, eqP)).trim().toLowerCase();
          const v = eqP === -1 ? '' : stripOuterBracesOnceLocal(item.slice(eqP + 1));
          if (k === 'hidelinks' && v.toLowerCase() !== 'false') hideLinks = true;
          else if (k === 'colorlinks') colorLinks = (v.toLowerCase() !== 'false');
          else if (k === 'allcolors' && v) {
            const c = mapLatexColor(v);
            linkCol = c; tocCol = c; urlCol = c; citeCol = c;
          } else if (k === 'linkcolor' && v) linkCol = mapLatexColor(v);
          else if (k === 'toccolor' && v) tocCol = mapLatexColor(v);
          else if (k === 'urlcolor' && v) urlCol = mapLatexColor(v);
          else if (k === 'citecolor' && v) citeCol = mapLatexColor(v);
        });
      };

      const upHyperRe = /\\(?:usepackage|RequirePackage)\s*\[((?:[^[\]{}]|\{[^}]*\})*)\]\s*\{[^}]*\bhyperref\b[^}]*\}/g;
      let upm;
      while ((upm = upHyperRe.exec(hsSrc)) !== null) {
        parseHyperOptsStr(upm[1]);
      }

      const hsRe = /\\hypersetup\s*\{/g;
      let hsm;
      while ((hsm = hsRe.exec(hsSrc)) !== null) {
        const bIdx = hsSrc.indexOf('{', hsm.index);
        const grp = extractBalancedBraces(hsSrc, bIdx);
        if (!grp) continue;
        hsRe.lastIndex = grp.endIndex + 1;
        parseHyperOptsStr(grp.content);
      }

      if (!hideLinks) {
        if (tocCol) hyperrefTocColorLocal = tocCol;
        else if (colorLinks) hyperrefTocColorLocal = linkCol || '#dc2626';
        if (colorLinks) {
          hyperrefLinkColorLocal = linkCol || '#dc2626';
          hyperrefUrlColorLocal = urlCol || linkCol || '#d11270';
          hyperrefCiteColorLocal = citeCol || linkCol || '#16a34a';
        }
      } else {
        hyperrefTocColorLocal = '';
        hyperrefLinkColorLocal = '';
        hyperrefUrlColorLocal = '';
        hyperrefCiteColorLocal = '';
      }
    })();

    const chapterFormatLocal = { shape: 'display', align: 'left', uppercase: false, color: '' };
    (function() {
      const tfSrc = rawPreambleBeforeBody || html;
      const tfM = /\\titleformat\s*\{\s*\\chapter\s*\}(?:\s*\[([^\]]*)\])?\s*\{/.exec(tfSrc);
      if (tfM) {
        if (tfM[1]) chapterFormatLocal.shape = tfM[1].trim().toLowerCase() || 'display';
        const bIdx = tfSrc.indexOf('{', tfM.index + tfM[0].length - 1);
        const fmtGrp = extractBalancedBraces(tfSrc, bIdx);
        if (fmtGrp) {
          if (/\\(?:centering|filcenter)\b/.test(fmtGrp.content)) chapterFormatLocal.align = 'center';
          else if (/\\(?:raggedleft|filleft)\b/.test(fmtGrp.content)) chapterFormatLocal.align = 'right';
          if (/\\(?:MakeUppercase|uppercase)\b/.test(fmtGrp.content)) chapterFormatLocal.uppercase = true;
          const colM = /\\color\s*(?:\[\s*([^\]]*)\s*\])?\s*\{([^}]+)\}/.exec(fmtGrp.content);
          if (colM) chapterFormatLocal.color = mapLatexColor(colM[2].trim(), colM[1] || '');
        }
      }
    })();

    const matchDocEnd = [...html.matchAll(/\\end\s*\{document\}/g)].pop();
    const lastDocEnd = matchDocEnd ? matchDocEnd.index : -1;
    if (firstDocStart !== -1 && lastDocEnd !== -1 && lastDocEnd > firstDocStart) {
      html = html.substring(firstDocStart, lastDocEnd);
    } else if (firstDocStart !== -1) {
      html = html.substring(firstDocStart);
    } else {
      if (html.includes('\\documentclass')) {

        if (idx !== -1) html = html.substring(idx);

    html = html.replace(/\\begin\s*\{document\}/g, '').replace(/\\end\s*\{document\}/g, '');

    // 2b. Quét và bung an toàn các macro của tác giả (\newcommand, \DeclareMathOperator, \newtcbox, \def 0 tham số) TRƯỚC storeMath
    // Bảo đảm các macro highlight văn xuôi có chứa toán học bên trong (VD: \nhanh{ma trận $A$}) bung trọn vẹn cả màu lẫn công thức
    (function expandAuthorMacrosBeforeMathLocal() {
      const PROTECTED_MACROS = new Set([
        'begin', 'end', 'part', 'chapter', 'section', 'subsection', 'subsubsection', 'paragraph', 'subparagraph',
        'textbf', 'textit', 'textsl', 'texttt', 'textsc', 'textrm', 'textsf', 'textup', 'textmd', 'textnormal', 'text',
        'emph', 'underline', 'uline', 'ul', 'uwave', 'dashuline', 'dotuline', 'sout', 'xout', 'st', 'hl', 'so', 'caps', 'enquote',
        'textcolor', 'color', 'colorbox', 'fcolorbox', 'fbox', 'framebox', 'ovalbox', 'Ovalbox', 'doublebox', 'shadowbox',
        'tcbox', 'boxpair', 'bai', 'loigiai', 'lgiai', 'includegraphics', 'caption', 'label', 'ref', 'eqref', 'cite',
        'href', 'url', 'footnote', 'maketitle', 'tableofcontents', 'addcontentsline', 'item', 'task', 'multicolumn', 'multirow',
        'parbox', 'resizebox', 'scalebox', 'rotatebox', 'raisebox', 'vspace', 'hspace', 'rule', 'today', 'par', 'noindent',
        'centering', 'raggedright', 'raggedleft', 'bfseries', 'itshape', 'slshape', 'scshape', 'ttfamily', 'rmfamily', 'sffamily',
        'Huge', 'huge', 'LARGE', 'Large', 'large', 'normalsize', 'small', 'footnotesize', 'scriptsize', 'tiny',
        'frac', 'dfrac', 'tfrac', 'sqrt', 'sum', 'prod', 'int', 'lim', 'sin', 'cos', 'tan', 'log', 'ln', 'exp',
        'mathbb', 'mathcal', 'mathrm', 'mathbf', 'mathsf', 'mathtt', 'mathfrak', 'mathscr', 'boldsymbol', 'bm',
        'vec', 'vv', 'hat', 'bar', 'tilde', 'overline', 'left', 'right', 'middle', 'operatorname', 'ensuremath',
        'tag', 'notag', 'nonumber', 'setcounter', 'addtocounter', 'stepcounter', 'refstepcounter',
        'arraystretch', 'baselinestretch', 'tabcolsep', 'fboxsep', 'fboxrule', 'parindent', 'parskip',

        'labelitemi', 'labelitemii', 'labelitemiii', 'labelitemiv', 'labelenumi', 'labelenumii', 'labelenumiii', 'labelenumiv'
      ]);

      const registerMacro = function(name, numArgs, defaultOpt, body) {

        const escN = name.replace(/[.*+?^$(){}|[\]\\]/g, '\\$&');
        if (new RegExp('\\\\' + escN + '(?![a-zA-Z@])').test(body)) return;

            cur += bareM[0].length;

                if (dBr) {

                  cur = dBr.endIndex + 1;
                }
              }

          if (srcText[cur] !== '{') continue;
          const bodyGrp = extractBalancedBraces(srcText, cur);
          if (!bodyGrp) continue;

          if (kind === 'DeclareMathOperator') {

          } else if (kind === 'newtcbox') {
            registerMacro(cmdName, numArgs, defaultOpt, '\\tcbox[' + bodyGrp.content.trim() + ']');
          } else {
            registerMacro(cmdName, numArgs, defaultOpt, bodyGrp.content);
          }

          if (stripFromOut) {
            out += srcText.slice(last, mm.index);
            last = bodyGrp.endIndex + 1;
          }
          mDeclRe.lastIndex = bodyGrp.endIndex + 1;
        }
        const rem = stripFromOut ? (out + srcText.slice(last)) : srcText;

        // Hỗ trợ \def\ten{...} 0 tham số đơn giản
        const defRe = /\\def\s*\\([a-zA-Z]+)\s*\{/g;
        let dout = '';
        let dlast = 0;
        let dm;
        while ((dm = defRe.exec(rem)) !== null) {
          const bOpen = rem.indexOf('{', dm.index);
          const bGrp = extractBalancedBraces(rem, bOpen);
          if (!bGrp) continue;
          registerMacro(dm[1], 0, null, bGrp.content);
          if (stripFromOut) {
            dout += rem.slice(dlast, dm.index);
            dlast = bGrp.endIndex + 1;
          }
          defRe.lastIndex = bGrp.endIndex + 1;
        }
        return stripFromOut ? (dout + rem.slice(dlast)) : rem;
      };

      scanMacroDecls(rawPreambleBeforeBody, false);
      html = scanMacroDecls(html, true);

      if (userMacros.size === 0) return;

      for (let pass = 0; pass < 8; pass++) {
        let changed = false;
        let res = '';
        let i = 0;
        while (i < html.length) {
          if (html[i] !== '\\') {
            res += html[i++];
            continue;
          }
          const cm = /^\\([a-zA-Z]+)(?![a-zA-Z@])/.exec(html.slice(i));
          if (!cm || !userMacros.has(cm[1])) {
            res += cm ? cm[0] : html[i];
            i += cm ? cm[0].length : 1;
            continue;
          }
          const macro = userMacros.get(cm[1]);
          let cursor = i + cm[0].length;
          if (macro.numArgs === 0) {
            res += macro.body;
            i = cursor;
            changed = true;
            continue;
          }
          const args = [];
          let reqCount = macro.numArgs;
          let aborted = false;
          if (macro.defaultOpt !== null) {
            let wsOpt = cursor;
            while (wsOpt < html.length && /[ \t]/.test(html[wsOpt])) wsOpt++;
            if (html[wsOpt] === '[') {
              const obr = extractBalancedBrackets(html, wsOpt);
              if (obr) {
                args.push(obr.content);
                cursor = obr.endIndex + 1;
              } else {
                args.push(macro.defaultOpt);
              }

              args.push(macro.defaultOpt);
            }
