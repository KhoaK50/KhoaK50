// ---------- QUIZ ROOM ----------
function renderQuizRoom(c, quizData) {
  if (!quizData || !quizData.questions) {
    console.warn("Quiz data lost (likely due to page reload). Redirecting to setup.");
    navigateTo('quiz', 'quiz', 'Kho ' + tr('knowledge.lesson_prefix', 'Bài') + ' tập', null);
    return;
  }
  c.innerHTML = '';
  window._quizActive = true;
  if (window._quizTimerInterval) clearInterval(window._quizTimerInterval);

  var questions = quizData.questions;
  var quizId = quizData.quiz_id;
  var mode = quizData.mode;
  var timeLimitMin = quizData.time_limit;
  var totalQ = questions.length;
  var answers = {};
  var visited = {};
  var currentIdx = 0;
  var submitted = false;
  var resultsMap = {};

  // Vi hành vi (Telemetry): thời gian làm từng câu và số lần đổi đáp án
  var telemetryMap = {};
  for (var ti = 0; ti < questions.length; ti++) {
    telemetryMap[questions[ti].id] = {
      time_spent_ms: 0,
      switch_count: 0
    };
  }
  var activeQuestionEnterTime = Date.now();
  var lastActiveQId = questions[0] ? questions[0].id : null;

  // Hàm giải mã ký hiệu Toán học LaTeX ($...$, $$...$$, \(...\), \[...\]) bằng KaTeX và MathJax
  function formatMathContent(str) {
    if (!str || typeof str !== 'string') return '';
    if (typeof katex !== 'undefined') {
      var unesc = function(s) { return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>'); };
      try {
        return str
          .replace(/\$\$([\s\S]+?)\$\$/g, function(_, m) {
            try { return katex.renderToString(unesc(m), { displayMode: true, throwOnError: false }); } catch(err) { return _; }
          })
          .replace(/\\\[([\s\S]+?)\\\]/g, function(_, m) {
            try { return katex.renderToString(unesc(m), { displayMode: true, throwOnError: false }); } catch(err) { return _; }
          })
          .replace(/\$([^\$]+?)\$/g, function(_, m) {
            try { return katex.renderToString(unesc(m), { displayMode: false, throwOnError: false }); } catch(err) { return _; }
          })
          .replace(/\\\(([\s\S]*?)\\\)/g, function(_, m) {
            try { return katex.renderToString(unesc(m), { displayMode: false, throwOnError: false }); } catch(err) { return _; }
          });
      } catch(e) {
        return str;
      }
    }
    return str;
  }

  function renderMath(element) {
    if (!element) return;
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(element, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });
      } catch(e) {}
    }
    if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
      MathJax.typesetPromise([element]).catch(function(){});
    }
  }

  // Ensure CSS Styles for Academic LaTeX Quiz Room
  if (!document.getElementById('quiz-room-custom-styles')) {
    var st = document.createElement('style');
    st.id = 'quiz-room-custom-styles';
    st.textContent = `
      .quiz-nav-cell {

        align-items: center;

        font-weight: 600 !important;

        transition: all 0.15s ease !important;

      }
      body.dark-theme .quiz-nav-cell.status-unvisited {
        background: var(--s3, #2d3139) !important;
        border: 1px solid var(--s4, #43484e) !important;
        color: var(--s12, #edeef0) !important;
      }
      /* 2. Đã xem nhưng chưa chọn: Màu vàng */
      .quiz-nav-cell.status-visited-empty {
        background: #fef08a !important;
        border: 1px solid #eab308 !important;
        color: #854d0e !important;
      }
      body.dark-theme .quiz-nav-cell.status-visited-empty {
        background: #713f12 !important;

      resultsMap[qId] = {
        is_correct: it.is_correct !== undefined ? it.is_correct : (it.correct !== undefined ? it.correct : (answers[qId] === it.correct_answer)),
        selected_answer: it.selected_answer || answers[qId] || null,
        correct_answer: it.correct_answer,
        explanation_html: it.explanation_html || ''
      };
    }

    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      if (!resultsMap[q.id]) {
        resultsMap[q.id] = {
          is_correct: false,

          correct_answer: q.correct_answer || '',
          explanation_html: q.explanation_html || ''

    var accuracyPct = totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0;
    var circ = 238.76;
    var strokeOffset = circ * (1 - (accuracyPct / 100));

    statsBox.innerHTML = `
      <div style="font-size:0.72rem; color:var(--s9); font-weight:700; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:10px; text-align:center;">
        Thống kê kết quả
      </div>

        <svg width="104" height="104" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--red, #e5484d)" stroke-width="8" opacity="0.8"></circle>
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--green, #30a46c)" stroke-width="8"
            stroke-dasharray="238.76" stroke-dashoffset="${strokeOffset}"
            stroke-linecap="butt" transform="rotate(-90 50 50)"></circle>

          quiz_id: quizId,
          total_score: totalScore,
          correct_count: correctCount,
          total_questions: totalQ,

        };
        var metaToSave = resultData.metadata ? Object.assign({}, resultData.metadata, baseMeta) : Object.assign({}, resultData.diagnosis, baseMeta);
        sessionStorage.setItem('latest_mentor_session', JSON.stringify(metaToSave));

    }

    // 2c. Tiến trình lộ trình: CHỈ thăng cấp node nếu học viên đạt điểm đạt (>= 5.0) VÀ là bài tập thuộc lộ trình
    var isFromLp = Boolean(quizData && quizData.from === 'learning-path');
    var pId = isFromLp ? ((quizData && quizData.path_id) || window._autoPracticePathId || sessionStorage.getItem('auto_practice_path_id') || localStorage.getItem('committed_path_id')) : null;

                            ? parseInt(window._autoPracticeNodeIdx)

  // --- Submit logic ---
  function doSubmit() {
    if (submitted) return;
    submitted = true;
    if (window._quizTimerInterval) clearInterval(window._quizTimerInterval);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang chấm...';

    var now = Date.now();
    if (lastActiveQId && telemetryMap[lastActiveQId]) {
      telemetryMap[lastActiveQId].time_spent_ms += (now - activeQuestionEnterTime);
    }

    var answerList = [];
    for (var i = 0; i < questions.length; i++) {
      var qid = questions[i].id;

        question_id: parseInt(qid),

      answers: answerList,
      path_id: currentPathId,
      node_id: practiceNodeId,

      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(submitPayload)
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.total_score !== undefined) {
        handleSubmissionResults(data);

        window.App.showToast(data.message || 'Lỗi khi nộp bài.', 'warning');

      submitted = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Nộp bài';
      submitBtn.style.opacity = '1';
    });
  }

  // Force Exit with 0 points modal & handler
  window.exitQuizWithZero = function(onDone) {
    if (!window._quizActive) {
      if (onDone) onDone();
      return;
    }

    var doExit = function() {
      window._quizActive = false;
      if (window._quizTimerInterval) clearInterval(window._quizTimerInterval);
      submitted = true;

      var zeroList = questions.map(function(q) {
        return {
          question_id: q.id,

          selected_answer: answers[q.id] || null,
          correct_answer: q.correct_answer,
          explanation_html: q.explanation_html || '<p>Bạn đã dừng bài làm giữa chừng. Bài thi được tính 0 điểm.</p>'
        };

      var zeroResult = {
        total_score: 0.0,
        correct_count: 0,
        total_questions: totalQ,

      };

      if (quizId !== 'mock') {
        var token = (window.AuthGuard && window.AuthGuard.getToken ? window.AuthGuard.getToken() : localStorage.getItem('user_token'));
        if (token) {
          var answerList = [];
          for (var qid in answers) {
            answerList.push({ question_id: parseInt(qid), selected_answer: answers[qid] });
          }
          var isFromLp = Boolean(quizData && quizData.from === 'learning-path');
          var practiceNodeId = isFromLp ? ((quizData && quizData.node_id) || window._activePracticeLessonId || window._autoPracticeLessonId || sessionStorage.getItem('auto_practice_lesson_id') || null) : null;
          var currentPathId = isFromLp ? ((quizData && quizData.path_id) || window._autoPracticePathId || sessionStorage.getItem('auto_practice_path_id') || localStorage.getItem('committed_path_id') || null) : null;
          var isFinalExam = Boolean(isFromLp && ((quizData && quizData.is_final) || window._autoFinalExam));
          fetch(App.API_BASE + '/api/quiz/' + quizId + '/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ 
              answers: answerList,
              path_id: currentPathId,
              node_id: practiceNodeId,
              is_final: isFinalExam
            })
          }).catch(function(err){ console.error(err); });
        }
      }

      if (onDone) {
        onDone();
      } else {
        handleSubmissionResults(zeroResult);
      }
    };

    if (window.App && window.App.showConfirm) {
      window.App.showConfirm(
        'Bạn đang trong phiên làm bài. Nếu thoát ra lúc này, bài thi sẽ tự động bị tính 0 điểm và kết thúc lượt làm. Bạn có chắc chắn muốn thoát?',
        doExit
      );
    } else {
      if (confirm('Bạn đang trong phiên làm bài. Nếu thoát ra lúc này, bài thi sẽ tự động bị tính 0 điểm và kết thúc lượt làm. Bạn có chắc chắn muốn thoát?')) {
        doExit();
      }
    }
  };

  // Initial render
  renderQuestion();
}

// PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP

const D = MOCK_LIBRARY_DATA;
let activePath = null;
let pinnedNode = null;
let hoveredNode = null;

const nodeMap = {};
D.graph.nodes.forEach(n => nodeMap[n.id] = n);
const adj = {};
const revAdj = {};
D.graph.nodes.forEach(n => { adj[n.id] = []; revAdj[n.id] = []; });
D.graph.edges.forEach(e => { adj[e.from].push(e.to); revAdj[e.to].push(e.from); });

// Group nodes by Topic (c1, c2, c3) instead of Section to match Unit colors
const lessonToTopic = {};
D.topics.forEach(t => {
  t.sections.forEach(s => {
    s.lessons.forEach(l => {
      lessonToTopic[l.id] = t.id;
    });
  });
});

D.graph.nodes.forEach(n => {
  const tId = lessonToTopic[n.id];
  if (tId) {
    nodeMap[n.id].group = tId;
    n.group = tId;
  } else {
    nodeMap[n.id].group = 't1';
    n.group = 't1';
  }
});

// Preserve 100% of all 92 edges in D.graph.edges
const reducedAdj = {};
D.graph.nodes.forEach(n => reducedAdj[n.id] = [...adj[n.id]]);

const GROUP_COLORS = {
  t1: { stroke: '#0090ff', fillLight: '#edf6ff', fillDark: '#0d2847', textLight: '#006adc', textDark: '#5eb1ef' }, // Radix Blue
  t2: { stroke: '#f76b15', fillLight: '#ffefd6', fillDark: '#3f1700', textLight: '#bd4b00', textDark: '#f78b4d' }, // Radix Orange
  t3: { stroke: '#30a46c', fillLight: '#e9f9ee', fillDark: '#0b2b1e', textLight: '#18794e', textDark: '#4cc38a' }, // Radix Green
  t4: { stroke: '#6e56cf', fillLight: '#f3f0ff', fillDark: '#221543', textLight: '#5031b2', textDark: '#9680e6' }, // Radix Violet
  t5: { stroke: '#e54666', fillLight: '#fff0f4', fillDark: '#38131a', textLight: '#c92a4e', textDark: '#f27891' }, // Radix Ruby
  t6: { stroke: '#00a2c7', fillLight: '#e5f8fb', fillDark: '#062a33', textLight: '#007797', textDark: '#4ab4d0' }, // Radix Cyan
  t7: { stroke: '#ffb224', fillLight: '#fff8e8', fillDark: '#392200', textLight: '#ad5700', textDark: '#ffd15c' }  // Radix Amber
};

});
cssStr += '}\nbody.dark-theme, html.dark body {\n';
Object.keys(GROUP_COLORS).forEach(k => {

  cssStr += `  --${k}-fill: ${c.fillDark}; --${k}-text: ${c.textDark}; --${k}-stroke: ${c.stroke};\n`;
});

document.head.appendChild(styleTag);

// Populate Dynamic Legend Bar
const lgBar = document.getElementById("dynamic-legend-bar");
if(lgBar && D.topics) {

  D.topics.forEach((t) => {

function gc(id) { 
  const grp = nodeMap[id]?.group || 't1';
  return GROUP_COLORS[grp] || GROUP_COLORS.t1;
}

const isDark = () => document.body.classList.contains('dark-theme') || document.documentElement.classList.contains('dark');

/*
 * Báo cáo Luận án: Phương trình Trọng số Cognitive Cost
 * W_u = (C * T) / \beta_u * (1 + P_u)
 */
function getWeight(id) { 
  const n = nodeMap[id]; 
  if (!n) return 1;
  const C = n.value || 5;
  const T = n.time || 45;
  const beta = 1.0;
  const P_u = 0.25;
  return (C * T / beta) * (1 + P_u); 
}

function getTree(startId, forward = true) {
  const tree = new Set();
  const q = [startId];
  while(q.length > 0) {
    const cur = q.shift();
    if (!tree.has(cur)) {
      tree.add(cur);
      const neighbors = forward ? reducedAdj[cur] : revAdj[cur];
      neighbors.forEach(nb => q.push(nb));
    }
  }
  return tree;
}

// =========================================================================
//  PAN, ZOOM, VIEW SWITCHER & CLUSTER CAMERA ENGINE (3 DISTINCT PARADIGMS)
// =========================================================================
let zs = { s:1, x:0, y:0 }, pan = { on:false, sx:0, sy:0 };
let activeTopicFilter = null;
let cameraAnimFrame = null;
window.GRAPH_BOUNDS = null;
window.CLUSTER_BOUNDS = {};
window.graphViewMode = (function() {
  try {
    const saved = localStorage.getItem('vec_graph_view_mode');
    if (saved === 'clusters' || saved === 'layered' || saved === 'radial') return saved;
  } catch (e) {}
  return 'clusters';
})();

window.setGraphViewMode = function(mode, ev) {

  if (mode !== 'clusters' && mode !== 'layered' && mode !== 'radial') return;
  window.graphViewMode = mode;
  try { localStorage.setItem('vec_graph_view_mode', mode); } catch (e) {}
  activeTopicFilter = null;
  const c = document.getElementById('d-canvas');
  if (c) {
    c.innerHTML = renderDiagram();
    initZP();

};

function animateCameraTo(targetS, targetX, targetY, duration = 260) {
  const svg = document.querySelector('#d-canvas svg');
  if (!svg) return;
  const g = svg.querySelector('#zg');
  if (!g) return;
  if (cameraAnimFrame) cancelAnimationFrame(cameraAnimFrame);

  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced || duration <= 0) {
    zs.s = targetS; zs.x = targetX; zs.y = targetY;
    g.setAttribute('transform', "translate(" + zs.x + "," + zs.y + ") scale(" + zs.s + ")");
    return;
  }

  const startS = zs.s, startX = zs.x, startY = zs.y;
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const ease = 1 - Math.pow(1 - t, 3);
    zs.s = startS + (targetS - startS) * ease;
    zs.x = startX + (targetX - startX) * ease;
    zs.y = startY + (targetY - startY) * ease;
    g.setAttribute('transform', "translate(" + zs.x + "," + zs.y + ") scale(" + zs.s + ")");
    if (t < 1) cameraAnimFrame = requestAnimationFrame(step);
    else cameraAnimFrame = null;
  }
  cameraAnimFrame = requestAnimationFrame(step);
}

window.fitGraphToCanvas = function(animate = false) {
  const c = document.getElementById('d-canvas');
  if (!c || !window.GRAPH_BOUNDS) return;
  const cRect = c.getBoundingClientRect();
  if (cRect.width === 0 || cRect.height === 0) return;

  const padX = 24, topReserve = 46, bottomReserve = 28;
  const availW = Math.max(120, cRect.width - padX * 2);
  const availH = Math.max(120, cRect.height - topReserve - bottomReserve);
  const scaleX = availW / window.GRAPH_BOUNDS.width;
  const scaleY = availH / window.GRAPH_BOUNDS.height;
  const targetS = Math.max(0.2, Math.min(1.25, Math.min(scaleX, scaleY)));
  const targetX = (cRect.width - window.GRAPH_BOUNDS.width * targetS) / 2 - window.GRAPH_BOUNDS.x * targetS;
  const targetY = topReserve + (availH - window.GRAPH_BOUNDS.height * targetS) / 2 - window.GRAPH_BOUNDS.y * targetS;

  if (animate) {
    animateCameraTo(targetS, targetX, targetY, 260);
  } else {
    zs.s = targetS; zs.x = targetX; zs.y = targetY;
    const g = c.querySelector('svg #zg');
    if (g) g.setAttribute('transform', "translate(" + zs.x + "," + zs.y + ") scale(" + zs.s + ")");
  }
};

window.focusTopicCluster = function(topicId, ev) {
  if (ev) ev.stopPropagation();
  const c = document.getElementById('d-canvas');
  if (!c) return;
  const cRect = c.getBoundingClientRect();

  if (!topicId || activeTopicFilter === topicId) {
    activeTopicFilter = null;
    window.fitGraphToCanvas(true);
    updateVisualState();
    refreshLegend();
    return;
  }
  const b = window.CLUSTER_BOUNDS && window.CLUSTER_BOUNDS[topicId];
  if (!b || cRect.width === 0) return;
  activeTopicFilter = topicId;
  const padX = 40, topReserve = 52, bottomReserve = 36;
  const availW = Math.max(100, cRect.width - padX * 2);
  const availH = Math.max(100, cRect.height - topReserve - bottomReserve);
  const scaleX = availW / b.w;
  const scaleY = availH / b.h;
  const targetS = Math.max(0.25, Math.min(1.4, Math.min(scaleX, scaleY)));
  const targetX = (cRect.width - b.w * targetS) / 2 - b.x * targetS;
  const targetY = topReserve + (availH - b.h * targetS) / 2 - b.y * targetS;
  animateCameraTo(targetS, targetX, targetY, 320);
  updateVisualState();
  refreshLegend();
  const topicHeaderEl = document.getElementById('lg-topic-' + topicId);
  if (topicHeaderEl) topicHeaderEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
};

window.zoomCanvasStep = function(factor) {
  const svg = document.querySelector('#d-canvas svg');
  if (!svg) return;
  const r = svg.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const ns = Math.max(0.15, Math.min(4, zs.s * factor));
  const ratio = ns / zs.s;
  const tx = cx - (cx - zs.x) * ratio;
  const ty = cy - (cy - zs.y) * ratio;
  animateCameraTo(ns, tx, ty, 180);
};

      '<button type="button" onclick="zoomCanvasStep(1.22)" title="Phóng to" style="width: 28px; height: 26px; border: 1px solid transparent; background: var(--s1); color: var(--s12); border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: var(--font-modern-ui); font-weight: 700; font-size: 0.9rem;">+</button>' +
      '<button type="button" onclick="zoomCanvasStep(0.82)" title="Thu nhỏ" style="width: 28px; height: 26px; border: 1px solid transparent; background: var(--s1); color: var(--s12); border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: var(--font-modern-ui); font-weight: 700; font-size: 0.9rem;">-</button>' +
      '<button type="button" onclick="focusTopicCluster(null, event)" title="Khớp toàn cảnh" style="height: 26px; padding: 0 9px; border: 1px solid transparent; background: var(--s1); color: var(--s11); border-radius: 2px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: var(--font-modern-ui); font-weight: 600; font-size: 0.75rem;">' + tr('knowledge.fit_view', 'Toàn cảnh') + '</button>';

    svg.onwheel = e => {
      e.preventDefault();
      if (cameraAnimFrame) { cancelAnimationFrame(cameraAnimFrame); cameraAnimFrame = null; }
      const r = svg.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const d = e.deltaY < 0 ? 1.13 : 0.88;
      const ns = Math.max(0.15, Math.min(4, zs.s * d));
      zs.x = mx - (mx - zs.x) * (ns / zs.s);
      zs.y = my - (my - zs.y) * (ns / zs.s);
      zs.s = ns;
      apply();
    };
    svg.onmousedown = e => { 
      if(e.button !== 0 || e.target.closest('.n-g') || e.target.closest('.cluster-hdr') || e.target.closest('.sec-card')) return; 
      if (cameraAnimFrame) { cancelAnimationFrame(cameraAnimFrame); cameraAnimFrame = null; }
      pan.on = true; pan.sx = e.clientX - zs.x; pan.sy = e.clientY - zs.y; 
      svg.style.cursor = 'grabbing'; 
    };
    window.addEventListener('mousemove', e => { 
      if(!pan.on) return; 
      zs.x = e.clientX - pan.sx; zs.y = e.clientY - pan.sy; 
      apply(); 
    });
    window.addEventListener('mouseup', () => { 
      if(pan.on) { pan.on = false; if(svg) svg.style.cursor = 'grab'; } 
    });

    let touchMode = 0;
    let startDist = 0, startScale = 1, pinchCenter = {x:0, y:0};

    svg.addEventListener('touchstart', e => {
      if(e.target.closest('.n-g') || e.target.closest('.cluster-hdr') || e.target.closest('.sec-card')) return;
      if (cameraAnimFrame) { cancelAnimationFrame(cameraAnimFrame); cameraAnimFrame = null; }
      if(e.touches.length === 1) {
        touchMode = 1;
        pan.on = true;
        pan.sx = e.touches[0].clientX - zs.x;
        pan.sy = e.touches[0].clientY - zs.y;
      } else if(e.touches.length === 2) {
        touchMode = 2;
        pan.on = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        startDist = Math.hypot(dx, dy);
        startScale = zs.s;
        const r = svg.getBoundingClientRect();
        pinchCenter = {
          x: (e.touches[0].clientX + e.touches[1].clientX)/2 - r.left,
          y: (e.touches[0].clientY + e.touches[1].clientY)/2 - r.top
        };
      }
    }, {passive: false});

    svg.addEventListener('touchmove', e => {
      if(touchMode === 0) return;
      e.preventDefault();
      if(touchMode === 1 && pan.on && e.touches.length === 1) {
        zs.x = e.touches[0].clientX - pan.sx;
        zs.y = e.touches[0].clientY - pan.sy;
        apply();
      } else if(touchMode === 2 && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if(startDist > 0) {
          const factor = dist / startDist;
          const ns = Math.max(0.15, Math.min(4, startScale * factor));
          zs.x = pinchCenter.x - (pinchCenter.x - zs.x) * (ns / zs.s);
          zs.y = pinchCenter.y - (pinchCenter.y - zs.y) * (ns / zs.s);
          zs.s = ns;
          apply();
        }
      }
    }, {passive: false});

    svg.addEventListener('touchend', e => {
      if(e.touches.length === 0) {
        touchMode = 0;
        pan.on = false;
      } else if(e.touches.length === 1) {
        touchMode = 1;
        pan.on = true;
        pan.sx = e.touches[0].clientX - zs.x;
        pan.sy = e.touches[0].clientY - zs.y;
      }
    });
}

//  DIAGRAM ENGINE v11: 3 PARADIGMS + ORTHOGONAL BUS ROUTING + 2-COLOR FLOW

function escapeSvgText(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Converts an array of orthogonal points [[x0,y0], [x1,y1], ...] into a smooth rounded-corner SVG path
function roundedOrthoPath(pts, radius = 6) {
  if (!pts || pts.length === 0) return '';
  if (pts.length === 1) return 'M' + pts[0][0] + ' ' + pts[0][1];
  // Remove consecutive duplicate points
  const clean = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (Math.hypot(pts[i][0] - clean[clean.length - 1][0], pts[i][1] - clean[clean.length - 1][1]) > 0.5) {
      clean.push(pts[i]);
    }
  }
  if (clean.length === 1) return 'M' + clean[0][0] + ' ' + clean[0][1];
  let d = 'M' + clean[0][0].toFixed(1) + ' ' + clean[0][1].toFixed(1);
  for (let i = 1; i < clean.length - 1; i++) {
    const prev = clean[i - 1], cur = clean[i], next = clean[i + 1];
    const vx1 = cur[0] - prev[0], vy1 = cur[1] - prev[1];
    const vx2 = next[0] - cur[0], vy2 = next[1] - cur[1];
    const len1 = Math.hypot(vx1, vy1), len2 = Math.hypot(vx2, vy2);
    if (len1 < 1 || len2 < 1) {
      d += ' L' + cur[0].toFixed(1) + ' ' + cur[1].toFixed(1);
      continue;
    }
    const r = Math.min(radius, len1 * 0.45, len2 * 0.45);
    const sx = cur[0] - (vx1 / len1) * r, sy = cur[1] - (vy1 / len1) * r;
    const ex = cur[0] + (vx2 / len2) * r, ey = cur[1] + (vy2 / len2) * r;
    d += ' L' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' Q' + cur[0].toFixed(1) + ' ' + cur[1].toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1);
  }
  const last = clean[clean.length - 1];
  d += ' L' + last[0].toFixed(1) + ' ' + last[1].toFixed(1);
  return d;
}

// -------------------------------------------------------------------------
//  PARADIGM 1: "PHÂN CỤM" (CLUSTERS) - Orthogonal PCB Bus Routing
//  Generous station gaps (20px), Left-gutter vertical routing (zero text crossing),
//  and Multi-track Highway lanes between Tier 0 and Tier 1
// -------------------------------------------------------------------------
function renderClustersDiagram(secMap, topicMap) {
  const METRO_SPEC = {
    t1: { roman: 'I',   tier: 0, order: 0, cols: [['s1', 's2', 's3']] },
    t2: { roman: 'II',  tier: 0, order: 1, cols: [['s4', 's5', 's6'], ['s7', 's8']] },
    t3: { roman: 'III', tier: 0, order: 2, cols: [['s9', 's10', 's11', 's12', 's13'], ['s14', 's15', 's16', 's17']] },
    t4: { roman: 'IV',  tier: 1, order: 0, cols: [['s18', 's19', 's20', 's21', 's22']] },
    t5: { roman: 'V',   tier: 1, order: 1, cols: [['s23', 's24', 's25', 's26']] },
    t6: { roman: 'VI',  tier: 1, order: 2, cols: [['s27', 's28', 's29', 's30'], ['s31', 's32', 's33']] },
    t7: { roman: 'VII', tier: 1, order: 3, cols: [['s34', 's35', 's36', 's37']] }
  };

  const stW = 34, stH = 28, stGapX = 20; // 20px gap between stations so horizontal arrows are crisp and spacious
  const colGap = 42; // 42px routing corridor between Col 0 and Col 1
  const padX = 26, headerH = 30, padTop = 46, padBottom = 20;
  const secTitleH = 18, secBlockGapY = 26; // 26px vertical channel between sections
  const tierGapY = 92; // 92px multi-track horizontal highway between Tier 0 and Tier 1

  const clusters = {};
  const pos = {};

  Object.keys(METRO_SPEC).forEach(tId => {
    const spec = METRO_SPEC[tId];
    const tObj = topicMap[tId] || { id: tId, title: tId };
    const colWidths = spec.cols.map(secIds => {
      let maxSt = 3;
      secIds.forEach(sId => {
        const sObj = secMap[sId];
        if (sObj && sObj.lessons) maxSt = Math.max(maxSt, sObj.lessons.length);
      });
      return Math.max(228, maxSt * stW + (maxSt - 1) * stGapX + 16);
    });

    const clusterW = padX * 2 + colWidths.reduce((a, b) => a + b, 0) + (colWidths.length - 1) * colGap;
    const colLayouts = [];
    let maxColBottom = padTop + 60;
    let curLocalX = padX;

    spec.cols.forEach((secIds, colIdx) => {
      const localX = curLocalX;
      const colW = colWidths[colIdx];
      curLocalX += colW + colGap;

      let curY = padTop;
      const secBlocks = [];

      secIds.forEach((sId, sIdx) => {
        const sObj = secMap[sId];
        if (!sObj || !sObj.lessons || !sObj.lessons.length) return;
        if (sIdx > 0) curY += secBlockGapY;
        const headerY = curY;
        curY += secTitleH;
        const lPositions = [];
        sObj.lessons.forEach((l, lIdx) => {
          lPositions.push({
            id: l.id,
            localX: localX + lIdx * (stW + stGapX),
            localY: curY,
            col: colIdx,
            secIdxInCol: sIdx,
            idxInSec: lIdx,
            secLen: sObj.lessons.length,
            secId: sId,
            topicId: tId
          });
        });
        curY += stH;
        secBlocks.push({ sId, rawTitle: sObj.title, localX, headerY, lessons: lPositions });
      });

      const colBottom = curY + padBottom;
      if (colBottom > maxColBottom) maxColBottom = colBottom;
      colLayouts.push({ colIdx, localX, colW, secBlocks, colBottom });
    });

    clusters[tId] = { id: tId, roman: spec.roman, tier: spec.tier, order: spec.order, rawTitle: tObj.title, w: clusterW, naturalH: maxColBottom, h: maxColBottom, colLayouts };
  });

  const tier0Ids = ['t1', 't2', 't3'], tier1Ids = ['t4', 't5', 't6', 't7'];
  const tier0MaxH = Math.max(...tier0Ids.map(id => clusters[id].naturalH));
  const tier1MaxH = Math.max(...tier1Ids.map(id => clusters[id].naturalH));
  tier0Ids.forEach(id => { clusters[id].h = tier0MaxH; });
  tier1Ids.forEach(id => { clusters[id].h = tier1MaxH; });

  const tier0BoxesW = tier0Ids.reduce((a, id) => a + clusters[id].w, 0);
  const tier1BoxesW = tier1Ids.reduce((a, id) => a + clusters[id].w, 0);
  const gap1 = 36;
  const totalGridW = Math.max(tier0BoxesW + 72, tier1BoxesW + gap1 * (tier1Ids.length - 1));
  const gap0 = (totalGridW - tier0BoxesW) / (tier0Ids.length - 1);
  const gap1Actual = (totalGridW - tier1BoxesW) / (tier1Ids.length - 1);
  const marginX = 32, marginY = 28;

  let cx0 = marginX;
  tier0Ids.forEach(id => { clusters[id].x = cx0; clusters[id].y = marginY; cx0 += clusters[id].w + gap0; });
  let cx1 = marginX;
  const tier1Y = marginY + tier0MaxH + tierGapY;
  tier1Ids.forEach(id => { clusters[id].x = cx1; clusters[id].y = tier1Y; cx1 += clusters[id].w + gap1Actual; });

  window.CLUSTER_BOUNDS = {};
  Object.keys(clusters).forEach(tId => {
    const c = clusters[tId];
    window.CLUSTER_BOUNDS[tId] = { x: c.x, y: c.y, w: c.w, h: c.h };
    c.colLayouts.forEach(col => {
      col.secBlocks.forEach(sb => {
        sb.x = c.x + sb.localX;
        sb.y = c.y + sb.headerY;
        sb.lessons.forEach(lp => {
          pos[lp.id] = {
            x: c.x + lp.localX,
            y: c.y + lp.localY,
            w: stW,
            h: stH,
            col: lp.col,
            secIdxInCol: lp.secIdxInCol,
            idxInSec: lp.idxInSec,
            secLen: lp.secLen,
            secId: lp.secId,
            topicId: lp.topicId,
            tier: c.tier,
            topicOrder: c.order,
            colBaseX: c.x + col.localX
          };
        });
      });
    });
  });

  window.GRAPH_BOUNDS = { x: 0, y: 0, width: totalGridW + marginX * 2, height: tier1Y + tier1MaxH + marginY };
  zs = { s: 1, x: 0, y: 0 };

  let svg = buildCommonSvgHeader();
  const highwayTop = marginY + tier0MaxH + 14;

  Object.keys(clusters).forEach(tId => {
    const c = clusters[tId];
    svg += '<g id="cluster-' + tId + '" data-topic="' + tId + '" class="cluster-box">';
    svg += renderClusterFrameSvg(c, tId, headerH);
    c.colLayouts.forEach(col => {
      col.secBlocks.forEach(sb => {
        const rawSec = tr('library_terms.' + sb.sId, sb.rawTitle);
        const maxCh = Math.floor(col.colW / 6.3);
        const shortSec = rawSec.length > maxCh ? rawSec.substring(0, maxCh - 2) + '...' : rawSec;
        svg += '<g class="sec-hdr"><title>' + escapeSvgText(rawSec) + '</title>';
        svg += '<text x="' + sb.x + '" y="' + (sb.y + 12) + '" font-size="10.8" font-weight="600" fill="var(--s11)">' + escapeSvgText(shortSec) + '</text></g>';
      });
    });
    svg += '</g>';
  });

  // Track counters for clean multi-lane separation (no overlapping parallel wires)
  const colChannelCount = {};
  let crossTierCount = 0;

  D.graph.nodes.forEach(u => {
    reducedAdj[u.id].forEach(v => {
      const from = pos[u.id], to = pos[v];
      if (!from || !to) return;
      let pathD = '', tierCls = 'e-chain', markerId = 'arr-' + from.topicId, extraStyle = 'stroke: var(--' + from.topicId + '-stroke);';

      if (from.secId === to.secId && to.idxInSec === from.idxInSec + 1) {
        // 1. Direct horizontal station-to-station track inside same section (20px wide open gap)
        const sx = from.x + stW, sy = from.y + stH / 2;
        const ex = to.x - 3, ey = to.y + stH / 2;
        pathD = 'M' + sx + ' ' + sy + ' L' + ex + ' ' + ey;
        tierCls = 'e-chain';
      } else if (from.topicId === to.topicId && from.col === to.col) {
        // 2. Same-column transition to a lower section:
        // Route down 9px into the inter-section gap (above the next section's title),
        // then left to the column's outer left gutter (colBaseX - 11),
        // then vertically down past the section title without touching any text,
        // and finally right into the target station's left port!
        const secDiff = Math.abs(to.secIdxInCol - from.secIdxInCol);
        const sx = from.x + stW / 2, sy = from.y + stH;
        const gapY = from.y + stH + 9;
        const gutterX = to.colBaseX - (secDiff > 1 ? 18 : 11);
        const ey = to.y + stH / 2 + (secDiff > 1 ? 4 : 0);
        const ex = to.x - 3;
        pathD = roundedOrthoPath([
          [sx, sy],
          [sx, gapY],
          [gutterX, gapY],
          [gutterX, ey],
          [ex, ey]
        ], 5);
        tierCls = 'e-branch';
      } else if (from.topicId === to.topicId) {
        // 3. Cross-column transition inside same chapter:
        // Route through the 42px vertical corridor between Col 0 and Col 1 with dedicated lane offsets
        const key = from.topicId;
        const laneIdx = (colChannelCount[key] || 0);
        colChannelCount[key] = laneIdx + 1;
        const sx = from.x + stW, sy = from.y + stH / 2;
        const ex = to.x - 3, ey = to.y + stH / 2;
        const midX = to.colBaseX - 14 - (laneIdx % 4) * 5.5;
        pathD = roundedOrthoPath([
          [sx, sy],
          [midX, sy],
          [midX, ey],
          [ex, ey]
        ], 6);
        tierCls = 'e-branch';
      } else if (from.tier === to.tier && to.topicOrder === from.topicOrder + 1) {
        // 4. Bridge between adjacent chapters on the same tier
        tierCls = 'e-bridge'; markerId = 'arr'; extraStyle = '';
        const key = 'br-' + from.topicId + '-' + to.topicId;
        const laneIdx = (colChannelCount[key] || 0);
        colChannelCount[key] = laneIdx + 1;
        const cFrom = clusters[from.topicId], cTo = clusters[to.topicId];
        const corrX = (cFrom.x + cFrom.w + cTo.x) / 2 + (laneIdx - 1) * 6;
        const sx = from.x + stW, sy = from.y + stH / 2;
        const ex = to.x - 3, ey = to.y + stH / 2;
        pathD = roundedOrthoPath([
          [sx, sy],
          [corrX, sy],
          [corrX, ey],
          [ex, ey]
        ], 7);
      } else {
        // 5. Cross-tier highway bus (Tier 0 -> Tier 1)
        tierCls = 'e-cross-tier'; markerId = 'arr'; extraStyle = '';
        const trackY = highwayTop + (crossTierCount % 13) * 4.8;
        crossTierCount++;
        const sx = from.x + stW / 2, sy = from.y + stH;
        const ex = to.x + stW / 2, ey = to.y - 3;
        pathD = roundedOrthoPath([
          [sx, sy],
          [sx, trackY],
          [ex, trackY],
          [ex, ey]
        ], 8);
      }
      svg += '<path id="edge-' + u.id + '-' + v + '" data-from="' + u.id + '" data-to="' + v + '" data-tier="' + tierCls + '" data-marker="' + markerId + '" class="e-line e-default ' + tierCls + '" style="' + extraStyle + '" d="' + pathD + '" marker-end="url(#' + markerId + ')"/>';
    });
  });

  // Station Nodes (1..78)
  D.graph.nodes.forEach(n => {
    const p = pos[n.id];
    if (!p) return;
    const grp = p.topicId || 't1';
    const rawTxt = tr('library_terms.' + n.id, n.label).replace(/^[0-9.]+\s*/, '');
    const secTitle = secMap[p.secId] ? tr('library_terms.' + p.secId, secMap[p.secId].title) : '';
    const border = 'var(--' + grp + '-stroke)';
    const fillBg = 'var(--' + grp + '-fill)';
    const textMain = 'var(--' + grp + '-text)';

    svg += '<g id="node-' + n.id + '" data-id="' + n.id + '" data-topic="' + grp + '" class="n-g" style="color: ' + border + ';" transform="translate(' + p.x + ',' + p.y + ')" onclick="clickNode(event, \'' + n.id + '\')" onmouseenter="hoverNode(\'' + n.id + '\')" onmouseleave="hoverNode(null)">';
    svg += '<title>' + escapeSvgText(n.num + '. ' + rawTxt + (secTitle ? ' · ' + secTitle : '')) + '</title>';
    svg += '<rect class="n-rect" width="' + stW + '" height="' + stH + '" rx="2" fill="' + fillBg + '" stroke="' + border + '" stroke-width="1.2"/>';
    svg += '<text x="' + (stW / 2) + '" y="18.5" font-size="11.5" font-weight="700" fill="' + textMain + '" text-anchor="middle">' + n.num + '</text>';
    svg += '</g>';
  });

  svg += '</g></svg>';
  return svg;
}

// -------------------------------------------------------------------------
//  PARADIGM 2: "PHÂN TẦNG" (LAYERED) - Adaptive Corridor Topological Swimlanes
//  Automatically widens rank gaps (+28px) wherever cross-lane/cross-section
//  edges occur so there are zero cramped vertical slits!
// -------------------------------------------------------------------------
function renderLayeredDiagram(secMap, topicMap) {
  const rank = {};
  D.graph.nodes.forEach(n => { rank[n.id] = 0; });
  for (let iter = 0; iter < 85; iter++) {
    D.graph.edges.forEach(e => {
      if (rank[e.to] <= rank[e.from]) rank[e.to] = rank[e.from] + 1;
    });
  }
  const maxRank = Math.max(...Object.values(rank)); // 37

  const SUB_TRACK = {
    s1: 0, s2: 1, s3: 2,
    s4: 0, s5: 0, s6: 1, s7: 0, s8: 0,
    s9: 0, s10: 0, s11: 0, s12: 0, s13: 0, s14: 1, s15: 1, s16: 1, s17: 1,
    s18: 0, s19: 0, s20: 0, s21: 0, s22: 0,
    s23: 0, s24: 0, s25: 1, s26: 0,
    s27: 0, s28: 0, s29: 0, s30: 0, s31: 0, s32: 0, s33: 0,
    s34: 0, s35: 0, s36: 0, s37: 0
  };
  const LANE_SPECS = [
    { id: 't1', roman: 'I',   tracks: 3 },
    { id: 't2', roman: 'II',  tracks: 2 },
    { id: 't3', roman: 'III', tracks: 2 },
    { id: 't4', roman: 'IV',  tracks: 1 },
    { id: 't5', roman: 'V',   tracks: 2 },
    { id: 't6', roman: 'VI',  tracks: 1 },
    { id: 't7', roman: 'VII', tracks: 1 }
  ];

  const lessonToSec = {};
  (D.topics || []).forEach(t => (t.sections || []).forEach(s => (s.lessons || []).forEach(l => { lessonToSec[l.id] = s.id; })));

  // Detect which rank transitions (r -> r+1) carry cross-section or cross-chapter edges
  const rankNeedsWideCorridor = {};
  D.graph.edges.forEach(e => {
    const rFrom = rank[e.from], rTo = rank[e.to];
    if (lessonToSec[e.from] !== lessonToSec[e.to] && rTo === rFrom + 1) {
      rankNeedsWideCorridor[rFrom] = true;
    }
  });

  const marginX = 28, marginY = 24;
  const rulerH = 34;
  const headerW = 216;
  const trackStartX = marginX + headerW + 28;
  const nodeW = 30, nodeH = 24;
  const baseStepX = 48; // 18px gap for normal horizontal links
  const wideExtraX = 24; // +24px extra corridor width where cross-lane branches occur

  const rankX = {};
  let curRankX = trackStartX;
  for (let r = 0; r <= maxRank; r++) {
    rankX[r] = curRankX;
    curRankX += baseStepX + (rankNeedsWideCorridor[r] ? wideExtraX : 0);
  }
  const totalW = curRankX + marginX;

  const trackH = 56, lanePadY = 16;
  let curY = marginY + rulerH;
  const lanes = {};
  window.CLUSTER_BOUNDS = {};
  const pos = {};
  const secFirstPos = {};

  LANE_SPECS.forEach((ls, lIdx) => {
    const laneH = ls.tracks * trackH + lanePadY * 2;
    const tObj = topicMap[ls.id] || { id: ls.id, title: ls.id };
    lanes[ls.id] = {
      id: ls.id,
      roman: ls.roman,
      idx: lIdx,
      rawTitle: tObj.title,
      x: marginX,
      y: curY,
      w: totalW - marginX * 2,
      h: laneH
    };
    window.CLUSTER_BOUNDS[ls.id] = { x: marginX, y: curY, w: totalW - marginX * 2, h: laneH };

    (tObj.sections || []).forEach(s => {
      const trk = SUB_TRACK[s.id] || 0;
      (s.lessons || []).forEach((l, idxInSec) => {
        const r = rank[l.id] || 0;
        const nx = rankX[r];
        const ny = curY + lanePadY + trk * trackH + 18;
        pos[l.id] = {
          x: nx,
          y: ny,
          w: nodeW,
          h: nodeH,
          rank: r,
          track: trk,
          idxInSec,
          secId: s.id,
          topicId: ls.id
        };
        if (idxInSec === 0) {
          secFirstPos[s.id] = { x: nx, y: ny - 6, title: s.title, topicId: ls.id };
        }
      });
    });

    curY += laneH;
  });

  const totalH = curY + marginY;
  window.GRAPH_BOUNDS = { x: 0, y: 0, width: totalW, height: totalH };
  zs = { s: 1, x: 0, y: 0 };

  let svg = buildCommonSvgHeader();

  // Top Topological Rank Ruler
  svg += '<rect x="' + marginX + '" y="' + marginY + '" width="' + (totalW - marginX * 2) + '" height="' + rulerH + '" fill="var(--s2)" stroke="var(--s4)" stroke-width="1"/>';
  svg += '<text class="ruler-txt" x="' + (marginX + 14) + '" y="' + (marginY + 21) + '" font-size="10.5" font-weight="800" fill="var(--s12)" letter-spacing="0.04em">PHÂN TẦNG TIÊN QUYẾT (BẬC 1 &rarr; BẬC ' + (maxRank + 1) + ')</text>';

  for (let r = 0; r <= maxRank; r++) {
    const gx = rankX[r] + nodeW / 2;
    if (r % 3 === 0 || r === maxRank) {
      svg += '<line x1="' + gx + '" y1="' + (marginY + rulerH) + '" x2="' + gx + '" y2="' + (totalH - marginY) + '" stroke="var(--s3)" stroke-width="1" stroke-dasharray="2 4"/>';
      svg += '<text class="ruler-txt" x="' + gx + '" y="' + (marginY + 21) + '" font-size="9.5" font-weight="700" fill="var(--s9)" text-anchor="middle">B' + (r + 1) + '</text>';
    }
  }

  // Render 7 Horizontal Chapter Swimlanes
  LANE_SPECS.forEach(ls => {
    const ln = lanes[ls.id];
    const stroke = (GROUP_COLORS[ls.id] && GROUP_COLORS[ls.id].stroke) || '#0090ff';
    const rawTitle = tr('library_terms.' + ls.id, ln.rawTitle).replace(/^CHƯƠNG\s+[IVX]+\s*[:\-]?\s*/i, '');
    const shortTitle = rawTitle.length > 26 ? rawTitle.substring(0, 24) + '...' : rawTitle;
    const bandFill = (ln.idx % 2 === 0) ? 'var(--s1)' : 'var(--s2)';
    const bandOpacity = (ln.idx % 2 === 0) ? '0.15' : '0.42';

    svg += '<g id="cluster-' + ls.id + '" data-topic="' + ls.id + '" class="cluster-box">';
    svg += '<rect class="cluster-border" x="' + ln.x + '" y="' + ln.y + '" width="' + ln.w + '" height="' + ln.h + '" fill="' + bandFill + '" fill-opacity="' + bandOpacity + '" stroke="var(--s4)" stroke-width="1"/>';
    svg += '<g class="cluster-hdr" onclick="focusTopicCluster(\'' + ls.id + '\', event)">';
    svg += '<rect x="' + ln.x + '" y="' + ln.y + '" width="' + headerW + '" height="' + ln.h + '" fill="var(--s2)" fill-opacity="0.75" stroke="var(--s4)" stroke-width="1"/>';
    svg += '<rect x="' + (ln.x + 12) + '" y="' + (ln.y + 14) + '" width="22" height="18" rx="2" fill="' + stroke + '"/>';
    svg += '<text x="' + (ln.x + 23) + '" y="' + (ln.y + 27) + '" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">' + ln.roman + '</text>';
    svg += '<text x="' + (ln.x + 42) + '" y="' + (ln.y + 27) + '" font-size="10.5" font-weight="800" fill="var(--s12)">' + escapeSvgText(shortTitle.toUpperCase()) + '</text>';
    svg += '</g>';

    Object.keys(secFirstPos).forEach(sId => {
      const sp = secFirstPos[sId];
      if (sp.topicId !== ls.id) return;
      const rawSec = tr('library_terms.' + sId, sp.title);
      const shortSec = rawSec.length > 26 ? rawSec.substring(0, 24) + '...' : rawSec;
      svg += '<g class="sec-hdr"><title>' + escapeSvgText(rawSec) + '</title>';
      svg += '<text x="' + sp.x + '" y="' + sp.y + '" font-size="9.8" font-weight="600" fill="var(--s10)">' + escapeSvgText(shortSec) + '</text></g>';
    });
    svg += '</g>';
  });

  // Render all 92 Left-to-Right Topological Edges using clean rounded orthogonal corridors
  const corridorCount = {};
  D.graph.nodes.forEach(u => {
    reducedAdj[u.id].forEach(v => {
      const from = pos[u.id], to = pos[v];
      if (!from || !to) return;
      const sx = from.x + nodeW, sy = from.y + nodeH / 2;
      const ex = to.x - 3, ey = to.y + nodeH / 2;
      let pathD = '', tierCls = 'e-chain', markerId = 'arr-' + from.topicId, extraStyle = 'stroke: var(--' + from.topicId + '-stroke);';

      if (from.topicId === to.topicId && Math.abs(sy - ey) < 2 && to.rank === from.rank + 1) {
        pathD = 'M' + sx + ' ' + sy + ' L' + ex + ' ' + ey;
        tierCls = 'e-chain';
      } else if (from.topicId === to.topicId && Math.abs(sy - ey) < 2 && to.rank > from.rank + 1) {
        // Same horizontal track, skipping over intermediate rank (l52->l54, l68->l72)
        const archY = sy + 20;
        pathD = roundedOrthoPath([
          [from.x + nodeW / 2, from.y + nodeH],
          [from.x + nodeW / 2, archY],
          [to.x + nodeW / 2, archY],
          [to.x + nodeW / 2, to.y + nodeH + 3]
        ], 6);
        tierCls = 'e-branch';
      } else {
        if (from.topicId !== to.topicId) {
          tierCls = 'e-bridge';
          markerId = 'arr';
          extraStyle = '';
        } else {
          tierCls = 'e-branch';
        }
        const cKey = from.rank + '-' + to.rank;
        const cIdx = (corridorCount[cKey] || 0);
        corridorCount[cKey] = cIdx + 1;
        const midX = sx + Math.max(12, (ex - sx) * 0.45) + (cIdx % 3 - 1) * 5;
        pathD = roundedOrthoPath([
          [sx, sy],
          [midX, sy],
          [midX, ey],
          [ex, ey]
        ], 7);
      }
      svg += '<path id="edge-' + u.id + '-' + v + '" data-from="' + u.id + '" data-to="' + v + '" data-tier="' + tierCls + '" data-marker="' + markerId + '" class="e-line e-default ' + tierCls + '" style="' + extraStyle + '" d="' + pathD + '" marker-end="url(#' + markerId + ')"/>';
    });
  });

  // Render all 78 Swimlane Station Nodes
  D.graph.nodes.forEach(n => {
    const p = pos[n.id];
    if (!p) return;
    const grp = p.topicId || 't1';
    const rawTxt = tr('library_terms.' + n.id, n.label).replace(/^[0-9.]+\s*/, '');
    const secTitle = secMap[p.secId] ? tr('library_terms.' + p.secId, secMap[p.secId].title) : '';
    const border = 'var(--' + grp + '-stroke)';
    const fillBg = 'var(--' + grp + '-fill)';
    const textMain = 'var(--' + grp + '-text)';

    svg += '<g id="node-' + n.id + '" data-id="' + n.id + '" data-topic="' + grp + '" class="n-g" style="color: ' + border + ';" transform="translate(' + p.x + ',' + p.y + ')" onclick="clickNode(event, \'' + n.id + '\')" onmouseenter="hoverNode(\'' + n.id + '\')" onmouseleave="hoverNode(null)">';
    svg += '<title>' + escapeSvgText(n.num + '. ' + rawTxt + ' (Bậc ' + (p.rank + 1) + ')' + (secTitle ? ' · ' + secTitle : '')) + '</title>';
    svg += '<rect class="n-rect" width="' + nodeW + '" height="' + nodeH + '" rx="2" fill="' + fillBg + '" stroke="' + border + '" stroke-width="1.2"/>';
    svg += '<text x="' + (nodeW / 2) + '" y="16" font-size="10.5" font-weight="700" fill="' + textMain + '" text-anchor="middle">' + n.num + '</text>';
    svg += '</g>';
  });

  svg += '</g></svg>';
  return svg;
}

// -------------------------------------------------------------------------
//  PARADIGM 3: "ĐỒNG TÂM" (RADIAL) - Concentric Polar Knowledge Web
//  Spacious orbits + True Circular Arc routing for orbital chains
// -------------------------------------------------------------------------
function polarToCartesian(cx, cy, r, deg) {
  const rad = deg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function describeSvgArc(cx, cy, r, startDeg, endDeg) {
  const start = polarToCartesian(cx, cy, r, startDeg);
  const end = polarToCartesian(cx, cy, r, endDeg);
  const diff = endDeg - startDeg;
  const largeArc = Math.abs(diff) <= 180 ? '0' : '1';
  const sweep = diff >= 0 ? '1' : '0';
  return 'M ' + start.x.toFixed(1) + ' ' + start.y.toFixed(1) + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' ' + sweep + ' ' + end.x.toFixed(1) + ' ' + end.y.toFixed(1);
}

function renderRadialDiagram(secMap, topicMap) {
  const cx = 860, cy = 600;
  const R = [148, 252, 348, 444, 540];
  const nodeBox = 32, nodeR = 15;
  const pos = {};
  window.CLUSTER_BOUNDS = {};

  const lessonToSec = {};
  (D.topics || []).forEach(t => (t.sections || []).forEach(s => (s.lessons || []).forEach(l => { lessonToSec[l.id] = s.id; })));

  // Inner Core: Topic 1 (Chương I: Kiến thức chuẩn bị, 10 lessons on Ring 0)
  const t1Lessons = ['l1','l2','l3','l4','l5','l6','l7','l8','l9','l10'];
  t1Lessons.forEach((id, i) => {
    const deg = -90 + i * (360 / t1Lessons.length);
    const pt = polarToCartesian(cx, cy, R[0], deg);
    pos[id] = {
      x: pt.x - nodeBox / 2,
      y: pt.y - nodeBox / 2,
      cx: pt.x,
      cy: pt.y,
      r: R[0],
      ringIdx: 0,
      deg,
      idxInRing: i,
      secId: lessonToSec[id] || 's1',
      topicId: 't1'
    };
  });
  window.CLUSTER_BOUNDS.t1 = { x: cx - R[0] - 45, y: cy - R[0] - 45, w: (R[0] + 45) * 2, h: (R[0] + 45) * 2 };

  // Section-aligned 4 outer rings per sector (zero backward carriage-return wraps!)
  const SECTORS = [
    { id: 't2', roman: 'II',  a0: -78, a1: -6, rings: [
      ['l11','l12','l13'],
      ['l14','l15','l16','l17','l18','l19'],

    ]},

  ];

  SECTORS.forEach(sec => {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    sec.rings.forEach((arr, rIdx) => {
      const radius = R[1 + rIdx];
      arr.forEach((id, idxInRing) => {
        const frac = arr.length === 1 ? 0.5 : idxInRing / (arr.length - 1);
        const deg = sec.a0 + frac * (sec.a1 - sec.a0);
        const pt = polarToCartesian(cx, cy, radius, deg);
        const bx = pt.x - nodeBox / 2, by = pt.y - nodeBox / 2;
        pos[id] = {
          x: bx,
          y: by,
          cx: pt.x,
          cy: pt.y,
          r: radius,
          ringIdx: 1 + rIdx,
          deg,
          idxInRing,
          secId: lessonToSec[id] || 's4',
          topicId: sec.id
        };
        if (bx < minX) minX = bx;
        if (by < minY) minY = by;
        if (bx + nodeBox > maxX) maxX = bx + nodeBox;
        if (by + nodeBox > maxY) maxY = by + nodeBox;
      });
    });

    const padB = 48;
    window.CLUSTER_BOUNDS[sec.id] = {
      x: minX - padB,
      y: minY - padB,
      w: (maxX - minX) + padB * 2,
      h: (maxY - minY) + padB * 2
    };
  });

  window.GRAPH_BOUNDS = { x: 200, y: 0, width: 1320, height: 1200 };
  zs = { s: 1, x: 0, y: 0 };

  let svg = buildCommonSvgHeader();

  // Concentric Polar Coordinate Rings
  const ringLabels = ['VÀNH I · LÕI CƠ BẢN', 'VÀNH II', 'VÀNH III', 'VÀNH IV', 'VÀNH V · CHUYÊN SÂU'];
  R.forEach((radius, idx) => {
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + radius + '" fill="none" stroke="var(--s3)" stroke-width="' + (idx === 0 ? '1.4' : '1') + '" stroke-dasharray="' + (idx === 0 ? 'none' : '3 5') + '"/>';
    svg += '<text class="ruler-txt" x="' + cx + '" y="' + (cy - radius + 12) + '" font-size="8.5" font-weight="700" fill="var(--s8)" text-anchor="middle" letter-spacing="0.05em">' + ringLabels[idx] + '</text>';
  });

  // Center Hub Medallion (Chương I Trigger)
  const c1Stroke = GROUP_COLORS.t1.stroke;
  svg += '<g id="cluster-t1" data-topic="t1" class="cluster-box">';
  svg += '<g class="cluster-hdr" onclick="focusTopicCluster(\'t1\', event)">';
  svg += '<circle class="cluster-border" cx="' + cx + '" cy="' + cy + '" r="72" fill="var(--s2)" stroke="' + c1Stroke + '" stroke-width="1.5"/>';
  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="65" fill="none" stroke="var(--s4)" stroke-width="1"/>';
  svg += '<text x="' + cx + '" y="' + (cy - 12) + '" font-size="9.5" font-weight="800" fill="' + c1Stroke + '" text-anchor="middle" letter-spacing="0.04em">LÕI CHƯƠNG I</text>';
  svg += '<text x="' + cx + '" y="' + (cy + 4) + '" font-size="10.5" font-weight="800" fill="var(--s12)" text-anchor="middle">KIẾN THỨC CHUẨN BỊ</text>';
  svg += '<text x="' + cx + '" y="' + (cy + 20) + '" font-size="8.5" font-weight="600" fill="var(--s9)" text-anchor="middle">78 ĐỈNH · 92 CUNG</text>';
  svg += '</g></g>';

  // 6 Outer Sector Dividers & Perimeter Arc Headers
  const outerArcR = 588;
  SECTORS.forEach(sec => {
    const stroke = (GROUP_COLORS[sec.id] && GROUP_COLORS[sec.id].stroke) || '#0090ff';
    const tObj = topicMap[sec.id] || { id: sec.id, title: sec.id };
    const rawTitle = tr('library_terms.' + sec.id, tObj.title).replace(/^CHƯƠNG\s+[IVX]+\s*[:\-]?\s*/i, '');
    const fullLabel = 'CHƯƠNG ' + sec.roman + ' · ' + rawTitle.toUpperCase();

    const rayIn = polarToCartesian(cx, cy, 200, sec.a0 - 5);
    const rayOut = polarToCartesian(cx, cy, outerArcR, sec.a0 - 5);
    svg += '<line x1="' + rayIn.x + '" y1="' + rayIn.y + '" x2="' + rayOut.x + '" y2="' + rayOut.y + '" stroke="var(--s4)" stroke-width="1" stroke-dasharray="4 4"/>';

    const arcPath = describeSvgArc(cx, cy, outerArcR, sec.a0, sec.a1);
    const midDeg = (sec.a0 + sec.a1) / 2;
    const lblPt = polarToCartesian(cx, cy, outerArcR + 22, midDeg);
    const anchor = Math.abs(Math.cos(midDeg * Math.PI / 180)) < 0.25 ? 'middle' : (Math.cos(midDeg * Math.PI / 180) > 0 ? 'start' : 'end');

    svg += '<g id="cluster-' + sec.id + '" data-topic="' + sec.id + '" class="cluster-box">';
    svg += '<path class="cluster-border" d="' + arcPath + '" fill="none" stroke="' + stroke + '" stroke-width="3"/>';
    svg += '<g class="cluster-hdr" onclick="focusTopicCluster(\'' + sec.id + '\', event)">';
    svg += '<title>' + escapeSvgText(fullLabel) + '</title>';
    svg += '<text x="' + lblPt.x + '" y="' + lblPt.y + '" font-size="10.5" font-weight="800" fill="' + stroke + '" text-anchor="' + anchor + '" letter-spacing="0.03em">' + escapeSvgText(fullLabel) + '</text>';
    svg += '</g></g>';
  });

  // Render all 92 Polar Edges using Shortest-Angle Orbital Cubic Béziers (never cutting through the center hub!)
  D.graph.nodes.forEach(u => {
    reducedAdj[u.id].forEach(v => {
      const from = pos[u.id], to = pos[v];
      if (!from || !to) return;

      let tierCls = 'e-chain', markerId = 'arr-' + from.topicId, extraStyle = 'stroke: var(--' + from.topicId + '-stroke);';
      if (from.topicId !== to.topicId) {
        tierCls = 'e-bridge';
        markerId = 'arr';
        extraStyle = '';
      } else if (from.secId !== to.secId) {
        tierCls = 'e-branch';
      }

      let pathD = '';
      // Shortest signed angular difference in [-180, +180]
      const deltaDeg = ((to.deg - from.deg + 540) % 360) - 180;
      const dAngFrom = (nodeR + 2) * 180 / (Math.PI * from.r);
      const dAngTo = (nodeR + 4) * 180 / (Math.PI * to.r);

      if (from.r === to.r && from.topicId === to.topicId && Math.abs(to.idxInRing - from.idxInRing) === 1) {
        // Pure circular arc directly along the concentric ring!
        const dir = deltaDeg >= 0 ? 1 : -1;
        pathD = describeSvgArc(cx, cy, from.r, from.deg + dir * dAngFrom, to.deg - dir * dAngTo);
      } else if (Math.abs(deltaDeg) <= 38) {
        // Short radial/diagonal step within the same or adjacent sector
        const dx = to.cx - from.cx, dy = to.cy - from.cy;
        const dist = Math.hypot(dx, dy) || 1;
        const sx = from.cx + (dx / dist) * (nodeR + 1);
        const sy = from.cy + (dy / dist) * (nodeR + 1);
        const ex = to.cx - (dx / dist) * (nodeR + 4);
        const ey = to.cy - (dy / dist) * (nodeR + 4);
        const midR = (from.r + to.r) / 2;
        const ctrlPt = polarToCartesian(cx, cy, midR, from.deg + deltaDeg * 0.5);
        pathD = 'M' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' Q' + ctrlPt.x.toFixed(1) + ' ' + ctrlPt.y.toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1);
      } else {
        // Long cross-sector orbital curve: uses 2 polar control points along the concentric corridor
        // at radius >= 200px so it orbits smoothly AROUND the core and NEVER cuts through the Center Medallion!
        const dir = deltaDeg >= 0 ? 1 : -1;
        const startPt = polarToCartesian(cx, cy, from.r, from.deg + dir * dAngFrom * 0.8);
        const endPt = polarToCartesian(cx, cy, to.r, to.deg - dir * dAngTo * 0.9);
        const orbitR = Math.max(202, (from.r + to.r) * 0.52);
        const c1 = polarToCartesian(cx, cy, orbitR, from.deg + deltaDeg * 0.33);
        const c2 = polarToCartesian(cx, cy, orbitR, from.deg + deltaDeg * 0.67);
        pathD = 'M' + startPt.x.toFixed(1) + ' ' + startPt.y.toFixed(1) +
                ' C' + c1.x.toFixed(1) + ' ' + c1.y.toFixed(1) + ', ' +
                       c2.x.toFixed(1) + ' ' + c2.y.toFixed(1) + ', ' +
                       endPt.x.toFixed(1) + ' ' + endPt.y.toFixed(1);
      }

      svg += '<path id="edge-' + u.id + '-' + v + '" data-from="' + u.id + '" data-to="' + v + '" data-tier="' + tierCls + '" data-marker="' + markerId + '" class="e-line e-default ' + tierCls + '" style="' + extraStyle + '" d="' + pathD + '" marker-end="url(#' + markerId + ')"/>';
    });
  });

  // Render all 78 Circular Graph Vertices (<circle r="15">)
  D.graph.nodes.forEach(n => {
    const p = pos[n.id];
    if (!p) return;
    const grp = p.topicId || 't1';
    const rawTxt = tr('library_terms.' + n.id, n.label).replace(/^[0-9.]+\s*/, '');
    const secTitle = secMap[p.secId] ? tr('library_terms.' + p.secId, secMap[p.secId].title) : '';
    const border = 'var(--' + grp + '-stroke)';
    const fillBg = 'var(--' + grp + '-fill)';
    const textMain = 'var(--' + grp + '-text)';

    svg += '<g id="node-' + n.id + '" data-id="' + n.id + '" data-topic="' + grp + '" class="n-g" style="color: ' + border + ';" transform="translate(' + p.x + ',' + p.y + ')" onclick="clickNode(event, \'' + n.id + '\')" onmouseenter="hoverNode(\'' + n.id + '\')" onmouseleave="hoverNode(null)">';
    svg += '<title>' + escapeSvgText(n.num + '. ' + rawTxt + (secTitle ? ' · ' + secTitle : '')) + '</title>';
    svg += '<circle class="n-rect" cx="16" cy="16" r="' + nodeR + '" fill="' + fillBg + '" stroke="' + border + '" stroke-width="1.4"/>';
    svg += '<text x="16" y="20" font-size="10.5" font-weight="700" fill="' + textMain + '" text-anchor="middle">' + n.num + '</text>';
    svg += '</g>';
  });

  svg += '</g></svg>';
  return svg;
}

function renderDiagram() {
  const secMap = {}, topicMap = {};
  (D.topics || []).forEach(t => {
    topicMap[t.id] = t;
    (t.sections || []).forEach(s => { secMap[s.id] = { ...s, topicId: t.id }; });
  });
  const mode = window.graphViewMode || 'clusters';
  if (mode === 'layered') return renderLayeredDiagram(secMap, topicMap);
  if (mode === 'radial') return renderRadialDiagram(secMap, topicMap);
  return renderClustersDiagram(secMap, topicMap);
}

window.clickNode = function(e, id) {
  e.stopPropagation();
  if (activePath) return;
  if (pinnedNode === id) {
    pinnedNode = null;
  } else {
    pinnedNode = id;
  }
  updateVisualState();
  focusLegend(pinnedNode, false);
};

window.hoverNode = function(id) {
  if (activePath) return;
  hoveredNode = id;
  updateVisualState();
};

function updateVisualState() {
  const c = document.getElementById('d-canvas');
  if (!c) return;
  
  let focusId = null;
  let isPinned = false;
  
  if (activePath) {
    focusId = null;
  } else if (pinnedNode) {
    focusId = pinnedNode;
    isPinned = true;
  } else if (hoveredNode) {
    focusId = hoveredNode;
  }

  updateNodeHud(hoveredNode || pinnedNode);

  let activeNodesSet = new Set();
  let ancestors = new Set(), descendants = new Set();
  let directIn = new Set(), directOut = new Set();

  if (focusId) {
    ancestors = getTree(focusId, false);
    descendants = getTree(focusId, true);
    ancestors.forEach(x => activeNodesSet.add(x));
    descendants.forEach(x => activeNodesSet.add(x));
    (revAdj[focusId] || []).forEach(p => directIn.add(p));
    (reducedAdj[focusId] || []).forEach(ch => directOut.add(ch));
  }

  c.querySelectorAll('g.cluster-box').forEach(cb => {
    const tId = cb.dataset.topic;
    cb.classList.remove('cluster-focused', 'cluster-dimmed');
    if (activeTopicFilter && !activePath && !focusId) {
      if (tId === activeTopicFilter) cb.classList.add('cluster-focused');
      else cb.classList.add('cluster-dimmed');
    }
  });

  // Update all 92 edges with 2-Tier Visual Hierarchy + 2-Color Directional Flow:
  // - Direct 1-hop incoming/outgoing edges of focusId: 2.5px, opacity 1.0 (sharp & immediate)
  // - Multi-hop transitive ancestor/descendant edges: 1.45px, opacity 0.44 (calm background context)
  c.querySelectorAll('path.e-line').forEach(el => {
    const from = el.dataset.from;
    const to = el.dataset.to;
    const defaultMarker = el.dataset.marker || 'arr';
    el.classList.remove('e-highlight', 'e-upstream', 'e-downstream', 'e-upstream-direct', 'e-downstream-direct', 'e-pin', 'e-hidden', 'e-default');
    
    const isOnActivePath = activePath && activePath.includes(from) && activePath.includes(to) && 
                           activePath.indexOf(to) === activePath.indexOf(from) + 1;

    if (activePath) {
      if (isOnActivePath) {
        el.classList.add('e-highlight');
        el.setAttribute('marker-end', 'url(#arrH)');
      } else {
        el.classList.add('e-hidden');
        el.setAttribute('marker-end', 'url(#' + defaultMarker + ')');
      }
    } else if (focusId) {
      const isDirectAnc = (to === focusId && directIn.has(from));
      const isDirectDesc = (from === focusId && directOut.has(to));
      const isAncEdge = ancestors.has(from) && ancestors.has(to) && reducedAdj[from].includes(to);
      const isDescEdge = descendants.has(from) && descendants.has(to) && reducedAdj[from].includes(to);

      if (isDirectAnc) {
        el.classList.add('e-upstream-direct');
        el.setAttribute('marker-end', 'url(#arrUp)');
      } else if (isDirectDesc) {
        el.classList.add('e-downstream-direct');
        el.setAttribute('marker-end', 'url(#arrH)');
      } else if (isAncEdge) {
        el.classList.add('e-upstream');
        el.setAttribute('marker-end', 'url(#arrUp)');
      } else if (isDescEdge) {
        el.classList.add('e-downstream');
        el.setAttribute('marker-end', 'url(#arrH)');
      } else {
        el.classList.add('e-hidden');
        el.setAttribute('marker-end', 'url(#' + defaultMarker + ')');
      }
    } else if (activeTopicFilter) {
      const fGrp = nodeMap[from] && nodeMap[from].group;
      const tGrp = nodeMap[to] && nodeMap[to].group;
      if (fGrp === activeTopicFilter || tGrp === activeTopicFilter) {
        el.classList.add('e-default');
      } else {
        el.classList.add('e-hidden');
      }
      el.setAttribute('marker-end', 'url(#' + defaultMarker + ')');
    } else {
      el.classList.add('e-default');
      el.setAttribute('marker-end', 'url(#' + defaultMarker + ')');
    }
  });

  // Update all 78 nodes
  c.querySelectorAll('g.n-g').forEach(el => {
    const id = el.dataset.id;
    const tId = el.dataset.topic;
    el.classList.remove('n-active', 'n-upstream', 'n-downstream', 'n-upstream-direct', 'n-downstream-direct', 'n-pinned', 'n-dimmed', 'pin-active', 'path-active');

    if (activePath) {
      if (activePath.includes(id)) {
        el.classList.add('n-active', 'path-active');
        if (id === activePath[0] || id === activePath[activePath.length - 1]) {
          el.classList.add('pin-active');
        }
      } else {
        el.classList.add('n-dimmed');
      }
    } else if (focusId) {
      if (id === focusId) {
        el.classList.add('n-active', 'pin-active');
      } else if (directIn.has(id)) {
        el.classList.add('n-active', 'n-upstream-direct');
      } else if (directOut.has(id)) {
        el.classList.add('n-active', 'n-downstream-direct');
      } else if (ancestors.has(id)) {
        el.classList.add('n-upstream');
      } else if (descendants.has(id)) {
        el.classList.add('n-downstream');
      } else {
        el.classList.add('n-dimmed');
      }
    } else if (activeTopicFilter) {
      if (tId !== activeTopicFilter) {
        el.classList.add('n-dimmed');
      }
    }
  });
}

function executePath() {
  if (!activePath || activePath.length === 0) {
    window.App.showToast('Vui lòng tìm lộ trình trước khi thực hiện.', 'warning');
    return;
  }
  function getAuthToken() {
      if (window.AuthGuard && window.AuthGuard.getToken) {
          return window.AuthGuard.getToken();
      }
      return sessionStorage.getItem('user_token') || localStorage.getItem('user_token');
  }

  function getUserId() {
      var token = getAuthToken();
      if (!token) return null;
      if (window.AuthGuard && window.AuthGuard._decodeJWT) {
          var p = window.AuthGuard._decodeJWT(token);
          if (p && p.user_id) return p.user_id;
      }
      try {
          var parts = token.split('.');
          if (parts.length === 3) {
              var payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
              return JSON.parse(atob(payload)).user_id;
          }
      } catch(e) {}
      return null;
  }
  
  const token = getAuthToken();
  const userId = getUserId();
  if (!token && !userId) {
      alert('Lỗi: Không tìm thấy phiên đăng nhập. Vui lòng đăng nhập lại.');
      return;
  }
  const startNode = activePath[0];
  const targetNode = activePath[activePath.length - 1];

  const API = window.App?.API_BASE || 'http://127.0.0.1:5000';
  
  // Show loading state
  const btn = document.getElementById('btn-execute-path');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Đang tạo...';
  btn.disabled = true;

  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;

  fetch(API + '/api/path/create', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
          user_id: userId,
          start_node_id: startNode,
          target_node_id: targetNode,
          path_nodes: activePath
      })
  })
  .then(res => res.json())
  .then(data => {
      if (data.message || data.path_id) {
          const newPathId = data.path_id || (data.path && data.path.path_id);
          if (newPathId) {
              localStorage.setItem('committed_path_id', newPathId);
          }
          navigateTo('learning-path', 'learning-path', tr('learning_path.title', 'Lộ trình học tập'), { path_id: newPathId });
      } else {
          alert('Lỗi tạo lộ trình: ' + (data.error || 'Không thể tạo lộ trình'));
          btn.innerHTML = originalText;
          btn.disabled = false;
      }
  })
  .catch(err => {
      console.error(err);
      // Fallback for local testing if DB is down
      localStorage.setItem('vectoria_active_path', JSON.stringify(activePath));
      navigateTo('learning-path', 'learning-path', tr('learning_path.title', 'Lộ trình học tập'), null);
  });
}

function dijkstra(s, e, avoid = new Set()) {
  if (s === e || avoid.has(s) || avoid.has(e)) return null;
  const dist = {}, prev = {}, q = new Set(D.graph.nodes.map(n => n.id));
  for (let id of q) dist[id] = Infinity;
  dist[s] = getWeight(s);
  while (q.size > 0) {
    let u = null, minD = Infinity;
    for (let id of q) if (dist[id] < minD) { minD = dist[id]; u = id; }
    if (u === null || u === e) break;
    q.delete(u);
    for (let v of (adj[u] || [])) {
      if (avoid.has(v) || !q.has(v)) continue;
      const alt = dist[u] + getWeight(v);
      if (alt < dist[v]) { dist[v] = alt; prev[v] = u; }
    }
  }
  if (dist[e] === Infinity) return null;
  const path = []; let c = e;
  while (c) { path.unshift(c); if (c === s) break; c = prev[c]; }
  return { path, cost: dist[e] };
}

function computeLayersForPf() {
  const layers = {}, inDeg = {};
  D.graph.nodes.forEach(n => { inDeg[n.id] = 0; layers[n.id] = 0; });
  D.graph.edges.forEach(e => inDeg[e.to]++);
  const q = D.graph.nodes.filter(n => inDeg[n.id] === 0).map(n => n.id);
  while(q.length) {
    const u = q.shift();
    (adj[u]||[]).forEach(v => { layers[v] = Math.max(layers[v], layers[u]+1); inDeg[v]--; if(inDeg[v]===0) q.push(v); });
  }
  return layers;
}

function getPathWithConstraints(s, e, avoidIds = [], includeIds = []) {
  const layers = computeLayersForPf();
  const inc = includeIds.filter(id => id !== s && id !== e).sort((a,b) => layers[a] - layers[b]);
  const wp = [s, ...inc, e];
  let fp = [], tc = 0;
  for (let i = 0; i < wp.length - 1; i++) {
    const res = dijkstra(wp[i], wp[i+1], new Set(avoidIds));
    if (!res) return null;
    let seg = res.path, sc = res.cost;
    if (i > 0) { seg.shift(); sc -= getWeight(wp[i]); }
    fp = fp.concat(seg); tc += sc;
  }
  return { path: fp, cost: tc };
}

class CustomCombobox {
  constructor(containerId, options, isMulti = false, placeholder = 'Chọn...') {
    this.container = document.getElementById(containerId);
    this.options = options;
    this.isMulti = isMulti;
    this.placeholder = placeholder;
    this.value = isMulti ? [] : (options[0]?.id || '');
    this.init();
  }

  init() {
    if (!this.container) return;
    this.container.classList.add('cb');
    this.container.innerHTML = `
      <div class="cb-trigger"></div>
      <div class="cb-drop">
        <input type="text" class="cb-search" placeholder="${tr('knowledge.search_content', 'Tìm kiếm nội dung...')}">
        <div class="cb-opts"></div>
      </div>
    `;

    this.trigger = this.container.querySelector('.cb-trigger');
    this.drop = this.container.querySelector('.cb-drop');
    this.searchInput = this.container.querySelector('.cb-search');
    this.optsContainer = this.container.querySelector('.cb-opts');

    this.updateTriggerText();
    this.renderOptions(this.options);

    this.trigger.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll('.cb.open').forEach(c => {
        if (c !== this.container) c.classList.remove('open');
      });
      this.container.classList.toggle('open');
      if (this.container.classList.contains('open')) this.searchInput.focus();
    };

    this.searchInput.oninput = () => {
      const q = this.searchInput.value.toLowerCase();
      const filtered = this.options.filter(o => o.label.toLowerCase().includes(q));
      this.renderOptions(filtered);
    };

    document.addEventListener('click', () => this.container.classList.remove('open'));
    this.container.onclick = (e) => e.stopPropagation();
  }

  updateTriggerText() {
    if (this.isMulti) {
      this.trigger.style.whiteSpace = 'nowrap';
      this.trigger.style.overflow = 'hidden';
      this.trigger.style.padding = '8px 32px 8px 12px';
      if (!this.value || this.value.length === 0) {
        this.trigger.innerHTML = `<span style="color: var(--s9);">${this.placeholder || 'Không có'}</span>`;
      } else {
        const labels = this.value.map(id => {
          const o = this.options.find(opt => opt.id === id);
          return o ? o.label : id;
        });
        const cnt = `<span style="background: var(--primary-base); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; margin-right: 8px; display: inline-flex; align-items: center; flex-shrink: 0;">${this.value.length}</span>`;
        const text = labels.join(', ');
        this.trigger.innerHTML = `<div style="display:flex; align-items: center; width: 100%; max-width: 100%; overflow: hidden; white-space: nowrap;">${cnt}<span style="overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; display: block; max-width: 100%;">${text}</span></div>`;
      }
    } else {
      const opt = this.options.find(o => o.id === this.value);
      this.trigger.innerText = opt ? opt.label : this.placeholder;
    }
  }

  renderOptions(opts) {
    if (this.isMulti) {
      const selected = opts.filter(o => this.value.includes(o.id));
      const unselected = opts.filter(o => !this.value.includes(o.id));
      let html = '';
      if (selected.length > 0) {
        html += `<div style="padding: 6px 12px; font-size: 0.7rem; font-weight: 800; color: var(--s9); background: var(--s2); text-transform: uppercase; letter-spacing: 0.5px;">` + tr('knowledge.selected_items', 'Đã chọn') + ` (${selected.length})</div>`;
        html += selected.map(o => `<div class="cb-opt selected" data-id="${o.id}">${o.label}</div>`).join('');
        html += `<div style="padding: 6px 12px; font-size: 0.7rem; font-weight: 800; color: var(--s9); background: var(--s2); text-transform: uppercase; letter-spacing: 0.5px;">` + tr('knowledge.all_items', 'Tất cả') + `</div>`;
      }
      html += unselected.map(o => `<div class="cb-opt" data-id="${o.id}">${o.label}</div>`).join('');
      this.optsContainer.innerHTML = html;
    } else {
      this.optsContainer.innerHTML = opts.map(o => {
        const isSelected = this.value === o.id;
        return `<div class="cb-opt ${isSelected ? 'selected' : ''}" data-id="${o.id}">${o.label}</div>`;
      }).join('');
    }

    this.optsContainer.querySelectorAll('.cb-opt').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.id;
        if (this.isMulti) {
          const idx = this.value.indexOf(id);
          if (idx > -1) this.value.splice(idx, 1);
          else this.value.push(id);
        } else {
          this.value = id;
          this.container.classList.remove('open');
        }
        this.updateTriggerText();
        this.renderOptions(this.options);
      };
    });
  }
}

<!-- Search Highlight Script -->
<script>
window.highlightAndScroll = function(query, matchIndex) {
    console.log("highlightAndScroll CALLED", {query, matchIndex});
    if (!query) return;
    const body = document.getElementById('dd-lesson-body');
    if (!body) { console.error("highlightAndScroll: body not found"); return; }
    
    const term = query.toLowerCase();
    const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    
    const nodesToReplace = [];
    function traverse(node) {
        if (node.nodeType === 3) { // Text node
            if (node.nodeValue && node.nodeValue.toLowerCase().includes(term)) {
                if (node.parentNode && !['SCRIPT', 'STYLE'].includes(node.parentNode.tagName)) {
                    nodesToReplace.push(node);
                }
            }
        } else if (node.nodeType === 1) { // Element node
            if (!['SCRIPT', 'STYLE', 'MARK'].includes(node.tagName)) {
                for (let i = 0; i < node.childNodes.length; i++) {
                    traverse(node.childNodes[i]);
                }
            }
        }
    }
    
    traverse(body);
    console.log("highlightAndScroll: found text nodes:", nodesToReplace.length);
    
    matchIndex = parseInt(matchIndex);
    if (isNaN(matchIndex)) matchIndex = 0;
    
    let counter = 0;
    let targetMark = null;
    
    nodesToReplace.forEach(n => {
        let text = n.nodeValue;
        if (regex.test(text)) {
            regex.lastIndex = 0; // reset regex state after test()
            const span = document.createElement('span');
            span.innerHTML = text.replace(regex, (match) => {
                if (counter === matchIndex) {
                    counter++;
                    return '<mark class="search-hl-target">' + match + '</mark>';
                }
                counter++;
                return match;
            });
            n.parentNode.replaceChild(span, n);
            const m = span.querySelector('mark.search-hl-target');
            if (m) targetMark = m;
        }
    });
    
    console.log("highlightAndScroll: targetMark found?", !!targetMark);
    
    if (targetMark) {
        console.log("highlightAndScroll: scrolling to target", targetMark);
        setTimeout(() => {
            targetMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
    } else {
        console.warn("highlightAndScroll: no targetMark found");
    }
};

(function initHighlightObserver() {
    // DO NOT RUN OBSERVER. IT IS DEAD.
})();
</script>

mark.search-hl-target {
    background-color: rgba(255, 204, 0, 0.6);
    color: inherit;
    border-radius: 2px;
    animation: flashHl 2s ease-in-out;
}
@keyframes flashHl {
    0%, 100% { background-color: rgba(255, 204, 0, 0.6); box-shadow: 0 0 8px rgba(255, 204, 0, 0.4); }
    50% { background-color: rgba(255, 255, 0, 0.8); box-shadow: none; }
}
