        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const neuralEyeOrbMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      // 6 Góc lục giác đứng chuẩn (Đỉnh trên và đỉnh dưới nằm chính xác trên trục Y: -90° và +90°)
      const hexAngles = [];
      for (let h = 0; h < 6; h++) {
        hexAngles.push(-Math.PI / 2 + (h / 6) * Math.PI * 2);
      }

      // Lục giác trong & Lục giác ngoài cùng chiều quay, nan hoa và 6 quả cầu vệ tinh thẳng hàng tuyệt đối
      const hexInnerPts = [];
      const hexOuterPts = [];
      const spokePts = [];
      for (let h = 0; h <= 6; h++) {
        const a = hexAngles[h % 6];
        const cosA = Math.cos(a);
        const sinA = Math.sin(a);
        hexInnerPts.push(new THREE.Vector3(cosA * R_IN, sinA * R_IN, 0));
        hexOuterPts.push(new THREE.Vector3(cosA * R_OUT, sinA * R_OUT, 0));
        if (h < 6) {
          spokePts.push(
            new THREE.Vector3(cosA * R_IN, sinA * R_IN, 0),
            new THREE.Vector3(cosA * R_OUT, sinA * R_OUT, 0)
          );
          const orbMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.24, 16, 16),
            neuralEyeOrbMat
          );
          orbMesh.position.set(cosA * R_SAT, sinA * R_SAT, 0);
          neuralEye3DGroup.add(orbMesh);
        }
      }
      neuralEye3DGroup.add(
        new THREE.Line(new THREE.BufferGeometry().setFromPoints(hexInnerPts), neuralEyeLineMat),
        new THREE.Line(new THREE.BufferGeometry().setFromPoints(hexOuterPts), neuralEyeLineMat),
        new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(spokePts), neuralEyeLineMat)
      );

      // Các lớp viền lục giác đa tầng (Layered Wireframes) tạo độ sâu 3D thể tích chuẩn như ảnh media_1792656442525_75accc8e.jpg
      for (let layer = 1; layer <= 3; layer++) {
        const layerZ = layer * 0.16;
        const layerScale = 1.0 - layer * 0.032;
        const ptsIn = hexInnerPts.map((p) => new THREE.Vector3(p.x * layerScale, p.y * layerScale, layerZ));
        const ptsInB = hexInnerPts.map((p) => new THREE.Vector3(p.x * layerScale, p.y * layerScale, -layerZ));
        const ptsOut = hexOuterPts.map((p) => new THREE.Vector3(p.x * layerScale, p.y * layerScale, layerZ));
        const ptsOutB = hexOuterPts.map((p) => new THREE.Vector3(p.x * layerScale, p.y * layerScale, -layerZ));
        neuralEye3DGroup.add(
          new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsIn), neuralEyeLineMat),
          new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsInB), neuralEyeLineMat),
          new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsOut), neuralEyeLineMat),
          new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsOutB), neuralEyeLineMat)
        );
      }

      // Vòng cung mí mắt trên, mí mắt dưới & Tròng mắt Sapphire 3D
      const lidUpperPts = [];
      const lidLowerPts = [];
      const irisPts = [];
      for (let k = 0; k <= 50; k++) {
        const u = k / 50;
        const x = (u - 0.5) * 4.4;
        const yCurve = Math.sin(u * Math.PI) * 1.65;
        lidUpperPts.push(new THREE.Vector3(x, yCurve, 0));
        lidLowerPts.push(new THREE.Vector3(x, -yCurve, 0));
        const a = u * Math.PI * 2;
        irisPts.push(new THREE.Vector3(Math.cos(a) * 1.42, Math.sin(a) * 1.42, 0));
      }
      neuralEye3DGroup.add(
        new THREE.Line(new THREE.BufferGeometry().setFromPoints(lidUpperPts), neuralEyeLineMat),
        new THREE.Line(new THREE.BufferGeometry().setFromPoints(lidLowerPts), neuralEyeLineMat),
        new THREE.Line(new THREE.BufferGeometry().setFromPoints(irisPts), neuralEyeLineMat)
      );

      // 2.800 Điểm Nơ-ron Dày Đặc & Sinh Động (Hoàn toàn hữu cơ, không khung lưới cứng)
      const AI_NODE_COUNT = 2800;
      const aiNodeGeo = new THREE.BufferGeometry();
      const aiNodePositions = new Float32Array(AI_NODE_COUNT * 3);
      const aiNodeBase = [];
      for (let i = 0; i < AI_NODE_COUNT; i++) {
        const angle = (i / AI_NODE_COUNT) * Math.PI * 28;
        const radius = 1.8 + (i % 23) * 0.95;
        const bx = Math.cos(angle) * radius;
        const by = Math.sin(angle) * radius * 0.72;
        const bz = ((i % 31) - 15) * 1.15;

        let eyeTargetX = 0;
        let eyeTargetY = 0;
        let eyeTargetZ = (Math.random() - 0.5) * 0.22;

        if (i < 800) {
          // 1. Hạch nơ-ron Tròng mắt & Đồng tử trung tâm
          const layer = i % 16;
          const rIris = (layer / 15) * 1.25;
          const th = (i / 800) * Math.PI * 2 * 14;
          eyeTargetX = Math.cos(th) * rIris;
          eyeTargetY = Math.sin(th) * rIris;
        } else if (i < 1550) {
          // 2. Chuỗi nơ-ron Cung mí mắt trên & dưới
          const idxLid = i - 800;
          const uLid = (idxLid % 375) / 375;
          const sign = idxLid < 375 ? 1 : -1;
          const layerOffset = (Math.floor(idxLid / 375) % 2) * 0.15;
          eyeTargetX = (uLid - 0.5) * 4.6;
          eyeTargetY = sign * (Math.sin(uLid * Math.PI) * (1.65 - layerOffset));
        } else if (i < 2150) {
          // 3. Đường viền nơ-ron Lục giác trong & ngoài
          const idxHex = i - 1550;
          const seg = Math.floor(idxHex / 100) % 6;
          const uSeg = (idxHex % 100) / 100;
          const isOuter = (idxHex % 2 === 0);
          const rHex = isOuter ? R_OUT : R_IN;
          const a0 = hexAngles[seg];
          const a1 = hexAngles[(seg + 1) % 6];
          eyeTargetX = lerp(Math.cos(a0) * rHex, Math.cos(a1) * rHex, uSeg);
          eyeTargetY = lerp(Math.sin(a0) * rHex, Math.sin(a1) * rHex, uSeg);
        } else if (i < 2550) {
          // 4. 6 Cụm hạch nơ-ron Quả cầu vệ tinh (6 Emitter Ganglia)
          const idxSat = i - 2150;
          const satIdx = idxSat % 6;
          const aSat = hexAngles[satIdx];
          const clusterR = 0.15 + (idxSat % 11) * 0.05;
          const clusterA = (idxSat / 400) * Math.PI * 2 * 12;
          eyeTargetX = Math.cos(aSat) * R_SAT + Math.cos(clusterA) * clusterR;
          eyeTargetY = Math.sin(aSat) * R_SAT + Math.sin(clusterA) * clusterR;
        } else {
          // 5. Chuỗi nơ-ron Nan hoa hướng tâm
          const idxSpoke = i - 2550;
          const spokeIdx = idxSpoke % 6;
          const uSpoke = (idxSpoke % 41.6) / 41.6;
          const aSp = hexAngles[spokeIdx];
          const rSp = lerp(R_IN, R_OUT, uSpoke);
          eyeTargetX = Math.cos(aSp) * rSp;
          eyeTargetY = Math.sin(aSp) * rSp;
        }

        aiNodeBase.push({
          bx,
          by,
          bz,
          angle,
          radius,
          speed: 0.65 + (i % 7) * 0.22,
          eyeTargetX,
          eyeTargetY,
          eyeTargetZ,
        });
        aiNodePositions[i * 3] = bx;
        aiNodePositions[i * 3 + 1] = by;
        aiNodePositions[i * 3 + 2] = bz;
      }
      aiNodeGeo.setAttribute("position", new THREE.BufferAttribute(aiNodePositions, 3));
      const aiNodeMat = new THREE.PointsMaterial({
        color: 0x38bdf8,
        size: 0.36,
        map: starSpriteTex,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const aiNodePoints = new THREE.Points(aiNodeGeo, aiNodeMat);
      climaxGroup.add(aiNodePoints);

      const SYNAPSE_COUNT = 600;
      const synapseGeo = new THREE.BufferGeometry();
      const synapsePositions = new Float32Array(SYNAPSE_COUNT * 2 * 3);
      synapseGeo.setAttribute("position", new THREE.BufferAttribute(synapsePositions, 3));
      const synapseMat = new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const synapseLines = new THREE.LineSegments(synapseGeo, synapseMat);
      climaxGroup.add(synapseLines);

      // ============================================================================
      // HỒI IX (y = 0, z = -185): KHÔNG GIAN TOẠ ĐỘ VECTOR VÔ CỰC & THIÊN HÀ THƯƠNG HIỆU
      // ============================================================================
      const finaleSanctuaryGroup = new THREE.Group();
      finaleSanctuaryGroup.position.set(0.0, 0.0, -185.0);
      scene.add(finaleSanctuaryGroup);

      // 1. Mặt phẳng Tọa độ Không gian Vector Vô cực (Infinite Vector Space Grid Floor)
      const GRID_LINES_X = 26;
      const GRID_LINES_Z = 30;
      const vectorGridGeo = new THREE.BufferGeometry();
      const vectorGridPos = [];
      const halfW = 28.0;
      const zNear = 22.0;
      const zFar = -78.0;
      const gridY = -4.5;

      for (let i = 0; i <= GRID_LINES_X; i++) {
        const x = -halfW + (i / GRID_LINES_X) * halfW * 2;
        vectorGridPos.push(x, gridY, zNear, x, gridY, zFar);
      }
      for (let j = 0; j <= GRID_LINES_Z; j++) {
        const z = zNear + (j / GRID_LINES_Z) * (zFar - zNear);
        vectorGridPos.push(-halfW, gridY, z, halfW, gridY, z);
      }
      vectorGridGeo.setAttribute("position", new THREE.Float32BufferAttribute(vectorGridPos, 3));
      const vectorGridMat = new THREE.LineBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const vectorGridMesh = new THREE.LineSegments(vectorGridGeo, vectorGridMat);
      finaleSanctuaryGroup.add(vectorGridMesh);

      // 2. Vòm Hào quang Trục Tọa độ & Vành đai Thiên văn (Celestial Astrolabe Coordinate Halo)
      const astrolabeGroup = new THREE.Group();
      astrolabeGroup.position.set(0.0, -0.21, -4.0);
      finaleSanctuaryGroup.add(astrolabeGroup);

      const astrolabeMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      // 3 Vành tròn đồng tâm tọa độ thiên văn
      [4.8, 7.6, 11.2].forEach((r) => {
        const ring = new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(
            new THREE.Path().absarc(0, 0, r, 0, Math.PI * 2, false).getPoints(96)
          ),
          astrolabeMat
        );
        astrolabeGroup.add(ring);
      });

      // 4 Trục tọa độ trực giao (e1, e2) với vạch chia đơn vị
      const axisPts = [
        new THREE.Vector3(-12.5, 0, 0), new THREE.Vector3(12.5, 0, 0),
        new THREE.Vector3(0, -12.5, 0), new THREE.Vector3(0, 12.5, 0)
      ];
      for (let t = -11; t <= 11; t += 2) {
        if (t === 0) continue;
        axisPts.push(new THREE.Vector3(t, -0.22, 0), new THREE.Vector3(t, 0.22, 0));
        axisPts.push(new THREE.Vector3(-0.22, t, 0), new THREE.Vector3(0.22, t, 0));
      }
      const astrolabeAxes = new THREE.LineSegments(
        new THREE.BufferGeometry().setFromPoints(axisPts),
        astrolabeMat
      );
      astrolabeGroup.add(astrolabeAxes);

      // 3. 850 Hạt sao tinh khôi lấp lánh trong chiều sâu vũ trụ (Multi-depth Celestial Galaxy)
      const FINALE_STAR_COUNT = 850;
      const finaleNebulaGeo = new THREE.BufferGeometry();
      const finaleNebulaPos = new Float32Array(FINALE_STAR_COUNT * 3);
      for (let n = 0; n < FINALE_STAR_COUNT; n++) {
        const na = (n / FINALE_STAR_COUNT) * Math.PI * 2 * 29;
        const nr = 2.0 + (n % 27) * 0.62;
        finaleNebulaPos[n * 3] = Math.cos(na) * nr * 1.65;
        finaleNebulaPos[n * 3 + 1] = Math.sin(na) * nr * 0.98;
        finaleNebulaPos[n * 3 + 2] = -2.0 - (n % 23) * 1.15;
      }
      finaleNebulaGeo.setAttribute("position", new THREE.BufferAttribute(finaleNebulaPos, 3));
      const finaleNebulaBackdropMat = new THREE.PointsMaterial({
        color: 0xbae6fd,
        size: 0.18,
        map: starSpriteTex,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const finaleNebulaPoints = new THREE.Points(finaleNebulaGeo, finaleNebulaBackdropMat);
      finaleSanctuaryGroup.add(finaleNebulaPoints);

      // Hạt bụi không gian lơ lửng xuyên suốt hành trình
      const DUST_COUNT = 420;
      const dustGeo = new THREE.BufferGeometry();
      const dustPos = new Float32Array(DUST_COUNT * 3);
      for (let i = 0; i < DUST_COUNT; i++) {
        dustPos[i * 3] = (Math.random() - 0.5) * 44;
        dustPos[i * 3 + 1] = (Math.random() - 0.5) * 32;
        dustPos[i * 3 + 2] = 10 - Math.random() * 205;
      }
      dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
      const dustMat = new THREE.PointsMaterial({
        color: 0x38bdf8,
        size: 0.12,
        map: starSpriteTex,
        transparent: true,
        opacity: 0.28,
        depthWrite: false,
      });
      const dustSystem = new THREE.Points(dustGeo, dustMat);
      scene.add(dustSystem);

      // ============================================================================
      // HỆ THỐNG CUỘN KÉP DÀN TRẢI (NATIVE SCROLL + WHEEL/TOUCH/KEYBOARD FALLBACK)
      // ============================================================================
      const runwayEl = document.getElementById("scrollyRunway");
      let targetProgress = 0;
      let currentProgress = 0;
      let isJumpingViaNode = false;
      const pointer = { x: 0, y: 0, targetX: 0, targetY: 0 };

      function getMaxScroll() {
        if (!runwayEl) return window.innerHeight * 60;
        return Math.max(1, runwayEl.offsetHeight - window.innerHeight);
      }

      function syncFromWindowScroll() {
        const scrollTop =
          window.scrollY ||
          document.documentElement.scrollTop ||
          document.body.scrollTop ||
          0;
        const runwayMax = getMaxScroll();
        targetProgress = clamp01(scrollTop / runwayMax);
      }

      window.addEventListener("scroll", syncFromWindowScroll, { passive: true });

      window.addEventListener(
        "wheel",
        (e) => {
          isJumpingViaNode = false;
          const maxScroll = getMaxScroll();
          const scroller = document.scrollingElement || document.documentElement;
          const beforeY = scroller.scrollTop || window.scrollY || 0;
          const deltaY = e.deltaY;

          requestAnimationFrame(() => {
            const afterY = scroller.scrollTop || window.scrollY || 0;
            if (Math.abs(afterY - beforeY) < 0.5) {
              targetProgress = clamp01(targetProgress + deltaY / (maxScroll * 1.15));
              window.scrollTo({ top: targetProgress * maxScroll, behavior: "instant" });
            }
          });
        },
        { passive: true }
      );

      let touchLastY = null;
      window.addEventListener(
        "touchstart",
        (e) => {
          isJumpingViaNode = false;
          if (e.touches && e.touches.length > 0) {
            touchLastY = e.touches[0].clientY;
          }
        },
        { passive: true }
      );
      window.addEventListener(
        "touchmove",
        (e) => {
          if (!e.touches || e.touches.length === 0 || touchLastY === null) return;
          const dy = touchLastY - e.touches[0].clientY;
          touchLastY = e.touches[0].clientY;
          const maxScroll = getMaxScroll();
          targetProgress = clamp01(targetProgress + (dy * 1.4) / maxScroll);
          window.scrollTo({ top: targetProgress * maxScroll, behavior: "instant" });
        },
        { passive: true }
      );

      window.addEventListener("keydown", (e) => {
        const maxScroll = getMaxScroll();
        if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
          isJumpingViaNode = false;
          targetProgress = clamp01(targetProgress + 0.018);
          window.scrollTo({ top: targetProgress * maxScroll, behavior: "smooth" });
        } else if (e.key === "ArrowUp" || e.key === "PageUp") {
          isJumpingViaNode = false;
          targetProgress = clamp01(targetProgress - 0.018);
          window.scrollTo({ top: targetProgress * maxScroll, behavior: "smooth" });
        }
      });

      window.addEventListener(
        "mousemove",
        (e) => {
          pointer.targetX = (e.clientX / window.innerWidth) * 2 - 1;
          pointer.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        },
        { passive: true }
      );

      const scrubberNodes = Array.from(document.querySelectorAll(".scrubber-node"));
      scrubberNodes.forEach((node) => {
        node.addEventListener("click", () => {
          const ratio = parseFloat(node.getAttribute("data-ratio") || "0");
          isJumpingViaNode = true;
          targetProgress = clamp01(ratio);
          window.scrollTo({
            top: targetProgress * getMaxScroll(),
            behavior: "smooth",
          });
        });
      });

      // DOM Elements
      const letterboxTop = document.getElementById("letterboxTop");
      const letterboxBottom = document.getElementById("letterboxBottom");
      const scrubberPercent = document.getElementById("scrubberPercent");
      const scrubberBar = document.getElementById("scrubberBar");

      const brandFinaleStage = document.getElementById("brandFinaleStage");
      const brandEmblemCrest = document.getElementById("brandEmblemCrest");
      const brandWordmark = document.getElementById("brandWordmark");
      const emblemLaserFlare = document.getElementById("emblemLaserFlare");
      const emblemOuterGroup = document.getElementById("emblemOuterGroup");
      const emblemInnerGroup = document.getElementById("emblemInnerGroup");
      const emblemEyelidsGroup = document.getElementById("emblemEyelidsGroup");
      const emblemIrisGroup = document.getElementById("emblemIrisGroup");

      // ============================================================================
      // PRE-COMPILE TOÀN BỘ SHADER & BUFFER TRƯỚC FRAME 1 (CHỐNG KHỰNG GPU 100%)
      // ============================================================================
      renderer.compile(scene, camera);

      // ============================================================================
      // VÒNG LẶP DIỄN HOẠT ĐIỆN ẢNH 9 HỒI (60FPS — SPLINE LIÊN TỤC $C^1$ & ĐA BẦU KHÍ QUYỂN)
      // ============================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        const diffP = targetProgress - currentProgress;
        if (Math.abs(diffP) > 0.000015) {
          // Nội suy vận tốc mượt mà, không dừng khựng ở ranh giới các phân cảnh
          const maxStep = isJumpingViaNode ? 0.0052 : 0.00165;
          const step = THREE.MathUtils.clamp(diffP * 0.045, -maxStep, maxStep);
          currentProgress += step;
        } else {
          isJumpingViaNode = false;
        }
        const p = currentProgress;

        // 0. Điều phối ánh sáng & Bầu khí quyển động theo từng Hồi (Multi-Act Color Grading)
        applyAtmosphere(p);

        // 1. Cập nhật Timeline La Mã 9 Hồi (I -> IX)
        const pctInt = Math.round(p * 100);
        if (scrubberPercent) {
          scrubberPercent.textContent = pctInt < 10 ? `0${pctInt}%` : `${pctInt}%`;
        }
        if (scrubberBar) {
          scrubberBar.style.height = `${p * 100}%`;
        }
        const activeActIdx =
          p < 0.11
            ? 0
            : p < 0.22
              ? 1
              : p < 0.33
                ? 2
                : p < 0.44
                  ? 3
                  : p < 0.55
                    ? 4
                    : p < 0.66
                      ? 5
                      : p < 0.77
                        ? 6
                        : p < 0.88
                          ? 7
                          : 8;
        scrubberNodes.forEach((node, idx) => {
          node.classList.toggle("active", idx === activeActIdx);
        });

        // 2. Thanh Cinema Letterbox ở cao trào Hồi VIII
        const letterboxFactor = Math.sin(smoothstep(0.75, 0.92, p) * Math.PI);
        const letterboxHeightPx = Math.round(letterboxFactor * 44);
        if (letterboxTop && letterboxBottom) {
          letterboxTop.style.height = `${letterboxHeightPx}px`;
          letterboxBottom.style.height = `${letterboxHeightPx}px`;
        }

        // 3. Nội suy Chuột & Góc Máy POV / Điện Ảnh (Catmull-Rom Cubic Spline $C^1$)
        pointer.x += (pointer.targetX - pointer.x) * 0.055;
        pointer.y += (pointer.targetY - pointer.y) * 0.055;
        const px = pointer.x;
        const py = pointer.y;

        const camState = sampleCamera(p);
        const walkFactor = smoothstep(0.0, 0.008, p) * (1.0 - smoothstep(0.04, 0.06, p));
        const stepBobY = Math.abs(Math.sin(p * 230)) * 0.075 * walkFactor;
        const stepSwayX = Math.sin(p * 115) * 0.045 * walkFactor;

        // Triệt tiêu hoàn toàn góc nhìn chuyển động qua lại khi bước vào Hồi VIII & IX (p >= 0.84),
        // giữ trục camera cố định tuyệt đối vào hồng tâm tâm điểm, chống lệch tâm với logo cuối dù chuột ở bất cứ đâu
        const camParallaxAmp = 1.0 - smoothstep(0.81, 0.845, p);

        const breathX = Math.sin(elapsed * 1.1) * 0.05 * camParallaxAmp;
        const breathY = Math.cos(elapsed * 1.4) * 0.035 * camParallaxAmp;

        camera.position.set(
          camState.pos[0] + (stepSwayX + breathX + px * 0.32) * camParallaxAmp,
          camState.pos[1] + (stepBobY + breathY + py * 0.22) * camParallaxAmp,
          camState.pos[2]
        );
        camera.up.set(Math.sin(camState.roll), Math.cos(camState.roll), 0);
        camera.lookAt(
          camState.look[0] + px * 0.22 * camParallaxAmp,
          camState.look[1] + py * 0.16 * camParallaxAmp,
          camState.look[2]
        );

        if (Math.abs(camera.fov - camState.fov) > 0.04) {
          camera.fov = camState.fov;
          camera.updateProjectionMatrix();
        }

        // ========================================================================
        // HỒI I & II (0.00 -> 0.22): CĂN PHÒNG ĐÊM KHUYA, ĐÈN BÀN CHUẨN XÁC & THE EVIL WITHIN 2 SHIFT
        // ========================================================================
        const roomVisible = p < 0.26;
        studyRoomGroup.visible = roomVisible;
        if (roomVisible) {
          const sitPullT = smootherstep(0.015, 0.055, p);
          const fractureT = smootherstep(0.115, 0.22, p);

          chairGroup.position.z = 2.05 + sitPullT * 0.75 + fractureT * 12.0;
          chairGroup.position.y = -fractureT * 5.5;
          chairGroup.rotation.y = sitPullT * 0.18 - fractureT * 1.4;
          chairGroup.rotation.x = fractureT * 0.9;

          // Đèn bàn ấm áp ở Hồi I -> chớp giật & chuyển xanh Sapphire ở đầu Hồi II (p: 0.108 -> 0.15)
          const flickerZone = smoothstep(0.105, 0.118, p) * (1.0 - smoothstep(0.148, 0.17, p));
          const flickerWave =
            flickerZone > 0.01
              ? Math.sin(elapsed * 55.0) * Math.cos(elapsed * 37.0) > -0.15
                ? 1.35
                : 0.08
              : 1.0;
          const lampFade = 1.0 - smootherstep(0.15, 0.21, p);
          const isBlueShift = p > 0.122;

          deskSpotLight.intensity = 24.0 * flickerWave * lampFade;
          deskSpotLight.color.setHex(isBlueShift ? 0x38bdf8 : 0xffc275);
          notebookBounceLight.intensity = 2.5 * flickerWave * lampFade;
          notebookBounceLight.color.setHex(isBlueShift ? 0x38bdf8 : 0xffcf87);
          lampBulbMat.color.setHex(isBlueShift ? 0x7dd3fc : 0xfff3d1);
          lampInnerReflectorMat.color.setHex(isBlueShift ? 0x38bdf8 : 0xffd584);
          lampPoolMat.opacity = 0.88 * flickerWave * lampFade;
          lampPoolMesh.visible = lampPoolMat.opacity > 0.01;

          // Rạn nứt & kéo giật toàn bộ mảng tường, sàn nhà, mặt bàn về bóng tối (-Z)
          const roomAlpha = 1.0 - smootherstep(0.17, 0.24, p);
          darkWoodMat.opacity = roomAlpha;
          roomWallMat.opacity = roomAlpha;

          const cadEdgeAlpha = Math.sin(smoothstep(0.112, 0.23, p) * Math.PI) * 0.88;
          cadWireMat.opacity = cadEdgeAlpha;
          const showCadEdges = cadEdgeAlpha > 0.01;
          for (let i = 0; i < roomCadWireSegments.length; i++) {
            roomCadWireSegments[i].visible = showCadEdges;
          }

          for (let i = 0; i < roomFragments.length; i++) {
            const frag = roomFragments[i];
            const localF = smootherstep(0.112 + (i % 6) * 0.006, 0.22 + (i % 5) * 0.008, p);
            frag.mesh.position.set(
              frag.basePos.x + frag.pullDir.x * localF,
              frag.basePos.y + frag.pullDir.y * localF,
              frag.basePos.z + frag.pullDir.z * localF
            );
            frag.mesh.rotation.set(
              frag.baseRot.x + frag.rotVel.x * localF,
              frag.baseRot.y + frag.rotVel.y * localF,
              frag.baseRot.z + frag.rotVel.z * localF
            );
          }

          // Đồ vật trên bàn (Bút chì, Cốc cà phê, Sách) chỉ bật khung xương toán học khi sang Hồi II (p > 0.114)
          const propDeconstructT = smootherstep(0.115, 0.185, p);
          const propFlyAwayT = smootherstep(0.185, 0.245, p);
          propSkinMat.opacity = Math.max(0.08, 1.0 - propDeconstructT * 0.88) * (1.0 - propFlyAwayT);

          const mathAlpha = smoothstep(0.115, 0.145, p) * (1.0 - propFlyAwayT);
          propMathLineMat.opacity = mathAlpha;
          propHyperplaneMat.opacity = mathAlpha * 0.28;
          const showDeskMath = mathAlpha > 0.01;
          for (let i = 0; i < deskMathReveals.length; i++) {
            deskMathReveals[i].visible = showDeskMath;
          }

          // Cây bút chì & Cốc nước bóc tách: nâng lên và xoay nghiêng nhẹ nhàng theo tiến trình cuộn, KHÔNG xoay tít theo thời gian
          pencilUnit.position.y = 0.075 + propDeconstructT * 1.15 + propFlyAwayT * 6.0;
          pencilUnit.rotation.z = propDeconstructT * 0.45;
          pencilUnit.rotation.y = 0.42 + propDeconstructT * 0.52 + Math.sin(elapsed * 0.5) * 0.03 * (1.0 - propFlyAwayT);

          mugUnit.position.y = 0.24 + propDeconstructT * 1.45 + propFlyAwayT * 6.5;
          mugUnit.rotation.x = propDeconstructT * 0.42;
          mugUnit.rotation.y = propDeconstructT * 0.58 + Math.cos(elapsed * 0.5) * 0.03 * (1.0 - propFlyAwayT);

          booksUnit.position.y = 0.12 + propDeconstructT * 1.25 + propFlyAwayT * 5.8;
          booksUnit.rotation.y = propDeconstructT * 0.45;

          notebookMat.opacity = 1.0 - smootherstep(0.175, 0.235, p);
        } else {
          deskSpotLight.intensity = 0;
          notebookBounceLight.intensity = 0;
        }

        // Các tia sáng từ trang vở chỉ trồi lên đồng thời khi góc máy bắt đầu cất cánh lia lên Trái Đất (p: 0.162 -> 0.224)
        const inkGrowT = smootherstep(0.162, 0.224, p);
        const inkFadeOut = 1.0 - smootherstep(0.245, 0.32, p);
        inkThreadMat.opacity = smoothstep(0.160, 0.185, p) * inkFadeOut * 0.95;
        inkThreadsGroup.visible = inkThreadMat.opacity > 0.01;
        if (inkThreadsGroup.visible) {
          for (let i = 0; i < inkThreads.length; i++) {
            const th = inkThreads[i];
            const count = Math.max(2, Math.floor(inkGrowT * th.totalVerts));
            th.geo.setDrawRange(0, count);
          }
          inkThreadsGroup.rotation.y = elapsed * 0.03;
        }

        // Lưới tọa độ 3D mở rộng từ trang vở
        const gridExpandT = smootherstep(0.118, 0.23, p);
        const gridFade = smoothstep(0.115, 0.145, p) * (1.0 - smootherstep(0.27, 0.35, p));
        gridLineMat.opacity = gridFade * 0.45;
        expandingGridGroup.visible = gridLineMat.opacity > 0.01;
        if (expandingGridGroup.visible) {
          const s = lerp(0.08, 1.35, gridExpandT);
          expandingGridGroup.scale.set(s, s, s);
        }

        // ========================================================================
        // HỒI III (0.22 -> 0.33): MÀN ĐÊM ĐẦY SAO, CHÒM SAO VECTOR & VỆ TINH VÀNG RÒNG ĐỊNH VỊ TRÁI ĐẤT
        // ========================================================================
        const terrestrialDip =
          1.0 - smoothstep(0.32, 0.37, p) * (1.0 - smoothstep(0.76, 0.83, p)) * 0.78;
        const starReveal = smoothstep(0.14, 0.23, p) * terrestrialDip;
        starFieldMat.opacity = starReveal * 0.92;
        nebulaMat.opacity = starReveal * 0.38;
        starFieldPoints.rotation.y = elapsed * 0.012;

        const act3Alpha =
          smoothstep(0.19, 0.24, p) * (1.0 - smootherstep(0.31, 0.36, p));
        earthSatGroup.visible = act3Alpha > 0.01;
        constellationMat.opacity = act3Alpha * 0.56;

        if (earthSatGroup.visible) {
          earthCoreMat.opacity = act3Alpha * 0.95;
          earthWireMat.opacity = act3Alpha * 0.76;
          gpsTargetTriad.material.opacity = act3Alpha;
          satLaserMat.opacity = act3Alpha * 0.92;
          satGoldFoilMat.opacity = act3Alpha * 0.98;
          satSolarPanelMat.opacity = act3Alpha * 0.96;
          satSolarGridMat.opacity = act3Alpha * 0.86;
          satBeaconMat.opacity =
            act3Alpha * (0.55 + Math.abs(Math.sin(elapsed * 7.5)) * 0.45);

          earthSphere.rotation.y = elapsed * 0.14;
          const targetWorld = gpsTargetPos.clone();

          const lArr = satLaserGeo.attributes.position.array;
          for (let s = 0; s < 4; s++) {
            const sat = satellites[s];
            const ang = elapsed * sat.speed + sat.phase + p * 6.0;
            const sx = Math.cos(ang) * sat.radius;
            const sy = Math.sin(ang) * Math.sin(sat.inclination) * sat.radius;
            const sz = Math.sin(ang) * Math.cos(sat.inclination) * sat.radius;
            sat.group.position.set(sx, sy, sz);
            sat.group.lookAt(0, 0, 0);

            const b6 = s * 6;
            lArr[b6] = sx;
            lArr[b6 + 1] = sy;
            lArr[b6 + 2] = sz;
            lArr[b6 + 3] = targetWorld.x;
            lArr[b6 + 4] = targetWorld.y;
            lArr[b6 + 5] = targetWorld.z;
          }
          satLaserGeo.attributes.position.needsUpdate = true;
        }

        // ========================================================================
        // HỒI IV (0.33 -> 0.44): KIẾN TRÚC ĐÔ THỊ RỰC SÁNG, CẦU DÂY VĂNG BÊ TÔNG & ĐỒ THỊ GIAO THÔNG
        // ========================================================================
        const act4Alpha =
          smoothstep(0.30, 0.35, p) * (1.0 - smootherstep(0.42, 0.47, p));
        realWorldGroup.visible = act4Alpha > 0.01;
        if (realWorldGroup.visible) {
          const deTexT = smootherstep(0.345, 0.415, p);
          citySolidMat.opacity = act4Alpha * lerp(0.94, 0.28, deTexT);
          bridgeConcreteMat.opacity = act4Alpha * lerp(0.96, 0.38, deTexT);
          bridgeAsphaltMat.opacity = act4Alpha * lerp(0.96, 0.45, deTexT);
          cityWireMat.opacity = act4Alpha * lerp(0.35, 0.98, deTexT);
          citySubWireMat.opacity = act4Alpha * lerp(0.28, 0.82, deTexT);
          bridgeTensionMat.opacity = act4Alpha * lerp(0.42, 0.96, deTexT);
          cityGroundGridMat.opacity = act4Alpha * 0.45;
          trafficMat.opacity = act4Alpha * 0.95;

          scannerRingMesh.position.z = lerp(10.0, -12.0, smootherstep(0.335, 0.415, p));
          scannerRingMat.opacity = Math.sin(smoothstep(0.335, 0.415, p) * Math.PI) * 0.72;

          // Diễn hoạt hạt luồng giao thông chạy dọc mặt cầu và các trục đường đô thị
          const tArr = trafficGeo.attributes.position.array;
          for (let i = 0; i < TRAFFIC_COUNT; i++) {
            const lane = i % 3;
            const u = ((elapsed * 0.22 + i / TRAFFIC_COUNT) % 1.0) * 2.0 - 1.0;
            if (lane === 0) {
              tArr[i * 3] = u * 11.8;
              tArr[i * 3 + 1] = 2.02;
              tArr[i * 3 + 2] = 1.8 + ((i % 2) - 0.5) * 0.9;
            } else if (lane === 1) {
              tArr[i * 3] = -u * 12.5;
              tArr[i * 3 + 1] = 0.15;
              tArr[i * 3 + 2] = -2.1;
            } else {
              tArr[i * 3] = ((i % 2) - 0.5) * 6.2;
              tArr[i * 3 + 1] = 0.15;
              tArr[i * 3 + 2] = u * 8.5;
            }
          }
          trafficGeo.attributes.position.needsUpdate = true;
        }

        // ========================================================================
        // HỒI V (0.44 -> 0.55): PHI CƠ HỢP KIM ĐỜI THỰC, BUỒNG HẦM GIÓ & GIMBAL MA TRẬN QUAY
        // ========================================================================
        const act5Alpha =
          smoothstep(0.41, 0.46, p) * (1.0 - smootherstep(0.53, 0.58, p));
        aerospaceGroup.visible = act5Alpha > 0.01;
        if (aerospaceGroup.visible) {
          const aeroScan = smootherstep(0.45, 0.52, p);
          aeroSolidMat.opacity = act5Alpha * lerp(0.88, 0.28, aeroScan);
          aeroCanopyMat.opacity = act5Alpha * lerp(0.94, 0.45, aeroScan);
          aeroWireMat.opacity = act5Alpha * 0.96;
          aeroSubWireMat.opacity = act5Alpha * 0.78;
          windTunnelRingMat.opacity = act5Alpha * 0.38;
          windStreamMat.opacity = act5Alpha * 0.76;
          machConeMat.opacity = act5Alpha * (0.28 + Math.sin(elapsed * 4.0) * 0.08);
          afterburnerMat.opacity = act5Alpha * (0.78 + Math.sin(elapsed * 18.0) * 0.18);
          afterburnerMesh.scale.y = 1.0 + Math.sin(elapsed * 22.0) * 0.15;

          aircraftMeshGroup.rotation.z = Math.sin(elapsed * 1.15 + p * 16.0) * 0.44;
          aircraftMeshGroup.rotation.x = Math.cos(elapsed * 0.85 + p * 12.0) * 0.24;
          aircraftMeshGroup.rotation.y = Math.sin(elapsed * 0.6) * 0.18;

          aircraftGimbals[0].rotation.x = elapsed * 0.85 + p * 12.0;
          aircraftGimbals[1].rotation.y = -elapsed * 0.95 - p * 14.0;
          aircraftGimbals[2].rotation.z = elapsed * 0.65 + p * 10.0;

          // Sóng dòng chảy khí động học lướt qua cánh phi cơ
          for (let s = 0; s < windStreams.length; s++) {
            const ws = windStreams[s];
            const posArr = ws.geo.attributes.position.array;
            for (let k = 0; k <= 28; k++) {
              const base = ws.basePts[k];
              const flutter = Math.sin(elapsed * 6.5 - k * 0.45 + ws.seed) * 0.075;
              posArr[k * 3] = base.x;
              posArr[k * 3 + 1] = base.y + flutter;
              posArr[k * 3 + 2] = base.z;
            }
            ws.geo.attributes.position.needsUpdate = true;
          }
        }

        // ========================================================================
        // HỒI VI (0.55 -> 0.66): ĐÀN CẦM GỖ MUN THÍNH PHÒNG, SÓNG DỪNG & PHỔ TẦN SỐ FOURIER
        // ========================================================================
        const act6Alpha =
          smoothstep(0.52, 0.57, p) * (1.0 - smootherstep(0.64, 0.69, p));
        acousticsGroup.visible = act6Alpha > 0.01;
        if (acousticsGroup.visible) {
          harpWoodMat.opacity = act6Alpha * 0.95;
          harpBrassMat.opacity = act6Alpha * 0.96;
          stringLineMat.opacity = act6Alpha * 0.96;
          fourierWaveMat.opacity = act6Alpha * 0.86;
          acousticShellMat.opacity = act6Alpha * 0.36;
          eqBarMat.opacity = act6Alpha * 0.85;

          // 7 Dây đàn rung theo mode riêng (Standing-Wave Eigenmodes: sin(n * pi * u) * cos(w_n * t))
          for (let st = 0; st < harmonicStrings.length; st++) {
            const hs = harmonicStrings[st];
            const arr = hs.arr;
            const amp = 0.28 * Math.sin(elapsed * (3.2 + hs.modeN * 1.4));
            for (let k = 0; k <= STRING_SEGS; k++) {
              const u = k / STRING_SEGS;
              const x = (u - 0.5) * 8.6;
              const dy = Math.sin(u * Math.PI * hs.modeN) * amp;
              arr[k * 3] = x;
              arr[k * 3 + 1] = hs.yPos + dy;
              arr[k * 3 + 2] = 0;
            }
            hs.geo.attributes.position.needsUpdate = true;
          }

          // 64 Cột phổ tần số âm thanh nhảy theo hòa âm
          for (let b = 0; b < eqBars.length; b++) {
            const eb = eqBars[b];
            const h =
              0.38 +
              Math.abs(Math.sin(elapsed * 3.8 + eb.idx * 0.22)) * 2.25 +
              Math.abs(Math.cos(elapsed * 2.1 - eb.idx * 0.35)) * 1.15;
            eb.mesh.scale.y = h;
            eb.mesh.position.y = -2.4 + h * 0.5;
          }

          // 5 Sóng hình sin trực giao tách lớp trong không gian 3D
          for (let w = 0; w < fourierWaves.length; w++) {
            const fw = fourierWaves[w];
            const arr = fw.arr;
            for (let k = 0; k <= WAVE_SEGS; k++) {
              const u = k / WAVE_SEGS;
              const x = (u - 0.5) * 11.5;
              const y =
                fw.yOff +
                Math.sin(u * Math.PI * 2 * fw.freq - elapsed * (2.5 + fw.freq * 0.8)) *
                  (0.58 / Math.sqrt(fw.freq));
              arr[k * 3] = x;
              arr[k * 3 + 1] = y;
              arr[k * 3 + 2] = fw.zOff;
            }
            fw.geo.attributes.position.needsUpdate = true;
          }
        }

        // ========================================================================
        // HỒI VII (0.66 -> 0.77): CỖ MÁY CHỤP CT/MRI BỆNH VIỆN ĐỜI THỰC & CHUỖI XOẮN KÉP DNA
        // ========================================================================
        const act7Alpha =
          smoothstep(0.63, 0.68, p) * (1.0 - smootherstep(0.75, 0.80, p));
        medicalBioGroup.visible = act7Alpha > 0.01;
        if (medicalBioGroup.visible) {
          const mriDeconstruct = smootherstep(0.69, 0.75, p);
          mriHousingWhiteMat.opacity = act7Alpha * lerp(0.95, 0.42, mriDeconstruct);
          mriAccentTealMat.opacity = act7Alpha * 0.96;
          mriCouchPadMat.opacity = act7Alpha * 0.94;
          ctRingMat.opacity = act7Alpha * 0.95;
          ctSliceMat.opacity = act7Alpha * 0.86;
          ctRayMat.opacity = act7Alpha * 0.62;
          dnaBondMat.opacity = act7Alpha * 0.88;
          dnaNodeGoldMat.opacity = act7Alpha * 0.96;
          dnaNodeRoseMat.opacity = act7Alpha * 0.96;
          bioChamberMat.opacity = act7Alpha * 0.36;

          // Bàn trượt bệnh nhân đưa nhẹ vào trong lòng ống Bore của máy chụp MRI
          const couchSlideOffset = Math.sin(elapsed * 0.95) * 0.45;
          couchSlidingBoard.position.z = 0.6 + couchSlideOffset;
          couchMattress.position.z = 0.55 + couchSlideOffset;
          couchHeadPillow.position.z = -1.85 + couchSlideOffset;

          // Vòng Gantry X-Quang bên trong lòng máy MRI quay quét chùm tia giải hệ Ax = b
          ctGantryRing.rotation.z = elapsed * 1.45 + p * 18.0;
          const scanWaveZ = Math.sin(elapsed * 1.6) * 1.85;
          ctGantryRing.position.z = scanWaveZ;

          const sliceSpread = 1.0 + Math.sin(smoothstep(0.66, 0.76, p) * Math.PI) * 0.32;
          for (let s = 0; s < ctSlices.length; s++) {
            const sl = ctSlices[s];
            sl.mesh.position.z = sl.baseZ * sliceSpread + couchSlideOffset * 0.5;
          }

          // Chuỗi xoắn kép DNA xoay quanh trục phân tử
          dnaHelixGroup.rotation.y = elapsed * 0.85 + p * 12.0;
          dnaHelixGroup.rotation.z = Math.sin(elapsed * 0.5) * 0.14;
        }

        // ========================================================================
        // HỒI VIII (0.77 -> 0.88): MA TRẬN ẢNH SVD & SỰ KẾT TINH CON MẮT VECTORIA 3D TỪ MẠNG NƠ-RON AI
        // ========================================================================
        const act8SvdAlpha =
          smoothstep(0.74, 0.78, p) * (1.0 - smootherstep(0.835, 0.865, p));
        pixelCrucibleGroup.visible = act8SvdAlpha > 0.01;
        if (pixelCrucibleGroup.visible) {
          svdFrameMat.opacity = act8SvdAlpha * 0.82;
          svdApertureRing.rotation.z = elapsed * 0.25 + p * 8.0;
          const svdSplit = Math.sin(smoothstep(0.77, 0.84, p) * Math.PI);
          const svdFocus = smootherstep(0.81, 0.84, p);

          for (let i = 0; i < voxelTiles.length; i++) {
            const tile = voxelTiles[i];
            tile.mat.opacity = act8SvdAlpha * 0.96;

            const layerZ = (tile.channelLayer - 1) * 3.2 * svdSplit;
            const scatterFactor = svdSplit * (1.0 - svdFocus) * 0.45;

            tile.mesh.position.set(
              tile.baseX + tile.noiseX * scatterFactor,
              tile.baseY + tile.noiseY * scatterFactor,
              layerZ
            );
            const depthScale = 1.0 + svdSplit * tile.singularWeight * 3.5;
            tile.mesh.scale.set(1.0, 1.0, depthScale);
          }

          svdFramePlanes.forEach((fp, idx) => {
            fp.position.z = (idx - 1) * 3.2 * svdSplit;
          });
        }

        // ========================================================================
        // HỒI VIII (0.77 -> 0.88): BÃO NƠ-RON AI & CON MẮT LỚN THU NHỎ VỀ LOGO
        // ========================================================================
        const act8AiAlpha =
          smoothstep(0.81, 0.845, p) * (1.0 - smoothstep(0.936, 0.954, p));
        climaxGroup.visible = act8AiAlpha > 0.005;
        if (climaxGroup.visible) {
          const eyeFormation = smootherstep(0.825, 0.870, p);
          const vortexSpin = elapsed * 1.15 + smootherstep(0.82, 0.88, p) * 10.0;

          // HOẠT HỌA THU NHỎ TẦM VÓC: Mở rộng biên độ cuộn (0.865 -> 0.942) giúp Con Mắt Lớn co cụm mềm mại, uyển chuyển
          const condenseT = smootherstep(0.865, 0.942, p);
          const currentScale = lerp(1.0, 0.20, condenseT);

          // Căn chỉnh trục tâm chính xác 100% vào hồng tâm góc nhìn Camera (Dead Center 50%, 50%)
          const losSlope = (camState.look[1] - camState.pos[1]) / (camState.look[2] - camState.pos[2]);
          const targetCenterY = camState.pos[1] + losSlope * (-164.0 - camState.pos[2]);
          const currentCenterY = lerp(0.0, targetCenterY, condenseT);

          // Áp dụng scale & position cho toàn bộ climaxGroup (cả khung 3D lẫn đám mây nơ-ron và synapse co cụm đồng bộ)
          climaxGroup.scale.set(currentScale, currentScale, currentScale);
          climaxGroup.position.set(0.0, currentCenterY, -164.0);

          // Độ mờ tan dần của 3D khi bàn giao cho Logo 2D (0.930 -> 0.952)
          const fadeOut3D = 1.0 - smoothstep(0.930, 0.952, p);
          const eyeWireGlow = eyeFormation * act8AiAlpha * fadeOut3D;

          // Hiệu ứng tăng nhiệt quang học (Core Surge) khi nơ-ron co cụm vào thể tích nhỏ
          const coreSurge = Math.sin(condenseT * Math.PI) * 0.35;
          aiNodeMat.size = lerp(0.36, 0.15, condenseT) + coreSurge * 0.06;
          aiNodeMat.opacity = act8AiAlpha * (1.0 + coreSurge * 0.35) * fadeOut3D;
          synapseMat.opacity = act8AiAlpha * (0.65 + coreSurge * 0.35) * fadeOut3D;

          neuralEyeLineMat.opacity = eyeWireGlow * 0.88;
          neuralEyeOrbMat.opacity = eyeWireGlow * 0.92;

          // Nhịp thở Coriolis & xoắn góc gyroscopic: lắc xoay nhẹ rồi khóa thẳng đứng đúng góc Logo
          const vortexTwist = Math.sin(condenseT * Math.PI) * 0.12;
          neuralEye3DGroup.rotation.z = Math.sin(elapsed * 0.6) * 0.05 * (1.0 - condenseT) + vortexTwist;

          const nArr = aiNodeGeo.attributes.position.array;
          for (let i = 0; i < AI_NODE_COUNT; i++) {
            const b = aiNodeBase[i];
            const curAng = b.angle + (vortexSpin + condenseT * 3.2) * b.speed * 0.22;

            const swirlX = Math.cos(curAng) * b.radius;
            const swirlY = Math.sin(curAng) * b.radius * 0.72;
            const swirlZ = b.bz;

            // Tọa độ cấu trúc Con Mắt Lớn
            const eyeX = lerp(swirlX, b.eyeTargetX, eyeFormation);
            const eyeY = lerp(swirlY, b.eyeTargetY, eyeFormation);
            const eyeZ = lerp(swirlZ, b.eyeTargetZ, eyeFormation * 0.9);

            nArr[i * 3] = eyeX;
            nArr[i * 3 + 1] = eyeY;
            nArr[i * 3 + 2] = eyeZ;
          }
          aiNodeGeo.attributes.position.needsUpdate = true;

          // Synapse tự động co cụm theo các hạt nơ-ron đang thu nhỏ
          const sArr = synapseGeo.attributes.position.array;
          for (let s = 0; s < SYNAPSE_COUNT; s++) {
            let i1 = 0, i2 = 0;
            if (s < 160) {
              i1 = (s * 5) % 800;
              i2 = (s * 5 + 1) % 800;
            } else if (s < 320) {
              i1 = 800 + ((s - 160) * 4) % 750;
              i2 = 800 + ((s - 160) * 4 + 1) % 750;
            } else if (s < 460) {
              i1 = 1550 + ((s - 320) * 4) % 600;
              i2 = 1550 + ((s - 320) * 4 + 1) % 600;
            } else {
              i1 = 2150 + (s - 460) % 400;
              i2 = (i1 + 1) % AI_NODE_COUNT;
            }
            const b6 = s * 6;
            sArr[b6] = nArr[i1 * 3];
            sArr[b6 + 1] = nArr[i1 * 3 + 1];
            sArr[b6 + 2] = nArr[i1 * 3 + 2];
            sArr[b6 + 3] = nArr[i2 * 3];
            sArr[b6 + 4] = nArr[i2 * 3 + 1];
            sArr[b6 + 5] = nArr[i2 * 3 + 2];
          }
          synapseGeo.attributes.position.needsUpdate = true;
        }

        // ========================================================================
        // HỒI IX (0.88 -> 1.00): KHÔNG GIAN TOẠ ĐỘ VECTOR VÔ CỰC & THƯƠNG HIỆU KẾT TINH
        // ========================================================================
        // 1. Không gian Tọa độ Vector Vô cực & Thiên hà Hồi IX (Hậu cảnh toán học hoành tráng)
        const act9Alpha = smoothstep(0.875, 0.925, p);
        finaleSanctuaryGroup.visible = act9Alpha > 0.01;
        if (finaleSanctuaryGroup.visible) {
          vectorGridMat.opacity = act9Alpha * 0.38;
          astrolabeMat.opacity = act9Alpha * 0.46;
          finaleNebulaBackdropMat.opacity = act9Alpha * 0.85;
          fusionCoreLight.intensity = act9Alpha * 14.0;

          astrolabeGroup.rotation.z = elapsed * 0.04;
        } else {
          fusionCoreLight.intensity = 0;
        }

        // 2. Diễn hoạt Sân khấu Thương hiệu Vectoria: Kết tinh đa tầng, mềm mại & có cá tính (0.895 -> 0.965)
        if (brandFinaleStage) {
          const stageAlpha = smoothstep(0.895, 0.930, p);
          brandFinaleStage.style.opacity = String(stageAlpha);
          if (brandEmblemCrest) {
            brandEmblemCrest.style.opacity = "1";
          }

          // Lớp 1: Khung Lục Giác Ngoài & 6 Quả Cầu Vệ Tinh (0.902 -> 0.932)
          // Khóa tọa độ với hiệu ứng hội tụ nhẹ từ ngoài vào trong (scale: 1.22 -> 1.0)
          const outerT = smootherstep(0.902, 0.932, p);
          if (emblemOuterGroup) {
            emblemOuterGroup.style.opacity = String(outerT);
            const outerScale = lerp(1.22, 1.0, outerT).toFixed(3);
            emblemOuterGroup.style.transform = `scale(${outerScale})`;
            emblemOuterGroup.style.transformOrigin = "0px 0px";
          }

          // Lớp 2: Khung Lục Giác Trong & Nan giằng Geodesic (0.918 -> 0.944)
          // Đan cài khớp cấu trúc (scale: 1.15 -> 1.0)
          const innerT = smootherstep(0.918, 0.944, p);
          if (emblemInnerGroup) {
            emblemInnerGroup.style.opacity = String(innerT);
            const innerScale = lerp(1.15, 1.0, innerT).toFixed(3);
            emblemInnerGroup.style.transform = `scale(${innerScale})`;
            emblemInnerGroup.style.transformOrigin = "0px 0px";
          }

          // Điểm bùng nổ quang học Sapphire tại tâm điểm (0.925 -> 0.954)
          // Lóe sáng khi nơ-ron 3D tụ về cực điểm, chuyển hóa thành linh hồn Logo
          const flarePulse = Math.sin(smoothstep(0.925, 0.952, p) * Math.PI);
          if (emblemLaserFlare) {
            emblemLaserFlare.style.opacity = String(flarePulse * 0.98);
            emblemLaserFlare.setAttribute("r", String(18 + flarePulse * 62));
          }

          // Lớp 3: Cung Mí Mắt mở dần từ tâm trục ngang ("Chớp mắt khai mở") (0.932 -> 0.958)
          // Mí mắt mở từ khe hẹp scaleY: 0.06 -> mở toang 1.0 đầy uy quyền và sức sống
          const eyeOpenT = smootherstep(0.932, 0.958, p);
          if (emblemEyelidsGroup) {
            const eyeAlpha = smoothstep(0.928, 0.945, p);
            emblemEyelidsGroup.style.opacity = String(eyeAlpha);
            const openScaleY = lerp(0.06, 1.0, eyeOpenT).toFixed(3);
            emblemEyelidsGroup.style.transform = `scaleY(${openScaleY})`;
            emblemEyelidsGroup.style.transformOrigin = "0px 0px";
          }

          // Lớp 4: Tròng Mắt Sapphire & Đồng tử trung tâm giãn nở hội tụ (0.936 -> 0.960)
          // Đồng tử mở rộng (0.35 -> 1.0) khi mí mắt mở, kết hợp bám theo con trỏ chuột (Parallax Gaze)
          const irisT = smootherstep(0.936, 0.960, p);
          if (emblemIrisGroup) {
            const irisAlpha = smoothstep(0.932, 0.948, p);
            emblemIrisGroup.style.opacity = String(irisAlpha);
            const irisScale = lerp(0.35, 1.0, irisT).toFixed(3);
            const lookX = (px * 3.8 * irisAlpha).toFixed(2);
            const lookY = (-py * 2.8 * irisAlpha).toFixed(2);
            emblemIrisGroup.style.transform = `translate(${lookX}px, ${lookY}px) scale(${irisScale})`;
            emblemIrisGroup.style.transformOrigin = "0px 0px";
          }

          // Khi con mắt đã hoàn tất khai mở trọn vẹn (p >= 0.966), dòng chữ VECTORIA mới xuất hiện
          if (brandWordmark) {
            if (p >= 0.966) {
              brandWordmark.classList.add("appear-active");
            } else if (p < 0.956) {
              brandWordmark.classList.remove("appear-active");
            }
          }
        }

        dustSystem.rotation.y = elapsed * 0.015;
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener("resize", () => {
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });
    </script>

    <script src="js/app/auth.js"></script>
    <script src="js/app/ui/topbar_avatar.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/utils/global-search.js"></script>
  </body>
