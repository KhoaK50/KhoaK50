    <style>
      :root,
      html,
      body,
      html.dark,
      body.dark,
      body.dark-theme {
        --topbar-h: 60px;
        --stage-bg: #050811;
        --stage-ink: #f8fafc;
        --stage-muted: #94a3b8;
        --stage-accent: #38bdf8;
        --scrubber-bg: rgba(15, 23, 42, 0.88);
        --scrubber-border: rgba(148, 163, 184, 0.24);
        --scrubber-rail: rgba(148, 163, 184, 0.22);
        --vignette-edge: rgba(2, 5, 14, 0.72);
      }

      /* Khóa cố định Dark Mode ở trang chiêm ngưỡng điện ảnh này */
      #themeToggleBtn {
        display: none !important;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Đảm bảo cuộn trang hoạt động 100% trên mọi trình duyệt (không khóa scroll container) */
      html {
        overflow-x: clip !important;
        overflow-y: scroll !important;
        height: auto !important;
        background-color: var(--stage-bg);
      }

      body {
        width: 100%;
        min-height: 100vh;
        height: auto !important;
        overflow: visible !important;
        font-family: var(--font-ui);
        background-color: var(--stage-bg);
        color: var(--stage-ink);
        -webkit-font-smoothing: antialiased;
      }

      #globalTopbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 10005;
      }

      /* Đường băng cuộn vật lý 6400vh cho đại cảnh điện ảnh 9 Hồi dàn trải, chậm rãi */
      .scrolly-runway {
        position: relative;
        width: 100%;
        height: 6400vh;
        background-color: var(--stage-bg);
      }

      /* Khung hình điện ảnh cố định tuyệt đối dưới Topbar */
      .scrolly-viewport {
        position: fixed;
        top: var(--topbar-h, 60px);
        left: 0;
        width: 100vw;
        height: calc(100vh - var(--topbar-h, 60px));
        overflow: hidden;
        background-color: var(--stage-bg);
        z-index: 1;
      }

      #webglStage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #webglStage canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* Lớp Vignette quang học dịu nhẹ tạo chiều sâu ống kính Cinema */
      .studio-vignette-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse 82% 76% at 50% 50%,
          rgba(0, 0, 0, 0) 52%,
          var(--vignette-edge) 100%
        );
      }

      /* 2 Thanh Cinema Letterbox ở cao trào Macro */
      .cinema-letterbox-top,
      .cinema-letterbox-bottom {
        position: absolute;
        left: 0;
        width: 100%;
        height: 0px;
        background: rgba(9, 13, 22, 0.94);
        z-index: 12;
        pointer-events: none;
        transition: height 0.12s linear;
      }

      .cinema-letterbox-top {
        top: 0;
      }

      .cinema-letterbox-bottom {
        bottom: 0;
      }

      /* Sân khấu Thương hiệu Hồi IX: Chùm Nơ-ron Chiếu Hologram Con Mắt + Chữ VECTORIA */
      .brand-finale-stage {
        position: absolute;
        inset: 0;
        z-index: 18;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        will-change: opacity;
      }

      .brand-emblem-crest {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: clamp(120px, 15vw, 190px);
        height: clamp(120px, 15vw, 190px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        will-change: opacity, transform, filter;
      }

      .brand-emblem-crest::before {
        content: "";
        position: absolute;
        inset: -28%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.42) 0%,
          rgba(2, 132, 199, 0.18) 45%,
          rgba(2, 6, 23, 0) 72%
        );
        pointer-events: none;
      }

      .brand-emblem-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.85))
                drop-shadow(0 0 48px rgba(2, 132, 199, 0.55));
      }

      #emblemOuterGroup,
      #emblemInnerGroup,
      #emblemEyelidsGroup,
      #emblemIrisGroup {
        transform-origin: 0px 0px;
        will-change: transform, opacity;
      }

      .brand-lockup-row {
        position: absolute;
        top: calc(50% + clamp(118px, 16vh, 168px));
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .brand-wordmark {
        margin: 0;
        padding: 0 0 0 0.24em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-ui, "Be Vietnam Pro", system-ui, sans-serif);
        font-size: clamp(42px, 6.6vw, 96px);
        font-weight: 700;
        letter-spacing: 0.24em;
        line-height: 1;
        color: #f8fafc;
        white-space: nowrap;
      }

      .brand-wordmark .bm-char {
        display: inline-block;
        opacity: 0;
        transform: translateY(28px) scale(0.84);
        filter: blur(8px);
        text-shadow: 0 0 36px rgba(56, 189, 248, 0.85), 0 0 72px rgba(2, 132, 199, 0.55);
        transition:
          opacity 0.95s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.95s cubic-bezier(0.16, 1, 0.3, 1),
          filter 0.95s cubic-bezier(0.16, 1, 0.3, 1),
          text-shadow 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: calc(var(--char-d, 0) * 65ms);
        will-change: opacity, transform, filter;
      }

      .brand-wordmark.appear-active .bm-char {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
        text-shadow:
          0 0 22px rgba(186, 230, 253, 0.65),
          0 0 48px rgba(56, 189, 248, 0.45),
          0 0 88px rgba(2, 132, 199, 0.32);
      }

      /* Thanh Timeline La Mã 9 Hồi bên phải */
      .chapter-scrubber {
        position: absolute;
        right: 28px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 25;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        user-select: none;
      }

      .scrubber-percent {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        color: var(--stage-accent);
        background-color: var(--scrubber-bg);
        border: 1px solid var(--scrubber-border);
        padding: 3px 8px;
        border-radius: 4px;
        letter-spacing: 0.04em;
        backdrop-filter: blur(8px);
      }

      .scrubber-rail {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 370px;
        padding: 4px 0;
      }

      .scrubber-rail::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1.5px;
        background-color: var(--scrubber-rail);
        transform: translateX(-50%);
        z-index: 1;
      }

      .scrubber-bar {
        position: absolute;
        top: 0;
        left: 50%;
        width: 2px;
        height: 0%;
        background-color: var(--stage-accent);
        transform: translateX(-50%);
        z-index: 2;
        transition: height 0.08s linear;
      }

      .scrubber-node {
        position: relative;
        z-index: 3;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-color: var(--scrubber-bg);
        border: 1.5px solid var(--scrubber-border);
        color: var(--stage-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .scrubber-node:hover {
        border-color: var(--stage-accent);
        color: var(--stage-accent);
        transform: scale(1.1);
      }

      .scrubber-node.active {
        background-color: var(--stage-accent);
        border-color: var(--stage-accent);
        color: #ffffff;
        box-shadow: 0 0 0 4px rgba(0, 144, 255, 0.16);
        transform: scale(1.12);
      }

      .node-num {
        font-family: var(--font-academic, "STIX Two Text", Georgia, serif);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }

      @media (max-width: 768px) {
        .brand-finale-stage {
          inset: 0;
        }

        .brand-emblem-crest {
          width: clamp(96px, 24vw, 136px);
          height: clamp(96px, 24vw, 136px);
        }

        .brand-lockup-row {
          top: calc(50% + clamp(96px, 16vh, 130px));
        }

        .brand-wordmark {
          font-size: clamp(32px, 9vw, 54px);
          letter-spacing: 0.16em;
        }

        .chapter-scrubber {
          right: 12px;
        }

        .scrubber-rail {
          height: 180px;
        }
      }
    </style>
  </head>

        <div class="brand-finale-stage" id="brandFinaleStage">
          <!-- Biểu tượng Con Mắt Lục Giác Vectoria (Kết tinh từ Con Mắt Bão Nơ-ron Hồi VIII) -->
          <div class="brand-emblem-crest" id="brandEmblemCrest">
            <svg
              class="brand-emblem-svg"
              id="brandEmblemSvg"
              viewBox="-120 -120 240 240"
              aria-hidden="true"
            >
              <defs>
                <radialGradient id="irisSapphireGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#020617" />
                  <stop offset="26%" stop-color="#0369a1" />
                  <stop offset="58%" stop-color="#38bdf8" />
                  <stop offset="84%" stop-color="#bae6fd" />
                  <stop offset="100%" stop-color="#0284c7" />
                </radialGradient>
                <radialGradient id="orbNodeGrad" cx="35%" cy="35%" r="65%">
                  <stop offset="0%" stop-color="#f8fafc" />
                  <stop offset="55%" stop-color="#94a3b8" />
                  <stop offset="100%" stop-color="#1e293b" />
                </radialGradient>
                <radialGradient id="laserFlashGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
                  <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.85" />
                  <stop offset="65%" stop-color="#0284c7" stop-opacity="0.35" />
                  <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
                </radialGradient>
              </defs>

              <!-- Tia lóe quang học trung tâm khi chùm nơ-ron chiếu hội tụ -->
              <circle id="emblemLaserFlare" cx="0" cy="0" r="48" fill="url(#laserFlashGrad)" opacity="0" pointer-events="none" />

              <!-- Lớp 1: Khung Lục Giác Ngoài & 6 Quả Cầu Vệ Tinh (Hiện trước tiên khi chùm tia chiếu tới) -->

                <polygon
                  points="43,-74.5 86,0 43,74.5 -43,74.5 -86,0 -43,-74.5"
                  fill="none"
                  stroke="#e2e8f0"
                  stroke-width="2.4"
                  stroke-linejoin="round"
                />
                <g stroke="#e2e8f0" stroke-width="2.6">
                  <line x1="0" y1="-58" x2="0" y2="-96" />
                  <line x1="50.2" y1="-29" x2="83.1" y2="-48" />
                  <line x1="50.2" y1="29" x2="83.1" y2="48" />
                  <line x1="0" y1="58" x2="0" y2="96" />
                  <line x1="-50.2" y1="29" x2="-83.1" y2="48" />
                  <line x1="-50.2" y1="-29" x2="-83.1" y2="-48" />
                </g>
                <g stroke="#e2e8f0" stroke-width="2.0" fill="url(#orbNodeGrad)">
                  <circle cx="0" cy="-103" r="8.5" />
                  <circle cx="89.2" cy="-51.5" r="8.5" />
                  <circle cx="89.2" cy="51.5" r="8.5" />
                  <circle cx="0" cy="103" r="8.5" />
                  <circle cx="-89.2" cy="51.5" r="8.5" />
                  <circle cx="-89.2" cy="-51.5" r="8.5" />
                </g>
              </g>

              <!-- Lớp 2: Khung Lục Giác Trong & Đường Giằng Geodesic (Khớp vào vị trí tiếp theo) -->
              <g id="emblemInnerGroup" opacity="0">
                <polygon
                  points="0,-58 50.2,-29 50.2,29 0,58 -50.2,29 -50.2,-29"
                  fill="none"
                  stroke="#f8fafc"
                  stroke-width="2.8"
                  stroke-linejoin="round"
                />
                <g stroke="#94a3b8" stroke-width="1.3" opacity="0.85">
                  <line x1="0" y1="-74.5" x2="-50.2" y2="-29" />
                  <line x1="0" y1="-74.5" x2="50.2" y2="-29" />
                  <line x1="0" y1="-74.5" x2="-25.1" y2="-43.5" />
                  <line x1="0" y1="-74.5" x2="25.1" y2="-43.5" />
                  <line x1="0" y1="74.5" x2="-50.2" y2="29" />
                  <line x1="0" y1="74.5" x2="50.2" y2="29" />
                  <line x1="0" y1="74.5" x2="-25.1" y2="43.5" />

      // Nội suy Catmull-Rom Cubic Spline liên tục C1 (Không bao giờ phanh khựng vận tốc về 0 tại các điểm mốc)
      function catmullRom1D(v0, v1, v2, v3, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return (
          0.5 *
          (2 * v1 +
            (-v0 + v2) * t +
            (2 * v0 - 5 * v1 + 4 * v2 - v3) * t2 +
            (-v0 + 3 * v1 - 3 * v2 + v3) * t3)
        );
      }

      function sampleCamera(progress) {
        const p = clamp01(progress);
        const n = CAMERA_TIMELINE.length;
        for (let i = 0; i < n - 1; i++) {
          const k1 = CAMERA_TIMELINE[i];
          const k2 = CAMERA_TIMELINE[i + 1];
          if (p >= k1.p && p <= k2.p) {
            const k0 = CAMERA_TIMELINE[Math.max(0, i - 1)];
            const k3 = CAMERA_TIMELINE[Math.min(n - 1, i + 2)];
            const u = clamp01((p - k1.p) / (k2.p - k1.p || 1e-6));
            return {
              pos: [
                catmullRom1D(k0.pos[0], k1.pos[0], k2.pos[0], k3.pos[0], u),
                catmullRom1D(k0.pos[1], k1.pos[1], k2.pos[1], k3.pos[1], u),
                catmullRom1D(k0.pos[2], k1.pos[2], k2.pos[2], k3.pos[2], u),
              ],
              look: [
                catmullRom1D(k0.look[0], k1.look[0], k2.look[0], k3.look[0], u),
                catmullRom1D(k0.look[1], k1.look[1], k2.look[1], k3.look[1], u),
                catmullRom1D(k0.look[2], k1.look[2], k2.look[2], k3.look[2], u),
              ],
              roll: catmullRom1D(k0.roll, k1.roll, k2.roll, k3.roll, u),
              fov: catmullRom1D(k0.fov, k1.fov, k2.fov, k3.fov, u),
            };
          }
        }
        const last = CAMERA_TIMELINE[n - 1];
        return { pos: [...last.pos], look: [...last.look], roll: last.roll, fov: last.fov };
      }

        let a0 = ACT_ATMOSPHERES[0];

        for (let i = 0; i < ACT_ATMOSPHERES.length - 1; i++) {
          if (p >= ACT_ATMOSPHERES[i].p && p <= ACT_ATMOSPHERES[i + 1].p) {

            a1 = ACT_ATMOSPHERES[i + 1];
            t = smootherstep(a0.p, a1.p, p);
            break;

        if (p < ACT_ATMOSPHERES[0].p) {
          a0 = ACT_ATMOSPHERES[0];
          a1 = ACT_ATMOSPHERES[0];
          t = 0;
        } else if (p > ACT_ATMOSPHERES[ACT_ATMOSPHERES.length - 1].p) {

          a1 = ACT_ATMOSPHERES[ACT_ATMOSPHERES.length - 1];

      function createStarSpriteTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0.0, "rgba(255, 255, 255, 1.0)");
        grad.addColorStop(0.25, "rgba(210, 238, 255, 0.85)");
        grad.addColorStop(0.6, "rgba(56, 189, 248, 0.22)");
        grad.addColorStop(1.0, "rgba(0, 0, 0, 0.0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#0b1322";
        ctx.fillRect(0, 0, 256, 512);

        for (let r = 0; r < 28; r++) {
          for (let c = 0; c < 10; c++) {
            const seed = (r * 31 + c * 17) % 19;
            if (seed < 11) {
              if (seed % 3 === 0) {
                ctx.fillStyle = "rgba(251, 191, 36, 0.92)";
              } else if (seed % 3 === 1) {
                ctx.fillStyle = "rgba(56, 189, 248, 0.88)";
              } else {
                ctx.fillStyle = "rgba(224, 242, 254, 0.82)";
              }
              ctx.fillRect(10 + c * 24, 10 + r * 18, 16, 11);
            }
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.needsUpdate = true;
        return tex;
      }

      // Tạo mặt giấy đôi 2048x1400 của quyển vở học tập lúc nửa đêm:
      // Ken đặc nét chì than 2B/4B đậm rõ, mực bút bi xanh, vết highlight và bản phác thảo Con Mắt Vectoria ở góc trang
      function createHandwrittenNotebookTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 2048;
        canvas.height = 1400;
        const ctx = canvas.getContext("2d");

        // Nền giấy kem ấm có chiều sâu chất liệu giấy
        ctx.fillStyle = "#f3ede0";
        ctx.fillRect(0, 0, 2048, 1400);

        // Đổ bóng gáy vở ở giữa (x = 1024)
        const spineGrad = ctx.createLinearGradient(950, 0, 1098, 0);
        spineGrad.addColorStop(0.0, "rgba(0,0,0,0)");
        spineGrad.addColorStop(0.44, "rgba(28, 22, 14, 0.25)");
        spineGrad.addColorStop(0.5, "rgba(12, 8, 4, 0.45)");
        spineGrad.addColorStop(0.56, "rgba(28, 22, 14, 0.25)");
        spineGrad.addColorStop(1.0, "rgba(0,0,0,0)");
        ctx.fillStyle = spineGrad;
        ctx.fillRect(950, 0, 148, 1400);

        // Lưới ô ly vở học sinh rõ nét hơn
        ctx.strokeStyle = "rgba(55, 115, 175, 0.28)";
        ctx.lineWidth = 1.4;
        for (let y = 75; y < 1335; y += 38) {
          ctx.beginPath();
          ctx.moveTo(55, y);
          ctx.lineTo(985, y);
          ctx.moveTo(1063, y);
          ctx.lineTo(1993, y);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(55, 115, 175, 0.16)";
        for (let x = 55; x < 985; x += 38) {
          ctx.beginPath();
          ctx.moveTo(x, 75);
          ctx.lineTo(x, 1335);
          ctx.stroke();
        }
        for (let x = 1063; x < 1993; x += 38) {
          ctx.beginPath();
          ctx.moveTo(x, 75);
          ctx.lineTo(x, 1335);
          ctx.stroke();
        }

        // Lề đỏ dọc hai trang vở
        ctx.strokeStyle = "rgba(205, 65, 65, 0.52)";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(138, 45);
        ctx.lineTo(138, 1355);
        ctx.moveTo(1145, 45);
        ctx.lineTo(1145, 1355);
        ctx.stroke();

        // Hàm vẽ ngoặc vuông ma trận viết tay đậm nét
        function drawHandBracket(bx, by, bw, bh, isLeft) {
          ctx.beginPath();
          const dir = isLeft ? 1 : -1;
          ctx.moveTo(bx + dir * 18, by);
          ctx.lineTo(bx, by + 2);
          ctx.quadraticCurveTo(bx - dir * 3, by + bh * 0.5, bx + 1, by + bh);
          ctx.lineTo(bx + dir * 18, by + bh - 1);

        // Vệt bút dạ quang vàng đánh dấu các kết quả quan trọng trên trang giấy

        ctx.fillRect(160, 82, 480, 34);
        ctx.fillRect(625, 340, 290, 34);
        ctx.fillRect(1175, 84, 520, 34);

        // ====================================================================
        // TRANG TRÁI: GHI CHÉP DÀY ĐẶC BẰNG CHÌ THAN 2B/4B ĐẬM & BÚT BI XANH
        // ====================================================================
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Tiêu đề & Hệ phương trình ma trận bằng chì than 4B cực rõ (#1e232a)
        ctx.strokeStyle = "#1e232a";
        ctx.fillStyle = "#1e232a";
        ctx.lineWidth = 3.8;
        ctx.font = "italic bold 29px Georgia, serif";
        ctx.fillText("Ax = b   ⟹   [ A | b ]  →  [ I | x ],   det(A) ≠ 0", 165, 108);

        // Khối phép nhân & biến đổi ma trận 1 (Nét chì đậm)
        drawHandBracket(168, 142, 210, 175, true);
        drawHandBracket(365, 142, 210, 175, false);
        const m1 = [
          [" 2", "-1", " 0"],
          ["-1", " 2", "-1"],
          [" 0", "-1", " 2"],
        ];
        ctx.font = "bold 31px Georgia, serif";
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            ctx.fillText(m1[r][c], 188 + c * 60, 188 + r * 54);
          }
        }

        // Vector cột x = [x1, x2, x3]^T
        drawHandBracket(392, 142, 70, 175, true);
        drawHandBracket(462, 142, 70, 175, false);
        ctx.font = "italic bold 28px Georgia, serif";
        ctx.fillText("x₁", 412, 188);
        ctx.fillText("x₂", 412, 242);
        ctx.fillText("x₃", 412, 296);

        // Dấu mũi tên biến đổi hàng (R2 -> 2R2 + R1)
        ctx.strokeStyle = "#163a70";
        ctx.fillStyle = "#163a70";
        ctx.lineWidth = 3.6;
        ctx.beginPath();
        ctx.moveTo(492, 228);
        ctx.quadraticCurveTo(548, 220, 602, 228);
        ctx.lineTo(585, 216);
        ctx.moveTo(602, 228);
        ctx.lineTo(586, 240);
        ctx.stroke();
        ctx.font = "italic bold 22px Georgia, serif";
        ctx.fillText("R₂ ← 2R₂ + R₁", 495, 206);
        ctx.fillText("R₃ ← 3R₃ + 2R₂", 495, 262);

        // Ma trận bậc thang thu gọn bên phải
        ctx.strokeStyle = "#1e232a";
        ctx.fillStyle = "#1e232a";
        drawHandBracket(628, 142, 235, 175, true);
        drawHandBracket(852, 142, 235, 175, false);
        const m2 = [
          ["2", "-1", " 0", "| 1"],
          ["0", " 3", "-2", "| 2"],
          ["0", " 0", " 4", "| 4"],
        ];
        ctx.font = "bold 28px Georgia, serif";
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 4; c++) {
            ctx.fillText(m2[r][c], 646 + c * 50, 188 + r * 54);

        }

        // Khu vực 2: Tính Định thức & Đa thức đặc trưng det(A - lambda*I) = 0

        ctx.strokeStyle = "#163a70";
        ctx.font = "italic bold 28px Georgia, serif";
        ctx.fillText("det(A - λI) = 0   ⟹   Av = λv,   v ≠ 0", 165, 366);
        ctx.font = "italic 27px Georgia, serif";
        ctx.fillText("⇔ (2 - λ)[(2 - λ)² - 1] - 1·(2 - λ) = 0", 172, 412);
        ctx.fillText("⇔ (2 - λ)(λ² - 4λ + 2) = 0   ⇒  λ₁ = 2,  λ₂,₃ = 2 ± √2", 172, 456);

        // Vùng nháp bằng chì 2B bị gạch xóa bên trái + tính lại bên phải
        ctx.save();
        ctx.strokeStyle = "#2b303a";
        ctx.fillStyle = "#2b303a";
        ctx.lineWidth = 3.2;
        drawHandBracket(168, 495, 185, 138, true);
        drawHandBracket(348, 495, 185, 138, false);
        ctx.font = "bold 28px Georgia, serif";
        ctx.fillText(" 3   4  -1", 190, 542);
        ctx.fillText(" 1  -2   5", 190, 596);
        // Nét chì gạch chéo xoá vùng nháp sai
        ctx.lineWidth = 3.4;
        for (let s = 0; s < 5; s++) {
          ctx.beginPath();
          ctx.moveTo(155, 508 + s * 26);
          ctx.lineTo(365, 494 + s * 28);
          ctx.stroke();
        }
        ctx.restore();

        // Phép phân tích trực giao Gram-Schmidt & Tích vô hướng bên cạnh vùng gạch xóa
        ctx.fillStyle = "#1e232a";
        ctx.strokeStyle = "#1e232a";
        ctx.font = "italic bold 26px Georgia, serif";
        ctx.fillText("⟨uᵢ, uⱼ⟩ = 0  (i ≠ j),   eᵢ = uᵢ / ‖uᵢ‖", 415, 526);
        ctx.font = "italic 26px Georgia, serif";
        ctx.fillText("u₁ = v₁,   e₁ = u₁ / ‖u₁‖", 415, 568);
        ctx.fillText("u₂ = v₂ - ⟨v₂, e₁⟩ e₁", 415, 612);
        ctx.fillText("u₃ = v₃ - ⟨v₃, e₁⟩ e₁ - ⟨v₃, e₂⟩ e₂", 415, 654);

        // Nửa dưới trang trái: Phép phân rã Giá trị kỳ dị SVD (A = U * Sigma * V^T) & Ma trận hiệp phương sai
        ctx.fillStyle = "#163a70";
        ctx.strokeStyle = "#163a70";
        ctx.font = "italic bold 28px Georgia, serif";
        ctx.fillText("A = U · Σ · Vᵀ,   UᵀU = Iₘ,   VᵀV = Iₙ", 165, 725);

        // 3 Khối ma trận U, Sigma, V^T vẽ tay liền kề
        ctx.strokeStyle = "#1e232a";
        ctx.fillStyle = "#1e232a";
        ctx.lineWidth = 3.4;
        drawHandBracket(172, 755, 135, 140, true);
        drawHandBracket(302, 755, 135, 140, false);
        ctx.font = "italic bold 26px Georgia, serif";
        ctx.fillText("u₁  u₂", 198, 808);
        ctx.fillText("... ...", 198, 858);

        drawHandBracket(342, 755, 165, 140, true);
        drawHandBracket(502, 755, 165, 140, false);
        ctx.fillText("σ₁   0   0", 362, 798);
        ctx.fillText(" 0  σ₂   0", 362, 838);
        ctx.fillText(" 0   0  σ₃", 362, 878);

        drawHandBracket(542, 755, 155, 140, true);
        drawHandBracket(692, 755, 155, 140, false);
        ctx.fillText("— v₁ᵀ —", 568, 798);
        ctx.fillText("— v₂ᵀ —", 568, 838);
        ctx.fillText("— v₃ᵀ —", 568, 878);

        // Các dòng ghi chú giải tích ma trận và đạo hàm chuỗi ở cuối trang trái
        ctx.font = "italic 25px Georgia, serif";
        const notesLeft = [
          "• rank(A) = dim(col A) = dim(row A) = r ≤ min(m, n)",
          "• rank(A) + nullity(A) = n,   dim(ker A) = n - r",
          "• x̂ = (AᵀA)⁻¹ Aᵀb,   Aᵀ(Ax̂ - b) = 0",
          "• ‖Ax - b‖₂² → min  ⟹  P = A(AᵀA)⁻¹Aᵀ,   P² = P",
          "• T: ℝⁿ → ℝᵐ,  T(αu + βv) = αT(u) + βT(v)  (∀α, β ∈ ℝ)",
        ];
        notesLeft.forEach((line, idx) => {
          ctx.fillStyle = idx === 4 ? "#163a70" : "#222730";
          ctx.fillText(line, 168, 962 + idx * 58);
        });

        // ====================================================================
        // TRANG PHẢI: HỆ TRỤC TỌA ĐỘ 3D, SÓNG FOURIER & BẢN PHÁC THẢO CON MẮT VECTORIA
        // ====================================================================
        ctx.fillStyle = "#1e232a";
        ctx.strokeStyle = "#1e232a";
        ctx.font = "italic bold 29px Georgia, serif";
        ctx.fillText("V ⊆ ℝ³,   v = c₁e₁ + c₂e₂ + c₃e₃,   R ∈ SO(3)", 1175, 108);

        // Hình vẽ phác thảo Hệ trục tọa độ 3D & Hình hộp bình hành tổ hợp tuyến tính
        const ox = 1420;
        const oy = 420;
        ctx.lineWidth = 3.8;
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox, oy - 245);
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox - 210, oy + 145);
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox + 290, oy + 40);
        ctx.stroke();
        ctx.font = "italic bold 26px Georgia, serif";
        ctx.fillText("z", ox - 28, oy - 230);
        ctx.fillText("x", ox - 225, oy + 155);
        ctx.fillText("y", ox + 302, oy + 48);

        // Các vector vẽ tay đậm nét xuất phát từ gốc tọa độ
        ctx.strokeStyle = "#163a70";
        ctx.lineWidth = 4.4;
        [
          [ox + 185, oy - 155, "v = c₁e₁ + c₂e₂ + c₃e₃"],
          [ox - 115, oy - 110, "u"],
          [ox + 135, oy + 105, "w = u × v"],
        ].forEach(([vx, vy, label]) => {
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.lineTo(vx, vy);
          const ang = Math.atan2(vy - oy, vx - ox);
          ctx.lineTo(vx - Math.cos(ang - 0.42) * 20, vy - Math.sin(ang - 0.42) * 20);
          ctx.moveTo(vx, vy);
          ctx.lineTo(vx - Math.cos(ang + 0.42) * 20, vy - Math.sin(ang + 0.42) * 20);
          ctx.stroke();
          ctx.fillStyle = "#163a70";
          ctx.fillText(label, vx + 12, vy);
        });

        // Đường gióng nét đứt hình hộp trên trang vở
        ctx.save();
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = "#334155";
        ctx.beginPath();
        ctx.moveTo(ox + 185, oy - 155);
        ctx.lineTo(ox + 185, oy + 25);
        ctx.lineTo(ox, oy);
        ctx.stroke();
        ctx.restore();

        // Ma trận quay R_z(theta) ghi bên phải hệ trục
        ctx.strokeStyle = "#1e232a";
        ctx.fillStyle = "#1e232a";
        ctx.lineWidth = 3.2;
        drawHandBracket(1690, 155, 255, 150, true);
        drawHandBracket(1945, 155, 255, 150, false);
        ctx.font = "italic bold 24px Georgia, serif";
        ctx.fillText("cosθ  -sinθ   0", 1712, 198);
        ctx.fillText("sinθ   cosθ   0", 1712, 242);
        ctx.fillText(" 0      0     1", 1712, 286);

        // Giữa trang phải: Phác thảo sóng điều hòa trực giao Fourier
        ctx.fillText("f(t) = ½a₀ + ∑ [aₙ cos(nωt) + bₙ sin(nωt)],   ⟨f, g⟩ = 0", 1175, 645);
        ctx.lineWidth = 3.0;
        for (let harm = 1; harm <= 3; harm++) {
          ctx.beginPath();
          ctx.strokeStyle = harm === 1 ? "#1e232a" : "#163a70";
          for (let x = 0; x <= 420; x += 6) {
            const px = 1185 + x;
            const py = 725 + (harm - 1) * 45 + Math.sin((x / 420) * Math.PI * 2 * harm) * (28 / harm);
            if (x === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        // ====================================================================
        // GÓC DƯỚI PHẢI: BẢN VẼ PHÁC THẢO BÚT CHÌ 4B CỦA CON MẮT VECTORIA & MŨI TÊN XUYÊN TÂM
        // (Manh mối nghệ thuật khởi nguồn cho toàn bộ các phân cảnh phía sau!)
        // ====================================================================
        const ex = 1560;
        const ey = 1065;
        ctx.save();
        ctx.strokeStyle = "#1e232a";
        ctx.fillStyle = "#1e232a";

        // Vòng tròn dựng hình compa mờ & trục tâm
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(ex, ey, 145, 0, Math.PI * 2);
        ctx.moveTo(ex - 185, ey);
        ctx.lineTo(ex + 185, ey);
        ctx.moveTo(ex, ey - 175);
        ctx.lineTo(ex, ey + 175);
        ctx.stroke();

        // Lục giác ngoài & lục giác trong vẽ chì đậm
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (k * Math.PI) / 3;
          const hx = ex + Math.cos(a) * 125;
          const hy = ey + Math.sin(a) * 125;
          if (k === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = Math.PI / 6 + (k * Math.PI) / 3;
          const hx = ex + Math.cos(a) * 88;
          const hy = ey + Math.sin(a) * 88;
          if (k === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.stroke();

        // 6 Trục hướng tâm & 6 Quả cầu vệ tinh phác chì
        for (let k = 0; k < 6; k++) {
          const a = Math.PI / 6 + (k * Math.PI) / 3;
          const x1 = ex + Math.cos(a) * 88;
          const y1 = ey + Math.sin(a) * 88;
          const x2 = ex + Math.cos(a) * 145;
          const y2 = ey + Math.sin(a) * 145;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x2, y2, 11, 0, Math.PI * 2);
          ctx.fill();

        // Hai mí mắt cong & Con ngươi đồng tâm
        ctx.lineWidth = 4.0;
        ctx.beginPath();
        ctx.moveTo(ex - 68, ey);
        ctx.quadraticCurveTo(ex, ey - 72, ex + 68, ey);
        ctx.moveTo(ex - 68, ey);
        ctx.quadraticCurveTo(ex, ey + 72, ex + 68, ey);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ex, ey, 36, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ex, ey, 16, 0, Math.PI * 2);
        ctx.fill();

        // Mũi tên Vector đâm xuyên qua tâm Con Mắt trên trang vở (Chuẩn logoChu.png!)
        ctx.strokeStyle = "#163a70";
        ctx.fillStyle = "#163a70";
        ctx.lineWidth = 4.8;
        ctx.beginPath();
        ctx.moveTo(ex - 250, ey);
        ctx.lineTo(ex + 95, ey);
        ctx.lineTo(ex + 72, ey - 14);
        ctx.moveTo(ex + 95, ey);
        ctx.lineTo(ex + 72, ey + 14);
        ctx.stroke();

        ctx.font = "italic bold 26px Georgia, serif";
        ctx.fillText("VECTORIA", ex - 235, ey + 195);
        ctx.restore();

        // Vết đáy cốc cà phê ở góc trang phải
        ctx.strokeStyle = "rgba(115, 72, 34, 0.20)";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(1855, 760, 82, 0, Math.PI * 2);
        ctx.stroke();

        const tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = 8;
        tex.needsUpdate = true;
        return tex;
      }

      // Tạo mặt phẳng quầng sáng ấm áp trải mềm trên mặt bàn gỗ (Thay thế hoàn toàn hình nón tam giác cứng)
      function createLampPoolTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");
        const grad = ctx.createRadialGradient(256, 256, 12, 256, 256, 256);
        grad.addColorStop(0.0, "rgba(255, 214, 145, 0.46)");
        grad.addColorStop(0.32, "rgba(255, 190, 105, 0.24)");
        grad.addColorStop(0.68, "rgba(255, 165, 75, 0.06)");
        grad.addColorStop(1.0, "rgba(0, 0, 0, 0.0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      // ============================================================================
      // KHỞI TẠO KHÔNG GIAN 3D WEBGL CHÍNH (KHÓA DARK MODE ĐIỆN ẢNH)
      // ============================================================================
      const container = document.getElementById("webglStage");
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050811);
      scene.fog = new THREE.FogExp2(0x050811, 0.013);

      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 240);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.06;
      container.innerHTML = "";
      container.appendChild(renderer.domElement);

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environment = envTexture;

      // Hệ thống ánh sáng Điện ảnh Đa Tầng (Dịu tối ở Hồi I để tôn ánh đèn bàn học ấm áp)
      const ambientLight = new THREE.AmbientLight(0x1e293b, 0.24);
      scene.add(ambientLight);

      const moonRimLight = new THREE.DirectionalLight(0x38bdf8, 0.65);
      moonRimLight.position.set(-8, 16, -14);
      scene.add(moonRimLight);

      const keyLight = new THREE.DirectionalLight(0xe2e8f0, 0.35);
      keyLight.position.set(14, 24, 16);
      scene.add(keyLight);

      // Ngọn đèn bàn học chiếu chính xác từ chao đèn xuống tâm quyển vở đang mở
      const deskSpotLight = new THREE.SpotLight(0xffc275, 22.0, 14.0, Math.PI * 0.38, 0.92, 1.6);
      deskSpotLight.position.set(-0.88, 1.16, -0.26);
      deskSpotLight.target.position.set(0.0, 0.07, 0.14);
      scene.add(deskSpotLight);
      scene.add(deskSpotLight.target);

      // Ánh sáng phản xạ ấm áp từ mặt giấy vở hắt nhẹ lên cốc cà phê, bút chì và chồng sách
      const notebookBounceLight = new THREE.PointLight(0xffcf87, 2.2, 3.8, 1.9);
      notebookBounceLight.position.set(0.0, 0.38, 0.14);
      scene.add(notebookBounceLight);

      const fusionCoreLight = new THREE.PointLight(0x38bdf8, 0, 32, 1.4);
      fusionCoreLight.position.set(0, 0, -180.0);
      scene.add(fusionCoreLight);

      // ============================================================================
      // HỒI I & II: CĂN PHÒNG ĐÊM TĨNH MỊCH, BÀN HỌC, ĐÈN BÀN, VỞ VIẾT TAY & SỰ RẠN NỨT THỰC TẠI
      // ============================================================================
      const studyRoomGroup = new THREE.Group();
      scene.add(studyRoomGroup);

      const roomFragments = [];
      function registerRoomFragment(mesh, basePos, baseRot, pullDir, rotVel) {
        mesh.position.copy(basePos);
        mesh.rotation.copy(baseRot);
        studyRoomGroup.add(mesh);
        roomFragments.push({
          mesh,
          basePos: basePos.clone(),
          baseRot: baseRot.clone(),
          pullDir: pullDir.clone(),
          rotVel,
        });
      }

      const darkWoodMat = new THREE.MeshStandardMaterial({
        color: 0x20150d,
        roughness: 0.46,
        metalness: 0.08,
        transparent: true,
        opacity: 1.0,
      });

      const roomWallMat = new THREE.MeshStandardMaterial({
        color: 0x0b101d,
        roughness: 0.82,
        metalness: 0.05,
        transparent: true,
        opacity: 1.0,
      });

      const windowMoonMat = new THREE.MeshBasicMaterial({
        color: 0x162b49,
        transparent: true,
        opacity: 0.38,
      });

      const cadWireMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });

      const roomCadWireSegments = [];
      function attachCadEdges(mesh, geo) {
        const seg = new THREE.LineSegments(new THREE.EdgesGeometry(geo), cadWireMat);
        seg.visible = false;
        mesh.add(seg);
        roomCadWireSegments.push(seg);
      }

      // 1. Hậu cảnh Tường Phòng & Cửa Sổ Ánh Trăng (Sẽ nứt toác ở Hồi II)
      for (let w = 0; w < 18; w++) {
        const wGeo = new THREE.BoxGeometry(2.6, 2.4, 0.22);
        const wMesh = new THREE.Mesh(wGeo, roomWallMat);
        attachCadEdges(wMesh, wGeo);
        const col = (w % 6) - 2.5;
        const row = Math.floor(w / 6);
        if (row === 1 && Math.abs(col) < 1.2) continue;
        const pos = new THREE.Vector3(col * 2.65, -0.4 + row * 2.45, -3.9);
        const pull = new THREE.Vector3(col * 3.2, (row - 0.5) * 3.5, -18.0 - (w % 5) * 3.0);
        registerRoomFragment(
          wMesh,
          pos,
          new THREE.Euler(0, 0, 0),
          pull,
          new THREE.Vector3(Math.sin(w) * 1.4, Math.cos(w) * 1.4, Math.sin(w * 2) * 1.1)
        );
      }

      // Khung cửa sổ đêm phía sau bàn học với các thanh chớp rèm ánh trăng
      const winFrameGroup = new THREE.Group();
      const winPane = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 2.6), windowMoonMat);
      winFrameGroup.add(winPane);
      for (let b = -4; b <= 4; b++) {
        const slat = new THREE.Mesh(new THREE.BoxGeometry(4.9, 0.08, 0.12), roomWallMat);
        slat.position.y = b * 0.28;
        winFrameGroup.add(slat);
      }
      registerRoomFragment(
        winFrameGroup,
        new THREE.Vector3(0, 2.1, -3.85),
        new THREE.Euler(0, 0, 0),
        new THREE.Vector3(0, 6.5, -24.0),
        new THREE.Vector3(-0.8, 0.4, 0.3)
      );

      // Sàn gỗ căn phòng (16 tấm ván sàn sẽ trôi giật ngược ở Hồi II)
      for (let f = 0; f < 16; f++) {
        const plankGeo = new THREE.BoxGeometry(1.15, 0.12, 11.5);
        const plank = new THREE.Mesh(plankGeo, darkWoodMat);
        attachCadEdges(plank, plankGeo);
        const px = (f - 7.5) * 1.18;
        registerRoomFragment(
          plank,
          new THREE.Vector3(px, -2.1, 1.2),
          new THREE.Euler(0, 0, 0),
          new THREE.Vector3(px * 1.8, -8.5 - (f % 4) * 1.5, -14.0),
          new THREE.Vector3(0.6, 0.2, (f % 2 === 0 ? 1 : -1) * 0.9)
        );
      }

      // 2. Chiếc Ghế Học Tập trước bàn
      const chairGroup = new THREE.Group();
      const seatMesh = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.1, 1.1), darkWoodMat);
      seatMesh.position.set(0, -0.85, 0);
      const backRestMesh = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 0.09), darkWoodMat);
      backRestMesh.position.set(0, -0.22, 0.52);
      chairGroup.add(seatMesh, backRestMesh);
      [
        [-0.5, -0.48],
        [0.5, -0.48],
        [-0.5, 0.48],
        [0.5, 0.48],
      ].forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.2, 0.09), darkWoodMat);
        leg.position.set(lx, -1.48, lz);
        chairGroup.add(leg);
      });
      chairGroup.position.set(0.0, 0.0, 2.05);
      studyRoomGroup.add(chairGroup);

      // 3. Mặt Bàn Học Gỗ (Gồm 6 phiến ghép lại)
      for (let d = 0; d < 6; d++) {
        const segW = 0.82;
        const dGeo = new THREE.BoxGeometry(segW, 0.14, 2.55);
        const dMesh = new THREE.Mesh(dGeo, darkWoodMat);
        attachCadEdges(dMesh, dGeo);
        const dx = (d - 2.5) * segW;
        registerRoomFragment(
          dMesh,
          new THREE.Vector3(dx, -0.02, 0.0),
          new THREE.Euler(0, 0, 0),
          new THREE.Vector3(dx * 3.4, -4.2 - (d % 3) * 1.4, -12.5),
          new THREE.Vector3(-1.2, (d - 2.5) * 0.5, 0.8)
        );
      }
      // 4 Chân bàn học
      [
        [-2.2, -1.05],
        [2.2, -1.05],
        [-2.2, 1.05],
        [2.2, 1.05],
      ].forEach(([lx, lz], idx) => {
        const legGeo = new THREE.BoxGeometry(0.16, 2.05, 0.16);
        const leg = new THREE.Mesh(legGeo, darkWoodMat);
        registerRoomFragment(
          leg,
          new THREE.Vector3(lx, -1.08, lz),
          new THREE.Euler(0, 0, 0),
          new THREE.Vector3(lx * 2.5, -6.5, -14.0),
          new THREE.Vector3(0.9, -0.5, idx * 0.4)
        );
      });

      // 4. Cây Đèn Bàn Kiến Trúc Sư Khớp Nối Chuẩn Xác & Quầng Sáng Mềm Trên Mặt Bàn
      const lampMetalMat = new THREE.MeshStandardMaterial({
        color: 0x1e2633,
        roughness: 0.34,
        metalness: 0.78,
      });
      const lampJointMat = new THREE.MeshStandardMaterial({
        color: 0x64748b,
        roughness: 0.25,
        metalness: 0.88,
      });
      const lampBulbMat = new THREE.MeshBasicMaterial({ color: 0xfff3d1 });
      const lampInnerReflectorMat = new THREE.MeshBasicMaterial({
        color: 0xffd584,
        side: THREE.BackSide,
      });

      function buildLampRod(pA, pB, radius, mat) {
        const dir = new THREE.Vector3().subVectors(pB, pA);
        const len = dir.length();
        const geo = new THREE.CylinderGeometry(radius, radius, len, 20);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pA).add(pB).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        return mesh;
      }

      const lampGroup = new THREE.Group();
      const pBase = new THREE.Vector3(0, 0.035, 0);
      const pElbow = new THREE.Vector3(-0.16, 0.66, -0.06);
      const pNeck = new THREE.Vector3(0.42, 1.10, 0.18);
      // Điểm hướng chao đèn trong tọa độ nội bộ của lampGroup (ứng với tâm quyển vở (0, 0.07, 0.14) ngoài thế giới)
      const pNotebookAim = new THREE.Vector3(1.32, 0.02, 0.59);

      // Đế đèn tròn nặng đặt vững chãi trên mặt bàn
      const lampBaseDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.31, 0.07, 36), lampMetalMat);
      lampBaseDisc.position.copy(pBase);
      const lampBaseCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.085, 0.08, 24), lampJointMat);
      lampBaseCollar.position.set(0, 0.085, 0);
      lampGroup.add(lampBaseDisc, lampBaseCollar);

      // Cặp thanh đỡ dưới song song (Lower Dual Architect Struts)
      const strutOffset = new THREE.Vector3(0, 0, 0.028);
      lampGroup.add(
        buildLampRod(
          new THREE.Vector3(0, 0.09, 0).add(strutOffset),
          pElbow.clone().add(strutOffset),
          0.018,
          lampMetalMat
        ),
        buildLampRod(
          new THREE.Vector3(0, 0.09, 0).sub(strutOffset),
          pElbow.clone().sub(strutOffset),
          0.018,
          lampMetalMat
        )
      );

      // Khớp khuỷu giữa (Elbow Mechanical Hinge)
      const elbowKnob = new THREE.Mesh(new THREE.SphereGeometry(0.052, 24, 24), lampJointMat);
      elbowKnob.position.copy(pElbow);
      lampGroup.add(elbowKnob);

      // Cần đèn trên nối liền mạch từ khuỷu tới cổ đèn (Upper Arm)
      lampGroup.add(buildLampRod(pElbow, pNeck, 0.024, lampMetalMat));

      // Khớp cổ xoay (Neck Swivel Joint)
      const neckKnob = new THREE.Mesh(new THREE.SphereGeometry(0.044, 24, 24), lampJointMat);
      neckKnob.position.copy(pNeck);
      lampGroup.add(neckKnob);

      // Cụm đầu đèn & chao đèn hướng thẳng xuống mặt vở
      const lampHeadGroup = new THREE.Group();
      lampHeadGroup.position.copy(pNeck);
      lampHeadGroup.lookAt(pNotebookAim);

      const shadeCapGeo = new THREE.CylinderGeometry(0.068, 0.082, 0.12, 28);
      shadeCapGeo.rotateX(Math.PI / 2);
      const shadeCapMesh = new THREE.Mesh(shadeCapGeo, lampMetalMat);
      shadeCapMesh.position.z = 0.05;
      lampHeadGroup.add(shadeCapMesh);

      const shadeBellGeo = new THREE.CylinderGeometry(0.082, 0.25, 0.26, 36, 1, true);
      shadeBellGeo.rotateX(Math.PI / 2);
      const shadeOuterMesh = new THREE.Mesh(shadeBellGeo, lampMetalMat);
      shadeOuterMesh.position.z = 0.23;
      const shadeInnerMesh = new THREE.Mesh(shadeBellGeo, lampInnerReflectorMat);
      shadeInnerMesh.position.z = 0.23;
      shadeInnerMesh.scale.set(0.98, 0.98, 0.98);
      lampHeadGroup.add(shadeOuterMesh, shadeInnerMesh);

      const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.072, 24, 24), lampBulbMat);
      lampBulb.position.z = 0.18;
      lampHeadGroup.add(lampBulb);

      lampGroup.add(lampHeadGroup);

      registerRoomFragment(
        lampGroup,
        new THREE.Vector3(-1.32, 0.05, -0.45),
        new THREE.Euler(0, 0, 0),
        new THREE.Vector3(-8.5, 4.8, -15.0),
        new THREE.Vector3(-1.1, 0.8, 1.4)
      );

      // Quầng sáng ấm áp trải mềm trên mặt bàn gỗ quanh quyển vở (Không có cạnh sắc)
      const lampPoolMat = new THREE.MeshBasicMaterial({
        map: createLampPoolTexture(),
        transparent: true,
        opacity: 0.88,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const lampPoolMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 2.45), lampPoolMat);
      lampPoolMesh.rotation.x = -Math.PI / 2;
      lampPoolMesh.position.set(-0.08, 0.054, 0.06);
      studyRoomGroup.add(lampPoolMesh);

      // 5. ĐỒ VẬT ĐỜI THỰC TRÊN BÀN BÓC TÁCH THÀNH ĐẠI SỐ TUYẾN TÍNH (Bút chì, Cốc nước, Chồng sách)
      const deskPropsGroup = new THREE.Group();
      studyRoomGroup.add(deskPropsGroup);

      const propSkinMat = new THREE.MeshStandardMaterial({
        color: 0x334155,
        roughness: 0.38,
        metalness: 0.22,
        transparent: true,
        opacity: 1.0,
      });
      const propMathLineMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });
      const propHyperplaneMat = new THREE.MeshBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const deskMathReveals = [];

      // 5A. Cây Bút Chì -> Biến thành Vector Định Hướng & Hệ Trục Cơ Sở Trực Chuẩn
      const pencilUnit = new THREE.Group();
      pencilUnit.position.set(1.08, 0.075, 0.38);
      pencilUnit.rotation.y = 0.42;
      const pencilBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.022, 0.022, 0.76, 6),
        propSkinMat
      );
      pencilBody.rotation.z = Math.PI / 2;
      pencilUnit.add(pencilBody);

      const pencilVectorPts = [
        new THREE.Vector3(-1.6, 0, 0),
        new THREE.Vector3(1.8, 0, 0),
        new THREE.Vector3(1.8, 0, 0),
        new THREE.Vector3(1.55, 0.14, 0),
        new THREE.Vector3(1.8, 0, 0),
        new THREE.Vector3(1.55, -0.14, 0),
        new THREE.Vector3(0, -0.95, 0),
        new THREE.Vector3(0, 0.95, 0),
        new THREE.Vector3(0, 0, -0.95),
        new THREE.Vector3(0, 0, 0.95),
      ];
      const pencilVectorLines = new THREE.LineSegments(
        new THREE.BufferGeometry().setFromPoints(pencilVectorPts),
        propMathLineMat
      );
      pencilVectorLines.visible = false;
      pencilUnit.add(pencilVectorLines);
      deskMathReveals.push(pencilVectorLines);
      deskPropsGroup.add(pencilUnit);

      // 5B. Chiếc Cốc Cà Phê -> Biến thành Trường Vector Xoáy Torus (Vector Field)
      const mugUnit = new THREE.Group();
      mugUnit.position.set(1.48, 0.24, -0.36);
      const mugCylinder = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.16, 0.38, 32),
        propSkinMat
      );
      const mugHandle = new THREE.Mesh(
        new THREE.TorusGeometry(0.095, 0.022, 12, 24, Math.PI),
        propSkinMat
      );
      mugHandle.position.set(0.17, 0.0, 0);
      mugHandle.rotation.z = -Math.PI / 2;
      mugUnit.add(mugCylinder, mugHandle);

      const mugFieldGeo = new THREE.EdgesGeometry(new THREE.TorusGeometry(0.34, 0.13, 10, 24));
      const mugFieldLines = new THREE.LineSegments(mugFieldGeo, propMathLineMat);
      mugFieldLines.visible = false;
      mugUnit.add(mugFieldLines);
      deskMathReveals.push(mugFieldLines);
      deskPropsGroup.add(mugUnit);

      // 5C. Chồng Sách Giáo Khoa -> Biến thành 3 Siêu Phẳng Giao Nhau (Intersecting Hyperplanes)
      const booksUnit = new THREE.Group();
      booksUnit.position.set(-1.42, 0.12, 0.42);
      for (let b = 0; b < 3; b++) {
        const bMesh = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.11, 0.96), propSkinMat);
        bMesh.position.y = b * 0.115;
        bMesh.rotation.y = (b - 1) * 0.12;
        booksUnit.add(bMesh);

        const hPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.45, 1.45), propHyperplaneMat);
        hPlane.rotation.set(b * 0.95, b * 0.65, b * 0.45);
        hPlane.visible = false;
        const hEdge = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.45, 1.45)),
          propMathLineMat
        );
        hPlane.add(hEdge);
        booksUnit.add(hPlane);
        deskMathReveals.push(hPlane);
      }
      deskPropsGroup.add(booksUnit);

      // 6. Quyển Vở Nháp Đang Mở & Các Sợi Mực Vector Trồi Lên Khỏi Mặt Giấy
      const notebookGroup = new THREE.Group();
      notebookGroup.position.set(0.0, 0.068, 0.14);
      studyRoomGroup.add(notebookGroup);

      const notebookTex = createHandwrittenNotebookTexture();
      const notebookMat = new THREE.MeshStandardMaterial({
        map: notebookTex,
        roughness: 0.68,
        metalness: 0.02,
        transparent: true,
        opacity: 1.0,
      });
      const notebookGeo = new THREE.PlaneGeometry(1.76, 1.22, 32, 24);
      // Uốn cong nhẹ 2 trang vở mở tự nhiên
      const nbPos = notebookGeo.attributes.position;
      for (let i = 0; i < nbPos.count; i++) {
        const x = nbPos.getX(i);
        const arch = Math.sin(Math.min(1, Math.abs(x) / 0.88) * Math.PI) * 0.032;
        nbPos.setZ(i, arch);
      }
      notebookGeo.computeVertexNormals();
      const notebookMesh = new THREE.Mesh(notebookGeo, notebookMat);
      notebookMesh.rotation.x = -Math.PI / 2;
      notebookGroup.add(notebookMesh);

      // 42 Sợi Dây Ánh Sáng Mực (Vector Threads) trồi từ mặt vở lên bầu trời sao ở Hồi II
      const inkThreadsGroup = new THREE.Group();
      scene.add(inkThreadsGroup);
      const inkThreadMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
      });

      const inkThreads = [];
      for (let t = 0; t < 42; t++) {
        const startX = ((t % 7) - 3) * 0.24 + (Math.random() - 0.5) * 0.08;
        const startZ = (Math.floor(t / 7) - 2.5) * 0.18 + 0.14;
        const pts = [];
        const segs = 28;
        for (let s = 0; s <= segs; s++) {
          const u = s / segs;
          const spiralA = u * Math.PI * 2.5 + t * 0.45;
          const spreadR = u * u * (2.2 + (t % 5) * 1.1);
          pts.push(
            new THREE.Vector3(
              startX + Math.cos(spiralA) * spreadR,
              0.08 + u * 21.5,
              startZ + Math.sin(spiralA) * spreadR
            )
          );
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        geo.setDrawRange(0, 0);
        const line = new THREE.Line(geo, inkThreadMat);
        inkThreadsGroup.add(line);
        inkThreads.push({ geo, totalVerts: segs + 1 });
      }

      // Lưới ô ly trang vở giãn nở ra thành Hệ Tọa Độ Không Gian 3D Vô Cực
      const expandingGridGroup = new THREE.Group();
      expandingGridGroup.position.set(0, 0.06, 0.14);
      scene.add(expandingGridGroup);
      const gridLineMat = new THREE.LineBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.0,
      });
      const gridPts = [];
      for (let i = -12; i <= 12; i++) {
        gridPts.push(new THREE.Vector3(i * 1.5, 0, -18), new THREE.Vector3(i * 1.5, 0, 18));
        gridPts.push(new THREE.Vector3(-18, 0, i * 1.5), new THREE.Vector3(18, 0, i * 1.5));
      }
      // 3 Trục Cơ Sở Không Gian X, Y, Z xuyên tâm
      gridPts.push(
        new THREE.Vector3(-24, 0, 0),
        new THREE.Vector3(24, 0, 0),
        new THREE.Vector3(0, -12, 0),
        new THREE.Vector3(0, 28, 0),
        new THREE.Vector3(0, 0, -24),
        new THREE.Vector3(0, 0, 24)
      );
      const expandingGridLines = new THREE.LineSegments(
        new THREE.BufferGeometry().setFromPoints(gridPts),
        gridLineMat
      );
      expandingGridGroup.add(expandingGridLines);

      // ============================================================================
      // HỒI III (y = 22, z = 0): MÀN ĐÊM ĐẦY SAO, CHÒM SAO VECTOR & VỆ TINH ĐỊNH VỊ TRÁI ĐẤT
      // ============================================================================
      const cosmosGroup = new THREE.Group();
      scene.add(cosmosGroup);

      const starSpriteTex = createStarSpriteTexture();

      // 2,600 Vì Sao Lấp Lánh Bao Trùm Bầu Trời Đêm
      const STAR_COUNT = 2600;
      const starGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(STAR_COUNT * 3);
      const starCol = new Float32Array(STAR_COUNT * 3);
      for (let i = 0; i < STAR_COUNT; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 42 + Math.random() * 95;
        starPos[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
        starPos[i * 3 + 1] = 22.0 + Math.sin(phi) * Math.sin(theta) * r * 0.75;
        starPos[i * 3 + 2] = -35.0 + Math.cos(phi) * r;

        const tint = i % 5;
        if (tint === 0) {
          starCol[i * 3] = 0.55;
          starCol[i * 3 + 1] = 0.85;
          starCol[i * 3 + 2] = 1.0;
        } else if (tint === 1) {
          starCol[i * 3] = 1.0;
          starCol[i * 3 + 1] = 0.92;
          starCol[i * 3 + 2] = 0.78;
        } else {
          starCol[i * 3] = 0.92;
          starCol[i * 3 + 1] = 0.96;
          starCol[i * 3 + 2] = 1.0;
        }
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute("color", new THREE.BufferAttribute(starCol, 3));
      const starFieldMat = new THREE.PointsMaterial({
        size: 0.95,
        map: starSpriteTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const starFieldPoints = new THREE.Points(starGeo, starFieldMat);
      cosmosGroup.add(starFieldPoints);

      // Dải Ngân Hà Bụi Sao Xanh Thẳm (Milky Way Stardust Band)
      const NEBULA_COUNT = 1600;
      const nebulaGeo = new THREE.BufferGeometry();
      const nebulaPos = new Float32Array(NEBULA_COUNT * 3);
      for (let i = 0; i < NEBULA_COUNT; i++) {
        const t = (Math.random() - 0.5) * 130;
        const bandSpread = (Math.random() - 0.5) * 16;
        nebulaPos[i * 3] = t * 0.85 + bandSpread;
        nebulaPos[i * 3 + 1] = 24.0 + t * 0.35 + (Math.random() - 0.5) * 9;
        nebulaPos[i * 3 + 2] = -28.0 - Math.abs(t) * 0.4 + (Math.random() - 0.5) * 22;
      }
      nebulaGeo.setAttribute("position", new THREE.BufferAttribute(nebulaPos, 3));
      const nebulaMat = new THREE.PointsMaterial({
        color: 0x0284c7,
        size: 1.65,
        map: starSpriteTex,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      cosmosGroup.add(new THREE.Points(nebulaGeo, nebulaMat));

      // Các Chòm Sao Nối Tia Sáng Vector Cơ Sở Trên Bầu Trời Đêm
      const constellationMat = new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.0,
      });
      const constellationPts = [];
      for (let c = 0; c < 12; c++) {
        const ang = (c / 12) * Math.PI * 2;
        const cx = Math.cos(ang) * 26;
        const cy = 22.0 + Math.sin(ang * 2) * 8.5 + 4.0;
        const cz = Math.sin(ang) * 22 - 12.0;
        let prev = new THREE.Vector3(cx, cy, cz);
        for (let s = 1; s <= 5; s++) {
          const next = new THREE.Vector3(
            cx + Math.cos(ang + s * 0.9) * (3.2 + s * 1.1),
            cy + Math.sin(s * 1.7 + c) * 3.4,
            cz + Math.sin(ang - s * 0.7) * 3.2
          );
          constellationPts.push(prev, next);
          prev = next;
        }
      }
      const constellationGeo = new THREE.BufferGeometry().setFromPoints(constellationPts);
      cosmosGroup.add(new THREE.LineSegments(constellationGeo, constellationMat));

      // Quả Địa Cầu Trắc Địa 3D & 4 Vệ Tinh Quét Tia Laser Định Vị (GPS Trilateration)
      const earthSatGroup = new THREE.Group();
      earthSatGroup.position.set(0.0, 22.0, 0.0);
      cosmosGroup.add(earthSatGroup);

      const earthWireMat = new THREE.LineBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.0,
      });
      const earthCoreMat = new THREE.MeshStandardMaterial({
        color: 0x0c2d5c,
        emissive: 0x072146,
        emissiveIntensity: 0.45,
        roughness: 0.52,
        metalness: 0.32,
        transparent: true,
        opacity: 0.0,
      });
      const earthSphere = new THREE.Mesh(new THREE.SphereGeometry(3.15, 32, 24), earthCoreMat);
      earthSphere.add(
        new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.SphereGeometry(3.18, 24, 16)),
          earthWireMat
        )
      );
      earthSatGroup.add(earthSphere);

      // 3 Vòng Hệ Trục Cơ Sở Thiên Cầu quanh Trái Đất
      [3.9, 4.8, 5.7].forEach((r, idx) => {
        const ring = new THREE.LineLoop(
          new THREE.EdgesGeometry(new THREE.RingGeometry(r, r + 0.02, 72)),
          constellationMat
        );
        ring.rotation.set(idx * 0.65 + 0.4, idx * 0.85, 0);
        earthSatGroup.add(ring);
      });

      // Điểm Đích Định Vị Trên Mặt Đất + Hệ 3 Vector Trực Chuẩn Tại Điểm Giao
      const gpsTargetPos = new THREE.Vector3(1.65, 1.85, 1.98);
      const gpsTargetTriad = new THREE.LineSegments(
        new THREE.BufferGeometry().setFromPoints([
          gpsTargetPos,
          gpsTargetPos.clone().add(new THREE.Vector3(0.95, 0, 0)),
          gpsTargetPos,
          gpsTargetPos.clone().add(new THREE.Vector3(0, 0.95, 0)),
          gpsTargetPos,
          gpsTargetPos.clone().add(new THREE.Vector3(0, 0, 0.95)),
        ]),
        new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.0 })
      );
      earthSatGroup.add(gpsTargetTriad);

      // 4 Vệ Tinh Quỹ Đạo Vàng Ròng (Aerospace Gold Foil + Glowing Solar Arrays) & 4 Chùm Tia Định Vị
      const satLaserMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
      });
      const satGoldFoilMat = new THREE.MeshStandardMaterial({
        color: 0xf59e0b,
        emissive: 0xd97706,
        emissiveIntensity: 0.68,
        roughness: 0.22,
        metalness: 0.88,
        transparent: true,
        opacity: 0.0,
      });
      const satSolarPanelMat = new THREE.MeshStandardMaterial({
        color: 0x0369a1,
        emissive: 0x38bdf8,
        emissiveIntensity: 0.85,
        roughness: 0.25,
        metalness: 0.65,
        transparent: true,
        opacity: 0.0,
      });
      const satSolarGridMat = new THREE.LineBasicMaterial({
        color: 0xbae6fd,
        transparent: true,
        opacity: 0.0,
      });
      const satBeaconMat = new THREE.MeshBasicMaterial({
        color: 0xfef08a,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
      });

      const satellites = [];
      const satLaserGeo = new THREE.BufferGeometry();
      const satLaserPositions = new Float32Array(4 * 2 * 3);
      satLaserGeo.setAttribute("position", new THREE.BufferAttribute(satLaserPositions, 3));
      const satLaserLines = new THREE.LineSegments(satLaserGeo, satLaserMat);
      earthSatGroup.add(satLaserLines);

      for (let s = 0; s < 4; s++) {
        const satUnit = new THREE.Group();
        satUnit.scale.setScalar(0.78);

        // Thân vệ tinh bọc vàng cách nhiệt vũ trụ (Gold MLI Foil Bus)
        const bodyGeo = new THREE.BoxGeometry(0.42, 0.42, 0.68);
        const body = new THREE.Mesh(bodyGeo, satGoldFoilMat);
        body.add(new THREE.LineSegments(new THREE.EdgesGeometry(bodyGeo), satSolarGridMat));

        // 2 Cánh pin mặt trời quang điện (Photovoltaic Solar Arrays) kẻ lưới vi mạch
        const wingGeo = new THREE.BoxGeometry(1.55, 0.04, 0.52, 6, 1, 2);
        const wingL = new THREE.Mesh(wingGeo, satSolarPanelMat);
        wingL.position.x = -1.08;
        wingL.add(new THREE.LineSegments(new THREE.WireframeGeometry(wingGeo), satSolarGridMat));

        const wingR = new THREE.Mesh(wingGeo, satSolarPanelMat);
        wingR.position.x = 1.08;
        wingR.add(new THREE.LineSegments(new THREE.WireframeGeometry(wingGeo), satSolarGridMat));

        // Chảo ăng-ten parabol hướng về tâm Trái Đất (+Z khi lookAt(0,0,0))
        const dishGeo = new THREE.ConeGeometry(0.26, 0.2, 16, 1, true);
        dishGeo.rotateX(-Math.PI / 2);
        const dish = new THREE.Mesh(dishGeo, satGoldFoilMat);
        dish.position.z = 0.45;

        // Đèn chớp tín hiệu dẫn đường (Navigation Strobe Beacon)
        const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), satBeaconMat);
        beacon.position.set(0, 0.34, 0);

        satUnit.add(body, wingL, wingR, dish, beacon);
        earthSatGroup.add(satUnit);
        satellites.push({
          group: satUnit,
          beacon,
          radius: 6.4 + (s % 2) * 1.15,
          speed: 0.45 + s * 0.12,
          phase: (s / 4) * Math.PI * 2,
          inclination: 0.42 + s * 0.28,
        });
      }

      // ============================================================================
      // HỒI IV (y = 0, z = -38): KIẾN TRÚC ĐÔ THỊ, NỘI LỰC CẦU DÂY VĂNG & ĐỒ THỊ LUỒNG GIAO THÔNG
      // ============================================================================
      const realWorldGroup = new THREE.Group();
      realWorldGroup.position.set(0.0, 0.0, -38.0);
      scene.add(realWorldGroup);

      const cityWinTex = createCityWindowTexture();

      const citySolidMat = new THREE.MeshStandardMaterial({
        color: 0x162238,
        map: cityWinTex,
        emissive: 0x38bdf8,
        emissiveMap: cityWinTex,
        emissiveIntensity: 0.78,
        roughness: 0.28,
        metalness: 0.62,
        transparent: true,
        opacity: 0.0,
      });
      const bridgeConcreteMat = new THREE.MeshStandardMaterial({
        color: 0xcbd5e1,
        emissive: 0x334155,
        emissiveIntensity: 0.38,
        roughness: 0.42,
        metalness: 0.28,
        transparent: true,
        opacity: 0.0,
      });
      const bridgeAsphaltMat = new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        emissive: 0x0f172a,
        emissiveIntensity: 0.35,
        roughness: 0.68,
        metalness: 0.18,
        transparent: true,
        opacity: 0.0,
      });
      const cityWireMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });
      const citySubWireMat = new THREE.LineBasicMaterial({
        color: 0x0ea5e9,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });
      const bridgeTensionMat = new THREE.LineBasicMaterial({
        color: 0xfbbf24,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });

      const cityMeshGroup = new THREE.Group();
      cityMeshGroup.position.set(0, -4.8, 0);
      realWorldGroup.add(cityMeshGroup);

      // Lưới đại lộ phản chiếu mặt đất đô thị (Metropolis Ground Grid Backdrop)
      const cityGroundGridMat = new THREE.LineBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });
      const cityGroundGridPts = [];
      for (let g = -16; g <= 16; g += 2) {
        cityGroundGridPts.push(
          new THREE.Vector3(g * 1.1, 0.02, -14.0),
          new THREE.Vector3(g * 1.1, 0.02, 12.0),
          new THREE.Vector3(-18.0, 0.02, g * 0.8),
          new THREE.Vector3(18.0, 0.02, g * 0.8)
        );
      }
      cityMeshGroup.add(
        new THREE.LineSegments(
          new THREE.BufferGeometry().setFromPoints(cityGroundGridPts),
          cityGroundGridMat
        )
      );

      for (let b = 0; b < 32; b++) {
        const bx = ((b % 8) - 3.5) * 3.25 + (b % 2) * 0.55;
        const bz = (Math.floor(b / 8) - 1.5) * 4.4;
        if (Math.abs(bx) < 2.8 && Math.abs(bz - 1.8) < 3.2) continue;
        const bh = 2.8 + ((b * 17) % 8) * 1.42;
        const bw = 1.45 + (b % 3) * 0.45;
        const bd = 1.45 + ((b + 1) % 3) * 0.45;

        const bGeo = new THREE.BoxGeometry(bw, bh, bd, 2, Math.max(2, Math.floor(bh)), 2);
        const solidTower = new THREE.Mesh(bGeo, citySolidMat);
        solidTower.position.set(bx, bh / 2, bz);
        const wireTower = new THREE.LineSegments(new THREE.WireframeGeometry(bGeo), citySubWireMat);
        solidTower.add(wireTower);
        cityMeshGroup.add(solidTower);
      }

      // Cây Cầu Treo Dây Văng Đời Thực (Mặt đường nhựa Asphalt + Tháp Pylon bê tông trắng xám + Khung FEM)
      const bridgeDeckGeo = new THREE.BoxGeometry(25.0, 0.32, 2.35, 26, 1, 2);
      const bridgeDeck = new THREE.Mesh(bridgeDeckGeo, bridgeAsphaltMat);
      bridgeDeck.position.set(0, 1.85, 1.8);
      bridgeDeck.add(new THREE.LineSegments(new THREE.WireframeGeometry(bridgeDeckGeo), cityWireMat));
      cityMeshGroup.add(bridgeDeck);

      [-6.8, 6.8].forEach((px) => {
        const pylonGeo = new THREE.BoxGeometry(0.72, 7.8, 2.4, 2, 8, 2);
        const pylon = new THREE.Mesh(pylonGeo, bridgeConcreteMat);
        pylon.position.set(px, 3.9, 1.8);
        pylon.add(new THREE.LineSegments(new THREE.WireframeGeometry(pylonGeo), cityWireMat));
        cityMeshGroup.add(pylon);

        const cablePts = [];
        for (let c = -6; c <= 6; c++) {
          if (c === 0) continue;
          cablePts.push(
            new THREE.Vector3(px, 7.45, 0.75),
            new THREE.Vector3(px + c * 0.95, 2.0, 0.75),
            new THREE.Vector3(px, 7.45, 2.85),
            new THREE.Vector3(px + c * 0.95, 2.0, 2.85)
          );
        }
        cityMeshGroup.add(
          new THREE.LineSegments(
            new THREE.BufferGeometry().setFromPoints(cablePts),
            bridgeTensionMat
          )
        );
      });

      // Đồ Thị Luồng Giao Thông Đô Thị (Markov Chain Traffic Flow Particles)
      const TRAFFIC_COUNT = 90;
      const trafficGeo = new THREE.BufferGeometry();
      const trafficPos = new Float32Array(TRAFFIC_COUNT * 3);
      trafficGeo.setAttribute("position", new THREE.BufferAttribute(trafficPos, 3));
      const trafficMat = new THREE.PointsMaterial({
        color: 0xfbbf24,
        size: 0.42,
        map: starSpriteTex,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const trafficPoints = new THREE.Points(trafficGeo, trafficMat);
      cityMeshGroup.add(trafficPoints);

      // Vòng Quét Bóc Tách Thực Tại (De-Texturing Scanner Wave)
      const scannerRingMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const scannerRingMesh = new THREE.Mesh(
        new THREE.RingGeometry(0.2, 16.5, 64),
        scannerRingMat
      );
      realWorldGroup.add(scannerRingMesh);

      // ============================================================================
      // HỒI V (y = 0, z = -64): PHI CƠ PHẢN LỰC HỢP KIM ĐỜI THỰC, BUỒNG HẦM GIÓ & GIMBAL
      // ============================================================================
      const aerospaceGroup = new THREE.Group();
      aerospaceGroup.position.set(0.0, 1.2, -64.0);
      scene.add(aerospaceGroup);

      const aeroSolidMat = new THREE.MeshStandardMaterial({
        color: 0x94a3b8,
        emissive: 0x1e293b,
        emissiveIntensity: 0.42,
        roughness: 0.24,
        metalness: 0.82,
        transparent: true,
        opacity: 0.0,
      });
      const aeroCanopyMat = new THREE.MeshPhysicalMaterial({
        color: 0xf59e0b,
        emissive: 0xd97706,
        emissiveIntensity: 0.38,
        roughness: 0.08,
        metalness: 0.25,
        clearcoat: 1.0,
        transparent: true,
        opacity: 0.0,
      });
      const aeroWireMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });
      const aeroSubWireMat = new THREE.LineBasicMaterial({
        color: 0x34d399,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });
      const windTunnelRingMat = new THREE.LineBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      });

      // Hậu cảnh Vòm Hầm Gió Khí Động Học 3D (Aerodynamic Wind-Tunnel Enclosure)
      const tunnelRings = [];
      for (let tr = 0; tr < 9; tr++) {
        const tz = (tr - 4) * 3.2;
        const tRing = new THREE.LineLoop(
          new THREE.EdgesGeometry(new THREE.RingGeometry(8.2, 8.28, 48)),
          windTunnelRingMat
        );
        tRing.position.z = tz;
        aerospaceGroup.add(tRing);
        tunnelRings.push(tRing);
      }

      const aircraftMeshGroup = new THREE.Group();
      aerospaceGroup.add(aircraftMeshGroup);

      // 1. Mũi kim đo áp suất khí động học & Chóp nón Radome vuốt nhọn (Radome Nose & Pitot Probe)
      const noseGeo = new THREE.ConeGeometry(0.58, 3.2, 16);
      noseGeo.rotateX(-Math.PI / 2);
      noseGeo.scale(1.22, 0.68, 1.0); // Vát dẹt tạo mép chine khí động học
      const noseMesh = new THREE.Mesh(noseGeo, aeroSolidMat);
      noseMesh.position.set(0, 0, -3.1);
      noseMesh.add(new THREE.LineSegments(new THREE.WireframeGeometry(noseGeo), aeroWireMat));

      const pitotGeo = new THREE.CylinderGeometry(0.025, 0.025, 1.1, 8);
      pitotGeo.rotateX(-Math.PI / 2);
      const pitotMesh = new THREE.Mesh(pitotGeo, aeroSolidMat);
      pitotMesh.position.set(0, 0, -5.0);

      // 2. Thân chính Blended Wing-Body đa giác tàng hình (Faceted Lifting-Body Fuselage)
      const fuselageGeo = new THREE.CylinderGeometry(0.74, 0.92, 4.8, 8);
      fuselageGeo.rotateX(-Math.PI / 2);
      fuselageGeo.scale(1.68, 0.64, 1.0); // Thân nâng khí động học
      const fMesh = new THREE.Mesh(fuselageGeo, aeroSolidMat);
      fMesh.position.set(0, 0, 0.4);
      fMesh.add(new THREE.LineSegments(new THREE.WireframeGeometry(fuselageGeo), aeroWireMat));

      // 3. Buồng lái kính giọt nước vuốt thuôn mượt mà (Streamlined Teardrop Canopy)
      // Vuốt liền vào sống lưng phi cơ, loại bỏ hoàn toàn khối cầu tròn thô
      const canopyGeo = new THREE.SphereGeometry(0.40, 24, 16);
      canopyGeo.scale(0.78, 0.62, 2.7);
      const canopyMesh = new THREE.Mesh(canopyGeo, aeroCanopyMat);
      canopyMesh.position.set(0, 0.36, -1.05);

      // 4. Hai Cửa Hút Khí Động Học DSI vát góc 2 bên thân (Twin Chiseled Supersonic Intakes)
      const intakeGeo = new THREE.BoxGeometry(0.54, 0.38, 2.2);
      const intakeMeshL = new THREE.Mesh(intakeGeo, aeroSolidMat);
      intakeMeshL.position.set(-1.02, -0.12, -0.35);
      intakeMeshL.rotation.y = 0.06;
      intakeMeshL.add(new THREE.LineSegments(new THREE.WireframeGeometry(intakeGeo), aeroWireMat));

      const intakeMeshR = new THREE.Mesh(intakeGeo, aeroSolidMat);
      intakeMeshR.position.set(1.02, -0.12, -0.35);
      intakeMeshR.rotation.y = -0.06;
      intakeMeshR.add(new THREE.LineSegments(new THREE.WireframeGeometry(intakeGeo), aeroWireMat));

      // 5. Cánh Chính Tam Giác Xuôi Góc Siêu Thanh (Cánh Delta Swept Wing chuẩn tiêm kích hiện đại)
      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, -1.5);      // Mép trước gốc cánh (tiếp giáp buồng lái)
      wingShape.lineTo(4.1, 1.05);    // Mút cánh ngoài (sải cánh rộng 8.2m)
      wingShape.lineTo(4.0, 1.65);    // Bản lề mép cánh ngoài
      wingShape.lineTo(1.15, 1.95);   // Mép sau cánh trong
      wingShape.lineTo(0, 2.2);       // Gốc sau cánh
      wingShape.lineTo(-1.15, 1.95);
      wingShape.lineTo(-4.0, 1.65);
      wingShape.lineTo(-4.1, 1.05);
      wingShape.closePath();

      const extrudeSettings = {
        depth: 0.11,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.035,
        bevelThickness: 0.035,
      };
      const mainWingGeo = new THREE.ExtrudeGeometry(wingShape, extrudeSettings);
      mainWingGeo.rotateX(Math.PI / 2);
      mainWingGeo.center();
      const wMesh = new THREE.Mesh(mainWingGeo, aeroSolidMat);
      wMesh.position.set(0, -0.02, 0.45);
      wMesh.add(new THREE.LineSegments(new THREE.WireframeGeometry(mainWingGeo), aeroWireMat));

      // 6. Cặp Cánh Đuôi Ngang Cơ Động Toàn Phần (All-Moving Horizontal Stabilators)
      const hTailShape = new THREE.Shape();
      hTailShape.moveTo(0, 0);
      hTailShape.lineTo(1.8, 0.9);
      hTailShape.lineTo(1.6, 1.4);
      hTailShape.lineTo(0, 1.3);
      hTailShape.closePath();

      const hTailGeo = new THREE.ExtrudeGeometry(hTailShape, { depth: 0.07, bevelEnabled: false });
      hTailGeo.rotateX(Math.PI / 2);

      const hTailMeshL = new THREE.Mesh(hTailGeo, aeroSolidMat);
      hTailMeshL.position.set(-0.95, -0.02, 2.2);
      hTailMeshL.rotation.y = Math.PI;
      hTailMeshL.add(new THREE.LineSegments(new THREE.WireframeGeometry(hTailGeo), aeroWireMat));

      const hTailMeshR = new THREE.Mesh(hTailGeo, aeroSolidMat);
      hTailMeshR.position.set(0.95, -0.02, 2.2);
      hTailMeshR.add(new THREE.LineSegments(new THREE.WireframeGeometry(hTailGeo), aeroWireMat));

      // 7. Cặp Cánh Đuôi Đứng Vát Nghiêng Thể Thao Tàng Hình (Twin Canted Vertical Stabilizers)
      const vTailShape = new THREE.Shape();
      vTailShape.moveTo(0, 0);       // Chân đuôi trước
      vTailShape.lineTo(0.72, 1.7);  // Đỉnh đuôi vát nhọn 48°
      vTailShape.lineTo(1.6, 1.7);   // Đỉnh mép sau
      vTailShape.lineTo(1.9, 0);     // Chân đuôi sau
      vTailShape.closePath();

      const vTailGeo = new THREE.ExtrudeGeometry(vTailShape, { depth: 0.08, bevelEnabled: false });
      vTailGeo.center();

      const tMeshL = new THREE.Mesh(vTailGeo, aeroSolidMat);
      tMeshL.position.set(-0.92, 0.88, 2.1);
      tMeshL.rotation.y = Math.PI / 2;
      tMeshL.rotation.x = -0.26; // Vát nghiêng ra ngoài 15° chuẩn F-22/Su-57
      tMeshL.add(new THREE.LineSegments(new THREE.WireframeGeometry(vTailGeo), aeroWireMat));

      const tMeshR = new THREE.Mesh(vTailGeo, aeroSolidMat);
      tMeshR.position.set(0.92, 0.88, 2.1);
      tMeshR.rotation.y = Math.PI / 2;
      tMeshR.rotation.x = 0.26;  // Vát nghiêng ra ngoài 15°
      tMeshR.add(new THREE.LineSegments(new THREE.WireframeGeometry(vTailGeo), aeroWireMat));

      // 8. Cặp Ống Xả Phản Lực Kép Titan (Twin Titanium Exhaust Nozzles)
      const nozzleGeo = new THREE.CylinderGeometry(0.35, 0.40, 0.72, 16, 1, true);
      nozzleGeo.rotateX(-Math.PI / 2);
      const nozzleMeshL = new THREE.Mesh(nozzleGeo, aeroSolidMat);
      nozzleMeshL.position.set(-0.52, 0, 2.65);
      const nozzleMeshR = new THREE.Mesh(nozzleGeo, aeroSolidMat);
      nozzleMeshR.position.set(0.52, 0, 2.65);

      // Nón Sóng Xung Kích Mach Siêu Thanh (Mach Shockwave Cone) & Luồng Lửa Kép Đốt Sau
      const machConeGeo = new THREE.ConeGeometry(3.6, 6.2, 32, 4, true);
      machConeGeo.rotateX(-Math.PI / 2);
      const machConeMat = new THREE.MeshBasicMaterial({

      // 2. Chuỗi Xoắn Kép Phân Tử DNA Đời Thực (Photphat Vàng + Base Đỏ/Lam)
      const dnaHelixGroup = new THREE.Group();

            colHex = 0xf59e0b;
            channelLayer = 0;
            singularWeight = 1.8;
          } else if (distSun < 0.32) {
            colHex = 0x38bdf8;
            channelLayer = 1;
            singularWeight = 1.3;
          } else if (v < mountainHeight) {
            colHex = v < 0.2 ? 0x0284c7 : 0x1e3a5f;

            singularWeight = 0.9 + (c % 3) * 0.25;

      const R_IN = 3.2;    // Lục giác trong
