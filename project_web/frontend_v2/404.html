<!doctype html>
<html lang="vi">
  <head>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('vec_theme') || localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark', 'dark-theme');
            document.documentElement.style.backgroundColor = '#0e0f12';
          } else {
            document.documentElement.classList.remove('dark', 'dark-theme');
            document.documentElement.style.backgroundColor = '#fcfcfd';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Trang không tồn tại | Vectoria</title>
    <meta name="description" content="Trang bạn tìm kiếm không tồn tại trên Vectoria." />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <link rel="stylesheet" href="css/radix_colors.css" />
    <link rel="stylesheet" href="css/global-search.css" />
    <script src="js/utils/theme-manager.js"></script>
    <style>
      :root {
        --bg-base: #fcfcfd;
        --bg-surface: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-subtle: #e2e8f0;
        --border-strong: #cbd5e1;
        --primary-base: #2563eb;
        --primary-hover: #1d4ed8;
        --accent-glow: rgba(37, 99, 235, 0.08);
        --font-ui: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .dark {
        --bg-base: #0e0f12;
        --bg-surface: #16171b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-subtle: #27272a;
        --border-strong: #3f3f46;
        --primary-base: #3b82f6;
        --primary-hover: #60a5fa;
        --accent-glow: rgba(59, 130, 246, 0.12);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: var(--font-ui);
        background: var(--bg-base);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
        text-align: center;
        overflow-x: hidden;
        position: relative;
        transition: background 0.25s ease, color 0.25s ease;
      }

      /* Fullscreen subtle architectural dot grid - blends seamlessly across entire viewport */
      .bg-dot-grid {
        position: fixed;
        inset: 0;
        background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.35;
        mask-image: radial-gradient(circle at 50% 46%, black 25%, transparent 75%);
        -webkit-mask-image: radial-gradient(circle at 50% 46%, black 25%, transparent 75%);
        pointer-events: none;
        z-index: 0;
      }

      /* Ambient soft glow centered on mascot */
      .ambient-glow {
        position: fixed;
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 560px;
        height: 560px;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }

      .error-container {
        position: relative;
        z-index: 10;
        max-width: 520px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Stage: Natural, unconfined mascot stage directly on the page */
      .stage-wrap {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }

      /* Nori Mascot Actor Container */
      .nori-actor-box {
        position: relative;
        width: 150px;
        height: 150px;
        cursor: pointer;
        user-select: none;
        transform-origin: center bottom;
        transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      /* Keyframes */
      @keyframes noriBreathe {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        50% { transform: translateY(-3px) scale(1.02, 0.98); }
      }

      @keyframes noriSpringHop {
        0% { transform: translateY(0) scale(1, 1); }
        20% { transform: translateY(6px) scale(1.08, 0.92); }
        45% { transform: translateY(-16px) scale(0.95, 1.06); }
        70% { transform: translateY(0) scale(1.04, 0.96); }
        85% { transform: translateY(-4px) scale(0.98, 1.02); }
        100% { transform: translateY(0) scale(1, 1); }
      }

      .actor-breathe {
        animation: noriBreathe 3.4s infinite ease-in-out;
      }
      .actor-bounce {
        animation: noriSpringHop 0.75s cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      /* Clean, Modern Typography */
      .error-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.18);
        color: var(--primary-base);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        margin-bottom: 0.75rem;
      }

      .error-title {
        font-size: clamp(1.4rem, 4vw, 1.85rem);
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.025em;
        color: var(--text-main);
      }

      .error-desc {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        line-height: 1.65;
        color: var(--text-muted);
        max-width: 440px;
      }

      .error-actions {
        margin-top: 2rem;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.6rem;
        background: var(--primary-base);
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 0.92rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s ease;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.6rem;
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        font-size: 0.92rem;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease, transform 0.15s ease;
      }
      .btn-secondary:hover {
        background: var(--bg-surface);
        border-color: var(--text-muted);
        transform: translateY(-1px);
      }

      .error-hint {
        margin-top: 2.5rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        opacity: 0.75;
      }

      @media (max-width: 520px) {
        .error-actions { flex-direction: column; }
        .btn-primary, .btn-secondary { width: 100%; }
      }
    </style>
  </head>
  <body>

    <div class="ambient-glow"></div>

    <div class="error-container">

          <svg id="noriSvg" width="150" height="150" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block; overflow:visible;">
            <defs>
              <radialGradient id="nori-body-grad" cx="45%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#f59e0b"/>

              </radialGradient>

            <!-- Main Mascot Group -->
            <g id="noriGroup" style="transform-origin: 50px 80px; transition: transform 0.25s ease-out;">
              <!-- Ears -->
              <g id="leftEar" style="transform-origin: 28px 24px; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);">
                <ellipse cx="28" cy="22" rx="10" ry="9" fill="url(#nori-body-grad)" stroke="#78350f" stroke-width="1.6"/>
                <ellipse cx="28.5" cy="22.5" rx="6.0" ry="5.2" fill="#fecdd3"/>
              </g>

                <ellipse cx="71.5" cy="22.5" rx="6.0" ry="5.2" fill="#fecdd3"/>

              <ellipse id="leftFoot" cx="36" cy="85" rx="7" ry="4.5" fill="#d97706" stroke="#78350f" stroke-width="1.4"/>
              <ellipse id="rightFoot" cx="64" cy="85" rx="7" ry="4.5" fill="#d97706" stroke="#78350f" stroke-width="1.4"/>

              <path d="

                C 80 58, 76 68, 68 76
                C 60 83, 40 83, 32 76
                C 24 68, 20 58, 20 46
                C 20 32, 32 20, 50 20 Z

              <!-- Cream Belly / Muzzle Patch -->
              <path d="
                M 50 44

                C 71 74, 62 79, 50 79
                C 38 79, 29 74, 29 64
                C 29 52, 38 44, 50 44 Z

              <!-- Cheeks Blush -->
              <ellipse cx="28" cy="55" rx="4.5" ry="2.8" fill="rgba(244, 63, 94, 0.45)"/>
              <ellipse cx="72" cy="55" rx="4.5" ry="2.8" fill="rgba(244, 63, 94, 0.45)"/>

              <!-- Eyebrows -->
              <g id="eyebrowsGroup">

                <path id="rightBrow" d="M 56 38 Q 62 35 67 40" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
              </g>

              <!-- Expressive Eyes -->
              <g id="eyesGroup">
                <g id="openEyes">
                  <ellipse cx="38" cy="49" rx="5.5" ry="6.2" fill="#292524"/>
                  <ellipse cx="62" cy="49" rx="5.5" ry="6.2" fill="#292524"/>
                  <g id="pupilsGroup" style="transition: transform 0.08s ease-out;">
                    <circle cx="39.5" cy="47.5" r="2.2" fill="#ffffff"/>

                    <circle cx="63.5" cy="47.5" r="2.2" fill="#ffffff"/>

                </g>
              </g>

              <!-- Nose -->
              <ellipse cx="50" cy="54" rx="1.5" ry="1.1" fill="#292524" opacity="0.65"/>

                <path id="mouthOpen" d="M 47 61 Q 50 64 53 61" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none"/>

              <!-- Hand-written 404 Signboard Group -->
              <g id="signboardGroup" style="transform-origin: 50px 70px; transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);">
                <g id="signboardPlate" style="transform-origin: 50px 70px; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
                  <!-- Front: Handwritten 404 on paper signboard -->
                  <g id="signFront">
                    <rect x="18" y="55" width="64" height="30" rx="4" fill="#fffbeb" stroke="#78350f" stroke-width="1.8"/>
                    <rect x="20.5" y="57.5" width="59" height="25" rx="2.5" fill="none" stroke="#fcd34d" stroke-width="0.8" stroke-dasharray="3 2"/>
                    <path d="M 32 62 L 26 72 L 38 72 M 35 60 L 35 78" stroke="#78350f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <ellipse cx="50" cy="70" rx="5.5" ry="7.2" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <path d="M 68 62 L 62 72 L 74 72 M 71 60 L 71 78" stroke="#78350f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  </g>

                  <!-- Back: Home navigation symbol -->
                  <g id="signBack" style="display: none;">

                    <rect x="20.5" y="57.5" width="59" height="25" rx="2.5" fill="none" stroke="#eab308" stroke-width="0.8" stroke-dasharray="3 2"/>

                  <ellipse cx="77" cy="57" rx="4.8" ry="3.8" fill="#f59e0b" stroke="#78350f" stroke-width="1.2"/>

      <div class="error-status-badge">Lỗi 404</div>
      <h1 class="error-title">Trang không tồn tại</h1>
      <p class="error-desc">
        Liên kết bạn truy cập không tồn tại hoặc đã được chuyển sang địa chỉ khác. Bạn có thể quay về trang chủ hoặc tìm kiếm trong thư viện kiến thức.

      <div class="error-actions">
        <a href="index.html" class="btn-primary" id="btnHome">

          Về trang chủ
        </a>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>

      <p class="error-hint">Mã phản hồi HTTP: 404 Not Found</p>
    </div>

    <script src="js/utils/toast.js"></script>
    <script src="js/utils/global-search.js"></script>
    <script>
      (function() {
        const noriActor = document.getElementById('noriActor');
        const noriGroup = document.getElementById('noriGroup');
        const pupilsGroup = document.getElementById('pupilsGroup');
        const openEyes = document.getElementById('openEyes');
        const happyEyes = document.getElementById('happyEyes');
        const signboardGroup = document.getElementById('signboardGroup');
        const signboardPlate = document.getElementById('signboardPlate');
        const signFront = document.getElementById('signFront');
        const signBack = document.getElementById('signBack');
        const leftEar = document.getElementById('leftEar');
        const rightEar = document.getElementById('rightEar');
        const btnHome = document.getElementById('btnHome');

        let isSignFlipped = false;
        let naturalBlinkTimer = null;

        // Signboard flip on click
        function flipSignboard() {
          if (!signboardPlate) return;
          signboardPlate.style.transform = 'scale(0, 1)';
          setTimeout(() => {
            isSignFlipped = !isSignFlipped;
            if (isSignFlipped) {
              if (signFront) signFront.style.display = 'none';
              if (signBack) signBack.style.display = 'block';
              openEyes.style.display = 'none';
              happyEyes.style.display = 'block';
              setTimeout(() => {
                openEyes.style.display = 'block';
                happyEyes.style.display = 'none';
              }, 600);
            } else {
              if (signFront) signFront.style.display = 'block';
              if (signBack) signBack.style.display = 'none';
            }
            signboardPlate.style.transform = 'scale(1, 1)';
          }, 160);
        }

        // Mouse tracking for subtle eye and signboard tilt
        window.addEventListener('mousemove', (e) => {
          const rect = noriActor.getBoundingClientRect();
          const noriCenterX = rect.left + rect.width / 2;
          const noriCenterY = rect.top + rect.height / 2;
          const dx = e.clientX - noriCenterX;
          const dy = e.clientY - noriCenterY;
          const angle = Math.atan2(dy, dx);
          const dist = Math.hypot(dx, dy);

          const maxPupilDist = 2.4;
          const pupilShift = Math.min(maxPupilDist, dist * 0.012);
          const px = Math.cos(angle) * pupilShift;
          const py = Math.sin(angle) * pupilShift;
          pupilsGroup.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;

          const signTilt = Math.max(-3, Math.min(3, (dx / window.innerWidth) * 6));
          noriGroup.style.transform = `rotate(${signTilt.toFixed(1)}deg)`;
        });

        // Hover shy peek when cursor hovers Nori
        noriActor.addEventListener('mouseenter', () => {
          signboardGroup.style.transform = 'translateY(-6px)';
          leftEar.style.transform = 'rotate(-10deg)';
          rightEar.style.transform = 'rotate(10deg)';
        });
        noriActor.addEventListener('mouseleave', () => {
          signboardGroup.style.transform = 'translateY(0px)';
          leftEar.style.transform = 'rotate(-6deg)';
          rightEar.style.transform = 'rotate(6deg)';
        });

        // Hover button "Về trang chủ": Nori anticipates warmly
        if (btnHome) {
          btnHome.addEventListener('mouseenter', () => {
            pupilsGroup.style.transform = 'translate(0px, 2.5px)';
            leftEar.style.transform = 'rotate(-12deg)';
            rightEar.style.transform = 'rotate(12deg)';
          });
          btnHome.addEventListener('mouseleave', () => {
            pupilsGroup.style.transform = 'translate(0px, 0px)';
            leftEar.style.transform = 'rotate(-6deg)';
            rightEar.style.transform = 'rotate(6deg)';
          });
        }

        // Click on Nori: spring bounce & toggle sign
        noriActor.addEventListener('click', () => {
          flipSignboard();

          noriActor.classList.remove('actor-breathe');
          void noriActor.offsetWidth;
          noriActor.classList.add('actor-bounce');

          openEyes.style.display = 'none';
          happyEyes.style.display = 'block';

          setTimeout(() => {
            openEyes.style.display = 'block';
            happyEyes.style.display = 'none';
            noriActor.classList.add('actor-breathe');
          }, 500);
        });

        // Natural subtle blinking
        function scheduleNaturalBlink() {
          const nextBlink = 3000 + Math.random() * 4000;
          naturalBlinkTimer = setTimeout(() => {
            if (happyEyes.style.display !== 'block') {
              openEyes.style.display = 'none';
              happyEyes.style.display = 'block';
              setTimeout(() => {
                openEyes.style.display = 'block';
                happyEyes.style.display = 'none';
              }, 140);
            }
            scheduleNaturalBlink();
          }, nextBlink);
        }
        scheduleNaturalBlink();
      })();
    </script>
  </body>
</html>
