<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu — Vectoria</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/radix_colors.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script src="js/app/api/endpoints.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-base);
            background-image:
                linear-gradient(rgba(0, 144, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 144, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .reset-container {
            width: 100%;
            max-width: 420px;
            margin: 20px;
        }
        .reset-card {
            background: var(--bg-card);
            padding: 40px 35px;
            border-radius: 16px;
            border: 1px solid var(--border-strong);
        }
        .reset-card::before {
            content: '';
            display: block;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-base), #60a5fa);
            border-radius: 16px 16px 0 0;
            margin: -40px -35px 32px -35px;
            width: calc(100% + 70px);
        }
        .brand-text {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-text h1 {
            font-family: 'Lora', serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: var(--text-main);
        }
        .brand-text p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-base);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--primary-base);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary-base);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status-msg {
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .status-msg.success { color: var(--success-base); }
        .status-msg.error { color: var(--danger-base); }

        .success-state {
            text-align: center;
            padding: 20px 0;
        }
        .success-state i {
            font-size: 48px;
            color: var(--success-base);
            margin-bottom: 16px;
        }
        .success-state h2 {
            font-family: 'Lora', serif;
            font-size: 1.3rem;
            margin: 0 0 8px 0;
        }
        .success-state p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .success-state a {
            display: inline-block;
            margin-top: 16px;
            color: var(--primary-base);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .success-state a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 30px 20px;
            }
            .reset-card::before {
                margin: -30px -20px 24px -20px;
                width: calc(100% + 40px);
            }
        }
    </style>
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-theme', 'dark');
    }
  </script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme', 'dark');
        }
    </script>

    <div class="reset-container">
        <div class="reset-card">
            <div class="brand-text">
                <h1 data-i18n="auth.reset_password_title">Đặt lại mật khẩu</h1>
                <p data-i18n="auth.reset_password_desc_new">Nhập mật khẩu mới cho tài khoản của bạn.</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword" data-i18n="auth.new_password_label">Mật khẩu mới</label>
                    <input type="password" id="newPassword" placeholder="Tối thiểu 8 ký tự, gồm chữ và số" required />
                </div>
                <div class="form-group">
                    <label for="confirmPassword" data-i18n="auth.reg_confirm_pass_label">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required />
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit" data-i18n="auth.btn_change_password">Cập nhật mật khẩu</button>
            </form>

            <div id="statusMsg" class="status-msg" style="display: none;"></div>
            <div id="successState" class="success-state" style="display: none;">
                <i class="fa-solid fa-circle-check"></i>
                <h2 data-i18n="auth.password_updated">Mật khẩu đã được cập nhật</h2>
                <p data-i18n="auth.auth_complete_desc">Bạn có thể đóng tab này và quay lại trang đăng nhập.</p>
                <a href="login.html" data-i18n="auth.or_click_login">Hoặc bấm vào đây để đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const form = document.getElementById('resetForm');
        const statusMsg = document.getElementById('statusMsg');
        const successState = document.getElementById('successState');
        const btn = document.getElementById('btnSubmit');

        // Notify the original login tab via BroadcastChannel
        const vectoriaChannel = new BroadcastChannel('auth_sync_channel');

        if (!token) {
            form.style.display = 'none';
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg error';
            statusMsg.textContent = 'Liên kết không hợp lệ hoặc đã hết hạn.';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (newPwd !== confirmPwd) {
                statusMsg.style.display = 'block';
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'Mật khẩu xác nhận không khớp.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';
            statusMsg.style.display = 'none';

            try {
                const res = await fetch(`${App.API_BASE}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPwd }),
                });
                const data = await res.json();

                if (data.status === 'success') {
                    form.style.display = 'none';
                    document.querySelector('.brand-text').style.display = 'none';
                    successState.style.display = 'block';
                    vectoriaChannel.postMessage('pwd_reset_done');
                } else {
                    statusMsg.style.display = 'block';
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = data.message || 'Không thể cập nhật mật khẩu.';
                    btn.disabled = false;
                    btn.textContent = 'Cập nhật mật khẩu';
                }
            } catch (err) {
                statusMsg.style.display = 'block';
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'Không thể kết nối đến máy chủ.';
                btn.disabled = false;
                btn.textContent = 'Cập nhật mật khẩu';
            }
        });
    </script>
<script src="js/utils/i18n.js?v=2"></script>
</body>
</html>
